name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # RULE (AGENTS.md §4, narrowed by founder amendment 2026-08-25): the
      # upstream engine project's name must not appear in the rendered
      # site's inputs — content/, src/, app/, public/ (any casing) — so a
      # reader of this site never encounters it. Elsewhere in the repo it
      # may be named freely. The pattern is assembled from pieces so this
      # guard file cannot trip itself.
      - name: Site name guard
        run: |
          FORBIDDEN="$(printf 'ale%s' 'theia')"
          # Grep only the site-input directories that exist (e.g. public/
          # arrives with the first images). A missing directory must not be
          # passed to grep: it makes grep exit 2 even when matches ARE found,
          # which would silently defeat this guard.
          SITE_DIRS="$(ls -d content src app public 2>/dev/null || true)"
          if [ -n "$SITE_DIRS" ] && grep -rIli "$FORBIDDEN" $SITE_DIRS; then
            echo "::error::The upstream project name (listed files above) must not appear in the rendered site's inputs (content/, src/, app/, public/). Rename it and push again."
            exit 1
          fi
          echo "guard passed: no occurrence in the site's inputs."

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npm test
      - run: npm run build
      - run: npm run check:links

      # Engine-path divergence check — WARNING ONLY. Engine changes flow one
      # way, upstream → here; this repo edits only content, config, and its
      # own constitution. Requires the ENGINE_UPSTREAM secret (a git URL);
      # skipped with a notice when unset. See ENGINE.md.
      - name: Engine divergence check (warning only)
        env:
          ENGINE_UPSTREAM: ${{ secrets.ENGINE_UPSTREAM }}
        run: |
          if [ -z "$ENGINE_UPSTREAM" ]; then
            echo "::notice::ENGINE_UPSTREAM secret not set — engine divergence check skipped. See ENGINE.md."
            exit 0
          fi
          if ! node scripts/sync-engine.mjs --check; then
            echo "::warning::Engine paths have diverged from upstream (see log above). Deliberate config-layer differences belong in the allowlist in scripts/sync-engine.mjs; anything else should be synced from upstream, never edited here."
          fi
