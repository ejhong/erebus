- date: "2026-08-26"
  change: >-
    Added five tombstone records (SEP-C025 to SEP-C029) for the
    most-circulated propositions the primary record contradicts outright: no
    airliner at the Pentagon, directed-energy or nuclear destruction of the
    towers, the "four thousand Israelis" fabrication, a Flight 93 shootdown,
    and fabricated telephone calls from the aircraft. Rejected claims keep
    their records and do not render in reader views; they exist so extraction
    runs do not re-propose material already examined, and so the reasoning
    survives for readers who wonder why an argument they have seen elsewhere
    is absent. A theme was added for the Pentagon and Flight 93 cluster,
    which this cut otherwise defers.

    What is deliberately NOT tombstoned: the WTC 7 demolition hypothesis
    remains a live, weakly-supported featured claim, because a real
    unaudited gap in the official mechanism sustains it. The line between
    those five and that one is evidence, not respectability.

    Correction by amendment: the launch entry above states the ledger and
    registry as 38 records and 33 sources. The actual figures at launch were
    39 evidence records and 36 sources. The launch entry is left standing
    with its error intact, because this log is append-only — a change ledger
    that can be edited is not a record of anything. Readers should take the
    figures in this entry, not those in the entry above. The error was
    caught by a cross-model arbiter seat reviewing the launch pull request.

    A second correction, of a worse kind, belongs in the same place. The
    first version of this amendment claimed the fix had been made "by
    amendment rather than by editing the original entry" while the same
    change silently rewrote the launch entry's figures in place. That was
    false about its own conduct in the provenance record itself. Two
    independent arbiter seats caught it, the in-place edit was reverted, and
    this wording replaces the false claim. Recorded rather than quietly
    fixed, because the alternative is a log that conceals the one failure
    most damaging to a log's purpose.
  reason: >-
    Founder direction to complete the open items from the case launch. The
    tombstone list follows the research digest's recommendation, with each
    rejection reason grounded in the verified record rather than in the
    claim's reputation.
