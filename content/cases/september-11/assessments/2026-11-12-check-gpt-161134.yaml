  synthesis: >-
    The case verdict applies to the featured hypothesis that WTC 7 was
    deliberately demolished, not to every locally true observation in the
    ledger. The starting observations are secure: WTC 7 burned for hours, was
    not struck by an aircraft, collapsed completely, and its visible north face
    underwent approximately 2.25 seconds of gravitational acceleration. Free
    fall is therefore an established feature requiring explanation, but it is
    not by itself diagnostic of demolition; the federal account places it after
    internal failures had already removed support.

    Steelmanning the hypothesis, the federal initiation sequence remains
    materially unaudited. SEP-E004 supplies a specific thermal-expansion and
    Column 79 mechanism, but SEP-E008 establishes that 68,500 modeling files
    were withheld, preventing exact outside recomputation. The UAF study
    reported that its fire scenarios did not reproduce the collapse and that
    near-simultaneous column failure did. No identified WTC 7 steel survives for
    direct examination, witnesses reported explosion-like sounds, and a limited
    metallurgical study left an unusual sulfur-related corrosion phenomenon
    unexplained. Together, these matters create a genuine evidentiary foothold
    rather than a dispute manufactured solely from misunderstanding.

    Steelmanning the opposing case, none of those points identifies a demolition
    mechanism or demonstrates deliberate action. The UAF result is weakened by
    its static temperature field, limited connection treatment, and the
    criticism that simultaneous column removal was imposed as an input rather
    than derived as a failure process. The sulfur-bearing samples lack secure
    building provenance and may reflect post-collapse debris-pile heating.
    Witness descriptions establish booms, not charges, while SEP-E012 predicts
    that even the smallest charge capable of failing the critical column would
    have produced blast-level sound absent from witness reports and recordings.
    A documented fire-induced high-rise collapse elsewhere also defeats the
    categorical prior that fire cannot produce total collapse, although it does
    not validate the particular WTC 7 sequence.

    The resulting attribution is weakly supported: the non-reproducible official
    mechanism and challenger result sustain investigation, but the move from
    “the published fire account is not independently established” to “deliberate
    demolition occurred” remains unsupported by direct physical, acoustic, or
    operational evidence. Other branches must not be pooled indiscriminately
    into that inference. Tower collapse initiation is well supported even though
    end-to-end modeling was not performed; anomalous trading is well supported
    while attack foreknowledge is contradicted by the available trade tracing;
    specific official foreknowledge is contradicted despite serious intelligence
    failures; and documented EPA editing and inaccurate air-defense accounts
    establish misconduct without establishing demolition. The Saudi evidence is
    separately mixed and does not identify a WTC 7 mechanism.

    Sensitivity is greatest to SEP-E008, the court record establishing the
    withheld WTC 7 files. Removing it would substantially weaken the main reason
    not to defer to the federal model, but the weakly_supported verdict would
    survive because the UAF challenge, absent steel, and remaining mismatch
    between an asserted sequence and an open reproduction would persist. The
    verdict therefore does not hang on that record alone, though without it the
    supporting case would be markedly thinner.
  steelman: No open model in this ledger uses the original WTC 7 connection
    details and time-varying fires to reproduce, in one auditable run, the
    Column 79 initiation, observed exterior motion, and 2.25-second free-fall
    interval; the federal files needed to check its claimed reproduction remain
    withheld, while identified WTC 7 steel is unavailable for a physical
    cross-check.
