  synthesis: "This case separates cleanly into three layers, and the featured
    hypothesis lives entirely in the thinnest one. The first layer is
    established beyond genuine dispute from mutually independent primary
    records: the attacks themselves and their adversarial trial record
    (SEP-C030), the WTC 7 collapse event and its seven hours of unfought fire
    (SEP-C001), the free-fall interval as measured by the federal
    investigation's own final report (SEP-C002), the fragmentary-warnings record
    (SEP-C018), the documented air-defense misstatements (SEP-C020), the EPA's
    edited air-safety assurances (SEP-C024), and the first Saudi employee's
    assistance, which the party employing him no longer disputes (SEP-C022). The
    second layer is where official accounts themselves fail audit: NIST's WTC 7
    initiating mechanism has never been independently recomputed because 68,500
    modeling files were withheld under a statutory safety finding a court upheld
    (SEP-C005), and no end-to-end progression model of either tower exists —
    NIST says so itself (SEP-C012, contradicted as a demonstration claim). These
    are real gaps, and the case is right to keep them live rather than explain
    them away. The third layer is the featured demolition hypothesis for WTC 7
    (SEP-C010), which is exactly what the tombstone note describes: live, but
    weakly supported. Its sustaining structure is the unaudited gap plus the
    challenger study (SEP-C004, advocacy-funded, unpeer-reviewed, one static
    temperature field) and an unexplained sulfidation anomaly (SEP-C007, two
    opportunistically recovered samples, requested follow-up never run). What
    blocks it from rising is that its affirmative mechanism claims fail on the
    present record: the acoustic analysis contradicts column-failing charges at
    reported sound levels (SEP-C009), and the Plasco collapse post-2017 broke
    the \"fires never fully felled a steel high-rise\" prior. The same pattern
    holds elsewhere: the trading anomaly is statistically real (SEP-C015) but
    its attribution to foreknowledge rests on unauditable government trace-outs
    (SEP-C016); the Saudi institutional claim is genuinely unresolved, with a
    preliminary jurisdictional finding that stops short of what the claim
    asserts (SEP-C023). Where my verdicts lean on priors rather than records, I
    flag it: the rigging-infeasibility point on SEP-C017 is background
    reasoning, and SEP-C013's seismic contradiction is the agency's
    characterization of a record this case has not obtained from its authors.
    The opposing steelman: an honest account must hold that documented official
    candor failures are real — yet every one of them, examined here, points at
    negligence and self-protection, not complicity, and several (the
    phantom-aircraft record) affirmatively refute the popular complicity
    variants."
  steelman: "The free-fall interval is not a challenger's claim but NIST's own
    published measurement, and the only mechanism offered to explain it — a
    single girder walking off its seat at temperatures below 400°C cascading
    into global failure — has never been independently recomputed, because NIST
    withheld 68,500 modeling files rather than release them; NIST's own FAQ
    further concedes that its late-stage simulated deformation differs from the
    video record. The one independent reevaluation (UAF), whose inputs and
    results were fully released while NIST's were not, states it could identify
    no fire-driven scenario capable of producing the observed descent, and the
    published criticisms of that study are pseudonymous forum posts the study's
    authors have never answered in a printed document. A proponent can rightly
    ask: after seventeen years, where is the reproducible fire-driven model that
    accounts for 2.25 seconds of gravitational acceleration over eight stories?"
