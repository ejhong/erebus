  - claimId: SEP-C007
    verdict: established
    reasoning: "The observation, the explicit statement that the sulfur source was unidentified, and the recommendation for further work are all verbatim in the appendix. Note a correction this case had to make: the appendix proposes no source for the sulfur at all — the frequently repeated claim that its authors suggested gypsum is mistaken, and that argument belongs to a different agency in a different document."
    confidence: high
    treatment:
