  synthesis: |-
    A single verdict on "9/11" would mean nothing, so this one is scoped to the disputes the case grades, and they stratify.
    Authorship and the towers' destruction are settled by positive evidence: adversarially tested trial exhibits (SEP-E038), initiation at the impact floors of unpredictably aimed aircraft, and no pre-collapse seismic signal (SEP-E015). SEP-C013 is contradicted, not merely unproven.
    The conventional account carries two conceded debts, both about auditability. The WTC 7 mechanism (SEP-C003) is specific and needs no melted steel, but cannot be recomputed outside the agency: roughly 68,500 modeling files were withheld under a finding a court upheld (SEP-E008), and no identified WTC 7 steel survives (SEP-E009). The towers' total progression was never modeled end to end (SEP-E014). Unauditable is not wrong, which is why SEP-C003 stays mixed.
    The challenge fares badly but not uniformly. SEP-C004 rests on an input presented as a finding (SEP-E007). In the dust dispute SEP-E039 asserts elemental aluminum and SEP-E017 fails to find it while refuting the primer rebuttal, so the chips remain unidentified. The trading anomaly is real (SEP-E040); its attribution is not.
    The Saudi branch moved. The district court's own opinion now carries it: after adversarial discovery the Kingdom does not dispute one employee's help with the hijackers' apartment (SEP-E041), and the judge found by a preponderance that the help was likely directed, not chance (SEP-E042), while calling the finding preliminary and leaving disputed facts to trial (SEP-E043). The Kingdom denies involvement (SEP-E044); the case is stayed for its appeal (SEP-E045), argued and undecided (SEP-E046). SEP-C023 moves from unresolved to mixed: substantial evidence for it now exists, weighed by a neutral court, beside a real gap between what that court found and what the claim asserts.
    Proven official misconduct runs underneath — edited air-quality assurances (SEP-E035), air-defense accounts the tapes contradicted (SEP-E026) — licensing refusal of deference to official reassurance, not an inference of concealed authorship.
    Sensitivity: the record whose removal would most change this verdict is SEP-E008; without it SEP-C003 would read closer to well supported, though the mixed verdict survives on SEP-E009, SEP-E014 and the open Saudi and trading branches.
  steelman: The strongest case against this assessment is that the institutions whose conduct is in question hold, or destroyed, nearly every record that would test it. The agency that modeled WTC 7 withheld the files that would let anyone check the model, and the building's steel was recycled before any investigation existed. The Commission's trade-tracing rests on interviews never published; the data-mining holdings were destroyed and witnesses barred from a Senate hearing; recordings of interrogations the Commission's account depends on were destroyed. The congressional section on Saudi support was withheld for nearly fourteen years, the FBI's Saudi files came out only through litigation and an executive order twenty years on — and once a court weighed what discovery produced, it found the help two hijackers received likely directed by their employer. On that record, crediting the official account wherever it cannot be checked is deference by another name, and the pattern, each release leaving the official account less complete than it was presented, is itself evidence. This assessment answers it only in part. On the towers the disproof is positive and owes nothing to any withheld file; on foreknowledge the released record shows information failing to connect at each node, not information suppressed; the Saudi finding concerns help to two hijackers, not knowledge of the plot by anyone placed to stop it. On WTC 7 and the Saudi chain the objection stands until the files are out.
