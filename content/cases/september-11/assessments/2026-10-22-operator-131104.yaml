    confidence: high
    treatment:
      plainLanguage: The warnings were real, numerous, and never assembled into a picture of what was coming. Both halves of that sentence are findings, and this case keeps them together.
      importance: headline
      diagnosticity: high
      diagnosticitySummary: "Highly diagnostic between the two hypotheses most often confused: it strongly supports institutional failure and it undercuts specific foreknowledge, because what the record shows at every node is information not being connected rather than information being buried."
      strongestObjection: A record assembled by bodies with an institutional interest in characterizing their own failures as analytical rather than culpable.
