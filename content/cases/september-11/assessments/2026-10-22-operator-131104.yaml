  - claimId: SEP-C012
    verdict: contradicted
    reasoning: The investigation modeled collapse initiation and stated that propagation "was readily explained without the same complexity of modeling," supporting that judgment with a floor-capacity argument rather than a simulation. That is a considered engineering position, not an end-to-end model — so the claim as worded is contradicted by the record, which is a statement about what exists, not about whether gravity suffices.
    confidence: high
    treatment:
      plainLanguage: Not the question of what started the collapses — the question of whether anyone has actually simulated them all the way down. Nobody has, including the federal investigation, which said the progression was "readily explained" without that modeling.
      importance: major
      diagnosticity: moderate
      diagnosticitySummary: The honest weak point of the conventional account's completeness, and the most legitimate opening the challenger literature has on the towers. It does not by itself imply any added energy source was present.
      strongestObjection: Order-of-magnitude analyses in the peer-reviewed mechanics literature argue the energy balance is not close — once a dozen-plus stories drop one storey, arrest is not plausible — so full simulation may be unnecessary to answer the physical question even though it would answer the auditability one.
      whatWouldChangeOurMind:
        - Publication of a high-fidelity progressive-collapse model of a tube-frame tower validated against the video and seismic record, with full inputs released.
  - claimId: SEP-C013
    verdict: contradicted
    reasoning: Positive disproof rather than mere absence. Initiation coincided with the impact floors, which no one could have designated in advance; the seismic record contains no signal before either collapse; the investigation reported finding no corroborating evidence for demolition; and any charges would have had to survive nearly an hour of approximately 1,000 °C fire at exactly the location where the collapse began.
    confidence: high
    treatment:
      plainLanguage: This one is not merely unproven; the record actively contradicts it. Collapse began exactly where unpredictably aimed aircraft happened to hit, no seismic trace precedes either collapse, and eight months of debris removal produced no device.
      importance: headline
      diagnosticity: high
      diagnosticitySummary: Would be decisive if true. Its failure is what separates the towers dispute — effectively closed — from the WTC 7 dispute, which is not.
      strongestObjection: Arguments from the absence of recovered devices depend on a debris operation that was not conducted as a forensic search, and the seismic argument depends on instruments at some distance from the site.
      whatWouldChangeOurMind:
        - A recovered, provenanced device component or an authenticated pre-collapse seismic or acoustic signature.
  - claimId: SEP-C014
    verdict: contradicted
