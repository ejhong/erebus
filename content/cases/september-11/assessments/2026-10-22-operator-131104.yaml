    reasoning: "Rests on a genuine unaudited gap in the official mechanism (SEP-C003, SEP-C005), an unreproduced advocacy-funded counter-model (SEP-C004), and an untested corrosion anomaly (SEP-C007). Against it: the acoustic evidence (SEP-C009), the absence of any recovered device or residue finding, and the practical difficulty of pre-rigging an occupied building without disclosure. Weakly supported is not the same as refuted, and this case does not expect the grade to be permanent — the decisive tests are cheap and unperformed."
    confidence: moderate
    treatment:
