  - claimId: SEP-C008
    verdict: established
    reasoning: "Multiple on-record accounts exist, and the agency's own FAQ answers a question about a responder who \"heard two loud booms\" without disputing that he did. This claim is deliberately narrower than the version in circulation: the agency does not deny that booms were reported, it denies that any reported sound matches the level a column-severing blast would produce."
    confidence: high
    treatment:
