      diagnosticitySummary: Decisive for the whole case if established, since deliberate demolition of this building could not have been arranged without advance coordination.
      strongestObjection: No physical artifact of a demolition has ever been produced — no device, no residue finding on identified WTC 7 steel (none of which was kept), no blast signature — so the claim rests entirely on the inadequacy of the alternative rather than on affirmative evidence of itself.
      whatWouldChangeOurMind:
        - A blinded independent re-analysis vindicating the challenger model.
        - A custody-controlled physical finding of incendiary or explosive residue on provenanced WTC 7 material.
        - "Conversely: independent reproduction of the official mechanism from released data would move this to contradicted."
  - claimId: SEP-C011
    verdict: well_supported
    reasoning: Supported by impact simulations reporting dozens of severed columns and insulation stripped from tens of thousands of square feet of truss area in each tower, by the fire reconstruction, and by the observed inward bowing that preceded each collapse. The counterfactual is stated twice in the report, both times hedged with "likely" — a hedge public restatement on both sides routinely drops, and which this claim keeps.
    confidence: high
    treatment:
      plainLanguage: 'The planes severed columns and knocked the fireproofing off the steel; the fires then did what fires cannot normally do to protected steel. The official report words this carefully, and so does this claim: "likely."'
      importance: headline
      diagnosticity: high
      diagnosticitySummary: Initiation at precisely the impact floors is very hard for any pre-placed-device account to accommodate, since the aircraft's aim could not be arranged in advance.
      strongestObjection: The simulations required tuning to reproduce the observed damage, and the "widely dislodged" insulation is an inference from modeling rather than a direct measurement of the buildings as they stood.
      whatWouldChangeOurMind:
