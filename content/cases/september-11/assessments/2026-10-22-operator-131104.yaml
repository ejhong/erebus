  - claimId: SEP-C006
    verdict: established
    reasoning: Stated openly by the investigating agency itself, which explains that WTC 7 steel lacked the paint and distinguishing markings that made tower steel identifiable.
    confidence: high
    treatment:
      plainLanguage: The physical evidence from the third building is simply gone. Tower steel carried paint and markings that allowed pieces to be traced; WTC 7's did not, and it was recycled before anyone catalogued it.
