caseAssessment:
  verdict: mixed
  whatIsClaimed: Critics claim, in rising order of strength, that the public technical record cannot be reproduced, that specific official accounts were false, that insiders knew in advance or profited, and, at the strongest, that the buildings were destroyed by pre-placed devices. Victims' families separately claim in court that Saudi government employees knowingly helped two hijackers, at their employer's direction. Who carried out the attacks is not the question here; which of these challenges survives the primary record is.
  whereDisagreementLives: "Not at the observations: both sides accept WTC 7's 2.25 seconds of free fall, the pre-attack option volumes, and the August 6, 2001 brief. The disputes sit a rung up: whether fire alone initiated WTC 7's collapse, argued between a federal model whose files are withheld and an advocacy-funded open one; whether tracing the headline trades to innocuous buyers exhausts the anomaly while the tracing files stay closed; whether destroyed data-mining records held an identification; and whether two Saudi employees' help to two hijackers was directed by their employer — likely, a federal judge found for jurisdiction in August 2025, a finding now on appeal."
  whatWouldSettleIt: Work nobody has done, most of it desk-scale. A blinded independent re-analysis of WTC 7's Column 79 connection; release or bounded re-derivation of the roughly 68,500 withheld modeling files; a custody-controlled, multi-laboratory re-test of the dust chips against thermite and primer controls; the sulfur-source study FEMA's metallurgists asked for; declassification of the trade-tracing files; the data-mining destruction certificates. And, moving on its own, the Second Circuit's ruling on Saudi Arabia's appeal, argued October 7, 2026 — then, if the claims proceed, a trial at which the exhibits behind the 2025 finding are tested in public.
  bestConventionalExplanation: "Al-Qaeda planned and carried out the attacks; the buildings fell from impact, fire and gravity; and the government's failures were of competence, not complicity. Authorship rests on independent streams — flight and air-traffic records, passenger calls, DNA, immigration and financial records, and over a thousand exhibits admitted in open court. The towers fell because impacts severed columns and stripped fireproofing while multi-floor fires weakened what remained. WTC 7 fell because fires burned unfought for seven hours after the water main was cut, thermally expanding long-span floor framing until a girder walked off its seat; no melted steel was needed, and Tehran's Plasco tower fell to fire in 2017. The free-fall interval is the signature of a facade whose interior had already failed. The warnings were real but generic; the trades traced to innocuous buyers; the help two hijackers got in California was chance and good nature, as the Kingdom argues. Its unpaid debt is reproducibility: WTC 7 cannot be recomputed from what was published, and no WTC 7 steel was kept."
