  - claimId: SEP-C009
    verdict: contradicted
    reasoning: The investigation calculated that the smallest blast capable of failing Column 79 would register 130 to 140 decibels at half a mile if unobstructed, and reported that no such sound appears on any audio track or in any witness account. That is a falsifiable published prediction that the recorded evidence does not meet.
    confidence: high
    treatment:
      plainLanguage: "The inference drawn from the booms. It does not survive the acoustics: a charge big enough to cut the critical column would have been heard for half a mile at jet-engine volume, and no recording contains it."
      importance: major
      diagnosticity: high
      diagnosticitySummary: Were it true it would establish demolition directly. Its failure is correspondingly costly to the demolition family, which is why proponents have largely moved to incendiary rather than explosive mechanisms.
      strongestObjection: The acoustic calculation is the investigation's own modeling, not an independent measurement, and it assumes an unobstructed path in a dense urban environment full of obstructions.
      whatWouldChangeOurMind:
        - Recovery of a recording containing a blast signature at the predicted level, authenticated and located.
        - An independent acoustic analysis showing the modeled threshold is substantially too high.
