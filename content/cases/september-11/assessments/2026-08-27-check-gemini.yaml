  synthesis: "The evidentiary record of the September 11 attacks, when separated
    from its vast literature of speculation, presents a bifurcated landscape: a
    robustly established conventional account of authorship and initiation,
    shadowed by genuine institutional gaps that sustain ongoing dispute.
    Mutually independent evidence streams confirm al-Qaeda authorship and the
    initiation of the Twin Towers' collapse through aircraft impact, dislodged
    fireproofing, and multi-floor fires (SEP-C011). The strongest challenger
    claims—pre-planted explosive demolition of the towers and specific insider
    foreknowledge—are overwhelmingly contradicted by positive physical and
    documentary evidence (SEP-C013, SEP-C019). However, the record is not
    pristine, and the case synthesis requires steelmanning the challenger
    positions where they press on real evidentiary absences. The official
    mechanism for the collapse of WTC 7 (SEP-C003) relies on modeling files that
    a federal court allowed the government to withhold (SEP-C005), rendering the
    most consequential engineering claim unauditable by independent scientists.
    Similarly, the total top-to-bottom collapse progression of the Twin Towers
    has never been modeled end-to-end (SEP-C012). These unpaid debts in
    reproducibility are compounded by documented episodes of official misconduct
    and lack of candor: the EPA's centrally edited air-quality assurances
    (SEP-C024) and the military's inaccurate initial timelines regarding air
    defense (SEP-C020) prove that institutional self-protection compromised the
    public record. In the financial and intelligence domains, authentic
    anomalies like the pre-attack put-option volumes (SEP-C015) and the Saudi
    assistance files (SEP-C022) sit alongside specific, plausible, but mostly
    unauditable official explanations. Ultimately, while the demolition and
    complicity hypotheses fail to satisfy the evidentiary burden—lacking
    physical artifacts, seismic signatures, or corroborating documents—the
    persistence of distrust is amply explained by the government's own
    documented failures in transparency. The record as it stands firmly supports
    the conventional account of the attacks while actively vindicating critics'
    frustration with the auditability of federal investigations."
