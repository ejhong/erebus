      occurred. The strongest opposing consideration is that a video-derived
      roofline trace could in principle be an artifact of frame-rate or
      reference-point selection, but no evidence record advances that objection
      and the agency itself adopted and explained the result."
  - claimId: SEP-C003
    verdict: provisionally_supported
    confidence: moderate
    reasoning: "I part from the case's \"mixed\" grade because mixed implies
      opposing evidence of comparable weight, and the only affirmative challenge
      (SEP-E005) is impeached on its own terms by SEP-E006 and SEP-E007 — a
      single connection, one static temperature field, and a simultaneous column
