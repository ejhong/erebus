      class of test — metallurgical examination of provenanced WTC 7 steel —
      that could have discriminated between competing mechanisms, so no future
      disclosure can fully close this branch. The strongest opposing
      consideration is that the sole source is the agency describing a gap in
      its own evidentiary base, and no independent audit of the debris-removal
      record appears here; but rapid recovery-driven clearance before any
      investigation was chartered is an ordinary explanation requiring no
      special assumption."
  - claimId: SEP-C007
