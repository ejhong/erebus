      Thermal-expansion-driven connection failure is an established mechanism
      class in fire engineering, and SEP-E018 removes the never-happened-before
      prior, though I flag that this plausibility judgment leans on general
      background rather than on any evidence record here. The decisive opposing
      consideration is real and unresolved: the specific sequence has never been
      independently recomputed and cannot be, because the modeling files were
