      collapse times. The strongest opposing consideration is that both sources
      belong to the same federal investigative lineage, but FEMA 403 predates
      and is methodologically independent of NCSTAR 1A, and the observation is
      corroborated by contemporaneous imagery no party contests.
  - claimId: SEP-C002
    verdict: established
    confidence: high
    reasoning: "The 2.25-second free-fall stage is quoted verbatim from the
      investigating agency's own principal findings (SEP-E003), which is the
      least contestable provenance available: it is an admission against the
      reflexive institutional interest, added after public comment. The
      measurement is of one visible face from video, which limits what it says
