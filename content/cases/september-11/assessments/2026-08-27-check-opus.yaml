  - claimId: SEP-C005
    verdict: established
    confidence: high
    reasoning: "The court's own memorandum opinion (SEP-E008) supplies the file
      counts, the July 2009 statutory finding, and the rationale verbatim, and a
      judicial record of what was withheld and on what basis is about as clean a
