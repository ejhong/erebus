  - claimId: SEP-C004
    verdict: weakly_supported
    confidence: moderate
    reasoning: "The study is a real finite-element effort that released its full
      dataset, which is more than the investigation it disputes offered, and its
      own text is properly hedged — it identified no fire scenario reproducing
