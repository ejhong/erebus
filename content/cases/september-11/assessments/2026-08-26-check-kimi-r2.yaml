  - claimId: SEP-C004
    verdict: weakly_supported
    confidence: moderate
    reasoning: "A genuine finite-element effort that released all its data, which is
      more openness than the investigation it disputes has offered. Against it:
      advocacy funding, no journal peer review, a single static temperature
      field rather than a modeled fire progression, and the critical objection
      that simultaneous column failure appears to be an input rather than a
      finding. Its own text concedes it cannot rule out an alternative scenario
      it did not identify."
  - claimId: SEP-C005
    verdict: established
    confidence: high
    reasoning: "Documented in the court's own opinion: 25,644 files released, 68,500
      withheld, under a statutory finding that release might jeopardize public
      safety. The figures do not reconcile arithmetically, but the fact of
      withholding and the court's upholding of it are not in dispute. The
      strongest opposing consideration is that the rationale — validated
      connection models as a general-purpose blueprint — is coherent on its own
      terms."
  - claimId: SEP-C006
    verdict: established
    confidence: high
    reasoning: Stated openly by the investigating agency itself, which explains that
      WTC 7 steel lacked the distinguishing markings that made tower steel
      identifiable. The gap is permanent and removes the class of test that
      could have discriminated between mechanisms. The strongest opposing
      consideration is that rapid debris removal during a recovery operation is
      an ordinary emergency consequence, not necessarily an evidence decision.
  - claimId: SEP-C007
    verdict: established
    confidence: high
    reasoning: The severe sulfidation with intergranular eutectic melting, the
      explicit statement that no clear sulfur source was identified, and the
      recommendation for further study are all verbatim in the FEMA appendix.
      The recommended study has never been performed. The strongest opposing
      consideration is that the examination covered two opportunistically
      recovered members with hedged identifications, and the appendix itself
      raises post-collapse debris-pile heating as a possibility.
  - claimId: SEP-C008
    verdict: established
    confidence: high
    reasoning: "Multiple on-record accounts exist, and the agency's own FAQ answers
      a responder who reported two loud booms without disputing that he did. The
      claim is deliberately narrower than the popular version: the agency denies
      blast-level noise, not booms. The strongest opposing consideration is that
      lay descriptions of loudness cannot distinguish detonation from structural
      failure."
  - claimId: SEP-C009
    verdict: contradicted
    confidence: moderate
    reasoning: The investigation calculated that the smallest column-severing charge
      would register 130–140 dB at half a mile if unobstructed, and reported no
      such sound on any recording or in any witness account. That is a
      falsifiable published prediction the recorded evidence does not meet. The
      strongest opposing consideration is that the acoustic threshold is the
      investigation's own modeling, not an independent measurement, and assumes
      an unobstructed path in a dense urban environment.
  - claimId: SEP-C010
    verdict: weakly_supported
    confidence: low
    reasoning: "Rests on a genuine unaudited gap in the official mechanism, an
      unreproduced advocacy-funded counter-model, and an untested corrosion
      anomaly. Against it: the failed acoustic prediction, the absence of any
      recovered device or residue, and the practical difficulty of pre-rigging
      an occupied building. The strongest opposing consideration is that the
      claim rests entirely on the inadequacy of the alternative rather than on
      affirmative evidence of itself."
  - claimId: SEP-C011
    verdict: well_supported
    confidence: high
    reasoning: Supported by impact simulations reporting dozens of severed columns
      and insulation stripped from tens of thousands of square feet, by the fire
      reconstruction, and by the observed inward bowing. The report's own hedge
      — "likely would not have collapsed" — is restored in the claim. The
      strongest opposing consideration is that the simulations required tuning
      and the insulation dislodgment is an inference from modeling, not a direct
      measurement.
  - claimId: SEP-C012
    verdict: contradicted
    confidence: high
    reasoning: The agency itself states that propagation "was readily explained
      without the same complexity of modeling," supporting that with a capacity
      argument rather than a simulation. The claim as worded — that end-to-end
      modeling exists — is contradicted by the record. The strongest opposing
      consideration is that order-of-magnitude analyses in the mechanics
      literature argue the energy balance is not close, so full simulation may
      be physically unnecessary even though it would answer the auditability
      question.
  - claimId: SEP-C013
    verdict: contradicted
    confidence: high
    reasoning: "Positive disproof: initiation coincided with the impact floors,
      which no one could have designated in advance; the seismic record contains
      no pre-collapse signal; and any charges would have had to survive nearly
      an hour of approximately 1,000 °C fire at exactly the location where
      collapse began. The strongest opposing consideration is that arguments
      from absence of recovered devices depend on a debris operation not
      conducted as a forensic search."
  - claimId: SEP-C014
    verdict: contradicted
    confidence: moderate
    reasoning: The independent analysis of archived dust from four Manhattan
