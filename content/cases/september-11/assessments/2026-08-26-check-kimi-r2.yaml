      that the community held clearly relevant information when considered
      collectively. The strongest opposing consideration is that the record was
      assembled by bodies with an institutional interest in characterizing their
      own failures as analytical rather than culpable.
  - claimId: SEP-C019
    verdict: contradicted
    confidence: moderate
    reasoning: Contradicted by the joint inquiry's central finding and by
      inspector-general reviews documenting specific, traceable bureaucratic
