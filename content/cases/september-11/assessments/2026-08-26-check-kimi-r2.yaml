  - claimId: SEP-C002
    verdict: established
    confidence: high
    reasoning: Stated verbatim in the final report's principal findings after public
      comment, with the three-stage descent described in the agency's own FAQ.
      The measurement is one visible face from video, but it is the government's
      own published figure, not a challenger's calculation. The strongest
      opposing consideration is that the interval was conceded and modeled by
      the investigation itself, so it cannot function as evidence of
