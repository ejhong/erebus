  synthesis: >-
    Evaluating the September 11 evidentiary ledger reveals a sharp divergence
    between maximalist alternative theories, which collapse under physical and
    documentary scrutiny, and the official investigative narrative, which
    contains acknowledged modeling gaps, statutory secrecy, and documented
    transparency failures. On the physical and forensic record, hypotheses of
    pre-planted demolition charges or exotic incendiaries in the Twin Towers and
    WTC 7 are contradicted. Continuous seismic monitoring recorded no
    pre-collapse explosive impulses; acoustic thresholds require that explosive
    column-cutting charges generate 130 to 140 decibels at half a mile, yet no
    such sounds exist on video recordings; and independent microscopy of
    archived dust chips found an absence of elemental aluminum, ruling out
    unreacted nanothermite. Similarly, theories of specific tactical
    foreknowledge or stand-down orders are contradicted by extensive
    declassified records and trial exhibits establishing that while systemic
    analytical negligence and intelligence siloing occurred, actionable tactical
    parameters were never held. Furthermore, the 2017 collapse of the Plasco
    Building in Tehran demonstrated the physical reality of fire-induced
    progressive collapse in a steel-framed high-rise.


    Conversely, the conventional account cannot claim definitive closure because
    critical elements remain unaudited or incomplete. For WTC 7, NIST measured a
    2.25-second period of absolute free fall across eight stories, but its
    explanatory sequence—fire-induced thermal expansion causing a girder to walk
    off Column 79—cannot be independently audited or replicated because NIST
    formally withheld 68,500 simulation files under a statutory public-safety
    exemption, while zero physical structural steel from the building was
    preserved for examination. For the Twin Towers, NIST explicitly conceded
    that it never simulated progressive collapse propagation to the ground,
    relying instead on static capacity comparisons. Genuine empirical anomalies
    also persist: FEMA metallurgists documented severe high-temperature
    sulfidation with intergranular eutectic melting on recovered steel and
    requested a follow-up study that was never conducted; peer-reviewed
    financial literature confirms statistically significant option volume spikes
    consistent with informed trading, while the government's innocuous
    trade-tracing remains classified; military officials presented air-defense
    timelines contradicted by their own operations tapes; and undisputed
    practical assistance was provided to two hijackers by a Saudi government
    employee, leaving state institutional support an active subject of federal
    litigation.


    In sensitivity analysis, the single evidence record whose removal would most
    alter this assessment is SEP-E008 (the Quick v. NIST memorandum opinion
    upholding the withholding of 68,500 modeling files). If those files were
    made public and successfully verified by independent structural engineers,
    the case verdict would shift toward well_supported for the conventional
    structural narrative. However, because NIST independently concedes the lack
    of end-to-end progression modeling (SEP-E014), the permanent loss of WTC 7
    forensic steel (SEP-E009), and unresolved Saudi civil litigation (SEP-E042),
    the mixed verdict survives even without that single record.
  steelman: WTC 7's measured 2.25-second free-fall descent across eight stories
    requires simultaneous zero-resistance failure across all core and exterior
    columns, a structural state that NIST's thermal-expansion walk-off model
    cannot be independently audited to produce because NIST withheld its 68,500
    simulation data files.
