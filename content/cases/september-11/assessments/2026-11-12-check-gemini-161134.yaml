      permanently foreclosed physical metallurgical examination of key
      components, such as Column 79 or the Floor 13 seat. The strongest opposing
      consideration is that rapid debris removal was driven by urgent emergency
      rescue and clearing operations rather than deliberate spoliation.
    confidence: high
  - claimId: SEP-C007
    verdict: established
    reasoning: Appendix C of FEMA 403 documents severe high-temperature hot
