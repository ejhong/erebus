    confidence: high
  - claimId: SEP-C001
    verdict: established
    reasoning: Both the preliminary FEMA performance study and NIST's final NCSTAR
      1A investigation establish that WTC 7 caught fire following the collapse
      of the North Tower, burned unfought for nearly seven hours due to severed
      water mains, and suffered complete collapse at 5:20 p.m. The strongest
      opposing consideration is that initial assessments attributed a
      significant role to diesel fuel tanks, but subsequent detailed modeling
      demonstrated office furnishings provided the dominant fuel load.
    confidence: high
  - claimId: SEP-C002
    verdict: established
    reasoning: NIST's final report explicitly incorporates a three-stage descent
      analysis confirming that WTC 7's north face descended at gravitational
      acceleration for approximately 2.25 seconds over roughly 32 meters (eight
      stories), a revision adopted after public comment on the draft report. The
      strongest opposing consideration is that free-fall acceleration
      characterized only a discrete vertical segment of one exterior facade
      rather than the simultaneous collapse of the building's entire internal
      structural framework.
    confidence: high
  - claimId: SEP-C003
    verdict: mixed
    reasoning: NIST developed an extensive finite-element framework demonstrating
      how thermal expansion at temperatures below 400 °C could walk the Floor 13
      girder off Column 79 and trigger progressive collapse, a mechanism
      supported generally by the 2017 Plasco Building fire collapse. However,
      this sequence cannot be independently verified or replicated because NIST
      withheld 68,500 simulation files under a public safety exemption, while no
      physical structural steel was preserved to verify connection performance.
      The strongest opposing consideration is that the thermal-expansion
      mechanism rests on sound structural engineering principles and has not
      been conclusively disproved by an auditable alternative model.
    confidence: moderate
  - claimId: SEP-C004
    verdict: weakly_supported
    reasoning: The University of Alaska Fairbanks study made its finite-element
      model publicly available and demonstrated that simulated simultaneous
      column failure can reproduce the observed exterior descent. However,
      technical critiques established that the authors imposed column failure as
      an arbitrary input rather than deriving it from fire dynamics, while using
      a single static temperature field that ignored moving office fires. The
      strongest opposing consideration is that the UAF report remains the only
      publicly downloadable computational simulation package directly
      challenging the federal investigation's mechanism.
    confidence: moderate
  - claimId: SEP-C005
    verdict: established
    reasoning: The memorandum opinion in Quick v. NIST confirms that the Director of
      NIST issued a formal finding withholding 68,500 data files under 15 U.S.C.
      § 7306(d) on the grounds that disclosing detailed collapse models could
      jeopardize public safety, a determination upheld by a federal court in
      2011. Because these files contain connection geometries, failure criteria,
      and finite-element meshes, independent third-party reproduction of the
      initiating collapse mechanism from published materials is precluded. The
      strongest opposing consideration is that NIST released over 25,000 files
      and published detailed qualitative descriptions of its methodology across
      several technical volumes.
    confidence: high
  - claimId: SEP-C006
    verdict: established
    reasoning: NIST's official FAQ explicitly confirms that structural steel from
