    overall mixed verdict would nonetheless survive, carried by the Saudi,
    trading, and candour branches — but the WTC 7 branch hangs on that one
    thread and should be read as doing so. Nearly every decisive remaining test
    is cheap, desk- or lab-scale, and unperformed."
