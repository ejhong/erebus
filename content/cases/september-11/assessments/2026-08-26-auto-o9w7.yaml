    laboratory has adjudicated it. The trading anomaly is real (SEP-E020,
    SEP-E021) with an unauditable exculpatory trace-out (SEP-E022). The Saudi
    branch is genuinely open and stayed on appeal. Underneath runs proven
    official misconduct (SEP-E035, SEP-E026) that licenses withholding
