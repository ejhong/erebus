      the prediction the demolition reading requires is unmet. The strongest
      opposing consideration is genuine: the threshold is the investigation's
      own modeling rather than an independent measurement, and it assumes an
      unobstructed path in an environment full of obstructions, so the
      calculation is exactly the kind of agency work product this case otherwise
