  synthesis: "The case's structural finding — that the conventional account is
    substantially correct while being, at two identifiable points, not
    independently checkable, and that the challenger case is mostly refuted
    while pressing on one real gap — survives the evidence ledger as presented.
    The architecture is sound because it separates observation-rung facts that
    both camps concede (SEP-C001, SEP-C002, SEP-C005, SEP-C006, SEP-C007,
    SEP-C008, SEP-C015, SEP-C018, SEP-C024) from mechanism and attribution
    claims where the discrimination actually happens. That separation is doing
    most of the epistemic work, and it is done honestly: the free-fall interval
    is correctly credited to NIST's own report, the acoustic finding is
    correctly narrowed to sound *level* rather than to booms, and the Millette
    report is correctly read as refuting the \"just paint\" rebuttal as well as
    the nanothermite claim. I diverge from the case at two points. First, I
    grade SEP-C003 provisionally_supported rather than mixed. Unauditability is
    a real defect, but \"mixed\" implies evidence pulling in both directions,
    and the only affirmative counter-evidence in the ledger is a study whose
    negative conclusion about fire rests on a single static temperature field
    (SEP-E005/E006) and whose collapse-reproducing scenario is an imposed input
    (SEP-E007). Against that sits a specific, low-temperature, falsifiable
    mechanism consistent with the seven-hour unfought fire and with a
    demonstrated mechanism class (Plasco, SEP-E018). Second, I grade SEP-C020
    established rather than well_supported: the claim is narrowly about what the
    Commission's staff found in the recordings, and Staff Statement 17 states it
    verbatim. Steelmanning the challenger side: the two auditability failures
    are genuine and, on WTC 7, compounded permanently by the loss of identified
    steel. A mechanism no outsider can recompute, in the only fire-driven total
    collapse of a tall building, with the physical evidence recycled and an
    unexplained sulfidation anomaly whose recommended follow-up was never run,
    is a weaker epistemic position than official confidence implies.
    Steelmanning the conventional side: no branch of the challenger case has
    produced an affirmative artifact — no device, no blast signature, no
    reproducible chemistry, no identified informed trader, no documentary chart.
    The towers dispute is closed by the initiation-location argument, which is
    mechanistically independent of any agency's modeling. Two ledger weaknesses
    should be flagged. The strongest objection to SEP-C004 rests on pseudonymous
    forum posts (SEP-E007), and the seismic negative for SEP-C013 is NIST's
    characterization rather than the seismologists' own publication (SEP-E015).
    Both conclusions are probably right, but they lean partly on priors —
    respectively that imposed column removal cannot evidence itself, and that a
    demolition-scale detonation would register — rather than on primary
    documents this ledger has obtained."
claimAssessments:
  - claimId: SEP-C001
    verdict: established
    confidence: high
    reasoning: 'Two mutually independent official studies six years apart record the
      same facts: seven hours of fire, a severed 20-inch main, no manual
      firefighting, total collapse (SEP-E001, SEP-E002). The claim is hedged to
      "about" seven hours, which accommodates the twenty-second discrepancy
      between the video-derived and seismic collapse times. The strongest
      opposing consideration is that both sources are governmental, but the
      observation is corroborated by the videographic record and is conceded by
      every hypothesis in the case, so no interested-party discount applies.'
  - claimId: SEP-C002
    verdict: established
    confidence: high
    reasoning: The 2.25-second free-fall stage is quoted verbatim from NIST's own
      principal findings and restated in the agency's FAQ (SEP-E003), so the
      measurement is not contested by the party it is usually deployed against.
      The strongest opposing consideration is that this is a video measurement
      of a single visible face rather than of the structure as a whole, and it
      could in principle be an artifact of reference-point selection — but no
      published re-analysis in the ledger raises that objection, and the agency
      itself accepts the figure. Note that the claim asserts only the
      measurement, not any inference from it.
  - claimId: SEP-C003
    verdict: provisionally_supported
    confidence: moderate
    reasoning: "I part from the case's \"mixed\" grade. The mechanism is specific,
      low-temperature, falsifiable, and consistent with the observed conditions
      (SEP-E004), and the mechanism class — total fire-induced collapse of a
      steel-framed high-rise — is no longer hypothetical (SEP-E018). The
      affirmative counter-evidence is thin: the challenger study drove its
      models with one static temperature field (SEP-E006) and appears to have
      imposed rather than derived its collapse scenario (SEP-E007), so it does
      not contradict the girder-walk-off mechanism so much as fail to test it.
      The strongest opposing consideration, and the reason confidence cannot
      exceed moderate, is SEP-C005: no one outside the agency can recompute this
      sequence, so it has never been independently confirmed, and \"unaudited\"
      caps how far any grade may go."
  - claimId: SEP-C004
    verdict: weakly_supported
    confidence: moderate
    reasoning: "The study's openness with its data is real and creditable, but its
      two stated conclusions are undermined by its own method: a single static
      temperature distribution cannot represent the migrating fires the official
      mechanism depends on (SEP-E006), and the near-simultaneous column failure
      appears to be an input whose output is then reported as a finding
      (SEP-E007). Its own text concedes it identified no alternative rather than
      excluding one (SEP-E005). The strongest opposing consideration is that the
      decisive objection here rests on pseudonymous forum characterization that
      the study's authors have not answered in any document this ledger
      obtained, which is weak provenance for a load-bearing rebuttal; the
      funding relationship and absence of journal review are secondary, not
      disqualifying."
  - claimId: SEP-C005
    verdict: established
    confidence: high
    reasoning: The file counts, the July 2009 statutory finding, the stated
      rationale, and the court's holding are quoted verbatim from the opinion
      (SEP-E008). The second half of the claim — that the mechanism therefore
      cannot be independently reproduced from published materials — follows, and
      is corroborated by the absence of any independent reproduction in the
      ledger. The strongest opposing consideration is that the withheld set
      might not in fact contain what reproduction requires, and the opinion's
      own arithmetic does not reconcile; but neither point disturbs the claim as
      worded, which asserts withholding and non-reproducibility, not pretext.
  - claimId: SEP-C006
    verdict: established
    confidence: high
    reasoning: "The investigating agency states the loss and explains its cause in
      its own FAQ (SEP-E009), which is the strongest form this kind of negative
      claim can take: an institution documenting a gap in its own evidentiary
      base. The strongest opposing consideration is that no independent
      inventory confirms that no provenanced piece survives anywhere in private
      or museum hands, so the claim is a well-supported negative rather than an
      exhaustively verified one. Its significance is that it permanently
      forecloses the metallurgical test that could have discriminated between
      competing WTC 7 mechanisms."
  - claimId: SEP-C007
    verdict: established
    confidence: high
    reasoning: "Every element of the claim is verbatim in the FEMA appendix: the
      sulfidation with intergranular eutectic melting, the explicit statement
      that no source for the sulfur was identified, and the recommendation for a
      detailed follow-up study (SEP-E010). That no such study exists is
      supported by its absence from the ledger and by the research agenda. The
      strongest opposing consideration is that the two members were
      opportunistically recovered with hedged identifications, and the
      appendix's own leading possibility is post-collapse heating in the debris
      pile — but that bears on what the anomaly means, not on whether it was
      documented and left open."
  - claimId: SEP-C008
    verdict: established
    confidence: high
    reasoning: The claim is deliberately minimal — that loud explosion-like sounds
      were reported — and it is satisfied by on-record broadcast and responder
      accounts (SEP-E011) plus the agency's own FAQ, which answers rather than
