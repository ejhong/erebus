      consideration is that the compilation is advocacy-assembled and selected
      toward a conclusion; but since the claim asserts only that such reports
      exist, selection bias does not defeat it. Lay identification of a sound as
      an explosion is not a measurement, which is why diagnosticity here is
      properly rated low.
  - claimId: SEP-C009
    verdict: contradicted
    confidence: moderate
    reasoning: "NIST published a falsifiable threshold — 130–140 dB at half a mile
