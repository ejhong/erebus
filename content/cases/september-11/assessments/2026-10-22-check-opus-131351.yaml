      evidential weight for charges is close to nil. The one discriminating test
      in the record points against the claim. NIST predicted that the smallest
      charge able to fail Column 79 would reach 130–140 dB at half a mile, and
      found that no witness reported, and no collapse-video audio track
      recorded, a noise of that level (SEP-E012). The strongest opposing
      consideration is that this threshold is NIST's own modeling under an
      unobstructed-path assumption in an obstructed street grid, and the ledger
      holds no independent acoustic analysis of the audio. The verdict therefore
      hangs on a single non-independent record, which is why confidence is
      moderate.
    confidence: moderate
  - claimId: SEP-C010
