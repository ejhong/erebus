  synthesis: >-
    The case presents itself as a map of disputes rather than one proposition. I
    therefore take the featured hypothesis to be the challenger account the
    claims are built around. Its central claim is that the official explanation
    fails at its contested points, above all that WTC 7 (and by extension the
    towers) was deliberately destroyed rather than brought down by fire and
    impact. Official foreknowledge, informed trading, and Saudi state complicity
    are its attribution-rung companions. The baseline is established and not in
    play (SEP-C030, SEP-C001). Graded as a conjunction, this hypothesis would be
    contradicted. Graded by its central claim, it is weakly supported, and that
    is my verdict.

    The structure is a two-layer split. The observation layer the hypothesis
    points to is overwhelmingly real, and much of it is established by the
    government's own records. WTC 7's north face fell freely for about 2.25 s
    (SEP-C002). The specific initiation mechanism cannot be recomputed because
    68,500 files are withheld (SEP-C005). No identified WTC 7 steel survives
    (SEP-C006). Sulfidation on recovered steel is unexplained (SEP-C007), and
    booms were reported (SEP-C008). The option anomaly is real (SEP-C015), the
    warnings existed (SEP-C018), and the air-defense chronology was misdescribed
    (SEP-C020). EPA's assurances were edited (SEP-C024), and a Saudi government
    employee's practical help is undisputed (SEP-C022).

    The attribution layer fails nearly everywhere it has been tested: the
    acoustic signature a column-failing charge predicts is absent (SEP-C009);
    the seismic record shows no precursors (SEP-C013); the thermite chemistry
    fails on independently archived dust (SEP-C014); the headline trades trace
    to an institution whose paired long position in American stock is hard to
    square with foreknowledge, and to a newsletter now partly corroborated
    (SEP-C016); the Joint Inquiry and inspector general document disconnection,
    not concealment (SEP-C019); the chart the inspector general matched to the
    Able Danger recollections did not name Atta (SEP-C021); and "pull it" sits
    in a containment conversation (SEP-C017). The bridge between the layers is
    where the hypothesis breaks. The conventional account accommodates nearly
    every anomaly about as well, so each carries little weight as evidence for
    the alternative.

    The crux is WTC 7. I grade NIST's sequence provisionally supported at low
    confidence (SEP-C003) and demolition weakly supported (SEP-C010). The
    free-fall stage does not discriminate between them, though NIST's
    explanation came after the measurement rather than before it.
    Near-simultaneous loss of exterior support over roughly eight stories is
    NIST's own description of Stage 2 as much as it is UAF's conclusion. What
    differs is cause and sequence. Only the withheld files, the lost steel, or a
    blinded re-analysis (SEP-R001, SEP-R002) could settle those. I prefer NIST's
    account because it derives the collapse from documented conditions while UAF
    imposes it. That is a methodological reason, not deference, and I note the
    asymmetry in openness runs the other way.

    Steelman for the hypothesis: the one mechanism that would close the crux is
    unauditable by statute. The steel that could have tested it was removed
    before anyone could identify it. Federal investigators measured free fall.
    Federal metallurgists found a sulfur-driven eutectic attack they could not
    explain and asked for a study that, on this record, was never run. No one
    tested the steel for residues. The government is documented misleading the
    public about air safety and the air-defense response. Distrust is earned.

    Steelman against: none of that is positive evidence of demolition or
    complicity. Every specific prediction of the alternative that has been
    checked came back negative. Plasco removed the premise that fire cannot
    totally collapse a steel high-rise. The government's own oversight exposed
    the misconduct, and the same recordings that indict air-defense candor
    refute the shootdown story.

    The Saudi branch is the live exception (SEP-C023, mixed). But it concerns
    support for al-Qaeda's own hijackers, which the official record itself
    flagged as leads. The court's preliminary findings also do not reach
    institutional knowledge of the plot.

    Sensitivity: the record whose removal would most change this verdict is
    SEP-E012, the only discriminating measurement in the crux branch. Without
    it, SEP-C009 would fall to unresolved and SEP-C010 would drift toward mixed.
    The case verdict survives, because the towers, foreknowledge, and trading
    branches rest on independent records (SEP-E015, SEP-E017, SEP-E022,
    SEP-E024, SEP-E025). The WTC 7 judgment, however, would then rest on UAF's
    methodological weakness and on priors rather than on any observation.
    SEP-E012 is itself NIST's unreplicated modeling, so even with it the crux
    hangs on a thread from the institution whose model is unaudited. Where
    verdicts lean on priors (covert rigging, kaolin morphology, the
    non-specificity of a heating exotherm), the claim reasoning says so.
  steelman: "The incendiary form of the WTC 7 demolition hypothesis is untouched
    by the evidence this assessment leans on. NIST's 130–140 dB threshold
    (SEP-E012) constrains only explosive charges; a column-cutting incendiary
    predicts no blast report at all. The two tests that could discriminate it
    were never run. NIST did not test steel for thermite or thermate residue,
    and its stated reason lists sulfur among the thermate elements, setting it
    aside only as confounded by wallboard gypsum rather than excluding it
    (SEP-E016). No identified WTC 7 steel survives to examine (SEP-E009). The
    only metallurgical examination in the ledger found a severe sulfur-driven
    attack with intergranular eutectic melting. Its authors could not identify
    the sulfur source and wrote that the attack may have begun before collapse
    (SEP-E010). The 2.25 s free-fall stage (SEP-E003) is explained only by an
    account whose underlying modeling files are withheld (SEP-E008) and which no
    outside team has reproduced. The predictions that would confirm or kill this
    variant remain untested in this ledger: sulfur source apportionment on the
    corroded steel, residue chemistry on steel, a blinded multi-laboratory dust
    test, and an independent recomputation of NIST's initiation. My verdict
    against it rests on the absence of positive evidence and on priors about
    covert rigging, not on any failed test."
claimAssessments:
  - claimId: SEP-C030
    verdict: established
    reasoning: The court's own trial-exhibits index (SEP-E038) states every element
      of the claim almost verbatim. All 1,202 exhibits admitted at trial are
      linked except seven that are classified or otherwise remain under seal,
      and they were posted July 31, 2006. A court's description of its own
      docket is the authoritative record for a fact of this kind, and nothing in
      the ledger disputes it. The strongest opposing consideration is that the
      count and date rest on the court page's self-description; the case has not
      inventoried the exhibits. The claim's significance, that the plot's
      authorship was adversarially tested, is a further inference this claim
      does not itself make.
    confidence: high
  - claimId: SEP-C001
    verdict: established
    reasoning: "NIST's final report fixes nearly seven hours of fire ending in total
      collapse (SEP-E001). FEMA's earlier, independent study records the broken
      Vesey Street water main and that no manual firefighting was attempted for
      lack of water (SEP-E002). Neither side of the dispute contests the event.
      The descriptors \"47-story\" and \"no aircraft struck,\" and the
      multi-floor extent of the fires, are not quoted in any evidence record;
      they rest on general background and the case framing, though no one
      disputes them. The strongest opposing consideration is wording: FEMA says
      water was \"limited\" and that \"preliminary indications\" were that no
      firefighting occurred, so \"no water available\" compresses a hedged
      source. That compression does not touch the finding that the fires went
      unfought."
    confidence: high
  - claimId: SEP-C002
    verdict: established
    reasoning: "The interval is the investigating agency's own published
      measurement. Its three-stage descent includes a second stage that was \"a
      freefall descent over approximately eight stories at gravitational
      acceleration for approximately 2.25 s\" (SEP-E003). The quoted text gives
      eight stories, not 32 m. As a background check, 32 m fits eight stories at
      ordinary floor heights. It is also kinematically consistent with free fall
      entered at a few metres per second from Stage 1; from rest, 2.25 s of free
      fall covers only about 25 m. The phrase \"prompted by public comment\"
      rests on the editor's gloss and the draft-for-comment chronology rather
      than on quoted text. The strongest opposing consideration is scope: this
      is a video measurement of one face, not of the structure, and the claim
      records what was measured, not what it means. NIST attributes Stage 2 to
      buckled exterior columns providing negligible support."
    confidence: high
  - claimId: SEP-C003
    verdict: provisionally_supported
    reasoning: "NIST's sequence (SEP-E004) is the only account in the record that
      derives total collapse from documented conditions rather than imposing it:
      fire-driven thermal expansion at or below about 400 °C walks the Column
      79–44 girder off its seat. Its rival used one static temperature field and
      imposed simultaneous column failure (SEP-E005, SEP-E006, SEP-E007). The
      blast alternative fails the acoustic test (SEP-E012), and Plasco removes
      the class-level objection that fire cannot totally collapse a steel-framed
      high-rise (SEP-E018). That is why the claim leans supported, on method
      rather than on who produced the account. FEMA's study (SEP-E002) is filed
      as support but bears only on the unfought-fire condition; it rated its own
      superseded diesel hypothesis improbable. The strongest opposing
      consideration is that nobody outside NIST has checked the sequence: the
      modeling files are withheld (SEP-E008), no identified steel survives
      (SEP-E009), and the only independent attempt failed to reproduce it. The
      broad conclusion that fire drove the collapse is better supported than the
      girder-specific detail, and my lean rests on the model's stated design,
      not on any audit of its execution."
    confidence: low
  - claimId: SEP-C004
    verdict: weakly_supported
    reasoning: "The study's own text is weaker than the claim. SEP-E005, filed as
      \"undermines\" relative to the official mechanism, is this claim's own
      source; it says it \"cannot completely rule out\" an alternative and that
      simultaneous failure is only the scenario it identified. So \"only ...
      reproduces\" overstates it, and \"over about eight stories\" is not in the
      quoted conclusion. Its primary conclusion rests on one connection under a
      single static temperature field that cannot represent moving fires
      (SEP-E006). Its secondary conclusion is circular if simultaneous column
      removal is the model's input rather than its result, and the
      debris-distribution mismatch raised against it is unanswered (SEP-E007).
      Near-simultaneous loss of exterior support over about eight stories is
      also NIST's description of Stage 2 (SEP-E003), so the observed descent
      does not discriminate the accounts; cause and sequence do, and the study
      offers no cause, while Plasco undercuts the premise that fire could not do
      this (SEP-E018). The strongest opposing consideration: this is the only
      independent model, its source record notes released inputs, and no
      fire-progression analysis an outsider can check has rebutted its finding
      that the fire scenario fails."
    confidence: moderate
  - claimId: SEP-C005
    verdict: established
    reasoning: "The court's memorandum opinion (SEP-E008) documents each factual
      element: the Director's July 9, 2009 statutory finding that disclosure
      \"might jeopardize public safety\"; 68,500 data files withheld against
      25,644 released; and the withholding upheld on April 7, 2011. The
      concluding inference follows from the agency's own court-accepted
      rationale. That rationale describes the withheld files as information that
      \"could be used to predict the collapse of a building\" and would instruct
      others in simulating it, so by that account the published remainder cannot
      reproduce the initiation. The strongest opposing consideration is scope:
      \"cannot be reproduced\" means cannot be recomputed from NIST's inputs,
      not cannot be tested, since an independent re-derivation from drawings is
      possible in principle (SEP-R002). The opinion's unreconciled figures
