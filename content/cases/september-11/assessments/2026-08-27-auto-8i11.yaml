  synthesis: >-
    A single verdict on "9/11" would be meaningless, so this one is scoped to
    the disputes the case actually grades, and they stratify.

    The authorship of the attacks and the destruction of the Twin Towers are
    settled by positive evidence, not by absence: adversarially tested trial
    exhibits (SEP-E038), initiation at the impact floors of unpredictably aimed
    aircraft, and a seismic record showing no pre-collapse signal (SEP-E015).
    SEP-C013 is contradicted, not merely unproven.

    The conventional account nonetheless carries two conceded debts, both about
    auditability rather than physics. The WTC 7 mechanism (SEP-C003) is
    specific, falsifiable, and requires no melted steel — and cannot be
    recomputed by anyone outside the agency, because roughly 68,500 modeling
    files were withheld under a finding a court upheld (SEP-E008), while no
    identified WTC 7 steel survives to test against (SEP-E009). The towers'
    total progression was never modeled end to end; the agency says so
    (SEP-E014). Unauditable is not wrong, but it is unauditable, which is why
    SEP-C003 stays mixed.

    The challenge fares badly but not uniformly. SEP-C004 rests on an input
    presented as a finding (SEP-E007). The nanothermite dispute now has both
    sides on the record: SEP-E039 asserts elemental aluminum, SEP-E017
    independently fails to find it in custody-archived dust and also refutes the
    standard primer rebuttal, leaving the chips genuinely unidentified. The
    trading anomaly is real and strengthened by SEP-E040; its attribution is
    not. The Saudi branch (SEP-C023) is the only live one with a forcing
    mechanism, currently stayed on appeal.

    Running underneath is proven official misconduct — edited air-quality
    assurances (SEP-E035), air-defense accounts contradicted by the tapes
    (SEP-E026). That licenses refusing presumptive deference to official
    reassurance; it does not license inferring concealment of authorship, and
    both deceptions were surfaced by other organs of the same government.

    Sensitivity: the record whose removal would most change this verdict is
    SEP-E008. Without the withholding opinion, the principal reason SEP-C003
    grades mixed rather than well_supported disappears and the case reads closer
    to a substantially verified conventional account. The overall mixed verdict
    still survives, because SEP-E009 (no preserved WTC 7 steel), SEP-E014 (no
    end-to-end progression model) and the open Saudi and trading-attribution
    branches independently keep parts of the ladder unresolved — but the WTC 7
    branch would move, and that should be said plainly rather than buried.
