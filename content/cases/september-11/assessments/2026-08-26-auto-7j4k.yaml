  synthesis: >-
    A single verdict on "9/11" would be meaningless, so this one is scoped to
    the disputes the case actually grades, and they stratify.


    Authorship and the towers are settled by positive evidence, not by absence:
    adversarially tested trial exhibits (SEP-E038), initiation at the impact
    floors with widely dislodged insulation (SEP-E013), and a seismic record
    showing no pre-collapse signal (SEP-E015). SEP-C013 is contradicted, not
    merely unproven.


    The conventional account nonetheless carries two conceded debts, both about
    auditability rather than physics. The WTC 7 mechanism (SEP-C003) is
    specific, falsifiable and requires no melted steel, yet cannot be recomputed
    by anyone outside the agency because roughly 68,500 modeling files were
    withheld under a finding a court upheld (SEP-E008), and no identified WTC 7
    steel survives to test against (SEP-E009). The towers' total collapse
    progression was never modeled end to end; the agency says so and substitutes
    a capacity argument (SEP-E014). Unaudited is not wrong — but it is
    unverifiable by design.


    The challenge fares badly and unevenly. SEP-C004 rests on an input
    (near-simultaneous column removal) presented as a finding (SEP-E007).
    SEP-C009 fails a published acoustic prediction (SEP-E012). On the dust chips
    the affirmative case is now on the record (SEP-E039) and stands in direct
    factual conflict with SEP-E017 over the single decisive question — elemental
    aluminum — with neither analysis peer-reviewed and only SEP-E017 working
    from custody-archived material; that asymmetry, not the absence of an
    affirmative claim, carries the verdict, and a third laboratory could settle
    it cheaply. Tehran 2017 (SEP-E018) removes the mechanism-class prior that
    fire cannot totally collapse a steel-framed high-rise, without establishing
    similarity to WTC 7.


    Running underneath everything is documented official deception — edited
    air-quality assurances (SEP-E035) and air-defense accounts contradicted by
    the tapes (SEP-E026). That licenses refusing presumptive deference; it does
    not license inferring concealment of authorship, and both were exposed by
    other organs of the same government.


    Sensitivity: the record whose removal would most change this verdict is
    SEP-E008. Without the withholding and the court's upholding of it, the WTC 7
    mechanism would be checkable in principle and SEP-C003 would likely move to
    provisionally_supported, pulling the case toward the conventional account.
    The mixed verdict survives even so, because SEP-E009 (no preserved WTC 7
    steel) and SEP-E014 (no end-to-end progression model) independently keep two
    central mechanism claims outside independent verification — but it survives
    on thinner ground, and that dependence should be stated plainly.
