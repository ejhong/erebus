caseAssessment:
  verdict: mixed
  whatIsClaimed: "Critics of the official account claim, in ascending order of strength: that the public technical record is incomplete and not independently reproducible (withheld modeling files, unrecovered steel, an untested sulfidation anomaly); that specific official accounts were false (air-defense timelines, air-quality assurances); that some actors held advance knowledge and allowed or profited from the attacks; and, on the strongest versions, that the buildings were destroyed with pre-placed devices, implying inside participation. The featured question is not who attacked the United States — the answer to that is well established here. It is which of these evidentiary challenges survives verification."
  whereDisagreementLives: "Almost none of it lives at the observation rung. Both sides accept that WTC 7's north face fell at gravitational acceleration for roughly 2.25 seconds — the figure is in NIST's own final report, added after public comment. Both accept the pre-attack option volumes. Both accept the August 6, 2001 President's Daily Brief was titled \"Bin Ladin Determined To Strike in US.\" The fight is one rung up, at mechanism and attribution: whether fire alone produces the WTC 7 initiation NIST modeled, a dispute now narrowed to a single girder-to-column connection under thermal load and argued between a federal model whose data files are largely withheld and an advocacy-funded open one; whether tracing the headline trades to innocuous buyers exhausts the anomaly when the underlying files stay closed;   whether destroyed data-mining records covered an identification; and whether documented assistance to two hijackers reflected institutional intent — a question a court found legally sufficient to try in August 2025, though the Kingdom appealed and proceedings are stayed."
  whatWouldSettleIt: Work nobody has done, most of it desk-scale. A blinded independent re-analysis of the Floor 13 girder and Column 79 connection using both the federal and the challenger datasets. Release, or bounded re-derivation, of the roughly 68,500 withheld WTC 7 modeling files. A chain-of-custody, blinded multi-laboratory re-test of the red/gray dust chips against both thermite and primer controls. The sulfur-source study the FEMA appendix's own authors called for and no one ran. Declassification of the trade-tracing files behind the Commission's put-option conclusions. The data-mining destruction certificates. And, self-executing, the Saudi civil trial record as it develops. Each is specified in the research agenda with what either outcome would prove.
  bestConventionalExplanation: "Al-Qaeda planned and executed the attacks; the buildings fell from impact, fire, and gravity; and the government's failures were of competence, not complicity. The authorship case rests on mutually independent streams — flight and air-traffic records, passenger calls, DNA, immigration and financial records, and over a thousand exhibits admitted in open court — and no serious party disputes it. The towers fell because impacts severed columns and stripped fireproofing while multi-floor fires weakened what remained; NIST concluded neither tower would have collapsed had the fireproofing stayed on, and once a dozen-plus stories dropped one floor, no plausible structure arrests that. WTC 7 fell because debris-ignited fires burned unfought for seven hours after the water main was cut, thermally expanding long-span floor framing until a girder walked off its seat — a mechanism needing no melted steel, and no longer without precedent since Tehran's Plasco tower burned and fell in 2017. The free-fall interval is the expected signature of a hollowed-out facade, not of demolition, which would have required detonations no recording captured. The warnings were real but generic, and the government's own inspectors general documented the failures. The trades traced to innocuous buyers. Its unpaid debt is reproducibility: the WTC 7 conclusion cannot be recomputed from what was published, no WTC 7 steel was kept, and where officials misled, they were caught by other organs of the same government rather than by disclosure."
