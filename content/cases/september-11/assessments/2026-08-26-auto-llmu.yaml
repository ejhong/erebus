    A single verdict on "9/11" would be meaningless, so this one is scoped to
    the disputes the case actually grades, and they stratify.


    The observation rung is solid and mostly conceded by the government's own
    documents: seven hours of unfought fire and total collapse at WTC 7
    (SEP-E001, SEP-E002), a 2.25-second free-fall interval published by the
    investigating agency itself (SEP-E003), 68,500 withheld modeling files
    upheld in court (SEP-E008), no preserved identifiable WTC 7 steel
    (SEP-E009), unexplained sulfidation with an unperformed follow-up study
    (SEP-E010), a real pre-attack option anomaly (SEP-E019, SEP-E020, SEP-E021),
    fragmentary warnings (SEP-E023, SEP-E024), air-defense accounts contradicted
    by the tapes (SEP-E026, SEP-E027), and edited air-quality assurances
    (SEP-E035). These are established and they license refusing presumptive
    deference to official reassurance. They do not license inferring concealment
    of authorship — and both proven deceptions were exposed by other organs of
    the same government.


    The mechanism rung is where the case sits. The official WTC 7 sequence
    (SEP-E004) is specific, falsifiable, requires no melted steel, and cannot be
    recomputed by anyone outside the agency. The tower progression was never
    modeled end to end and the agency says so (SEP-E014). Unaudited is not
    wrong; it is unaudited, and that is what "mixed" records.


    The challenge fares badly. The counter-model imposes near-simultaneous
    column failure rather than deriving it (SEP-E005, SEP-E006, SEP-E007).
    Demolition at WTC 7 fails a published acoustic prediction (SEP-E012); the
    towers show no pre-collapse seismic signal (SEP-E015); the "pull it" reading
    collapses in context (SEP-E036). The newly recorded thermite paper
    (SEP-E039) puts the affirmative chemistry on the record but stands in direct
    factual conflict with SEP-E017 on the one element the claim cannot do
    without, on samples with no chain of custody and no third-laboratory
    adjudication.


    Sensitivity: the record whose removal would most change this verdict is
    SEP-E008. Without the withholding and the court's ratification, the
    auditability debt behind SEP-C003 largely dissolves and the WTC 7 branch
    drifts toward well_supported. The case verdict nonetheless survives its
    removal — SEP-E009 (no testable steel), SEP-E014 (no progression model), the
    unresolved Saudi branch (SEP-C023), and the unauditable trade trace-outs
    (SEP-E022) independently keep the roll-up at mixed. The verdict does not
    hang on one thread; SEP-C003 comes closer to doing so.
