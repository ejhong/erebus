    A single verdict on "9/11" would be meaningless, so this one is scoped to
    the disputes the case actually grades, and they fall into three strata that
    point different ways.


    First, authorship and the towers are settled by positive evidence, not by
    absence. Adversarially tested exhibits (SEP-E038), initiation at the impact
    floors with widely dislodged insulation (SEP-E013), and a seismic record
    showing no pre-collapse signal (SEP-E015) make SEP-C013 contradicted rather
    than merely unproven.


    Second, the conventional account carries two unpaid debts, both about
    auditability rather than physics, and both conceded in government documents.
    The WTC 7 mechanism (SEP-C003) is precise, falsifiable, requires no melted
    steel — and cannot be recomputed by anyone outside the agency, because
    roughly 68,500 modeling files were withheld under a finding a court upheld
    (SEP-E008), while no identified WTC 7 steel survives to test against
    (SEP-E009). The towers' total progression was never modeled end to end; the
    agency says so and substitutes a capacity argument (SEP-E014). Neither debt
    implies the account is wrong. Both mean a central claim is unverifiable by
    design.


    Third, the challenge fares badly but not uniformly. The counter-model
    (SEP-C004) rests on an input presented as a finding (SEP-E007). The
    demolition reading of WTC 7 survives only as weakly supported, living on the
    audit gap rather than on any artifact, and failing a published acoustic
    prediction (SEP-E012). The dust chemistry now has both sides on the record —
    SEP-E039 asserting elemental aluminum, SEP-E017 finding none in
    custody-archived samples — and the affirmative paper's provenance and
    non-reproduction leave the claim contradicted, though SEP-E017 also refutes
    the popular primer-paint rebuttal, so the chips remain unidentified. The
    trading anomaly (SEP-C015) is real and its exculpatory explanation
    (SEP-E022) is unauditable. The Saudi branch is genuinely open and stayed on
    appeal.


    Running underneath is proven official misconduct — edited air-quality
    assurances (SEP-E035), air-defense accounts contradicted by the tapes
    (SEP-E026). That justifies refusing presumptive deference to official
    reassurance; it does not license inferring concealment of authorship, and
    both deceptions were exposed by other organs of the same government.


    Sensitivity: the record whose removal would most change this case verdict is
    SEP-E008. Without it, SEP-C003 would likely move from mixed toward
    well_supported and SEP-C010 would lose most of its remaining footing. The
    case verdict would still be mixed, carried by SEP-E009, SEP-E014, SEP-E022
    and the open Saudi branch — but by a thinner margin. The verdict does not
    hang on one thread; the WTC 7 branch of it largely does.
