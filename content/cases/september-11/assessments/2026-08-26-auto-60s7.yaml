  synthesis: >-
    A single verdict on "9/11" would be meaningless, so this one is scoped to
    the disputes the case actually grades, and they sort into three strata
    pointing different ways.


    Authorship and the towers are settled by positive evidence, not by absence:
    adversarially tested exhibits (SEP-E038), initiation at the impact floors
    with the report's own conjunctive hedge (SEP-E013), and a seismic record
    with no pre-collapse signal (SEP-E015). SEP-C013 is contradicted, not merely
    unproven.


    The conventional account nonetheless carries two unpaid debts, both about
    auditability rather than physics, and both conceded in government documents.
    The WTC 7 mechanism (SEP-C003) is specific, falsifiable and requires no
    melted steel, yet cannot be recomputed by anyone outside the agency because
    roughly 68,500 modeling files were withheld under a finding a court upheld
    (SEP-E008), and no identified WTC 7 steel survives to test against
    (SEP-E009). The towers' total progression was never modeled end to end
    (SEP-E014). Unaudited is not wrong; it is also not checkable, which is what
    "mixed" records.


    The challenge fares badly but unevenly. The counter-model (SEP-C004)
    presents an imposed input as a finding (SEP-E007). Demolition of WTC 7
    (SEP-C010) lives on the audit gap alone and fails a published acoustic
    prediction (SEP-E012). The dust chemistry is now genuinely contested rather
    than one-sided: SEP-E039 asserts elemental aluminum, SEP-E017 finds none in
    custody-archived dust and also refutes the standard primer rebuttal — the
    chips remain unidentified in the literature and no third laboratory has
    adjudicated. SEP-E018 shows the mechanism class (total fire-induced collapse
    of a steel high-rise) is real, which retires a central proponent prior
    without establishing similarity to WTC 7. The trading anomaly (SEP-C015) is
    real and its exculpatory trace-out (SEP-E022) is unauditable. The Saudi
    branch (SEP-C023) is the only one with a forcing mechanism, presently stayed
    on appeal.


    Underneath runs a proven record of official deception — edited air-quality
    assurances (SEP-E035), air-defense accounts contradicted by the tapes
    (SEP-E026). That justifies refusing presumptive deference; it does not
    license inferring concealment of authorship, and both were exposed by other
    organs of the same government.


    Sensitivity: the record whose removal would most change this verdict is
    SEP-E008. Without the withholding and the court's upholding of it, SEP-C003
    would rise toward well_supported and SEP-C010 toward contradicted. The case
    verdict of mixed survives without it — SEP-E009 and SEP-E014 independently
    establish that identified WTC 7 steel is gone and the tower progression was
    never modeled — but it survives weakened, and the WTC 7 branch would no
    longer be the sharpest open gap.
