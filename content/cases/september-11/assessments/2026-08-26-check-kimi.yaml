  synthesis: "This case is a ledger, not a single hypothesis, and the honest
    roll-up is that its disputes sort decisively in both directions — which is
    what \"mixed\" records here, not indecision. Steelmanning the challenger
    side first: the strongest version of its case is real and documentary, not
    speculative. The central engineering claim of the official WTC 7 account
    (SEP-C003) cannot be recomputed by anyone outside the agency, because
    roughly 68,500 modeling files were withheld under a statutory finding a
    federal court upheld (SEP-C005) — a fact established from the court's own
    opinion. No identified WTC 7 steel survives (SEP-C006), foreclosing the
    metallurgical test that could have discriminated between mechanisms. The one
    corrosion anomaly the government's own metallurgists flagged (SEP-C007) has
    never received the follow-up study they requested. The Commission's trade
    trace-outs (SEP-C016) are unverifiable assertion. The Able Danger question
    (SEP-C021) turns on destroyed data. And the calibration anchor is proven:
    health-relevant air-quality statements were centrally edited (SEP-C024), and
    air-defense accounts were contradicted by subpoenaed recordings (SEP-C020).
    Distrust of uncheckable official reassurance is earned by this record, not
    paranoid. Steelmanning the conventional side: al-Qaeda authorship rests on
    mutually independent streams tested adversarially; tower initiation is well
    supported with its hedge intact (SEP-C011); pre-planted demolition of the
    towers is positively disproved by initiation at unpredictably aimed impact
    floors plus the absence of any pre-collapse seismic signal (SEP-C013); the
    WTC 7 blast claim fails a falsifiable published acoustic prediction
    (SEP-C009); the nanothermite claim is contradicted by the only independent
    chemical analysis on record (SEP-C014); and the foreknowledge record shows
    traceable dysfunction, not concealment, at every documented node (SEP-C019).
    The structural finding: disagreement lives almost entirely at the mechanism
    and attribution rungs, sustained by auditability gaps rather than
    conflicting observations, and every decisive test is cheap, specified, and
    unperformed. The conventional account is substantially correct and, at two
    points (WTC 7 reproducibility, end-to-end tower progression, SEP-C012), not
    independently checkable; the challenger's affirmative artifacts all fail,
    while its critique of auditability stands. One dispute (SEP-C023) has a live
    judicial forcing mechanism, currently stayed."
