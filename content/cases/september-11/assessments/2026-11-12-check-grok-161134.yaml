  synthesis: "The baseline facts of the September 11 attacks rest on mutually
    reinforcing, high-quality records that survive inspection: the Moussaoui
    trial's public admission of 1,202 exhibits establishes an adversarial test
    of the hijacker identities, travel, financing and training; the multi-hour
    unfought fires and total collapse of WTC 7 are recorded in the federal
    investigation and the earlier FEMA study; the free-fall interval of the
    north face is the agency's own measurement after public comment; aircraft
    impact, dislodged fireproofing and multi-floor fires are the stated
    initiation mechanism for the Twin Towers, hedged by NIST itself as
    \"likely\"; fragmentary but real pre-attack warnings existed without
    identifying time, place or method; air-defense officials gave accounts later
    contradicted by their own tapes; one Saudi-connected employee’s practical
    apartment assistance to two hijackers is now undisputed in the civil record;
    and EPA air-safety statements were edited without sufficient data under
    White House influence. These load-bearing observations are established or
    well supported by primary reports, court filings and inspector-general
    findings. Against them, the affirmative alternative attributions collapse.
    Explosion-like sounds around WTC 7 are real but the claim they were
    demolition charges is contradicted by the agency’s published acoustic
    threshold that no recording or witness met. The Twin Towers
    explosive-demolition claim is contradicted by the absence of pre-collapse
    seismic signals and by the lack of residue testing that was never performed.
    The nanothermite identification of red/gray chips is contradicted by an
    independent analysis finding no elemental aluminum. Specific official
    foreknowledge and allowance of the plot is contradicted by the Joint
    Inquiry’s first factual finding and the DOJ inspector general’s detailed
    account of analytical failure without intentional misconduct. Able Danger’s
    pre-attack identification of Atta is contradicted by the DoD inspector
    general’s reconstruction of the actual chart. The “pull it” remark is
    contradicted by its documentary context of firefighter withdrawal. These
    contradictions are not prestige arguments; they are direct mismatches
    between claim and primary measurement or record. The remaining live disputes
    are genuine but limited. NIST’s WTC 7 initiation sequence (girder walk-off,
    Column 79) is specific and falsifiable yet cannot be recomputed because
    68,500 modeling files were withheld under a public-safety finding a court
    upheld; the UAF reevaluation concludes fire did not cause the collapse but
    itself uses a single static temperature field, imposes simultaneous column
    failure as input rather than output, and is advocacy-funded and unreviewed.
    Pre-attack put-option volumes are statistically anomalous and peer-reviewed
    papers find consistency with informed trading, yet the Commission’s
    trace-out to a single institutional investor and a newsletter remains
    unauditable from outside. The second Saudi-connected imam’s assistance rests
    on a preliminary jurisdictional finding of thinner but credible evidence
    (mosque meeting, timed calls, photograph) while the Kingdom denies
    assistance itself; the leap from two employees’ scope-of-employment acts to
    a state institution knowingly supporting the plot remains unresolved pending
    appeal and any trial. Sulfidation of two opportunistically recovered steel
    members is an open anomaly whose authors requested a follow-up study that
    never occurred. No end-to-end progressive-collapse model of the towers was
    ever produced. These gaps are real methodological and archival defects; they
    do not invert the baseline or resurrect the contradicted attributions. The
    case therefore stands as mixed: the core event sequence and the failure of
    the most-circulated alternatives are established or contradicted on the
    supplied record, while the auditability of WTC 7’s precise mechanism, the
    attribution of the trading anomaly, and the institutional reach of the
    documented Saudi-linked assistance remain open and load-bearing for any
    future revision. Sensitivity is highest to the court opinion’s preliminary
    findings on the California assistance and to the free-fall-plus-withholding
    pair; removal of either would shift the Saudi or WTC 7 branches but would
    not erase the contradicted demolition and foreknowledge claims or the
    established baseline."
  steelman: The free-fall interval of WTC 7’s north face for 2.25 seconds,
    combined with the permanent loss of identifiable WTC 7 steel and the
    court-upheld withholding of the 68,500 modeling files that would allow
    independent recomputation of the girder-walk-off sequence, leaves the
    precise initiation mechanism unreproduced by any party outside NIST and
    therefore still consistent with a near-simultaneous multi-column failure
    whose cause is not yet publicly demonstrated from primary data.
