  - claimId: SEP-C030
    verdict: established
    reasoning: The Eastern District of Virginia court page states that 1,202
      exhibits were admitted and published online on 31 July 2006 except seven
      sealed items. This is a primary court record of an adversarial criminal
      proceeding. No opposing evidence appears in the ledger. The strongest
      opposing consideration is that seven exhibits remain sealed, but that does
      not disturb the count or the public release of the rest.
    confidence: high
  - claimId: SEP-C001
    verdict: established
    reasoning: NIST NCSTAR 1A records almost seven hours of fire from the collapse
      of WTC 1 until WTC 7’s total collapse at 5:20:52 p.m., the first known
      instance of total collapse of a tall building primarily due to fires; FEMA
      403 independently confirms the unfought condition from a broken water main
      and absence of manual firefighting. The 2017 Plasco collapse supplies a
      later instance of the same mechanism class. The strongest opposing
      consideration is the twenty-second discrepancy between video and seismic
      timing, which is a measurement-chain difference, not a denial of the
      event.
    confidence: high
  - claimId: SEP-C002
    verdict: established
    reasoning: NIST NCSTAR 1A’s own principal findings, added after public comment,
      state a three-stage descent including freefall at gravitational
      acceleration for approximately 2.25 s over about eight stories, with
      buckled columns providing negligible support. This is the agency’s
      measurement, not a challenger’s. The strongest opposing consideration is
      that it is a measurement of one visible face from video rather than the
      structure as a whole, yet the claim is precisely that measurement.
    confidence: high
  - claimId: SEP-C003
    verdict: mixed
    reasoning: NIST states a specific probable sequence—thermal expansion pushing
      the girder spanning Columns 79 and 44 off its seat, cascading floor
      failures, buckling of Column 79—at temperatures well below those causing
      significant strength loss. The UAF study concludes no fire-driven scenario
      reproduces the observed behavior, while methodological critiques note its
      static temperature field and input-driven column removal. The initiating
      mechanism cannot be recomputed because the bulk of the modeling files
      remain withheld. The strongest opposing consideration is the internal
      coherence and temperature specificity of the NIST sequence, yet
      unauditability and the existence of a contrary (if flawed) model leave the
      claim mixed rather than established or contradicted.
    confidence: moderate
  - claimId: SEP-C004
