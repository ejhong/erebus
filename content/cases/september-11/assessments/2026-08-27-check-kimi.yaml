  synthesis: "This case grades 24 disputes and the grades split by claim, not by
    camp — that split is the finding. The observation rung is almost entirely
    uncontested, and several observations cut against the side that cites them:
    the 2.25-second free-fall interval is in NIST's own principal findings; the
    phantom-scramble record that documents official misstatement about the
    air-defense timeline is simultaneously the strongest evidence against the
    shootdown theories; the EPA finding that proves centrally edited health
    reassurances was produced by the government's own inspector general. The
    conventional core survives contact with the record: tower initiation is well
    supported and tower demolition is positively disproved — initiation at
    unpredictably aimed impact floors plus a seismically silent run-up is
    disproof, not absence. \"Let it happen\" is contradicted by node-by-node
    inspector-general documentation of dysfunction rather than concealment. The
    strongest steelman for the challenger is procedural, not physical, and it is
    real: the single load-bearing engineering claim (SEP-C003) cannot be
    recomputed because 68,500 modeling files were withheld under a court-upheld
    safety finding; no identified WTC 7 steel survives; the sulfidation
    follow-up the FEMA metallurgists requested was never run; the dust
    literature is a two-laboratory standoff in which the anti-thermite analysis
    also excludes the building's primer, leaving both camps' settled answers
    unsupported; the trade-tracing files behind the Commission's footnote remain
    closed; and the data-mining records that could settle SEP-C021 were
    destroyed. Documented misconduct — edited air-quality statements, inaccurate
    air-defense accounts, destroyed interrogation tapes — makes reflexive
    deference irrational, while the fact that each was exposed by the
    government's own organs makes reflexive complicity inferences equally
    irrational. The counter-steelman holds too: unaudited is not wrong, no
    affirmative demolition artifact exists anywhere in the record, and the
    loudest anomalies have mundane candidate readings. Verdict: mixed, with high
    confidence — settled in the conventional direction at the observation and
    authorship rungs, genuinely open at exactly the WTC 7 initiation audit, the
    chemistry loose ends, the trading attribution, and the Saudi institutional
    question, with the decisive tests cheap, specified, and unperformed for
    twenty-five years."
claimAssessments:
  - claimId: SEP-C001
    verdict: established
    confidence: high
    reasoning: NIST's final report records seven hours of fire and total collapse
      verbatim (SEP-E001), and the earlier, independent FEMA study records the
      broken 20-inch Vesey Street water main and that no manual firefighting was
      attempted (SEP-E002). The roughly twenty-second collapse-time difference
      between video and seismic measurement chains is real and is why the claim
      says "about." Every hypothesis in the case accepts the observation, so
      there is no opposing consideration of substance — the strongest one
      available is that FEMA's study was preliminary and superseded, which bears
      on mechanism, not on this event record.
  - claimId: SEP-C002
    verdict: established
    confidence: high
    reasoning: The three-stage descent, including "a freefall descent over
      approximately eight stories at gravitational acceleration for
      approximately 2.25 s," is quoted verbatim from NIST's own principal
      findings (SEP-E003), added after public comment pressed the point. The
      claim as stated is about the measurement and its provenance, and both are
      documented. The strongest opposing consideration is that the measurement
      is of one visible face from video, not of the structure as a whole — a
      real limitation on diagnosticity, but not on whether the report states
      what this claim says it states.
  - claimId: SEP-C003
    verdict: mixed
    confidence: high
    reasoning: The NIST sequence is specific, internally coherent, and
      low-temperature — initiation at or below ~400 °C, peak column temperatures
      near 300 °C, no melted steel required (SEP-E004) — and Plasco 2017 removes
      any impossibility prior for the mechanism class (SEP-E018). But it has
      never been independently reproduced and cannot be, because the files
      needed to recompute it were withheld under a court-upheld finding
