      it (SEP-E012). That is a published prediction the recorded evidence fails
      to meet, which contradicts the charge attribution for the reported sounds.
      The strongest opposing consideration is that the threshold is the agency's
      own model assuming unobstructed sightlines in a dense urban environment;
      but attenuation would have to erase a jet-engine-level signal from every
      recording simultaneously, and this verdict leans partly on general
      acoustics background in so reasoning, which is flagged per the rules.
      Confidence is moderate because the threshold itself was never
      independently derived.
