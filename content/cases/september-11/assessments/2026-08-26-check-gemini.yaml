      the time, place, and exact nature of the plot. The strongest opposing
      consideration is that the historical record was compiled by bodies
      assessing their own failures, giving them an institutional interest in
      portraying their lapses as analytical rather than culpable.
  - claimId: SEP-C019
    verdict: contradicted
    confidence: high
    reasoning: The Joint Inquiry and internal inspector general reviews found no
      intentional misconduct or specific foreknowledge, documenting instead a
      trail of profound bureaucratic and analytical dysfunction. Multiple missed
