      nanothermite. The strongest opposing consideration is that the independent
      rebuttal also definitively ruled out the towers' column primer, leaving
      the actual composition of the chips completely unidentified in
      peer-reviewed literature.
  - claimId: SEP-C015
    verdict: well_supported
    confidence: high
    reasoning: Exchange data reflects highly skewed put-to-call ratios for the
