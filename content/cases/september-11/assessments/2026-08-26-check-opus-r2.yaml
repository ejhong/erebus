  synthesis: "The case is not a single hypothesis but a partition, and the
    partition survives the evidence ledger largely intact — which is why the
    case-level verdict is mixed in the substantive sense rather than the evasive
    one. Three groups resolve in three different directions, and no global
    position on either side is vindicated. First, the demolition family fails on
    affirmative grounds, not on absence: for the towers, initiation coincided
    with impact floors that no planner could have designated in advance, the
    seismic record carries no pre-collapse signal, and the only affirmative
    physical-evidence claim (the red/gray chips) is contradicted by an
    independent analysis that found none of the elemental aluminium the claim
    requires. For WTC 7 the acoustic prediction of 130–140 dB at half a mile is
    a genuine falsifiable test that the recorded evidence does not meet. Second,
    the conventional account is well supported at the level that matters most —
    impact plus stripped fireproofing plus multi-floor fire as the initiator of
    both tower collapses — and its coarse WTC 7 mechanism (fire-driven thermal
    expansion, connection failure, progressive collapse) has no competing
    published rival and now has a mechanism-class precedent in Tehran 2017.
    Third, and this is where the case earns its existence, two specific
    auditability defects are real and documented from the government's own
    records: 68,500 withheld modeling files upheld in court, and an agency
    admission that no identified WTC 7 steel survives. Neither is evidence of
    error; both mean the most consequential engineering claim here is
    permanently unverifiable by anyone outside the agency that made it.
    Steelmanning the challengers: an unreproducible model, destroyed physical
    evidence, an unperformed sulfur study the examining metallurgists themselves
    requested, unpublished trade-tracing files, and destroyed data-mining
    records constitute a pattern of foreclosed tests that would be unacceptable
    in any other forensic domain, and the EPA inspector-general finding proves
    that centrally managed official reassurance in this event was not
    hypothetical. Steelmanning the conventional side: every one of those gaps is
    an absence of confirmation, not a presence of contrary evidence, and the
    challenger literature has produced in twenty-five years exactly one
    engineering study, funded by the organisation campaigning for its
    conclusion, whose headline finding is an imposed model input. The honest
    roll-up is that the conventional account is substantially correct and, at
    two named points, not checkable — and that the case's own framing of this is
    supported by the records it cites."
