    A single verdict on "9/11" would be meaningless, so this one is scoped to
    the disputes the case actually grades, and they fall into three layers that
    point different ways.


    First, authorship and the towers are settled by positive evidence, not by
    absence: adversarially tested trial exhibits (SEP-E038), initiation at the
    impact floors with widely stripped insulation (SEP-E013), and a seismic
    record with no pre-collapse signal (SEP-E015). SEP-C013 is contradicted, not
    merely unproven.


    Second, the conventional account carries two unpaid debts, both about
    auditability rather than physics, and both conceded in government documents.
    The WTC 7 mechanism (SEP-E004) is specific, falsifiable and needs no melted
    steel — and cannot be recomputed by anyone outside the agency, because
    roughly 68,500 modeling files were withheld under a finding a court upheld
