    (SEP-E009). The towers' full collapse progression was never modeled end to
    end; the agency says so and offers a capacity argument instead (SEP-E014).
    Neither debt makes the account wrong. Both make a central claim unverifiable
    by design, which is why SEP-C003 stays mixed.


    Third, the challenge mostly fails but not uniformly. The counter-model
    (SEP-E005) imposes near-simultaneous column failure rather than deriving it
    (SEP-E007), and Tehran 2017 (SEP-E018) removes the categorical prior that
    steel-framed high-rises cannot collapse totally from fire. The demolition
    reading of WTC 7 lives on a real unaudited gap, not on any artifact, and
    fails a published acoustic prediction (SEP-E012). The dust chemistry is now
    an explicit head-to-head conflict — SEP-E039 asserts elemental aluminum,
    SEP-E017 finds none in custody-archived dust — and neither paper is
    journal-refereed, though only one worked from archived,
    provenance-controlled material. The trading anomaly is real (SEP-E020,
    SEP-E021) and its exculpatory trace-out is unauditable (SEP-E022). The Saudi
    branch is genuinely open and the only one with a forcing mechanism,
    currently stayed on appeal (SEP-E032).


    Running underneath is proven official misconduct — edited air-quality
    assurances (SEP-E035) and air-defense accounts contradicted by the tapes
    (SEP-E026). That justifies refusing presumptive deference to official
    reassurance; it does not license inferring concealed authorship, and both
    deceptions were exposed by other organs of the same government.


    Sensitivity: the record whose removal would most move this case is SEP-E008,
