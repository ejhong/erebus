  synthesis: >-
    A single verdict on "9/11" would be meaningless, so this one is scoped
    to what the case actually grades: the surviving evidentiary disputes.
    Three strata emerge, and they point in different directions.

    First, the authorship and the towers are settled, and settled by
    positive evidence rather than by absence. Adversarially tested trial
    exhibits, convergent independent record streams, initiation at the
    impact floors of unpredictably aimed aircraft, and a seismic record
    with no pre-collapse signal make the demolition-of-the-towers claim
    contradicted rather than merely unproven. Anyone treating that as an
    open question is not reading the record.

    Second, the conventional account carries two specific unpaid debts,
    both about auditability rather than physics, and both conceded in the
    government's own documents. The WTC 7 mechanism is precisely stated,
    requires no melted steel, and cannot be recomputed by anyone outside
    the agency, because roughly 68,500 modeling files were withheld under a
    finding a court upheld — and no identified WTC 7 steel survives to
    test against. The towers' total collapse progression was never modeled
    end to end; the agency says so and offers a capacity argument instead.
    Neither debt implies the account is wrong. Both mean a central claim
    is unverifiable by design, which is why the mechanism grades mixed
    rather than well supported.

    Third, the challenge fares badly but not uniformly. The demolition
    hypothesis for WTC 7 survives as weakly supported — living on a real
    unaudited gap rather than on any affirmative artifact, with no device,
    no residue finding, and a published acoustic prediction it fails. The
    counter-model rests on an input it presents as a finding. The dust
    chemistry contradicts the thermite claim outright, though it also
    refutes the standard rebuttal: the chips are not the building's primer
    either, and remain unidentified. The trading anomaly is real and its
    exculpatory explanation is unauditable. The data-mining question cannot
    be resolved because the data was destroyed. The Saudi question is
    genuinely open and is the only branch with a forcing mechanism
    attached, currently stayed on appeal.

    Running underneath all of it is a proven record of official misconduct
    — edited air-quality assurances, air-defense accounts contradicted by
    the tapes — which is established, load-bearing for calibration, and
    routinely misused. It justifies refusing presumptive deference to
    official reassurance. It does not license inferring concealment of
    authorship, and both deceptions were exposed by other organs of the
    same government.

    The honest bottom line: the conventional account is substantially
    correct and, at two identifiable points, not independently checkable;
    the challenge is mostly refuted and, at one identifiable point,
    pressing on something real. Nearly every decisive test is cheap,
    desk- or lab-scale, and unperformed.
