  organization: "National Institute of Standards and Technology"
  year: "2008"
  sourceType: report
  identifier: "NIST NCSTAR 1A; DOI 10.6028/NIST.NCSTAR.1a; published November 2008"
  url: "https://nvlpubs.nist.gov/nistpubs/Legacy/NCSTAR/ncstar1a.pdf"
  verification: ai_verified
  verificationNote: >-
    Official NIST PDF downloaded and read 2026-08-26; the collapse
    sequence (§2.4), three-stage descent analysis (§3.6 and Chapter 4),
    column temperatures (Ch. 2), first-known-instance statement (§ES.1),
    and blast findings (Ch. 4) all quoted verbatim with printed page
    numbers. Re-confirmed reachable 2026-08-26 after an automated checker
    reported a transient 404; the DOI in the identifier field resolves to
    the same file and is the stable fallback.
  reliabilityNotes:
    - "The most thorough engineering study of this collapse, and the only one with subpoena power and full site access; it is also the investigation whose adequacy is under dispute, so it is not independent of the question."
    - "The report's central initiation mechanism cannot be recomputed from the data NIST released — the modeling files were withheld, a withholding a court upheld."
    - "NIST's own pages give the final report's date variously as November 20 and November 23, 2008; neither is relied on as exact here."
    - "The girder designation widely used in public argument does not appear in this report, which refers only to the girder spanning between Columns 79 and 44; the lettered designation belongs to NCSTAR 1-9, which this case has not obtained."

