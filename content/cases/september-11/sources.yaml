# SEP-001 source registry. Every entry was independently verified by the
# editorial AI against the live primary document (or a dated archive
# snapshot, noted) on 2026-08-26 before entry; verificationNote records how.
# Casework briefs are never cited here, and no citation was inherited from
# them unchecked — several brief-supplied URLs proved truncated, mirrored, or
# attached to the wrong claim, and were corrected or dropped.
#
# Reliability notes distinguish access from inference: a source can be
# authoritative for what it directly shows and weak for its conclusions.
# Advocacy material on both sides is admitted only as claim-origin
# documentation and labeled as such.

# ── WTC 7: the challenger study ─────────────────────────────────────────

- id: SRC-UAF-WTC7-2020
  title: "A Structural Reevaluation of the Collapse of World Trade Center 7 — Final Report"
  authors: ["J. Leroy Hulsey", "Zhili Quan", "Feng Xiao"]
  organization: "Institute of Northern Engineering, University of Alaska Fairbanks"
  year: "2020"
  sourceType: report
  identifier: "INE Report 18.17; March 2020; 112 pp."
  url: "https://ine.uaf.edu/wtc7"
  verification: ai_verified
  verificationNote: >-
    Final report PDF downloaded and text-extracted 2026-08-26 (126 PDF
    pages); conclusions quoted from report pp. ii, 3, and 7. Project page
    live at the URL given.
  reliabilityNotes:
    - "Funded by Architects & Engineers for 9/11 Truth, an advocacy organization campaigning for the conclusion the study reached; the report names the funder without an amount, and the $316,153 figure appears on the funder's own project page."
    - "Not published in a peer-reviewed engineering journal; reviewers included academics associated with the funder."
    - "Full input and results data were released, which is more than the federal investigation it disputes has done — the openness is real and independent of whether the modeling is right."
    - "The report's own conclusion is hedged more carefully than its public reception: it states it cannot completely rule out an alternative scenario, only that it identified none capable of producing the observed behavior."

