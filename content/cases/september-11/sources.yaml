# SEP-001 source registry. Every entry was independently verified by the
# editorial AI against the live primary document (or a dated archive
# snapshot, noted) on 2026-08-26 before entry; verificationNote records how.
# Casework briefs are never cited here, and no citation was inherited from
# them unchecked — several brief-supplied URLs proved truncated, mirrored, or
# attached to the wrong claim, and were corrected or dropped.
#
# Reliability notes distinguish access from inference: a source can be
# authoritative for what it directly shows and weak for its conclusions.
# Advocacy material on both sides is admitted only as claim-origin
# documentation and labeled as such.

# ── the official investigative record ───────────────────────────────────

- id: SRC-911COMMISSION-2004
  title: "The 9/11 Commission Report: Final Report of the National Commission on Terrorist Attacks Upon the United States"
  organization: "National Commission on Terrorist Attacks Upon the United States"
  year: "2004"
  sourceType: report
  identifier: "Released July 22, 2004; 585 pp."
  url: "https://www.9-11commission.gov/report/911Report.pdf"
  verification: ai_verified
  verificationNote: >-
    Official PDF downloaded from 9-11commission.gov 2026-08-26 and read
    with text extraction; the put-options passage (Ch. 5 body p. 172,
    footnote 130 at p. 499), the Chapter 8 title (p. 254), the reproduced
    August 6 brief text (pp. 261–262), and the Saudi-funding sentence
    (p. 171) all quoted verbatim with page numbers.
  reliabilityNotes:
    - "The most comprehensive official narrative, and not independent of the institutions whose performance it assessed."
    - "Its account depends at several nodes on detainee interrogations conducted under conditions the government later acknowledged, and the recordings of some of those interrogations were destroyed — so 'the Commission says X citing an interrogation' and 'the detainee said X' are one source, not two."
    - "The put-options footnote states conclusions without naming the investor, the newsletter, or the underlying agency files, so its trace-outs cannot be audited from the public record."
    - "The Saudi-funding sentence carries a parenthetical caveat about charities with significant Saudi government sponsorship diverting funds; quoting the first clause alone misstates the source."

