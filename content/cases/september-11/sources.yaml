# ── WTC dust chemistry: both keystones sit outside normal peer review ───

- id: SRC-HARRIT-2009
  title: "Active Thermitic Material Discovered in Dust from the 9/11 World Trade Center Catastrophe"
  authors:
    - "Niels H. Harrit"
    - "Jeffrey Farrer"
    - "Steven E. Jones"
    - "Kevin R. Ryan"
    - "Frank M. Legge"
    - "Daniel Farnsworth"
    - "Gregg Roberts"
    - "James R. Gourley"
    - "Bradley R. Larsen"
  organization: "The Open Chemical Physics Journal"
  year: "2009"
  sourceType: paper
  identifier: "Open Chem. Phys. J. 2:7–31; DOI 10.2174/1874412500902010007"
  url: "https://benthamopenarchives.com/abstract.php?ArticleCode=TOCPJ-2-7"
  verification: ai_verified
  verificationNote: >-
    Abstract page fetched live 2026-08-26 with DOI; quoted findings are
    verbatim from the published abstract. Full text not obtained this pass.
  reliabilityNotes:
    - "The journal's editor-in-chief resigned over its publication, telling a Danish science news service that the article was printed without her permission and should never have appeared in that journal; she also noted the subject lay outside her expertise, so her objection was to process, not to the chemistry."
    - "No independent laboratory has reproduced the paper's central finding on custody-controlled samples."
    - "Samples were collected privately by correspondents of the authors, not under a documented chain of custody."

- id: SRC-MILLETTE-2012
  title: "Revised Report of Results: MVA9119 — Progress Report on the Analysis of Red/Gray Chips in WTC Dust"
  authors: ["James R. Millette"]
  organization: "MVA Scientific Consultants"
  year: "2012"
  sourceType: report
  identifier: "Dated March 1, 2012 (supersedes February 29, 2012); 21 pp.; prepared for Classical Guide, Denver, CO"
  url: "https://www.metabunk.org/sk/9119ProgressReport022912_rev1_030112webHiRes.pdf"
  verification: ai_verified
  verificationNote: >-
    Full report text obtained and read 2026-08-26 from a third-party mirror
    (the original hosting is gone; identical text served by two further
    mirrors); conclusions quoted verbatim from p. 6 of 21.
  reliabilityNotes:
    - "A consulting progress report prepared for a private client, never published in a peer-reviewed journal — the same venue objection that applies to the paper it rebuts, and this case applies it symmetrically."
    - "No authoritative host: the document survives only on third-party mirrors, one of them a site adversarial to the hypothesis under test."
    - "Analyzed the analyst's own archived dust samples from four Manhattan locations, not the samples used in the paper it rebuts — so it is an independent test of the claim, not a re-examination of the same material."

# ── pre-attack option trading ───────────────────────────────────────────

- id: SRC-POTESHMAN-2006
  title: "Unusual Option Market Activity and the Terrorist Attacks of September 11, 2001"
  authors: ["Allen M. Poteshman"]
  organization: "The Journal of Business (University of Chicago Press)"
  year: "2006"
  sourceType: paper
  identifier: "J. Bus. 79(4):1703–1726; DOI 10.1086/503645"
  url: "https://doi.org/10.1086/503645"
  verification: ai_verified
  verificationNote: >-
    DOI and full bibliographic record confirmed via CrossRef 2026-08-26;
    complete abstract fetched and quoted verbatim from the RePEc/IDEAS
    record. Publisher full text is paywalled and was not obtained.
  reliabilityNotes:
    - "Peer-reviewed and methodologically explicit; its finding is a statistical characterization of order flow, which cannot identify a trader or a motive."
    - "The paper's own conclusion is stated as consistency with informed trading, not as a demonstration of it — a distinction both sides of the public argument routinely drop."

- id: SRC-CHESNEY-2015
  title: "Detecting abnormal trading activities in option markets"
  authors: ["Marc Chesney", "Remo Crameri", "Loriano Mancini"]
  organization: "Journal of Empirical Finance"
  year: "2015"
  sourceType: paper
  identifier: "J. Empir. Finance 33:263–275; DOI 10.1016/j.jempfin.2015.03.008"
  url: "https://doi.org/10.1016/j.jempfin.2015.03.008"
  verification: ai_verified
  verificationNote: >-
    DOI and metadata confirmed via CrossRef; full published text read
    2026-08-26 from an openly hosted copy of the published version. The
    paper's body treats the September 11 trades only summarily, deferring
    detail to a separate appendix.
  reliabilityNotes:
    - "Peer-reviewed for the method; the granular September 11 figures widely attributed to this paper are not in its body but in the working-paper version and separate appendix, and this case cites them to that record instead."
    - "Like Poteshman, it detects statistical abnormality, not identity or intent."

- id: SRC-SNOPES-PUTS-2001
