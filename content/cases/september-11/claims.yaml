  dependsOnClaimIds: [SEP-C003, SEP-C004, SEP-C005, SEP-C007, SEP-C009]
  strongestObjection: >-
    No physical artifact of a demolition has ever been produced — no device,
    no residue finding on identified WTC 7 steel (none of which was kept),
