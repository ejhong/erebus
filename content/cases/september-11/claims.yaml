    unevidenced capability. The seismic record contains no pre-collapse
    signal of any kind. Rejected as physically unsupported rather than
    merely unproven.
  sourceAnchor:
    locator: "Circulating claim family (directed-energy and mini-nuke variants); no primary source supports it"
  origin:
