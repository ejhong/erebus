- id: SEP-C008
  tier: featured
  statement: >-
    Witnesses at WTC 7 reported loud explosion-like sounds associated with
    the building on September 11, 2001.
  plainLanguage: >-
    People there heard bangs and booms and said so on the record. That much
    is not in dispute — including by the investigating agency, which
    acknowledges a responder who reported two loud booms.
  theme: wtc7
  rung: observation
  claimType: observation
  importance: supporting
  reviewState: ai_extracted
  origin:
    ref: "casework/september-11 digest — C09, narrowed at verification"
    extractedBy: "Claude Fable 5 (Cursor cloud agent)"
    runId: "case-sep11-launch-2026-08-26"
    date: "2026-08-26"
  credibility: established
  credibilitySummary: >-
    Multiple on-record accounts exist, and the agency's own FAQ answers a
    question about a responder who "heard two loud booms" without disputing
    that he did. This claim is deliberately narrower than the version in
    circulation: the agency does not deny that booms were reported, it
    denies that any reported sound matches the level a column-severing
    blast would produce.
  diagnosticity: low
  diagnosticitySummary: >-
    Collapsing structures, failing transformers, and falling debris all
    produce loud reports. The testimony establishes that loud sounds
    occurred, which nearly every hypothesis predicts.
  strongestObjection: >-
    Lay descriptions of loudness cannot distinguish a detonation from
    structural failure, and the accounts do not describe a blast-wave
