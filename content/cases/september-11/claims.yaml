  whatWouldChangeOurMind:
    - "A blinded independent re-analysis vindicating the challenger model."
    - "A custody-controlled physical finding of incendiary or explosive residue on provenanced WTC 7 material."
    - "Conversely: independent reproduction of the official mechanism from released data would move this to contradicted."

# ── the Twin Towers ─────────────────────────────────────────────────────

- id: SEP-C011
  tier: featured
  statement: >-
    Aircraft impact damage, widely dislodged fireproofing, and multi-floor
    fires initiated the collapses of WTC 1 and WTC 2; the federal
    investigation concluded the towers "likely would not have collapsed" had
    the thermal insulation not been widely dislodged.
  plainLanguage: >-
    The planes severed columns and knocked the fireproofing off the steel;
    the fires then did what fires cannot normally do to protected steel. The
    official report words this carefully, and so does this claim: "likely."
  theme: towers
  rung: mechanism
  claimType: mechanistic
  importance: headline
  reviewState: ai_extracted
  origin:
    ref: "casework/september-11 digest — C12, hedge restored at verification"
    extractedBy: "Claude Fable 5 (Cursor cloud agent)"
    runId: "case-sep11-launch-2026-08-26"
    date: "2026-08-26"
  credibility: well_supported
  credibilitySummary: >-
    Supported by impact simulations reporting dozens of severed columns and
    insulation stripped from tens of thousands of square feet of truss area
    in each tower, by the fire reconstruction, and by the observed inward
    bowing that preceded each collapse. The counterfactual is stated twice
    in the report, both times hedged with "likely" — a hedge public
    restatement on both sides routinely drops, and which this claim keeps.
  diagnosticity: high
  diagnosticitySummary: >-
    Initiation at precisely the impact floors is very hard for any
    pre-placed-device account to accommodate, since the aircraft's aim
    could not be arranged in advance.
  strongestObjection: >-
    The simulations required tuning to reproduce the observed damage, and
    the "widely dislodged" insulation is an inference from modeling rather
    than a direct measurement of the buildings as they stood.
  whatWouldChangeOurMind:
    - "An independent impact-and-fire model with published inputs producing materially different initiation conditions."

- id: SEP-C012
  tier: featured
  statement: >-
    Once collapse had initiated, the total top-to-bottom progression of each
    tower has been demonstrated by end-to-end structural modeling.
  plainLanguage: >-
    Not the question of what started the collapses — the question of whether
    anyone has actually simulated them all the way down. Nobody has,
    including the federal investigation, which said the progression was
    "readily explained" without that modeling.
  theme: towers
  rung: mechanism
  claimType: methodological
  importance: major
  reviewState: ai_extracted
  origin:
    ref: "casework/september-11 digest — C13, restated as an auditability claim"
    extractedBy: "Claude Fable 5 (Cursor cloud agent)"
    runId: "case-sep11-launch-2026-08-26"
    date: "2026-08-26"
  credibility: contradicted
  credibilitySummary: >-
    The investigation modeled collapse initiation and stated that
    propagation "was readily explained without the same complexity of
    modeling," supporting that judgment with a floor-capacity argument
    rather than a simulation. That is a considered engineering position, not
    an end-to-end model — so the claim as worded is contradicted by the
    record, which is a statement about what exists, not about whether
    gravity suffices.
  diagnosticity: moderate
  diagnosticitySummary: >-
    The honest weak point of the conventional account's completeness, and
    the most legitimate opening the challenger literature has on the towers.
    It does not by itself imply any added energy source was present.
  dependsOnClaimIds: [SEP-C011]
  strongestObjection: >-
    Order-of-magnitude analyses in the peer-reviewed mechanics literature
    argue the energy balance is not close — once a dozen-plus stories drop
    one storey, arrest is not plausible — so full simulation may be
    unnecessary to answer the physical question even though it would answer
    the auditability one.
  whatWouldChangeOurMind:
    - "Publication of a high-fidelity progressive-collapse model of a tube-frame tower validated against the video and seismic record, with full inputs released."

- id: SEP-C013
  tier: featured
  statement: >-
    The Twin Towers were destroyed with pre-planted explosive devices.
  plainLanguage: >-
    This one is not merely unproven; the record actively contradicts it.
    Collapse began exactly where unpredictably aimed aircraft happened to
    hit, no seismic trace precedes either collapse, and eight months of
    debris removal produced no device.
  theme: towers
  rung: attribution
  claimType: causal
  importance: headline
  reviewState: ai_extracted
  origin:
    ref: "casework/september-11 digest — C14"
    extractedBy: "Claude Fable 5 (Cursor cloud agent)"
    runId: "case-sep11-launch-2026-08-26"
    date: "2026-08-26"
  credibility: contradicted
  credibilitySummary: >-
    Positive disproof rather than mere absence. Initiation coincided with
    the impact floors, which no one could have designated in advance; the
    seismic record contains no signal before either collapse; the
    investigation reported finding no corroborating evidence for
    demolition; and any charges would have had to survive nearly an hour of
    approximately 1,000 °C fire at exactly the location where the collapse
    began.
  diagnosticity: high
  diagnosticitySummary: >-
    Would be decisive if true. Its failure is what separates the towers
    dispute — effectively closed — from the WTC 7 dispute, which is not.
  dependsOnClaimIds: [SEP-C011]
  strongestObjection: >-
    Arguments from the absence of recovered devices depend on a debris
    operation that was not conducted as a forensic search, and the seismic
    argument depends on instruments at some distance from the site.
  whatWouldChangeOurMind:
    - "A recovered, provenanced device component or an authenticated pre-collapse seismic or acoustic signature."

- id: SEP-C014
  tier: featured
  statement: >-
    The red/gray chips found in World Trade Center dust are unreacted
    nanothermite.
  plainLanguage: >-
    The best-known physical-evidence claim on the challenger side. An
    independent analysis found no elemental aluminum in the chips, which
    the claim requires — but that same analysis also refutes the popular
    debunking, because it found the chips were not the building's primer
    paint either.
  theme: dust
  rung: mechanism
  claimType: measurement
  importance: major
  reviewState: ai_extracted
  origin:
    ref: "casework/september-11 digest — C15, corrected at verification"
    extractedBy: "Claude Fable 5 (Cursor cloud agent)"
    runId: "case-sep11-launch-2026-08-26"
    date: "2026-08-26"
  credibility: contradicted
  credibilitySummary: >-
    The independent 2012 analysis of archived dust from four Manhattan
    locations found "no evidence of individual elemental aluminum particles
    of any size," and concluded on that basis that the red layer "is not
    thermite or nano thermite." Elemental aluminum is not optional for the
    claim. Two honest caveats travel with this grade: the rebuttal was never
    published in a peer-reviewed journal, exactly the objection made against
    the paper it rebuts; and it explicitly did NOT identify the chips as the
    towers' column primer, finding the composition "does not match" that
    primer and that none of 177 candidate products matched.
  diagnosticity: moderate
  diagnosticitySummary: >-
    A confirmed thermitic material in custody-controlled dust would be
    strong evidence for the incendiary-demolition family. Its absence
    removes the challenger side's only affirmative physical-evidence claim
    about the dust, without establishing what the chips actually are.
  strongestObjection: >-
    Neither analysis was conducted under a documented chain of custody from
    the site, and neither was peer-reviewed in a normal venue — so the
    dispute is between two irregular analyses, and the unresolved
    composition question is a real loose end rather than a settled one.
  whatWouldChangeOurMind:
    - "A blinded multi-laboratory re-test of custody-controlled dust against both thermite and primer controls."
    - "Identification of the coating the chips actually are, which no published analysis has yet achieved."

