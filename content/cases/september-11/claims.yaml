  plainLanguage: >-
    The physical evidence from the third building is simply gone. Tower
    steel carried paint and markings that allowed pieces to be traced;
    WTC 7's did not, and it was recycled before anyone catalogued it.
  theme: wtc7
  rung: observation
  claimType: observation
  importance: major
  reviewState: ai_extracted
  origin:
    ref: "casework/september-11 digest — C07"
    extractedBy: "Claude Fable 5 (Cursor cloud agent)"
