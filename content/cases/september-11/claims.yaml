# SEP-001 featured claims. Wording was frozen against the verified primary
# text before the evidence pass (AGENTS.md §3.12), which is why several
# claims here read more narrowly than their popular versions: the
# verification pass found that the federal report hedges ("likely would not
# have collapsed"), that the agency denies blast-LEVEL noise rather than
# denying booms, and that a widely cited chemistry rebuttal says the
# opposite of what it is usually cited for. Each claim grades an evidence
# dispute, never any person's conduct or guilt.

# ── World Trade Center 7 ────────────────────────────────────────────────

- id: SEP-C001
  tier: featured
  statement: >-
    World Trade Center 7, a 47-story steel-framed building that no aircraft
    struck, collapsed completely on September 11, 2001 after fires burned on
    multiple floors for about seven hours with no water available to fight
    them.
  plainLanguage: >-
    A third skyscraper fell that day. Nothing hit it; it burned all
    afternoon while firefighters, who had no water, decided not to fight the
    fire. Every hypothesis on this page accepts this much.
  theme: wtc7
  rung: observation
  claimType: observation
  importance: headline
  reviewState: ai_extracted
  origin:
    ref: "casework/september-11 digest — WTC 7 cluster"
    extractedBy: "Claude Fable 5 (Cursor cloud agent)"
    runId: "case-sep11-launch-2026-08-26"
    date: "2026-08-26"
  credibility: established
  credibilitySummary: >-
    Documented by the federal investigation and, independently and earlier,
    by the 2002 FEMA study, which recorded the broken 20-inch water main in
    Vesey Street and that no manual firefighting was attempted. Timing
    differs slightly by measurement chain — 5:20:52 p.m. from video
    analysis, 5:20:33 p.m. from seismic records — which is why this claim
    says "about."
  diagnosticity: low
  diagnosticitySummary: >-
    Accepted by every hypothesis here, including the official account. It
    establishes what has to be explained, and by itself favors no
    explanation over another.
  strongestObjection: >-
    None to the observation. The contested question is entirely about
    mechanism, graded separately below.
  whatWouldChangeOurMind:
    - "Nothing realistic; this is among the most thoroughly documented events of the day."

- id: SEP-C002
  tier: featured
  statement: >-
    During the collapse, WTC 7's north face descended at gravitational
    acceleration — free fall — for approximately 2.25 seconds over about
    32 metres, as stated in the federal investigation's own final report
    after a re-analysis prompted by public comment.
  plainLanguage: >-
    For roughly two and a quarter seconds, part of the building fell as
    fast as a dropped stone, meaning the structure below offered essentially
    no resistance during that interval. This is not a challenger's
    calculation — it is in the government's final report, added after
    critics pressed the point.
  theme: wtc7
  rung: observation
  claimType: measurement
  importance: headline
  reviewState: ai_extracted
  origin:
    ref: "casework/september-11 digest — WTC 7 free fall"
    extractedBy: "Claude Fable 5 (Cursor cloud agent)"
    runId: "case-sep11-launch-2026-08-26"
    date: "2026-08-26"
  credibility: established
  credibilitySummary: >-
    Stated verbatim in the final report's principal findings: a three-stage
    descent whose second stage is "a freefall descent over approximately
    eight stories at gravitational acceleration for approximately 2.25 s."
    The agency's public FAQ gives the same staging by time interval.
  diagnosticity: moderate
  diagnosticitySummary: >-
    Frequently oversold in both directions. Free fall requires that the
    supporting structure was already gone in that interval, which is a real
    constraint on any mechanism — but the official account accommodates it
    explicitly, attributing it to exterior columns that had already buckled.
    It narrows the field without selecting a hypothesis.
  strongestObjection: >-
    That the interval was conceded and modeled by the investigation itself
    rather than discovered against it, so it cannot function as evidence the
    investigation suppressed something.
  whatWouldChangeOurMind:
    - "A demonstration that the video measurement of the roofline descent is wrong."
    - "A published re-analysis showing the free-fall stage is an artifact of the frame-rate or reference-point choice."

- id: SEP-C003
  tier: featured
  statement: >-
    The federal investigation's probable collapse sequence for WTC 7 —
    fire-driven thermal expansion pushing the girder spanning Columns 79
    and 44 off its seat, cascading floor failures, and the buckling of
    Column 79 — is correct.
  plainLanguage: >-
    The official explanation says heat made steel beams expand, shoving a
    girder off its support until a key column lost its bracing and buckled.
    No steel had to melt. Whether this specific sequence is what happened is
    the central technical dispute of the case.
  theme: wtc7
  rung: mechanism
  claimType: mechanistic
  importance: headline
  reviewState: ai_extracted
  origin:
    ref: "casework/september-11 digest — C04, the case crux"
    extractedBy: "Claude Fable 5 (Cursor cloud agent)"
    runId: "case-sep11-launch-2026-08-26"
    date: "2026-08-26"
  credibility: mixed
  credibilitySummary: >-
    The best-resourced and only comprehensive account, internally coherent
    and requiring no melted steel — the report puts the highest column
    temperatures near 300 °C and the initiating process at or below about
    400 °C. But it has never been independently reproduced, and it cannot
    be: the modeling files needed to recompute it were withheld
    (SEP-C005). A mechanism that only its author can evaluate is not
    thereby wrong; it is thereby unaudited, and this grade records exactly
    that distinction.
  diagnosticity: high
  diagnosticitySummary: >-
    The load-bearing question for the whole WTC 7 dispute. If the sequence
    holds, the demolition hypotheses lose their principal motivation; if it
    fails, the collapse has no published explanation and everything reopens.
  dependsOnClaimIds: [SEP-C001]
  strongestObjection: >-
    The challenger study reports that its simulations could not reproduce
    the observed collapse from this mechanism, and that only near-simultaneous
    failure of every column over about eight stories matched the video —
    though that study has its own serious defects, graded at SEP-C004.
  whatWouldChangeOurMind:
    - "A blinded independent re-analysis of the Column 79 connection, built from the shop drawings under documented fire curves by a team with no prior public position."
    - "Release of the withheld modeling files, allowing the published sequence to be recomputed by anyone."
    - "A demonstration that the connection as actually built differs materially from the connection as modeled."

- id: SEP-C004
  tier: featured
  statement: >-
    The University of Alaska Fairbanks reevaluation correctly concluded that
    fire did not cause WTC 7's collapse and that only the near-simultaneous
    failure of every column over about eight stories reproduces the observed
    behavior.
  plainLanguage: >-
    The main published challenge to the official account. It is a real
    engineering study that released all its data — and it was paid for by
    the advocacy group whose position it confirms, was not peer-reviewed in
    a journal, and leaves several observed features of the collapse
    unexplained.
  theme: wtc7
  rung: mechanism
  claimType: mechanistic
  importance: major
  reviewState: ai_extracted
  origin:
    ref: "casework/september-11 digest — C05"
    extractedBy: "Claude Fable 5 (Cursor cloud agent)"
    runId: "case-sep11-launch-2026-08-26"
    date: "2026-08-26"
  credibility: weakly_supported
  credibilitySummary: >-
    A genuine finite-element effort that published its full dataset, which
    is more openness than the investigation it disputes has offered. Against
    it: funding from the organization campaigning for its conclusion; no
    journal peer review; a single static temperature distribution rather
    than a modeled fire progression; and a best-fit scenario that reproduces
    the fall itself while leaving the debris distribution and other observed
    features unaddressed. Its own text is more cautious than its reception,
    conceding it cannot rule out an alternative scenario it did not identify.
  diagnosticity: moderate
  diagnosticitySummary: >-
    If sustained, it would refute the official mechanism and force the
    question open — but "every column failed at once" does not by itself
    establish what made them fail, so it supports the demolition family
    only by elimination.
  dependsOnClaimIds: [SEP-C001]
  strongestObjection: >-
    Simultaneous column removal is an input to the simulation, not a finding
    from it: critics note the columns are made to disappear and the building
    then falls at free fall, which demonstrates that the input produces the
    output rather than that the input occurred.
  whatWouldChangeOurMind:
    - "Independent replication by a team with no funding relationship to either side."
    - "An extension of the model that reproduces the observed debris distribution as well as the descent."
    - "Peer review in a structural or fire engineering journal."

- id: SEP-C005
  tier: featured
  statement: >-
    The federal investigation withheld tens of thousands of WTC 7 modeling
    data files under a July 2009 statutory finding that their release might
    jeopardize public safety, a withholding a federal court upheld in April
    2011; the initiating mechanism therefore cannot be independently
    reproduced from the published materials.
  plainLanguage: >-
    Anyone wanting to check the official collapse model cannot: most of the
    computer files were kept back on the grounds that they could teach
    someone how to destroy a building, and a judge agreed the law allowed
    that.
  theme: wtc7
  rung: observation
  claimType: methodological
  importance: headline
  reviewState: ai_extracted
  origin:
    ref: "casework/september-11 digest — C06"
    extractedBy: "Claude Fable 5 (Cursor cloud agent)"
    runId: "case-sep11-launch-2026-08-26"
    date: "2026-08-26"
  credibility: established
  credibilitySummary: >-
    Documented in the court's own opinion: 25,644 files released, 68,500
    withheld, against 91,114 described as potentially responsive — figures
    that do not reconcile arithmetically and are quoted here as the opinion
    gives them. The statutory basis and the "might jeopardize public safety"
    finding are quoted verbatim in the opinion and restated on the agency's
    public FAQ.
  diagnosticity: moderate
  diagnosticitySummary: >-
    A fact about auditability, not about physics, and it cuts both ways: the
    stated rationale is coherent on its own terms, and withholding is not
    evidence of error. What it does establish is that the central mechanism
    claim cannot be checked by anyone outside the agency, which is why
    SEP-C003 is graded mixed rather than well supported.
  dependsOnClaimIds: [SEP-C003]
  strongestObjection: >-
    The rationale is not obviously pretextual — detailed validated
    connection models genuinely would be a blueprint of general
    applicability — and the released subset is substantial.
  whatWouldChangeOurMind:
    - "Release of the withheld files, or a bounded re-derivation sufficient for independent recomputation."
    - "Evidence that the withheld files contain nothing that would permit reproduction anyway."

- id: SEP-C006
  tier: featured
  statement: >-
    No identified structural steel from WTC 7 was preserved for forensic
    examination, because the debris could not be distinguished after removal
