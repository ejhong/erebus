- id: SEP-C026
  tier: catalog
  statement: >-
    Directed-energy weapons or nuclear devices destroyed the World Trade
    Center towers.
  theme: towers
  rung: mechanism
  reviewState: rejected
  rejectionReason: >-
    Contradicted on every measurable prediction it makes. A nuclear device
    would leave a radiation signature and a thermal-blast pattern; neither
    appears in any dust study, medical surveillance record, or environmental
    survey of the site, including the extensive dust characterization work
    done for public-health purposes. Directed-energy variants predict
    effects — vehicle damage patterns, selective material transmutation —
