# SEP-001 featured claims. Wording was frozen against the verified primary
# text before the evidence pass (AGENTS.md §3.12), which is why several
# claims here read more narrowly than their popular versions: the
# verification pass found that the federal report hedges ("likely would not
# have collapsed"), that the agency denies blast-LEVEL noise rather than
# denying booms, and that a widely cited chemistry rebuttal says the
# opposite of what it is usually cited for. Each claim grades an evidence
# dispute, never any person's conduct or guilt.

