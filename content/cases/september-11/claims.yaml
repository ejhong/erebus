- id: SEP-C007
  tier: featured
  statement: >-
    A limited federal metallurgical examination documented severe
    high-temperature sulfidation with intergranular eutectic melting on two
    recovered steel members, and its authors stated that no clear
    explanation for the source of the sulfur had been identified and
    recommended a follow-up study that has never been performed.
  plainLanguage: >-
    Two pieces of steel were found corroded and partly liquefied in a way
    the examining metallurgists could not explain. They asked for a proper
    study. Twenty-four years later, nobody has done it.
  theme: dust
  rung: observation
  claimType: observation
  importance: major
  reviewState: ai_extracted
  origin:
    ref: "casework/september-11 digest — C08, corrected at verification"
    extractedBy: "Claude Fable 5 (Cursor cloud agent)"
    runId: "case-sep11-launch-2026-08-26"
    date: "2026-08-26"
  credibility: established
  credibilitySummary: >-
    The observation, the explicit statement that the sulfur source was
    unidentified, and the recommendation for further work are all verbatim
    in the appendix. Note a correction this case had to make: the appendix
    proposes no source for the sulfur at all — the frequently repeated claim
    that its authors suggested gypsum is mistaken, and that argument belongs
    to a different agency in a different document.
  diagnosticity: moderate
  diagnosticitySummary: >-
    A real and uncontested anomaly with mundane candidate explanations that
    were never tested. Untested candidates mean it currently discriminates
