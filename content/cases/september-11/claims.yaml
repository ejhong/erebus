- id: SEP-C009
  tier: featured
  statement: >-
    The explosion-like sounds reported around WTC 7 were produced by
    demolition charges.
  plainLanguage: >-
    The inference drawn from the booms. It does not survive the acoustics:
    a charge big enough to cut the critical column would have been heard for
    half a mile at jet-engine volume, and no recording contains it.
  theme: wtc7
  rung: mechanism
  claimType: causal
  importance: major
  reviewState: ai_extracted
  origin:
    ref: "casework/september-11 digest — C10"
    extractedBy: "Claude Fable 5 (Cursor cloud agent)"
    runId: "case-sep11-launch-2026-08-26"
    date: "2026-08-26"
  credibility: contradicted
  credibilitySummary: >-
    The investigation calculated that the smallest blast capable of failing
    Column 79 would register 130 to 140 decibels at half a mile if
    unobstructed, and reported that no such sound appears on any audio track
    or in any witness account. That is a falsifiable published prediction
    that the recorded evidence does not meet.
  diagnosticity: high
  diagnosticitySummary: >-
    Were it true it would establish demolition directly. Its failure is
    correspondingly costly to the demolition family, which is why proponents
    have largely moved to incendiary rather than explosive mechanisms.
  dependsOnClaimIds: [SEP-C008]
  strongestObjection: >-
    The acoustic calculation is the investigation's own modeling, not an
    independent measurement, and it assumes an unobstructed path in a dense
    urban environment full of obstructions.
  whatWouldChangeOurMind:
    - "Recovery of a recording containing a blast signature at the predicted level, authenticated and located."
    - "An independent acoustic analysis showing the modeled threshold is substantially too high."

