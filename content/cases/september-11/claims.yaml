  tier: featured
  statement: >-
    WTC 7 was deliberately demolished.
  plainLanguage: >-
    The strongest challenger claim about this building. Everything above
    feeds into it, and on the current record it does not carry: the
    supporting arguments are either contradicted, unaudited, or
    unexplained-but-untested.
  theme: wtc7
  rung: attribution
  claimType: causal
  importance: headline
  reviewState: ai_extracted
  origin:
    ref: "casework/september-11 digest — C11"
    extractedBy: "Claude Fable 5 (Cursor cloud agent)"
    runId: "case-sep11-launch-2026-08-26"
    date: "2026-08-26"
  credibility: weakly_supported
  credibilitySummary: >-
    Rests on a genuine unaudited gap in the official mechanism (SEP-C003,
    SEP-C005), an unreproduced advocacy-funded counter-model (SEP-C004),
    and an untested corrosion anomaly (SEP-C007). Against it: the acoustic
    evidence (SEP-C009), the absence of any recovered device or residue
    finding, and the practical difficulty of pre-rigging an occupied
    building without disclosure. Weakly supported is not the same as
    refuted, and this case does not expect the grade to be permanent — the
    decisive tests are cheap and unperformed.
  diagnosticity: high
  diagnosticitySummary: >-
    Decisive for the whole case if established, since deliberate demolition
    of this building could not have been arranged without advance
