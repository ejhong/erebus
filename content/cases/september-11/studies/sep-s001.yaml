  criteriaHash: f2938e9757ab
method: Discovery per the frozen protocol; one row per peer-reviewed study, each
  cell citing the primary publication with the standard verification label. The
  authors' statistics and the authors' stated interpretations are separate cells
  — a finding of statistical abnormality and an attribution of foreknowledge are
  different claims, and this literature is routinely misquoted by merging them
  in both directions. Findings state what the literature establishes, what it
  explicitly declines to establish, and where each paper stands relative to the
  Commission's innocuous-explanation conclusion — including whether any paper
  engages the specific trade-tracing the official note describes. The study
  grades the published record; it does not re-analyze market data (that is
  SEP-R005's paired re-analysis, separate work). Failed searches are reported,
  and the searcher-overlap coverage indicator is given. Either outcome
  publishes.
columns:
  - study
  - year and venue
  - data and window
  - method
  - abnormality finding (instruments, significance)
  - authors' stated interpretation
  - engagement with the official explanation
rows:
  - cells:
      study: "Poteshman 2006, 'Unusual Option Market Activity and the Terrorist Attacks of September 11, 2001'"
      year and venue: "Journal of Business 79(4):1703-1726 (2006), doi 10.1086/503645"
      data and window: "CBOE option-market data; target window in early September 2001 judged against benchmark distributions built from 1990-2001 for the largest-capitalization firms"
      method: "quantile placement of option-volume statistics against long-run historical distributions"
      abnormality finding (instruments, significance): "two-sided by the paper's own accounting: the ShortLong statistic's maximum for AMR or UAL sits at the 0.80 quantile daily and the 0.49 quantile judged as a windowed maximum ('could hardly have been more ordinary'); the abnormal long-put measure (AbnLongPut) for AMR or UAL sits at the 0.99 quantile daily and 0.96 windowed"
      authors' stated interpretation: "'there was an unusually high level of put buying. This finding is consistent with informed investors having traded options in advance of the attacks' (abstract, verbatim)"
      engagement with the official explanation: "none — the paper measures market-level statistics and does not address the trade-level attributions in the official record"
    citation:
      text: "Journal of Business 79(4):1703-1726, doi 10.1086/503645 (full text read at native verification, including the quantile results on both statistics)"
      url: "https://doi.org/10.1086/503645"
      verification: ai_verified
  - cells:
      study: "Wong, Thompson & Teh 2011, 'Was there abnormal trading in the S&P 500 index options prior to the September 11 attacks?'"
      year and venue: "Multinational Finance Journal 15(1-2):1-46 (2011); circulated earlier as SSRN working paper 1588523"
      data and window: "CBOE SPX index options around September 2001; out-of-, at-, and in-the-money puts and in-the-money calls"
      method: "Student's t-statistics and non-parametric tests against null hypotheses of no abnormal trading"
      abnormality finding (instruments, significance): "rejects the no-abnormal-trading null for OTM, ATM and ITM SPX puts and ITM SPX calls before the attacks; reports patterns consistent with three bearish strategies (put purchase, put bear spread, naked ITM call write); VIX used as a cross-check"
      authors' stated interpretation: "'consistent with insiders anticipating the 9-11 attacks' (abstract, verbatim)"
      engagement with the official explanation: "does not engage the specific trade-tracing in the official record"
    citation:
      text: "Multinational Finance Journal 15(1-2):1-46 (2011), doi 10.17578/15-1/2-1 (resolves; surfaced by a searcher and confirmed natively); abstract read verbatim via SSRN 1588523"
      url: "https://doi.org/10.17578/15-1/2-1"
      verification: ai_verified
  - cells:
      study: "Chesney, Crameri & Mancini 2015, 'Detecting abnormal trading activities in option markets'"
      year and venue: "Journal of Empirical Finance 33:263-275 (2015), doi 10.1016/j.jempfin.2015.03.008"
      data and window: "9.6 million daily option prices, 31 companies mainly in airline, banking and insurance sectors, 1996-2009; intraday stock data for the hedging test"
      method: "abnormal-trade detection via unusual open-interest and volume increments plus realized gains, with multiple-hypothesis-testing control of false discoveries and a nonparametric hedging test"
      abnormality finding (instruments, significance): "abnormal trades cluster before 9/11 — 13 transactions identified (4 could not be identified further); named underlyings include American Airlines, United Airlines and Boeing (lesser signals for Delta and KLM); an AMR/UAL example realizes roughly $3 million within weeks; the non-hedging hypothesis is not rejected"
