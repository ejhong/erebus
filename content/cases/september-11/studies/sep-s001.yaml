    citation:
      text: "Journal of Empirical Finance 33:263-275, doi 10.1016/j.jempfin.2015.03.008 (full published text read at native verification, including the 13-transaction 9/11 cluster and the joint-hypothesis language)"
      url: "https://doi.org/10.1016/j.jempfin.2015.03.008"
      verification: ai_verified
findings:
  - statement: >-
      The peer-reviewed literature is three studies, and on statistics
      it is unanimous: each finds abnormality in its instruments —
      airline long-put volume at the 0.99 quantile (Poteshman), SPX
      option nulls rejected across moneyness classes (Wong et al.), and
      a false-discovery-controlled cluster of 13 unhedged abnormal
      trades including AMR, UAL and Boeing (Chesney et al.). SEP-C015's
      two halves — anomalous volumes, and peer-reviewed findings
      statistically consistent with informed trading — are both the
      literature's own language.
    evidenceId: SEP-E040
  - statement: >-
      The interpretations are stronger than either popular compression
      admits, and more careful: Poteshman's own paper shows a second
      statistic looking 'could hardly have been more ordinary' beside
      the elevated one; Wong et al. write 'consistent with insiders
      anticipating the 9-11 attacks'; and Chesney et al., after stating
      their general joint hypothesis, set it aside for 9/11 on the
      stated ground that corporate insiders were unaware of the pending
      attacks — reading the cluster as 'consistent with informed
      investors having traded... in advance of the attack.' All three
      stop at consistency language; none claims to identify who traded,
      and none rules innocuous explanations out trade by trade.
    evidenceId: SEP-E040
  - statement: >-
      The statistical literature and the official attribution never
      meet: none of the three studies engages the Commission's specific
      trade-tracing — the note recording that a single U.S. institutional
      investor bought 95 percent of the September 6 UAL puts as part of
      a strategy that included 115,000 AMR shares, and that the
      September 10 AMR activity traced substantially to an options
      newsletter faxed September 9 (the declassified SEC interview
      memorandum records 26 of 28 interviewed buyers of the relevant
      series citing it). Market-level abnormality and innocuous
      trade-level attribution are compatible claims about different
      grains — which is why the tracing files, not more statistics, are
      what SEP-R005 asks for.
    evidenceId: SEP-E040
  - statement: >-
      Comparandum, quoted for the record (not a row): the Commission
      Report's note states that 'some unusual trading did in fact
      occur, but each such trade proved to have an innocuous
      explanation,' and that investigators 'found that the apparently
      suspicious consistently proved innocuous.' The evidence behind
      those sentences is the unreleased working record this case's
      research agenda targets.
limitations:
  - >-
    Three studies is the whole peer-reviewed population found; the
    conclusion 'the literature is unanimous on abnormality' is three
    data points, and publication incentives against null results are
    unmeasured here.
  - >-
    The Wong, Thompson & Teh row's venue rests on the journal's RePEc
    listing and the SSRN record; the published PDF itself was not
    retrieved at collection, and the row's quantitative cells rest on
    the abstract's own statements.
  - >-
    Searcher coverage: the Gemini deep-research run corroborated all
    three rows, supplied the row-level gains detail, surfaced the
    journal DOI for the Wong row, and caught a real understatement in
    the draft Chesney interpretation cell (the paper's 9/11-specific
    setting-aside of its joint hypothesis), corrected after native
    verification against the published text. The OpenAI substitute run
    marked its unverifiable cells NOT FOUND honestly this time but
    supplied a fabricated Commission quotation with an invented page
    locator (flagged NOT FOUND by the searcher itself); the comparandum
    quoted in finding 4 is the natively verified note text instead.
