    "NIST did not test for the residue of these compounds in the steel."
    The reasoning offered: "Analysis of the WTC steel for the elements in
    thermite/thermate would not necessarily have been conclusive. The metal
    compounds also would have been present in the construction materials
    making up the WTC towers, and sulfur is present in the gypsum wallboard
