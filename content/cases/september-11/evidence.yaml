- id: SEP-E013
  title: "The fireproofing counterfactual, with the report's own hedge"
  claimIds: [SEP-C011]
  sourceId: SRC-NIST-NCSTAR1-2005
  direction: supports
  strength: strong
  sourceStatement: >-
    "The WTC towers likely would not have collapsed under the combined
    effects of aircraft impact damage and the extensive, multi-floor fires
    that were encountered on September 11 2001, if the thermal insulation
    had not been widely dislodged or had been only minimally dislodged by
    aircraft impact." And the companion finding: "In the absence of
    structural and insulation damage, a conventional fire substantially
    similar to or less intense than the fires encountered on September 11,
    2001, likely would not have led to the collapse of a WTC tower."
  editorInference: >-
    The mechanism is a conjunction — impact damage AND stripped insulation
    AND multi-floor fire — and the report says "likely" in both statements.
    Restatements on both sides routinely drop that hedge in opposite
    directions, one to claim certainty and the other to claim overreach.
  exactLocator: "NCSTAR 1, Executive Summary p. xxxviii; §6.14.5 conclusions p. 149"
  limitations:
    - "An inference from tuned impact and fire models, not a measurement of the buildings as they stood."
    - "Quoted from a PDF whose text layer carries OCR artifacts; the printed text is unambiguous."
