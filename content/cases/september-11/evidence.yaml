# ── WTC 7: the contested mechanism ─────────────────────────────────────

- id: SEP-E004
  title: "The official collapse sequence: thermal expansion, a girder walking off its seat, Column 79 buckling"
  claimIds: [SEP-C003]
  sourceId: SRC-NIST-NCSTAR1A-2008
  direction: supports
  strength: strong
  sourceStatement: >-
    "The initiating local failure that began the probable WTC 7 collapse
    sequence was the buckling of Column 79. This buckling arose from a
    process that occurred at temperatures at or below approximately 400 °C
    (750 °F), which are well below the temperatures considered in current
    practice for determining fire resistance ratings associated with
    significant loss of steel strength." And: "Fire-induced thermal
    expansion of the floor system surrounding Column 79 led to the collapse
    of Floor 13 ... the floor beams on the east side of the building
    expanded enough that they pushed the girder spanning between Columns 79
    and 44 to the west on the 13th floor. ... This movement was enough for
    the girder to walk off of its support at Column 79."
  editorInference: >-
    The mechanism is specific, falsifiable, and requires no melted steel —
    the report puts the highest column temperatures near 300 °C. Its
    specificity is what makes SEP-C005 consequential: a precisely stated
    mechanism that cannot be recomputed is a testable claim nobody can test.
  exactLocator: "NCSTAR 1A §2.4 'The Probable Collapse Sequence', pp. 21–22; column temperatures Ch. 2, p. 21"
  limitations:
    - "Described as the probable sequence, not an observed one; it is the output of models whose data files were largely withheld."
    - "The girder designation used throughout public argument does not appear in this report, which refers only to the girder spanning Columns 79 and 44."
  reviewState: ai_extracted
  origin:
    ref: "verification pass, NIST batch"
    extractedBy: "Claude Fable 5 (Cursor cloud agent)"
