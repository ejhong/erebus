- id: SEP-E012
  title: "The acoustic threshold: what a column-severing charge would have sounded like"
  claimIds: [SEP-C009, SEP-C008]
  sourceId: SRC-NIST-NCSTAR1A-2008
  direction: undermines
  strength: strong
  sourceStatement: >-
    "Blast events did not play a role in the collapse of WTC 7. ... Blast
    from the smallest charge capable of failing a critical column (i.e.,
    Column 79) would have resulted in a sound level of 130 dB to 140 dB at
    a distance of at least half a mile if unobstructed by surrounding
    buildings (such as along Greenwich Street or West Broadway). This sound
    level is consistent with standing next to a jet plane engine and more
    than 10 times louder than being in front of the speakers at a rock
    concert. There were no witness reports of such a loud noise, nor was
    such a noise heard on the audio tracks of video recordings of the WTC 7
    collapse."
  editorInference: >-
    A falsifiable published prediction that the recorded evidence does not
    meet. Read precisely, the agency denies blast-LEVEL noise, not booms —
    its public FAQ separately answers a responder who reported two loud
    booms by arguing the reported levels do not match a column-failing
    blast. Both the prediction and its exact scope matter, and public
    argument on both sides misstates them.
  exactLocator: "NCSTAR 1A, Ch. 4 Principal Findings, p. 49; companion FAQ answers Q33 and Q36"
  limitations:
    - "The threshold is the investigation's own modeling, not an independent measurement."
    - "It assumes an unobstructed path in an environment full of obstructions, which the report acknowledges by naming specific sightlines."
  reviewState: ai_extracted
  origin:
