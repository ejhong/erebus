  claimIds: [SEP-C015, SEP-C016]
  sourceId: SRC-SEP-S001
  direction: qualifies
  strength: moderate
  sourceStatement: >-
    Three peer-reviewed studies, each finding statistical abnormality
    in its instruments (airline long-put volume at the 0.99 quantile;
    SPX option null hypotheses rejected; a false-discovery-controlled
    cluster of 13 unhedged abnormal trades including AMR, UAL and
    Boeing) — and each stopping at consistency language: Poteshman's
    own second statistic looks ordinary; Chesney et al. state a general
    joint hypothesis (informed trading versus insider hedging) but set
    it aside for 9/11 on the stated ground that corporate insiders were
    unaware of the pending attacks, reading their cluster as consistent
    with informed trading in advance of the attack. None
    engages the Commission's trade-tracing (the single institutional
    investor behind 95 percent of the September 6 UAL puts; the
    newsletter behind the September 10 AMR series, with 26 of 28
    interviewed buyers citing it per the declassified SEC memorandum).
