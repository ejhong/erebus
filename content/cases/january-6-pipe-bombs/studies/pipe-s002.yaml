  searchProtocol: "Download the two videos from X's video service at their posted resolution (the
    7-minute video at 1920x1080, the 63-minute breakdown at 640x360). Extract one frame every two
    seconds with ffmpeg, and every frame across any change of camera. For each CCTV segment record:
    the video's own time offset where it starts and ends; the camera label shown, if any; the
    earliest and latest legible on-screen date and time; whether the time is drawn as part of the
    camera's own image (a burned-in stamp that keeps its position, font and running clock across the
