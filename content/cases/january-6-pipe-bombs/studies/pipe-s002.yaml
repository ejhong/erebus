    camera (buildings, Peace Circle, Constitution Avenue, New Jersey Avenue, lamp standards); and
    the man's visible clothing, mask, shoes and anything carried. For the originals, search the
    subcommittee's Rumble channel for the camera numbers and the date, and record each file's title,
    length and on-screen times. Predictions fixed now: if the videos' times are the cameras' own
    burned-in stamps, they will run continuously within a segment and match the originals; if they
    are added captions, they will appear as fixed text in the editor's style. Either result is
    reported."
