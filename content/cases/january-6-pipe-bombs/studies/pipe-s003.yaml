criteria:
  frozenOn: 2026-10-19
  inclusion:
    - "Every statement Brian Cole Jr. makes in the transcript of his recorded FBI interview of
      December 4, 2025 (ECF No. 102-1, Exhibit A to the defense's motion to suppress statements,
      cited as Tr.) about the evening of January 5, 2021: when he arrived and left, how he travelled
      and where he parked, the places he went and in what order, how long he stayed, what he did and
      saw, what he wore and carried, whom he met or spoke to, and his phone. The reading runs from
      the transcript's first page to the first place he answers yes to being the person in the
      surveillance video, the point both sides describe as his admission. The motion to suppress
      cites it at Tr. 93; the scan, not the citation, sets the bound."
    - Each question or assertion by an agent that names a detail before Cole states it, recorded
      beside his answer. A detail is first named by an agent when an agent's words anywhere earlier
      in the transcript name the same place, time, garment, item or act; otherwise it is Cole's.
    - "Two standards of comparison, both records already in the case and fixed before this freeze.
      The man the October 2026 video follows, as the rows of PIPE-S002 record him: on cameras 3188,
      3187, 600, 601, 602 and 940 from 7:59:49 to 8:05:42 p.m. by the posted files' recorded times,
      on the north-west side of the Capitol, from the walkway by Pennsylvania Avenue NW across Peace
      Circle and along Northwest Drive to Constitution and New Jersey Avenues NW, alone, in a
      violet-blue hooded jacket, dark trousers and light-soled shoes. And the bomber as the sworn
      affidavit and the prosecution's filings in the case's ledger describe him: filmed in the
      neighbourhood south-east of the Capitol from about 7:34 to 8:18 p.m.; at the DNC at about
      7:54; walking south on New Jersey Avenue SE and turning east on E Street SE at 7:59:38; in the
      alley beside the RNC at 8:14:15 and at the RNC at about 8:16; in dark pants, a grey hooded
      sweatshirt, dark gloves, Nike Air Max Speed Turf shoes and a face mask."
  exclusion:
    - "Everything after that point: what he said once he had answered yes is outside the study,
      which concerns only the account he gave while denying the charge."
    - Anything about making, carrying or placing the devices, wherever it appears; the study records
      none of it.
    - The names of agents, relatives and other private people in the transcript; rows describe them
      by role.
    - His views on politics and the election, except where a statement names the protest he says he
      went to, or where or when it was.
    - "Any judgment of whether Cole is the man in the October footage or the bomber: the study
      compares one description of an evening with two records of it, identifies no one and grades no
      claim."
  searchProtocol: >-
    Reading. Read ECF No. 102-1 as the RECAP archive serves it
    (storage.courtlistener.com/recap/gov.uscourts.dcd.288125/gov.uscourts.dcd.288125.102.1.pdf; 161
    pages, a scan whose only text layer is the court's page headers), page by page from the first
    page to the bound, by eye from the page images. Any machine reading is checked against the page
    image before a row is written; a passage that cannot be read is recorded as unread. Page and
    line numbers are the scan's own printed transcript numbers (Tr.), with the PDF page beside them.


    Rows. A statement with several details is split into one row per detail (a place, a time or
    interval, a direction, a garment, an item, an act, a sighting, a contact, the car, the
    departure), and each detail is graded on its own. Each row records the topic; what Cole says, in
    a close paraphrase with short quotations where the scan is legible; whether the detail is Cole's
    or first named by an agent; and whether it is specific (a named or unmistakable street,
    intersection, building, monument, park or protest; a clock time, or an interval stated to under
    half an hour; a colour, fabric or style of garment; a named item) or generic ('walked around',
    'the Capitol', 'at night', 'an hour', 'a jacket'). The operator grades every row in the
    collection change and shows each grade beside the passage it rests on, so any reader can
    regrade.


    Comparison. Each row is set against each standard. Against the man: fits (the footage shows it),
    conflicts (the footage shows otherwise: another colour or kind of garment, a companion, or a
    place or time that puts the speaker away from where and when the man is filmed), or not
    observable (six minutes on six cameras cannot show it: where he parked, what he did before 7:59
    or after 8:06, his phone). Against the bomber: fits, conflicts, or not described by the sworn
    account. A detail the standard cannot show is never a fit.


    Decision rule, fixed now. Only Cole's own specific details count; details an agent named first
    are recorded and reported but count for neither standard. The footage was found, its maker says,
    by searching where Cole's account pointed, so for the man a fit of place or time is recorded but
    given no weight; only fits of other kinds count (the colour and kind of his clothes and shoes,
    what he says he saw, the order and direction of his walk, companions). For the bomber, fits of
    every kind count. For each standard the account is in one of three states: it conflicts with the
    standard when any of Cole's own specific details conflicts with it, a conflict of place or time
    included, whatever else fits; it describes the standard when at least two counted details fit
    and none conflicts; otherwise it is undecided. The result is the pair of states, reported as it
    falls. The telling pairs are an account that describes the man and conflicts with the bomber's
    movements, and the reverse. An account that describes both, or is undecided on both, does not
    tell them apart and is reported as fitting both; one that conflicts with both fits neither. Each
    result is reported, whichever reading it favours.
