id: PIPE-S003
title: "Cole's first account against the footage: what he told the FBI before he confessed, beside
  the man on the north-west side and the bomber on the south-east"
question: Does the account Brian Cole Jr. gave the FBI before he confessed (where he went on the
  evening of January 5, 2021, when, and in what clothes) describe the man the October 2026 footage
  follows on the north-west side of the Capitol, the bomber's sworn movements on the south-east
  side, or neither?
