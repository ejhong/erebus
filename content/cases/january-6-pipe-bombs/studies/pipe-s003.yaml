method: "A reading of the interview transcript up to the point both sides describe as Cole's admission, recording each detail he gives of the evening of January 5, 2021, who first named it and whether it is specific, and setting each against two fixed standards: the man the October 2026 footage follows (PIPE-S002) and the bomber's movements as the affidavit swears them. Rows: one per detail. Findings apply the frozen decision rule, count what fits, what conflicts and what is generic on each side, and say what the comparison cannot show: it does not identify the man, and a fit of place was partly built into how the footage was found.\n\nCoding tolerances, set after the freeze merged and before any page of the transcript was read, so that the coding is fixed in advance too (they sit outside the hashed criteria and only narrow them). A clock time fits a standard when the standard puts the person at that place within the time's own precision: within 15 minutes of a round hour or 'around' a time, 7 minutes of a quarter-hour, 3 minutes of a time to the minute, since the cameras' clocks are checked only to within minutes. A place fits when it lies on the standard's route or within 150 metres of it. A place or time conflicts only when the account ties it, by a stated time or by its order from one, to a moment inside the standard's window and puts the speaker more than 500 metres from where the standard puts the person at that moment; a place with no such tie is not observable for the man and not described for the bomber. Each attribute of a garment is its own row: blue, violet or purple fits the man's jacket and grey or gray the bomber's sweatshirt; a hood fits both; gloves, a mask, a bag and a shoe's brand are not observable on the man's six cameras. A hedged detail ('I think', 'maybe') is graded on what it names, with the hedge noted. When he gives two versions of one detail, each is a row and each counts. The column 'first named by' gives the agent's prior words with their Tr. page and line. All nine pairs of states are reported as they fall: where the frozen rule says an account undecided on both is reported as fitting both, the finding says it does not tell them apart and gives the pair. Every grade is the operator's draft, shown beside its passage, and carries weight only through evidence records the review checks."
