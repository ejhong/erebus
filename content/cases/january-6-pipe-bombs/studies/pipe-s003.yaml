findings:
  - statement: "The account does not tell the two apart: under the frozen rule it is undecided against
      the man in the October footage and undecided against the bomber's sworn movements, the pair
      the rule reports as fitting both. Of the 21 details recorded, four are specific and Cole's own
      — his Nissan, a restaurant he says he drove to afterwards, a man he saw carrying a Confederate
      flag, and having no headphones with him — and neither record can show any of them, so none
      counts as a fit or a conflict on either side. Nothing he said conflicts with either: he gave
      no clock time ('I know it was night') and no place more definite than 'in front of the
      Capitol, right?', which no time ties to the minutes the cameras or the affidavit cover. The
      result turns on no close grade: graded specific, 'alone' would be one fit with the man, short
      of the two the rule requires, and 'a jacket' is generic by the frozen examples."
    evidenceId: PIPE-E181
  - statement: While denying the charge, Cole said he drove his Nissan to Washington alone, at night, to
      a protest about the election 'in support of Trump'; that he stayed about an hour, walking,
      sitting and looking around, and talked to no one; that he wore 'a jacket because it was cold
      outside', its type forgotten; and that he then drove to a restaurant and home (Tr. 13–14,
      36–49, 73, 84).
    evidenceId: PIPE-E183
  - statement: "What could have told the two standards apart came from the agents. Before he said yes,
      they told him he had been 'in the area of the RNC and the DNC' (54:9–11) and had 'parked at --
      near Folger Park' (54:19), that his phone was at the RNC and DNC (85:1–2) and that he was
      there 'between 7:34 and 8:18 p.m.' (88:18–20), and they showed him shoes (77:20). He had said
      none of these himself. Before the bound he took up two: he called where he parked 'Fuller
      Square (sic), or however you call it' (73:8), and he said he used to have a pair of the shoes
      (77:21)."
    evidenceId: PIPE-E184
  - statement: "One description came from Cole before any agent had named a place. Asked the general
      area where he parked (41:6–8), he said 'there's a park with a bunch, with a bunch of
      neighborhoods' and 'There's a road that splits in the middle and, like, two grass -- like, two
      grassy areas on each side. That's where I always go' (41:9–19), and he did not know the park's
      name. The agents first named Folger Park at 54:19, thirteen pages later; an agent first
      offered a map at 40:11–14 and pulled one up on a phone at 41:24–42:1, after the description.
      On OpenStreetMap, D Street SE between 2nd and 3rd Streets divides into two roadways around
      Folger Park, the southern one running between Folger Park and Providence Park: the block
      where, by the prosecution's account, he said after his admission that he had parked that night
      (ECF No. 17 at 15–16). The description names no street and could fit other places; it is
      graded generic, and neither standard includes a parking place, so it counts for neither."
    evidenceId: PIPE-E186
  - statement: "Asked 'Do you recognize these shoes?', he said 'Yeah. I used, I used to have a pair',
      and that he had thrown them away: 'I grew out of them. I threw them away. I replaced them', as
      they were old and coming apart (77:20–78:9). The transcript does not name the shoe; the
      prosecution's memorandum says he was shown a picture of a Nike Air Max Speed Turf (ECF No. 17
      at 14). Asked whether he wore them the night of the 5th, he said he did not remember
      (79:8–13). An agent named the shoes first, so these rows are recorded and not counted."
    evidenceId: PIPE-E189
  - statement: The bound falls where the motion to suppress cites it. Shown a video on a laptop and
      asked 'Do you recognize that person?', he said 'No', and that he had not watched the video
      before (92:8–11); told that lying to federal agents is a crime and that the agents knew he had
      not told the truth so far (92:16–23), he was asked 'So, is this individual you?' and after a
      pause said 'Yes' (93:3–5). The transcript does not say what the video showed.
    evidenceId: PIPE-E190
limitations:
  - The transcript is a typed record of a video recording that is not public (ECF No. 103, a manual
    exhibit not on the public docket). Passages it marks inaudible or indiscernible could not be
    read (one, at 56:24–25, mentions the protest), and what was shown on screens — the map on an
    agent's phone (41:24–42:1), the shoes, the video — is not described in it.
  - Read once, by eye, from the page images in a browser, not downloaded or machine-read. Page and
    line numbers are the transcript's own; its printed page numbers equal the PDF's throughout the
    pages read. Quotations keep the transcript's spelling, including 'Capital' for the Capitol and
    the transcriber's '(sic)'.
  - "The footage was found by searching where this account pointed, its maker says, so a fit of
    place or time with the man was given no weight, as frozen: the account cannot confirm the
    footage, nor the footage the account."
  - "Both standards are as frozen: six cameras over six minutes for the man (PIPE-S002), and the
    sworn timeline from 7:34 to 8:18 p.m. for the bomber. Neither includes a car, a parking place,
    or anything outside those minutes, where most of Cole's specific details fall."
  - The frozen list of specific details names no kind for companions or for an unnamed place;
    'alone' and the parking description are graded generic on that ground, and every grade is shown
    beside its passage for regrading.
  - The map comparison rests on OpenStreetMap, a volunteer-edited public map viewed on October 19,
    2026, and on the prosecution's account of where he said he parked; it was not checked against
    the District's own records or against any camera.
  - As frozen, nothing about the devices is recorded, and agents, relatives and other private people
    are described by role. The restaurant he names is described, not named, because it would point
    to a relative's workplace.
