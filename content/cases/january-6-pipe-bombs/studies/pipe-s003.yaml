criteria:
  frozenOn: 2026-10-19
  inclusion:
    - "Every statement Brian Cole Jr. makes in the transcript of his recorded FBI interview of
      December 4, 2025 (ECF No. 102-1, Exhibit A to the defense's motion to suppress statements,
      cited as Tr.) about the evening of January 5, 2021: when he arrived and left, how he travelled
      and where he parked, the places he went and in what order, how long he stayed, what he did and
      saw, what he wore and carried, whom he met or spoke to, and his phone. The reading runs from
      the transcript's first page to the moment he first says he is the person in the surveillance
      video, the admission both sides describe, which the motion to suppress places at Tr. 93."
    - Each question or assertion by an agent that first names a detail Cole then affirms, recorded
      beside his answer, so that a detail he volunteered can be told apart from one put to him.
    - "Two standards of comparison, fixed now. The man the October 2026 video follows, as PIPE-S002
      recorded him: on cameras 3188, 3187, 600, 601, 602 and 940 from 7:59:49 to 8:05:42 p.m. by the
      posted files' recorded times, on the north-west side of the Capitol, from the walkway by
      Pennsylvania Avenue NW across Peace Circle and along Northwest Drive to Constitution and New
      Jersey Avenues NW, alone, in a violet-blue hooded jacket, dark trousers and light-soled shoes.
      And the bomber as the sworn affidavit and the prosecution's filings describe him: filmed in
      the neighbourhood south-east of the Capitol from about 7:34 to 8:18 p.m.; at the DNC at about
      7:54; walking south on New Jersey Avenue SE and turning east on E Street SE at 7:59:38; in the
      alley beside the RNC at 8:14:15 and at the RNC at about 8:16; in dark pants, a grey hooded
      sweatshirt, dark gloves, Nike Air Max Speed Turf shoes and a face mask."
  exclusion:
    - "Everything after the admission: what he said once he had said he was the person in the video
      is outside the study, which concerns only the account he gave while denying it."
    - Anything about making, carrying or placing the devices, wherever it appears; the study records
      none of it.
    - The names of agents, relatives and other private people in the transcript; rows describe them
      by role.
    - His views on politics and the election, except where a statement names the protest he says he
      went to, or where or when it was.
    - "Any judgment of whether Cole is the man in the October footage or the bomber: the study
      compares one description of an evening with two records of it, identifies no one and grades no
      claim."
  searchProtocol: "Read ECF No. 102-1 as the RECAP archive serves it
    (storage.courtlistener.com/recap/gov.uscourts.dcd.288125/gov.uscourts.dcd.288125.102.1.pdf; 161
    pages, a scan whose only text layer is the court's page headers), page by page from the first
    page to the admission, by eye from the page images. Any machine reading is checked against the
    page image before a row is written; a passage that cannot be read is recorded as unread. Cite
    each statement by the transcript's own page and line (Tr.), as the motion to suppress cites it,
    with the PDF page beside it. For each statement record: its topic (arrival, travel and parking,
    places and route, time, activity, what he saw, clothing and items, contact, phone, departure,
    purpose); what he says, in a close paraphrase with short quotations where the scan is legible;
    whether he volunteered the detail or an agent first named it; whether it is specific (a named or
    unmistakable street, building, monument, park or protest; a clock time, or an interval under
    half an hour; a colour or kind of garment) or generic ('walked around', 'the Capitol', 'a
    jacket'); and how it compares with each standard: fits, conflicts, or not covered, naming the
    camera and time or the sworn passage it is set against. Predictions fixed now. The October
    footage was found, its maker says, by searching where Cole's account pointed, so a fit of place
    is partly built into the search; the telling details are those a search by place would not
    supply: the colour and kind of his clothes, what he says he saw, the order and direction of his
    walk, where he left the car and when he left. If the first account describes the man the October
    footage follows, those details, where specific, will fit him and none will conflict with him,
    and no specific detail will put Cole on the bomber's side of the Capitol (the DNC, the RNC,
    Folger or Providence Park, D Street SE, New Jersey Avenue SE, Ivy Street) between 7:34 and 8:18
    p.m. If it was a cover story told by the bomber, as the prosecution says, those details will be
    generic, will conflict with the man in the footage, or will fit the bomber's movements; a run of
    specific fits with the man that the agents did not supply would be unexpected. A generic account
    fits both and is reported as fitting both. Each result is reported, whichever reading it
    favours."
  knownCandidates:
    - name: "The prosecution's summary of the first account (ECF No. 17, p. 13): he drove his Nissan
        Sentra to Washington by himself that evening to attend a protest concerning the outcome of
        the 2020 election, one 'in support of [then President] Trump'"
      disposition: include
      reason: Known before the freeze. The rows record the transcript's own words where they are found,
        not the summary.
    - name: "The prosecution's summary of the shoe exchange (ECF No. 17, p. 14): shown a picture of a Nike
        Air Max Speed Turf shoe, he said he 'used to have a pair' and 'threw them away'; Armitas
        gives his reason as having outgrown them"
      disposition: include
      reason: A statement before the admission about a kind of shoe the bomber wore; known before the
        freeze.
    - name: "Baker's posted images of transcript pages (X, October 18, 2026): he came alone in his Nissan,
        at night; went to the protest to show support; for about an hour walked around, sat around
        and looked around, wishing he had his headphones; talked to no one; wore a jacket because it
        was cold"
      disposition: include
      reason: Seen before the freeze. The rows cite the transcript pages the images reproduce.
    - name: "Armitas (X, October 19, 2026): the transcript says the protest was 'in front of' something;
        he searched the north-east side first, by the Supreme Court, mentions a 'Jesus Lives' rally,
        and says he looked for Cole based on what Cole told the agents"
      disposition: include
      reason: Known before the freeze. The passage it describes is a row when found; the search it
        describes means the footage was chosen by place, which the predictions take into account.
    - name: "The prosecutor at the detention hearing (ECF No. 53, p. 53): the cover story was that he was
        going to DC 'to attend a protest at the Capitol', and he 'stuck to that story for two
        hours'"
      disposition: exclude
      reason: An advocate's description of the interview, not a statement in the transcript; known before
        the freeze.
    - name: "The account after the admission (ECF No. 17, pp. 15–16; ECF No. 102 at 11, citing Tr.
        103–117): parking on D Street SE and walking to the DNC and the RNC, with details the
        defense says the agents supplied"
      disposition: exclude
      reason: After the admission and outside the study; known before the freeze.
