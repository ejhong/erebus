method: "A reading of the interview transcript up to the admission, recording each statement Cole
  makes about the evening of January 5, 2021, who first named each detail and whether it is
  specific, and setting each against two fixed standards: the man the October 2026 footage follows
  (PIPE-S002) and the bomber's movements as the affidavit swears them. Rows: one per statement.
  Findings count what fits, what conflicts and what is generic on each side, and say what the
  comparison cannot show: it does not identify the man, and a fit of place was partly built into how
  the footage was found."
