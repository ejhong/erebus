findings:
  - statement: "At 7:59:36, the one phone session inside the footage's window, the phone used Sector C, which faces south from 200 Independence Avenue SW. Every place the October footage puts the man — 3rd Street and Pennsylvania Avenue NW, the Pennsylvania Avenue walkway, Peace Circle, Northwest Drive, New Jersey and Constitution Avenues NW — lies behind that sector, 147° to 172° off its direction: outside the nominal arc and outside the ±90° band, from 3 seconds to under 6 minutes from the session. The disconfirmer fixed at the freeze is not met: the sworn phone data do not place the phone where the footage puts the man."
    evidenceId: PIPE-E162
  - statement: The man filmed crossing at Peace Circle at 8:01:18 would have had to be at least 419 metres south of where he is filmed, 102 seconds earlier, to be inside even the sensitivity band at 7:59:36 — a sustained 4.1 metres a second.
  - statement: "The bomber's sworn positions fit the sectors: each lies inside the nominal arc of the sector serving the phone at the nearest session, except at 7:39:27 on Sector A (75° off, inside the band), when Sector B at the same second fits at 24°. The weakest fit is the one the footage turns on: at 7:59:38 the bomber is 59° off Sector C's direction, at the arc's edge, and 787 m from the site, beyond the 588 m bound set by the next sworn site in that direction (103 G Street SW)."
    evidenceId: PIPE-E163
  - statement: Under Sector B's first-published direction, 345°, the bomber's positions at 7:39 and 7:44 are 129° and 133° off its direction, outside both arc and band; they fit only with the April 2021 correction to east, which the FBI's drive tests, not public, are said to support.
    evidenceId: PIPE-E164
  - statement: "For reference, not a row: 3rd and C Streets SW, where the breakdown's sedan clips are captioned, lie inside Sector C's arc, 116 metres from the site; no phone session falls within four minutes of those clips."
  - statement: "What the geometry allows and excludes: if the man in the footage is Cole, the phone attributed to him was not with him at 7:59:36, or the sworn records or directions are wrong; if the phone was with Cole, the man is not Cole. The study grades neither."
    evidenceId: PIPE-E165
limitations:
  - "Sites are the District's address points (MAR 297573, 291713, 277868 and 5839), placed at a building's main entrance or centre, not at its antennas. Moving a site 100 metres turns a bearing by 7° to 12° at these distances: enough to move the bomber's 7:59:38 position either side of Sector C's arc edge, not enough to bring any of the man's positions inside the band."
  - The protocol's cross-check of the sites against FCC registrations and OpenCelliD was not done in this collection.
  - "A nominal arc is a convention: real coverage depends on beam width, tilt, power and buildings, and a sector can serve a nearby phone from behind. The band allows for the affidavit's caveat that coverage can extend beyond 120°; it does not allow for service from behind, which is possible within a few hundred metres and would need the provider's records to show."
  - Two tower numbers share 200 Independence Avenue SW (126187, facing east, and 147990, facing south); they may be different frequency layers of one site.
  - Footage places are the streets and landmarks in each camera's view, to about 100 metres; the walker on camera 3188 is placed at both ends of the Pennsylvania Avenue walkway, and both ends give the same result.
  - "The bomber's positions are the affidavit's and the detention memorandum's, from video that is not public, except camera 794's. The 7:10 p.m. plate-reader reading is not placed: it is 29 minutes from the nearest session and its expressway ramp has no address point."
  - "Excluded, as frozen: the breakdown's sedan clips (a vehicle, with no camera position) and the person behind barricades (no time or place)."
  - "The method's map is not drawn: the site's figures must be real imagery with provenance, so the table gives each bearing and distance instead."
