id: PIPE-S001
title: "Cole's phone and the October 2026 footage: do the cell sectors reach where the footage puts him?"
question: At the minutes the October 2026 footage shows a man on the north side of the Capitol, does
  the cell sector serving Cole's phone cover that place, as it would if the man and the phone were
  together, or only the bomber's route on the southeast side?
researchIds:
  - PIPE-R002
claimIds:
  - PIPE-C027
  - PIPE-C033
  - PIPE-C059
  - PIPE-C075
criteria:
  frozenOn: 2026-10-19
  inclusion:
    - "The cell-site records sworn in the complaint affidavit (PDF pages 6-7): every data session of
      the phone attributed to Cole between 7:39 and 8:24 p.m. on January 5, 2021, with its time,
      tower, tower address and sector direction as sworn (Sectors A to E), and the April 2021
      correction of Sector B's direction."
    - Every location in the footage Steve Baker published on October 18, 2026 that Baker, his
      collaborators or any later release ties to a camera position and a time, recorded with the
      source of each.
    - Every location of the bomber the affidavit and the detention memorandum give with a time, as
      the reference path the sectors are said to fit.
  exclusion:
    - Footage locations with no stated time or no identifiable camera position (listed in the
      limitations, never silently dropped).
    - Any location of the man in the October footage whose identification as the same man rests on a
      different camera's frames without a continuous track (reported separately, not pooled).
  searchProtocol: "Tower positions: the street addresses sworn in the affidavit (103 G Street SW; 200
    Independence Avenue SW; 101 Independence Avenue SE; 600 Pennsylvania Avenue SE), geocoded with
    the District's Master Address Repository, cross-checked against FCC antenna structure
    registrations and OpenCelliD where they list the same structures. Footage positions and times:
    Baker's X thread of 2026-10-18 and its two videos, any later release by Baker, @accabbat, the
    defense or the Capitol Police, and court filings. Method fixed now: a sector's nominal coverage
    is its sworn azimuth plus or minus 60 degrees (the affidavit's approximately 120 degrees), with
    a sensitivity band of plus or minus 90 degrees for the affidavit's caveat that coverage can
    extend beyond 120 degrees; range is bounded at the distance to the nearest other site of the
    same provider in the sector's direction, or 1.5 km where unknown. For each footage location at
    minute t, record whether it lies inside the nominal arc and inside the sensitivity band of the
    sector the phone used nearest in time to t, and the time gap between them. Prediction under the
    charged account: footage locations of Cole at minutes of phone sessions fall outside the nominal
    arc of the serving sector, or the footage's times do not overlap the 7:34-8:18 window when the
    bomber is on camera elsewhere. Disconfirmer of the claim that the phone data exclude the
    footage: every timed footage location lies inside the nominal arc of the sector serving the
    phone at that minute. The study reports both, and grades nothing."
