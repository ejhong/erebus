method: A desk study of public records only. Geocode the four tower sites sworn in the affidavit;
  draw each sector's nominal arc (sworn azimuth plus or minus 60 degrees) and a sensitivity band
  (plus or minus 90 degrees), bounded in range as the search protocol fixes; place every timed
  location of the bomber (from the affidavit and the detention memorandum) and every timed location
  of the man in the October footage (from the published footage and any later release); and for
  each, report the sector serving the phone nearest in time, the time gap, and whether the location
  lies inside the arc and the band. Results are a table and a map; the study states what the
  geometry allows and excludes, and grades no claim.
