  - "Misidentification: the man the congressional footage shows on the north side of the Capitol, who is not the bomber, is Cole, as his family and Steve Baker say, and his confession was coerced."
  - "An insider: a law-enforcement insider placed the devices and the investigation protected them (Baker and others); its one named suspect was retracted."
