question: Does the public record support the charge that Brian Cole Jr. placed the pipe bombs outside the RNC and DNC on January 5, 2021 — and could the October 2026 footage undo it?
accounts:
  - "The charged account: Brian Cole Jr., alone, built both devices and placed them on the evening of January 5, 2021, as prosecutors allege; he denies it and is presumed innocent."
  - "Misidentification: Cole was on the north side of the Capitol while the bomber worked to the south, as footage Steve Baker published in October 2026 is said to show, and his confession was coerced."
  - "An insider: a law-enforcement insider placed the devices and the investigation protected them (Baker and others); its one named suspect was retracted."
  - "Not overnight: the devices were set down shortly before they were found on January 6, not the evening before (Baker)."
article: |-
  On the evening of January 5, 2021, someone in a grey hooded sweatshirt, a face mask, gloves and Nike running shoes walked the streets south of the Capitol for about three-quarters of an hour and left two pipe bombs: one by the Democratic National Committee, one behind the Republican National Committee. Neither went off. They were found around one o'clock the next afternoon, as the crowd at the Capitol was breaking through the police lines, and for almost five years no one was charged.

  On December 4, 2025, the FBI arrested Brian J. Cole Jr., a 30-year-old from Woodbridge, Virginia, who worked in a bail bondsman's office and lived with his family. Prosecutors say the records of what he bought, where his car went and where his phone was all lead to him, and that he confessed the same day. He has pleaded not guilty. **No court has decided the charges, and he is presumed innocent.** In October 2026 the reporter Steve Baker published Capitol security video that he says shows Cole on the far side of the Capitol while the bomber was at work. This page sets out what the public record shows, each side's case in its own words, and what would settle it.

  ## Where the case stands

  United States v. Cole, No. 1:26-cr-00001-AHA, is before Judge Amir H. Ali of the U.S. District Court for the District of Columbia. [The current indictment, the third superseding one, has eight counts]{claim=PIPE-C060}, among them two of transporting explosives across state lines, one for each device, and two of trying to damage the party headquarters by explosive. [Cole has pleaded not guilty, and his trial is set for February 16, 2027]{claim=PIPE-C057}. The judge has kept him in custody, and [ruled that the January 2025 pardons for the Capitol riot do not reach him]{claim=PIPE-C058}. Pending motions include the defense's bid to suppress his confession and to dismiss the transportation counts as brought a day too late. Last checked October 19, 2026.

  ## The night of January 5

  What happened that evening is not in dispute between the parties. [The FBI's video timeline has the person placing the first device by the DNC at about 7:54 p.m.]{claim=PIPE-C001} and [the second, behind the RNC, at about 8:16]{claim=PIPE-C002}, after being caught on camera in the neighborhood from 7:34 onward. [Each device was a short metal pipe capped at both ends, filled with homemade black powder and wired to a kitchen timer and a 9-volt battery]{claim=PIPE-C006}. [An FBI explosives examiner assessed both as viable]{claim=PIPE-C007}, though [whether they could actually have gone off is disputed]{claim=PIPE-C008}: by the prosecution's own account one powder sample was not explosive, and neither device fired in the sixteen hours it lay out. [They lay where they were left until they were found]{claim=PIPE-C004} — [a Secret Service sweep at the DNC missed its device that morning, before Vice President-elect Kamala Harris arrived]{claim=PIPE-C054}, and [after the discovery the police failed to keep people and cars away from them]{claim=PIPE-C055}.

  The person on the video was [put by the FBI's 2021 height analysis at 5 feet 7 inches, give or take an inch, hood included]{claim=PIPE-C009}, [wore eyeglasses]{claim=PIPE-C011} and [wore Nike Air Max Speed Turf shoes]{claim=PIPE-C012}. Cole, the affidavit says, [is about 5 feet 6]{claim=PIPE-C010} and wears glasses: a fit, but one that would fit a great many men.

  ## The case as the prosecution states it

  Four lines of evidence, all described in sworn statements or court filings and none yet tested at trial, make up the charge.

  **Purchases.** [Bank and card records, as the FBI describes them, show Cole buying every kind of part in the devices across 2019 and 2020]{claim=PIPE-C020}: the pipes, end caps, timers, wire, steel wool and battery connectors. Most of it is ordinary hardware — [some 26,000 pipes of that make were sold in 2020]{claim=PIPE-C022} — but [the battery connector was not: fewer than 8,000 were distributed in the whole country over three years]{claim=PIPE-C021}, and he bought five. [He went on buying the same kinds of parts after January 2021, the last in August 2022]{claim=PIPE-C023}, and [the searches of his home and car turned up pipes, end caps, wire and receipts]{claim=PIPE-C024}. [No fingerprint or DNA link to the devices appears in the public record]{claim=PIPE-C025}; the prosecution says he wore gloves and wiped the devices down.

  **His car.** [A license plate reader recorded his Nissan coming off Interstate 395 at the South Capitol Street exit at 7:10 p.m.]{claim=PIPE-C026}, twenty-four minutes before the bomber first appears on camera half a mile away.

  **His phone.** This is the strongest line. [Between 7:39 and 8:24 p.m., the affidavit states, the phone attributed to Cole connected seven times to the cell sectors covering the places the cameras show the bomber at the same minutes]{claim=PIPE-C027} — at 7:59:36, for instance, to a sector facing south from Independence Avenue that covers the corner where, at 7:59:38, the bomber turned from New Jersey Avenue onto E Street SE. A sector is a wide wedge, not a pin, so each match says only that the phone was somewhere in that wedge; but five different wedges, in the order the bomber walked them, are hard to come by unless the phone went with the bomber. [One sector's direction was published wrongly at first and corrected by the provider in April 2021]{claim=PIPE-C028}, years before Cole was a suspect. [The story that the carriers handed the FBI corrupted data]{claim=PIPE-C029}, which a former FBI official told Congress, the carriers deny, and the FBI later worked from the provider's records.

  **His own account.** [When questioned, Cole first said he had driven to Washington alone that evening to attend a protest about the 2020 election]{claim=PIPE-C037}. [After about two hours of denials, shown a still from the video and reminded that lying to agents is a crime, he paused for about fifteen seconds and said yes, it was him]{claim=PIPE-C038}, the prosecution says, and [then spent an hour and a half describing how he built, carried and placed the devices]{claim=PIPE-C039}: black powder made from charcoal, sulfur dust and potassium nitrate, timers set to their sixty-minute maximum, his car parked on D Street SE near Folger Park. [He said he acted out of frustration with both parties]{claim=PIPE-C049} and [denied that he was aiming at Congress or the next day's vote]{claim=PIPE-C050}, though [prosecutors now allege an intent to coerce Congress]{claim=PIPE-C051}. Over the following years [his phone recorded 943 factory resets or wipes]{claim=PIPE-C046} — [one in December 2020, then none until July 2022]{claim=PIPE-C047}, and one about three hours before his arrest; [the defense puts the wiping down to obsessive-compulsive disorder]{claim=PIPE-C048}.

  ## The challenge to the confession

  The defense has moved to suppress the confession. [Its expert, a leading researcher of false confessions, quotes the agents minimizing the act, implying leniency and suggesting his family might be spared a trip to Washington]{claim=PIPE-C041}, and reports that [Cole was in acute distress, at times hyperventilating]{claim=PIPE-C042}. [Cole was diagnosed with autism and obsessive-compulsive disorder two weeks after his arrest]{claim=PIPE-C043}; the prosecution notes that his school records show no diagnosis and that the defense has not produced the basis for it. Baker says [Cole denied involvement some 95 times before the agents raised his family]{claim=PIPE-C044}.

  These are real risk factors, and they are also common in interrogations of people who did what they confess to. What decides the confession's worth is a different question: [does it contain details only the bomber could have known, which the agents had not supplied, and which check out?]{claim=PIPE-C040} Some are checkable — a particular brand of sulfur dust from a particular store — but neither side has published that comparison, and [the recording itself is not public]{claim=PIPE-C045}. Baker's count, from the transcript, is that 95 of 123 admissions repeated what was supplied or already public and 28 were new; which 28, and whether they are true, is the open question.

  ## The October footage

  On October 18, 2026, Baker published what he calls [never-before-seen Capitol CCTV of a young man walking alone on the north side of the Capitol that evening]{claim=PIPE-C030}, found with a researcher who goes by Armitas by following clues in Cole's first account. The next day he gave the specifics: [the footage is raw Capitol Police video from the House Administration Subcommittee on Oversight's public release on Rumble]{claim=PIPE-C061}, and [the man appears on cameras 602 and 940 between 8:03:32 and 8:04:02 p.m., by Peace Circle and crossing Constitution Avenue toward New Jersey Avenue NW]{claim=PIPE-C062}. [He wears a maroon-and-gold cloth mask, a jacket with a tag hanging from it, and New Balance shoes with the heels crushed down]{claim=PIPE-C034}; Cole's family recognised the mask, which his mother says she sewed, and the jacket, a Christmas gift. Baker's conclusion is that [Cole was elsewhere while the devices were being placed, and so was not the bomber]{claim=PIPE-C033}. Rep. Thomas Massie and others have endorsed it; the FBI and the Justice Department have not responded publicly.

  The timestamps are what make this a test rather than an argument. Baker's headline says the man was filmed [at the same time the devices were being placed]{claim=PIPE-C032}, which is not quite the point: 8:03 falls between the two placements. The sharp conflict is with an earlier minute. The affidavit puts the bomber at New Jersey Avenue and E Street SE at 7:59:38, about a kilometre from Constitution Avenue in a straight line and farther on foot. [If both camera systems' clocks are right, the man filmed at 8:03:32 cannot be the person filmed at 7:59:38]{claim=PIPE-C063}. Then either the man on the north side is not Cole, or the charged account is wrong at that point — unless one of the clocks is several minutes off, which happens often enough with surveillance systems that it must be checked, not assumed.

  Two things weigh against the alibi as it stands. First, [whether the man is Cole rests on his family's recognition of his clothes and on gait judged by eye]{claim=PIPE-C031}, and [the same way of identifying people named a different person, a former Capitol Police officer, in November 2025 — a report its publisher retracted, and over which a federal court has entered a default judgment for defamation against Baker]{claim=PIPE-C036}. Second, the phone: if Cole was on Constitution Avenue at 8:03, his phone four minutes earlier was on a sector facing south from Independence Avenue, and the alibi has to explain that too. And [whether the footage is authentic Capitol CCTV with accurate times]{claim=PIPE-C035} has not been independently established: the House has posted Capitol security video online since 2023, but these two files have not yet been found for this page.

  ## Baker's other points

  [The bomber's shoes, Baker says, measured about size 9 to 9.5]{claim=PIPE-C014}, while [Cole wears 12 to 13]{claim=PIPE-C015}; no measurement or method has been published, and the sizes of the shoes seized from Cole would settle it. [He says the FBI's own podiatrist found a gait comparison inconclusive]{claim=PIPE-C016}; a court filing confirms such materials exist and went to the defense, not what they conclude. [He says unreleased video shows the bomber wearing a smartwatch]{claim=PIPE-C017}, and [that Cole never owned a watch]{claim=PIPE-C018}. [He says no camera shows the RNC device being set down]{claim=PIPE-C003}, and the prosecution's own memorandum says only that the bomber appears to have placed it there. [He reports that a laboratory flame test on the DNC device's powder was negative]{claim=PIPE-C065}, which fits the prosecution's admission that one sample was not explosive; that [an end cap went missing after the device was disrupted]{claim=PIPE-C066}; that [a second disruption shot destroyed fingerprint and DNA evidence]{claim=PIPE-C067}; that [the RNC device's timer read twenty minutes when it was found]{claim=PIPE-C068}, against the sixty Cole reportedly described; and that [the FBI told Congress the DNC's January 6 footage was lost]{claim=PIPE-C069}. He argues that [the devices were set down shortly before they were found, not the night before]{claim=PIPE-C005}, which the timestamped video of the placements, and a sweep that missed a device lying in place, both contradict. And he says he is certain [the bomber was a police insider]{claim=PIPE-C052}; no evidence for that has been published, and its one named suspect is the one his outlet retracted.

  Questions about the investigation itself are fair. [The FBI chased many leads in 2021]{claim=PIPE-C053}, among them five people whose phone data may have matched the bomber's movements; and [Cole became the focus only weeks before his arrest, without any new tip or witness]{claim=PIPE-C056}, by officials' account — which means the evidence against him sat in the files for years.

  ## What the record shows, and what would settle it

  On the public record as it stands, [the charged account — that Cole is the person on the video]{claim=PIPE-C059} — is well supported: purchases matching every part, including an uncommon one; a car arriving at the right time; a phone keeping pace with the bomber minute by minute; parts at his home; and a detailed confession, all described under oath or in filings and none yet tested in court. That is this site's own assessment of the evidence, not a finding of guilt, which only a jury can make. It stands open to one specific challenge, and three records would settle it: the native files from cameras 602 and 940 with their clock offsets, set against the cameras that filmed the bomber; a map of the five phone sectors against the places in that footage; and the recorded interview, each detail traced to whoever said it first. The court will see the last two before trial. The first is a public archive away.
