question: Does the public record support the charge that Brian Cole Jr. placed the pipe bombs outside the RNC and DNC on January 5, 2021 — and is the man the October 2026 footage shows on the other side of the Capitol him?
accounts:
  - "The charged account: Brian Cole Jr., alone, built both devices and placed them on the evening of January 5, 2021, as prosecutors allege; he denies it and is presumed innocent."
  - "Misidentification: the man the congressional footage shows on the north side of the Capitol, who on its recorded clocks cannot be the bomber, is Cole, as his family and Steve Baker say, and his confession was coerced."
  - "An insider: a law-enforcement insider placed the devices and the investigation protected them (Baker and others, and now Cole's defense, against the officer a retracted report named); the government says the FBI's inquiry found nothing to support it, from records not public."
  - "Not overnight: the devices were set down shortly before they were found on January 6, not the evening before (Baker, before his October 2026 account)."
article: |
  On the evening of January 5, 2021, someone in a grey hooded sweatshirt, a face mask, gloves and Nike running shoes walked the streets south of the Capitol for about three-quarters of an hour and left two pipe bombs: one by the Democratic National Committee, one behind the Republican National Committee. Neither went off. They were found around one o'clock the next afternoon, as the crowd at the Capitol was breaking through the police lines, and for almost five years no one was charged.

  On December 4, 2025, the FBI arrested Brian J. Cole Jr., a 30-year-old from Woodbridge, Virginia. Prosecutors say the records of what he bought, where his car went and where his phone was all lead to him, and that he confessed the same day. He has pleaded not guilty. **No court has decided the charges, and he is presumed innocent.** In October 2026 the reporter Steve Baker published Capitol security video that he says shows Cole on the far side of the Capitol while the bomber was at work. This page sets out what the public record shows, each side's case in its own words, and what would settle it. It takes official accounts as claims to be tested, like anyone else's.

  ## New: the footage, checked against the subcommittee's files

  > **New on October 19, 2026.** This site found the subcommittee's files from which Baker's video was cut, and ran two studies registered in advance; no published account had established these findings.

  - **The clips are the subcommittee's files, and the times, but one, are the files' own.** [All eight cameras in the video are among the files the House subcommittee posted, and every clip matches its posted file]{claim=PIPE-C073}. [The times on screen were added in editing, as critics said, and all but one are the files' own recorded times]{claim=PIPE-C074}: [camera 602's is 30 seconds early]{claim=PIPE-C083}.
  - **The times given for cameras 602 and 940 are when the files begin.** [Baker's side gave them as 20:03:32 to 20:04:02]{claim=PIPE-C062}; [the man is on them from 8:04:56 and 8:05:23, 83 and 81 seconds in]{claim=PIPE-C078}.
  - **On the clocks as recorded, the man cannot be the bomber.** [To have been where the affidavit puts the bomber at 7:59:38, the man who crosses Peace Circle at 8:01:18 would have had to cover at least 960 metres in 100 seconds, faster than any runner has covered a kilometre; at a brisk walk, camera 3187's clock and the FBI's would have to be about nine minutes apart]{claim=PIPE-C063}. The clocks are checked at one moment only, on camera 794, which films the figure Baker's breakdown labels the bomber on the sworn route at 7:57:10; camera 3187's is unmeasured.
  - **The phone's sector faced away from him.** [At 7:59:36 the phone the affidavit attributes to Cole used a cell sector facing away from every place the man is filmed]{claim=PIPE-C075}; a sector can serve a phone close behind it, which only the provider's records could show.

  Everything now turns on who the man is, and on the cameras' clocks.

  ## New: Cole's first account, against the footage

  > **New on October 20, 2026.** This site read Cole's interview transcript, public since September 29, up to his admission, under a study registered beforehand.

  - [His account until then fits the man in the footage no better than the bomber's sworn movements]{claim=PIPE-C079}.
  - What could tell the two apart came from the agents: [before he said yes, they told him he had been in the area of the RNC and DNC, had parked near Folger Park and was there between 7:34 and 8:18 p.m., and showed him shoes]{claim=PIPE-C080}.
  - [Before any agent had named a park, he said he always parks by "a road that splits in the middle and, like, two grass -- like, two grassy areas on each side."]{claim=PIPE-C081} [That fits D Street SE where it splits around Folger Park, where by the prosecution's account he later said he parked]{claim=PIPE-C082}, though the FBI had publicly named the area in 2021.

  ## Where the case stands

  United States v. Cole, No. 1:26-cr-00001-AHA, is before Judge Amir H. Ali of the U.S. District Court for the District of Columbia. [The current indictment, the third superseding one, has eight counts]{claim=PIPE-C060}, among them two of transporting explosives across state lines, one for each device, and two of trying to damage the party headquarters by explosive. [Cole pleaded not guilty to all eight on October 1; his trial was set in July for February 16, 2027, and the court's scheduling order is still to come]{claim=PIPE-C057}. The judge has kept him in custody, and [ruled that the January 2025 pardons for the Capitol riot do not reach him]{claim=PIPE-C058}. Pending motions include the defense's bid to suppress his confession, which the government must answer by November 13; to dismiss the transportation counts as brought a day too late; and [to subpoena a native video file and other media from one person's phone on January 5, 2021, with that day's communications with a second person, which the government has declined to produce in full]{claim=PIPE-C076}.

  > **New on October 21, 2026.** [Three of Cole's lawyers also represent Baker and his former colleague Joseph Hanneman in a defamation suit over their November 2025 report]{claim=PIPE-C087}, brought by the former Capitol Police officer it named. The government calls it a conflict; the defense says the clients' interests run the same way. On October 20 the judge ordered the Federal Public Defender to appoint independent counsel to advise Cole, who may waive any conflict; that counsel reports by October 30. Last checked October 21, 2026.

  ## The night of January 5

  The FBI's reconstruction of that evening, from surveillance video that has not been made public, is not contested by the defense, though Baker disputes parts of it. [The FBI's video timeline has the person placing the first device by the DNC at about 7:54 p.m.]{claim=PIPE-C001} and [the second, behind the RNC, at about 8:16]{claim=PIPE-C002}, after appearing on camera from 7:34. [Each device was a capped metal pipe filled with homemade black powder, wired to a kitchen timer and a 9-volt battery]{claim=PIPE-C006}. [An FBI explosives examiner assessed both as viable]{claim=PIPE-C007}, though [whether they could actually have gone off is disputed]{claim=PIPE-C008}: by the prosecution's own account one powder sample was not explosive, and neither device fired in the sixteen hours it lay out. [By that reconstruction they lay where they were left until they were found]{claim=PIPE-C004}, though no continuous footage of either device is public, and [a Secret Service sweep at the DNC missed its device that morning]{claim=PIPE-C054}.

  The person on the video was [put by the FBI's 2021 height analysis at 5 feet 7 inches, give or take an inch, hood included]{claim=PIPE-C009}, [wore eyeglasses]{claim=PIPE-C011} and [wore Nike Air Max Speed Turf shoes]{claim=PIPE-C012}. Cole, the affidavit says, [is about 5 feet 6]{claim=PIPE-C010} and wears glasses: a fit, but one that would fit a great many men.

  ## The case as the prosecution states it

  Four lines of evidence, all described in sworn statements or filings and none yet tested at trial, make up the charge; each stays provisional while it rests on one side's description of records no one else has examined.

  **Purchases.** [Bank and card records, as the FBI describes them, show Cole buying six of the kinds of part in the devices across 2019 and 2020]{claim=PIPE-C020}: the pipes, end caps, timers, wire, steel wool and battery connectors. [The alligator clips are the exception: the only clips the affidavit lists were bought on January 23, 2021]{claim=PIPE-C070}, weeks after the placements. Most of it is ordinary hardware — [some 26,000 pipes of that make were sold in 2020]{claim=PIPE-C022} — but [the battery connector was not: fewer than 8,000 were distributed in the whole country over three years]{claim=PIPE-C021}, and he bought five. [He went on buying the same kinds of parts after January 2021, the last in August 2022]{claim=PIPE-C023}, and [the searches of his home and car turned up pipes, end caps, wire and receipts]{claim=PIPE-C024}. [No fingerprint or DNA link to the devices appears in the public record]{claim=PIPE-C025}; the prosecution says he wore gloves and wiped the devices down.

  **His car.** [A license plate reader recorded his Nissan coming off Interstate 395 at the South Capitol Street exit at 7:10 p.m.]{claim=PIPE-C026}, twenty-four minutes before the bomber first appears on camera half a mile away; Baker's collaborator Armitas accepts that reading.

  **His phone.** This is the strongest line. [Between 7:39 and 8:24 p.m., the affidavit states, the phone attributed to Cole connected seven times to the cell sectors covering the places the cameras show the bomber at the same minutes]{claim=PIPE-C027}. Mapped by this site, each of the bomber's positions does lie in the serving sector's arc; the weakest fit is at 7:59:36, when the bomber's corner, New Jersey Avenue and E Street SE, sits at the very edge of a sector facing south from Independence Avenue SW. The provider's raw records and the FBI's drive tests, which would show each session's distance, are not public. A sector is a wedge, not a pin; but five in the bomber's order are hard to explain unless the phone went with the bomber. [One sector's direction was published wrongly at first and corrected by the provider in April 2021]{claim=PIPE-C028}, years before Cole was a suspect, and the fit depends on the correction. A former senior FBI official told Congress that [the carriers had handed the FBI corrupted data]{claim=PIPE-C029}; the carriers deny it, and how the data used against Cole was kept and recovered is not public.

  **His own account.** [When questioned, Cole first said he had driven to Washington alone that evening to attend a protest about the 2020 election]{claim=PIPE-C037}. [After about two hours of denials, shown a still from the video and reminded that lying to agents is a crime, he paused for about fifteen seconds and said yes, it was him]{claim=PIPE-C038}, the prosecution says, and [then spent an hour and a half describing how he built, carried and placed the devices]{claim=PIPE-C039}, in pages of the transcript this site has yet to read. [He said he acted out of frustration with both parties]{claim=PIPE-C049} and [denied that he was aiming at Congress or the next day's vote]{claim=PIPE-C050}, though [prosecutors now allege an intent to coerce Congress]{claim=PIPE-C051}. [His phone recorded 943 factory resets or wipes]{claim=PIPE-C046}, [one in December 2020, then none until July 2022]{claim=PIPE-C047}; [the defense puts the wiping down to obsessive-compulsive disorder]{claim=PIPE-C048}.

  ## The challenge to the confession

  The defense has moved to suppress the confession. [Its expert, a leading researcher of false confessions, quotes the agents minimizing the act, implying leniency and suggesting his family might be spared a trip to Washington]{claim=PIPE-C041}, and reports that [Cole was in acute distress, at times hyperventilating]{claim=PIPE-C042}. [Cole was diagnosed with autism and obsessive-compulsive disorder two weeks after his arrest]{claim=PIPE-C043}; the prosecution says the defense has not produced its basis. Baker says [Cole denied involvement some 95 times before the agents raised his family]{claim=PIPE-C044}.

  These are real risk factors, common also in interrogations of the guilty. What decides the confession's worth is a different question: [does it contain details only the bomber could have known, which the agents had not supplied, and which check out?]{claim=PIPE-C040} Some are checkable — a brand and a store he named — but neither side has published that comparison. [The recording itself is not public]{claim=PIPE-C045}, though its transcript now is; the defense says that after the waiver the agents supplied where he parked, what he carried, where he sat and the timer setting. Baker counts 28 of 123 admissions as new, the rest supplied or already public; which 28, and whether they are true, is open.

  ## The October footage

  On October 18, 2026, Baker published [Capitol CCTV of a man walking alone on the northwest side of the Capitol that evening]{claim=PIPE-C030}, found with a researcher who goes by Armitas by following clues in Cole's first account. It comes, as he says, [from the Capitol Police video the House Administration Subcommittee on Oversight posted on Rumble]{claim=PIPE-C061}, and [the video begins, as Armitas says, at 7:57 p.m.]{claim=PIPE-C071} Critics' charge that [the times shown were added by his team rather than read from the camera files]{claim=PIPE-C072} is half right, as shown above. Baker's conclusion is that [Cole was elsewhere while the devices were being placed, and so was not the bomber]{claim=PIPE-C033}. Rep. Thomas Massie and others have endorsed it; the FBI and the Justice Department have not responded publicly.

  Baker's headline has the man filmed [at the same time the devices were being placed]{claim=PIPE-C032}; in fact it is between the placements, during the bomber's walk.

  So the question is whether he is Cole. [He wears, Baker says, a maroon-and-gold cloth mask, a jacket with a tag hanging from it, and New Balance shoes]{claim=PIPE-C034}; Cole's family, Baker reports, recognised the mask, which his mother says she sewed, and the jacket. The frames, at 704 by 528 pixels, show a violet-blue hooded jacket and light shoes that flash under the lights, and cannot resolve a mask's colours, a brand or a tag; below, his head is about 10 by 13 pixels. [Whether the man is Cole rests on that recognition and on his face judged by eye]{claim=PIPE-C031}, by no method published or tested. The longer breakdown adds [clips captioned as a dark sedan on 3rd Street SW at 8:03 and on C Street at 8:04]{claim=PIPE-C077}, beside a photograph of a Nissan Sentra, inside the sector the phone used at 7:59:36; their source is not stated.

  Baker's earlier identification is a separate matter. In November 2025 he and Hanneman [named a former Capitol Police officer as a forensic match for the bomber, in a report their publisher retracted]{claim=PIPE-C036}. That report, as the government quotes it, claimed a software gait match of 94 to 98 per cent from an analyst it did not name; [the October identification does not use that method]{claim=PIPE-C085}, and offers no gait analysis of the man at all. This page earlier said a federal court had entered a default judgment against Baker over the report. The court's docket shows only the clerk's entry of default, set aside in July, and [no judgment has been entered]{claim=PIPE-C084}; motions to dismiss are pending.

  {plate:IMG-J6PB-P01}

  ## Baker's other points

  [The bomber's shoes, Baker says, measured about size 9 to 9.5]{claim=PIPE-C014}, while [Cole wears 12 to 13]{claim=PIPE-C015}; no measurement or method has been published, and the sizes of the shoes seized from Cole would settle it. [He says the FBI's own podiatrist found a gait comparison inconclusive]{claim=PIPE-C016}; the government's filings describe one such comparison, of another person's gait with the bomber's, and do not say whether Cole's was ever compared. [He says unreleased video shows the bomber wearing a smartwatch]{claim=PIPE-C017}, and [that Cole never owned a watch]{claim=PIPE-C018}. [He says no camera shows the RNC device being set down]{claim=PIPE-C003}, and the prosecution's own memorandum says only that the bomber appears to have placed it there. [He reports that a laboratory flame test on the DNC device's powder was negative]{claim=PIPE-C065}, which fits the prosecution's admission that one sample was not explosive; that [an end cap went missing after the device was disrupted]{claim=PIPE-C066}; that [a second disruption shot destroyed fingerprint and DNA evidence]{claim=PIPE-C067}; that [the RNC device's timer read twenty minutes when it was found]{claim=PIPE-C068}, against the sixty Cole reportedly described; and that [the FBI told Congress the DNC's January 6 footage was lost]{claim=PIPE-C069}. He argued that [the devices were set down shortly before they were found, not the night before]{claim=PIPE-C005}; the FBI's sworn timeline and his own October account say otherwise.

  And he says he is certain [the bomber was a police insider]{claim=PIPE-C052}; the evidence he says he has is unreleased, and its one named suspect is the officer above. That account is now Cole's defense too: [his lawyers argue in court that she, not he, placed the devices, and seek records by subpoena to show it]{claim=PIPE-C086}. The government answers that [the FBI investigated the November report and found nothing connecting her to the devices]{claim=PIPE-C088}, citing records it says account for her that evening; they went to the defense under a protective order and are not public. So the government's word against her involvement, like most of what points to Cole, cannot yet be checked.

  Questions about the investigation itself are fair. [The FBI chased many leads in 2021]{claim=PIPE-C053}, among them five people whose phone data may have matched the bomber's movements; and [Cole became the focus only weeks before his arrest, without any new tip or witness]{claim=PIPE-C056}, by officials' account.

  ## What the record shows, and what would settle it

  On the public record as it stands, [the charged account — that Cole is the person on the video]{claim=PIPE-C059} — is provisionally supported. The lines against Cole converge, but all of them, the interview's transcript aside, are the prosecution's description of records the public has not seen and no court has tested. That is this site's own assessment of the evidence, not a finding of guilt, which only a jury can make. Whether the man in the October footage is Cole is now the decisive question: if he is, the charged account needs the cameras' clocks to be minutes off the FBI's; if the phone records are right and the phone was with Cole, the man is someone else. Four things would settle it: a comparison of the man's frames with known images of Cole by an examiner who is not told which is which, with his track on the cameras around him; the cameras' clock offsets, measured through something two cameras saw; the phone's raw records, with distance data; and the interview, each detail of the confession traced to whoever said it first.
