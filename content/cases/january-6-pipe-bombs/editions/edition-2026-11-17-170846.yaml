article: |
  On the evening of January 5, 2021, someone in a grey hooded sweatshirt, a face mask, gloves and Nike running shoes walked the streets south of the Capitol for about three-quarters of an hour and left two pipe bombs: one by the Democratic National Committee, one behind the Republican National Committee. Neither went off. They were found around one o'clock the next afternoon, as the crowd at the Capitol was breaking through the police lines, and for almost five years no one was charged.

  On December 4, 2025, the FBI arrested Brian J. Cole Jr., a 30-year-old from Woodbridge, Virginia. Prosecutors say the records of what he bought, where his car went and where his phone was all lead to him, and that he confessed the same day. He has pleaded not guilty. **No court has decided the charges, and he is presumed innocent.** In October 2026 the reporter Steve Baker published Capitol security video that he says shows Cole on the far side of the Capitol while the bomber was at work. This page sets out what the public record shows, each side's case in its own words, and what would settle it. It takes official accounts as claims to be tested, like anyone else's.

  ## New: the government answers the challenge to the confession

  > **New on November 17, 2026.** The government's answer to the motion to suppress, filed November 13, read in full.

  - **It agrees on what the agents did.** [It concedes the minimizing, the statements that confessing would help him, and the remark that his family might be spared a trip to Washington]{claim=PIPE-C041}, and that [he was distressed while he denied the charge]{claim=PIPE-C042}. It calls all of it lawful: [the family, it says, were already under subpoena for the next day, and were released after he talked]{claim=PIPE-C097}.
  - **It points to one detail his records confirm.** [His card records, it says, show a 2018 purchase of Lilly Miller sulfur dust, the brand he named for the powder]{claim=PIPE-C091}. Before his admission the agents had listed the parts he had bought, but not sulfur. Whether he named the brand or answered a question that named it is on two transcript pages this site has not yet read.
  - **It adds new assertions, from records not public.** [A deleted copy of the Anarchist Cookbook on a thumb drive where he lived]{claim=PIPE-C092}; [searches in 2012 for how to make a pipe bomb, under a profile named "Brian" on a family drive]{claim=PIPE-C093}; [his computer's operating system reinstalled hours before his arrest]{claim=PIPE-C094}; and [a recorded call from jail, eight days after his arrest, in which he called "what I did four years ago" the dumbest thing he had ever done]{claim=PIPE-C095}. By the same account his parents at once told him he had done nothing, and he agreed.
  - **Its expert answers his.** [A neuropsychologist it retained, reviewing the recording, finds no functional impairment, and anxiety that largely disappeared once he said yes]{claim=PIPE-C096}. That fits a guilty man's relief and an innocent man's release from pressure alike.

  The defense has not yet replied, and the court has not ruled.

  ## The footage and the first account, checked

  In October this site found the House subcommittee's files from which Baker's video was cut, and read Cole's interview transcript up to his admission, under studies registered in advance.

  - [All eight cameras in the video are among the posted files, and every clip matches its file]{claim=PIPE-C073}. [The times on screen were added in editing, and all but one are the files' own]{claim=PIPE-C074}; [camera 602's is 30 seconds early]{claim=PIPE-C083}, and [the times Baker's side gave for cameras 602 and 940]{claim=PIPE-C062} are when the files begin: [the man is on them from 8:04:56 and 8:05:23]{claim=PIPE-C078}.
  - **On the clocks as recorded, the man cannot be the bomber.** [To have been where the affidavit puts the bomber at 7:59:38, the man who crosses Peace Circle at 8:01:18 would have had to cover at least 960 metres in 100 seconds; at a brisk walk, the clocks would have to be about nine minutes apart]{claim=PIPE-C063}. Only camera 794's clock is checked, at one moment.
  - **The phone's sector faced away from him.** [At 7:59:36 the phone the affidavit attributes to Cole used a cell sector facing away from every place the man is filmed]{claim=PIPE-C075}; a sector can serve a phone close behind it, which only the provider's records could show.
  - [Cole's account before his admission fits the man no better than the bomber's sworn movements]{claim=PIPE-C079}. What could tell them apart came from the agents: [before he said yes, they had named the RNC and DNC, Folger Park, the hours and the parts he bought, and shown him shoes]{claim=PIPE-C080}. [Before any agent named a park, he said he always parks by "a road that splits in the middle and, like, two grass -- like, two grassy areas on each side."]{claim=PIPE-C081} [That fits D Street SE by Folger Park]{claim=PIPE-C082}, though the FBI had publicly named the area in 2021.

  ## Where the case stands

  United States v. Cole, No. 1:26-cr-00001-AHA, is before Judge Amir H. Ali of the U.S. District Court for the District of Columbia. [The current indictment, the third superseding one, has eight counts]{claim=PIPE-C060}, among them two of transporting explosives across state lines and two of trying to damage the party headquarters by explosive. [Cole pleaded not guilty to all eight on October 1, and the court has set his trial for February 16, 2027]{claim=PIPE-C057}. The judge has kept him in custody, and [ruled that the January 2025 pardons for the Capitol riot do not reach him]{claim=PIPE-C058}. Pending are the motion to suppress his confession, now answered; motions on the counts; [subpoenas for a native video file and other phone media from January 5, 2021]{claim=PIPE-C076}; and a motion to compel the FBI's copy of a former officer's phone, below. Other pretrial motions are due November 20, though the government has asked, unopposed, to delay [any motion to exclude the defense's evidence that someone else placed the devices]{claim=PIPE-C086} until the subpoenas are resolved.

  > **Updated November 17, 2026.** [Three of Cole's lawyers also represent Baker and his former colleague Joseph Hanneman in a defamation suit over their November 2025 report]{claim=PIPE-C087}, brought by the former Capitol Police officer it named. The judge found a conflict plausible, though the clients' interests are aligned for now, and appointed independent counsel to advise Cole, who may waive it. That counsel expected to finish by November 13; no waiver or hearing was in the public archive on November 17.

  ## The night of January 5

  The FBI's reconstruction of that evening, from surveillance video not made public, is not contested by the defense, though Baker disputes parts of it. [The FBI's video timeline has the person placing the first device by the DNC at about 7:54 p.m.]{claim=PIPE-C001} and [the second, behind the RNC, at about 8:16]{claim=PIPE-C002}, after appearing on camera from 7:34. [Each device was a capped metal pipe filled with homemade black powder, wired to a kitchen timer and a 9-volt battery]{claim=PIPE-C006}. [An FBI explosives examiner assessed both as viable]{claim=PIPE-C007}, though [whether they could have gone off is disputed]{claim=PIPE-C008}: by the prosecution's own account one powder sample was not explosive. [By that reconstruction they lay where they were left until they were found]{claim=PIPE-C004}, though no continuous footage of either is public, and [a Secret Service sweep at the DNC missed its device that morning]{claim=PIPE-C054}.

  The person on the video was [put by the FBI's 2021 height analysis at 5 feet 7 inches, give or take an inch]{claim=PIPE-C009}, [wore eyeglasses]{claim=PIPE-C011} and [wore Nike Air Max Speed Turf shoes]{claim=PIPE-C012}. Cole, the affidavit says, [is about 5 feet 6]{claim=PIPE-C010} and wears glasses: a fit, but one that would fit a great many men.

  ## The case as the prosecution states it

  Four lines of evidence make up the charge, all described in sworn statements or filings and none yet tested at trial.

  **Purchases.** [Bank and card records, as the FBI describes them, show Cole buying six of the kinds of part in the devices across 2019 and 2020]{claim=PIPE-C020}: the pipes, end caps, timers, wire, steel wool and battery connectors. [The only alligator clips the affidavit lists were bought on January 23, 2021]{claim=PIPE-C070}, weeks after the placements. Most of it is ordinary hardware — [some 26,000 pipes of that make were sold in 2020]{claim=PIPE-C022} — but [the battery connector was not: fewer than 8,000 were distributed in the whole country over three years]{claim=PIPE-C021}, and he bought five. [He went on buying the same kinds of parts until August 2022]{claim=PIPE-C023}, and [the searches of his home and car turned up pipes, end caps, wire and receipts]{claim=PIPE-C024}. [No fingerprint or DNA link to the devices appears in the public record]{claim=PIPE-C025}.

  **His car.** [A license plate reader recorded his Nissan coming off Interstate 395 at 7:10 p.m.]{claim=PIPE-C026}, twenty-four minutes before the bomber first appears on camera half a mile away; Baker's collaborator Armitas accepts that reading.

  **His phone.** This is the strongest line. [Between 7:39 and 8:24 p.m., the affidavit states, the phone attributed to Cole connected seven times to the cell sectors covering the places the cameras show the bomber at the same minutes]{claim=PIPE-C027}. Mapped by this site, each of the bomber's positions lies in the serving sector's arc, the weakest at 7:59:36, at the arc's very edge. The raw records and drive tests, which would show each session's distance, are not public. A sector is a wedge, not a pin; but five in the bomber's order are hard to explain unless the phone went with the bomber. [One sector's direction was corrected by the provider in April 2021]{claim=PIPE-C028}, years before Cole was a suspect, and the fit depends on the correction. A former senior FBI official told Congress that [the carriers had handed the FBI corrupted data]{claim=PIPE-C029}; the carriers deny it.

  **His own account.** [When questioned, Cole first said he had driven to Washington alone that evening to attend a protest about the 2020 election]{claim=PIPE-C037}. [After about two hours of denials, shown a still from the video and reminded that lying to agents is a crime, he paused for about fifteen seconds and said yes, it was him]{claim=PIPE-C038}, and [then spent about an hour and a quarter describing how he built, carried and placed the devices]{claim=PIPE-C039}, the prosecution says. [He said he acted out of frustration with both parties]{claim=PIPE-C049} and [denied aiming at Congress or the next day's vote]{claim=PIPE-C050}, though [prosecutors allege an intent to coerce Congress]{claim=PIPE-C051}. [His phone recorded 943 factory resets or wipes]{claim=PIPE-C046}, [one in December 2020, then none until July 2022]{claim=PIPE-C047}; [the defense puts the wiping down to obsessive-compulsive disorder]{claim=PIPE-C048}.

  ## The challenge to the confession

  [The defense's expert, a leading researcher of false confessions, quotes the agents minimizing the act, implying leniency and raising his family]{claim=PIPE-C041}; [Cole was diagnosed with autism and obsessive-compulsive disorder two weeks after his arrest]{claim=PIPE-C043}, and the government says it has seen only a four-sentence letter. Baker says [Cole denied involvement some 95 times before the agents raised his family]{claim=PIPE-C044}. Whether the tactics were coercive is for the court.

  These are real risk factors, common also in interrogations of the guilty. What decides the confession's worth is a different question: [does it contain details only the bomber could have known, which the agents had not supplied, and which check out?]{claim=PIPE-C040} The government's sulfur brand is the first candidate either side has named. [The recording is not public]{claim=PIPE-C045}, though its transcript is; the defense says that after the waiver the agents supplied where he parked, what he carried, where he sat and the timer setting. Baker counts 28 of 123 admissions as new; which 28, and whether they are true, is open.

  ## The October footage

  On October 18, 2026, Baker published [Capitol CCTV of a man walking alone on the northwest side of the Capitol that evening]{claim=PIPE-C030}, found with a researcher who goes by Armitas by following clues in Cole's first account. It comes, as he says, [from the Capitol Police video the House Administration Subcommittee on Oversight posted on Rumble]{claim=PIPE-C061}, and [begins at 7:57 p.m.]{claim=PIPE-C071} Critics' charge that [the times shown were added by his team rather than read from the files]{claim=PIPE-C072} is half right, as shown above. Baker's conclusion is that [Cole was elsewhere while the devices were being placed, and so was not the bomber]{claim=PIPE-C033}; by the government's account, Cole later said he had attended no protest that night. Rep. Thomas Massie and others have endorsed Baker's conclusion; the FBI has not responded publicly. His headline has the man filmed [at the same time the devices were being placed]{claim=PIPE-C032}; in fact it is between the placements.

  So the question is whether he is Cole. [He wears, Baker says, a maroon-and-gold cloth mask, a jacket with a tag hanging from it, and New Balance shoes]{claim=PIPE-C034}; Cole's family, Baker reports, recognised the mask and the jacket. The frames, at 704 by 528 pixels, show a violet-blue hooded jacket and light shoes, and cannot resolve a mask's colours, a brand or a tag; on one camera his head is about 10 by 13 pixels. [Whether the man is Cole rests on that recognition and on his face judged by eye]{claim=PIPE-C031}, by no method published or tested. The longer breakdown adds [clips captioned as a dark sedan on 3rd Street SW at 8:03 and on C Street at 8:04]{claim=PIPE-C077}, inside the sector the phone used at 7:59:36; their source is not stated.

  In November 2025 Baker and Hanneman [named a former Capitol Police officer as a forensic match for the bomber, in a report their publisher retracted]{claim=PIPE-C036}. That report, as the government quotes it, claimed a software gait match from an analyst it did not name; [the October identification does not use that method]{claim=PIPE-C085}. In her defamation suit, [the docket shows the clerk's entry of default, set aside in July, and no judgment through October 14]{claim=PIPE-C084}.

  {plate:IMG-J6PB-P01}

  ## Baker's other points

  [The bomber's shoes, Baker says, measured about size 9 to 9.5]{claim=PIPE-C014}, while [Cole wears 12 to 13]{claim=PIPE-C015}; no measurement has been published. [He says the FBI's podiatrist found a gait comparison inconclusive]{claim=PIPE-C016}; the government's filings describe one such comparison, of another person. [He says unreleased video shows the bomber wearing a smartwatch]{claim=PIPE-C017}, and [that Cole never owned a watch]{claim=PIPE-C018}. [He says no camera shows the RNC device being set down]{claim=PIPE-C003}. He reports [a negative flame test on the DNC device's powder]{claim=PIPE-C065}, [a missing end cap]{claim=PIPE-C066}, [a second disruption shot that destroyed fingerprint and DNA evidence]{claim=PIPE-C067}, [an RNC timer reading twenty minutes when found]{claim=PIPE-C068}, against the sixty Cole described, and [that the FBI told Congress the DNC's January 6 footage was lost]{claim=PIPE-C069}. He argued that [the devices were set down shortly before they were found]{claim=PIPE-C005}; the FBI's sworn timeline and his own October account say otherwise.

  And he says he is certain [the bomber was a police insider]{claim=PIPE-C052}; the evidence he says he has is unreleased, and its one named suspect is the officer above. That account is now Cole's defense too: [his lawyers argue in court that she, not he, placed the devices]{claim=PIPE-C086}. [The government says the FBI investigated and found nothing connecting her to the devices]{claim=PIPE-C088}, citing a home video it says records her voice at 7:37 p.m., minutes after the bomber first appears on camera. [The defense disputes that account]{claim=PIPE-C090}: it calls the exoneration advocacy, asks whether the video's timestamp is the file's own, and points to an apparent mismatch in her work records, but does not publish or attach a contrary record. Its newest motion says [the inquiry gathered no cell-site data for her phones, no Apple account records, no home-camera footage and no copy of the phone she carried in 2021]{claim=PIPE-C098}, and that the FBI's first review of the phone it did copy missed eleven geotagged photographs. Both sides state that [the FBI's polygraph examiner reported "Deception Indicated"]{claim=PIPE-C089}. She denied placing the devices; the government says the result, after a day of questioning and searches, deserves no weight and is inadmissible as substantive evidence. It complicates the government's description of no evidence; it is not evidence of involvement. None of these records is public.

  Questions about the investigation itself are fair. [The FBI chased many leads in 2021]{claim=PIPE-C053}, among them five people whose phone data may have matched the bomber's movements; and [Cole became the focus only weeks before his arrest, without any new tip or witness]{claim=PIPE-C056}, by officials' account.

  ## What the record shows, and what would settle it

  On the public record as it stands, [the charged account — that Cole is the person on the video]{claim=PIPE-C059} — is provisionally supported. The lines against Cole converge, but all of them, the interview's transcript aside, are the prosecution's description of records the public has not seen and no court has tested; the government's new assertions are of the same kind. That is this site's own assessment of the evidence, not a finding of guilt, which only a jury can make. For the footage, the question is whether the man is Cole: if he is, the clocks must be minutes off; if the phone was with Cole, he is someone else. Four things would settle it: a comparison of the man's frames with known images of Cole by an examiner not told which is which; the cameras' clock offsets, measured through something two cameras saw; the phone's raw records, with distance data; and the interview, each detail of the confession traced to whoever said it first, beginning with the sulfur.
