  - "Misidentification: the man the congressional footage shows on the north side of the Capitol, who on its recorded clocks cannot be the bomber, is Cole, as his family and Steve Baker say, and his confession was coerced."
  - "An insider: a law-enforcement insider placed the devices and the investigation protected them (Baker and others, and now Cole's defense, against the officer a retracted report named); the government says the FBI's inquiry cleared her, from records not public, which the defense disputes."
