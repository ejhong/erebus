# PIPE-001 claims. Living-persons rule (AGENTS.md; config/site-rules.md):
# every claim is a proposition about the evidence, graded as such — never a
# finding of anyone's guilt, which only a court can make. Brian J. Cole Jr. is
# presumed innocent; what prosecutors say is recorded as theirs, what the
# defense says as the defense's, and what Steve Baker says as his. No
# uncharged person is named. Every one of Baker's points is a claim of its own,
# with its first public appearance under `genealogy`.

