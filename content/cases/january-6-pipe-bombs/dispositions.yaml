- key: "text:what the fbi's image of the former officer's phone shows for january 4 to 6, 2021 and november 2025"
  kind: claim
  disposition: excluded
  observed: "The defense motion of November 2 (ECF No. 128, pp. 4 and 6) describes what the FBI's image of the former officer's phone does and does not contain for January 4 to 6, 2021, and the phone's home-camera application sessions in November 2025, and asks whether either reflects a phone set aside or footage retrieved."
  reason: >-
    The defense itself frames these as questions for an examiner, not
    findings. Published here they would invite inferences about an uncharged
    private person that no record yet supports (AGENTS.md, living persons;
    site rules, "Where to stop"). What the motion says of the FBI's inquiry
    is recorded (PIPE-E242, PIPE-E243); what it says of her phone's contents
    is left out.
  reopenIf: "A court ruling, or an examiner's report filed in the case, makes a finding about what the image shows."
  by: "2026-11-17-session-site-165252"
  date: "2026-11-17"
