# Candidates considered and not admitted, each with its reason, so that no
# later session re-litigates them without saying what changed.

- key: "url:storage.courtlistener.com/recap/gov.uscourts.dcd.288125/gov.uscourts.dcd.288125.119.0.pdf"
  kind: source
  disposition: excluded
  observed: "Unopposed motion for protective order governing polygraph information, with proposed order (United States v. Cole, ECF No. 119, filed 10/26/26)"
  reason: >-
    Read 2026-11-01. It governs polygraph examination materials in an FBI
    case file, made available to the defense for in-person review only and
    barred from public filings, but it does not say whose examination they
    are. Tying it to the former officer's polygraph (PIPE-C089) would be this
    site's inference about a private person; it is set aside until a filing
    says what it covers.
  reopenIf: "A filing or order states whose polygraph materials the protective order governs."
  by: "2026-11-01-session-site-141624"
  date: "2026-11-01"

