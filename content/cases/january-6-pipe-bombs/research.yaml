# PIPE-001 decisive tests. Each is specified so that either outcome is
# informative, and none asks a reader to trust any party's characterization:
# most turn on records that exist and are held by the court, the parties or the
# Capitol Police.

- id: PIPE-R001
  title: "Authenticate the October 2026 footage and its clock"
  summary: >-
    Baker says the footage is raw Capitol Police CCTV, uncut and unaltered, from the House Administration Subcommittee on Oversight's public release on Rumble (rumble.com/c/CHASubcommitteeOnOversightRepublicanMajority): cameras 602 and 940, 20:03:32 to 20:04:02 on January 5, 2021, the video beginning, Armitas says, at 7:57 p.m. Critics say the times shown were added by Baker's team. Find those two files in the committee's release (or obtain them from the Capitol Police with their metadata); confirm the camera positions and that the man's track is continuous between them; establish each camera's clock offset that night; and check those clocks against the clocks of the cameras that recorded the bomber at 7:59:38 p.m. on New Jersey Avenue SE, using anything both systems saw (a vehicle, a patrol, a train). Then publish the man's path and times minute by minute.
  claimIds: [PIPE-C030, PIPE-C032, PIPE-C033, PIPE-C035, PIPE-C061, PIPE-C062, PIPE-C063, PIPE-C071, PIPE-C072]
  track: either
  effortTier: desk
  informationGain: >-
    Decisive in both directions. If the clocks agree to within a minute or two, a man on Constitution Avenue at 20:03:32 cannot be the person on New Jersey Avenue SE at 7:59:38, and either the identification of the man as Cole or the charged account fails. If the clocks are several minutes apart, the conflict dissolves, and the footage may instead corroborate Cole's first account of where he went that evening.
  status: answered
  statusNote: "PIPE-S002: all eight files found in the subcommittee's release; every clip matches its original at its labelled moment; the times are captions read from the files' own times; and the release's clock agrees with the affidavit's timeline to within a few minutes at camera 794. The man is not the bomber (PIPE-C063); who he is passes to PIPE-R009."
  statusBy: 2026-10-19-session-january-6-pipe-bombs-founder
  statusDate: 2026-10-19

- id: PIPE-R002
  title: "Does the phone data reach the places in the October footage?"
  summary: >-
    Using the towers and sector directions sworn in the complaint affidavit, map the nominal coverage of the five sectors that served Cole's phone between 7:39 and 8:24 p.m., and test whether the Capitol locations in the October footage fall inside the sector the phone used at the same minute. Then seek the FBI's drive-test maps for those sectors (named in the affidavit) and the raw call-detail records. Pre-registered as study PIPE-S001.
  claimIds: [PIPE-C027, PIPE-C028, PIPE-C033, PIPE-C059]
  track: either
  effortTier: desk
  informationGain: >-
    If the footage's locations fall outside the sectors the phone used at those minutes, the footage and the phone cannot both describe one man carrying that phone; if inside, the phone data cannot by themselves exclude the footage, and the case rests more on the video timeline and the confession.
  status: answered
  statusNote: "PIPE-S001: every place the footage puts the man lies behind the sector the phone used at 7:59:36, while the bomber's sworn positions fit the serving sectors, at the edge at 7:59:36. The provider's raw records and the FBI's drive tests pass to PIPE-R011."
  statusBy: 2026-10-19-session-january-6-pipe-bombs-founder
  statusDate: 2026-10-19

- id: PIPE-R003
  title: "Which details of the confession came from Cole first, and are they true?"
  summary: >-
    When the recorded interview is played (at the suppression hearing or at trial), list every detail of Cole's account; mark those the agents introduced or that were public before the interview; and check the rest against independent records — the purchases he described, the parking place on D Street SE against cameras there, the restaurant stop in Virginia, the disposal of materials at a dump.
  claimIds: [PIPE-C039, PIPE-C040, PIPE-C041, PIPE-C044]
  track: either
  effortTier: desk
  informationGain: >-
    The standard test of a disputed confession: details first supplied by the suspect and then confirmed are strong evidence he was there; a confession made only of what he was told or could have read is close to no evidence at all.

- id: PIPE-R004
  title: "Measure the bomber's shoes, and record Cole's"
  summary: >-
    Publish a shoe-length estimate from the surveillance frames with its method and error (camera calibration against known objects such as paving bricks), and compare it with the sizes of the shoes seized in the December 2025 searches, which the inventory records.
  claimIds: [PIPE-C014, PIPE-C015, PIPE-C059]
  track: either
  effortTier: desk
  informationGain: >-
    A three-size gap, if it survives a published error analysis, is hard to reconcile with Cole; if the error spans the gap, the point is moot.

- id: PIPE-R005
  title: "Release the laboratory findings on the devices"
  summary: >-
    Obtain the FBI Laboratory's report on the two devices and the defense's evidence that they could not have detonated, including the powder samples' test results and the state of the timers and circuits when the devices were rendered safe.
  claimIds: [PIPE-C007, PIPE-C008]
  track: either
  effortTier: desk
  informationGain: >-
    Settles whether the devices were capable of exploding, which bears on the charges and on the seriousness of the security failures, though not on who placed them.

- id: PIPE-R006
  title: "Show the RNC alley footage from 8:14 to 8:18 p.m."
  summary: >-
    Release, or describe in a sworn filing, what the cameras near the RNC recorded between 8:14 and 8:18 p.m. on January 5, 2021: whether any camera shows the device being set down, and if not, which views cover the spot.
  claimIds: [PIPE-C002, PIPE-C003]
  track: either
  effortTier: desk
  informationGain: >-
    Confirms or removes one of Baker's points; on its own it would not move who placed the devices, since the same person is filmed around the RNC at the time.

- id: PIPE-R007
  title: "Date the phone wipes against the investigation"
  summary: >-
    Set the 943 wipe events against the investigation's public milestones (reward increases, published videos, the 2025 House report, press about suspects) and against the clinical evidence for obsessive-compulsive wiping, which the defense has not produced.
  claimIds: [PIPE-C046, PIPE-C047, PIPE-C048]
  track: either
  effortTier: desk
  informationGain: >-
    Wipes clustered after investigative news would read as concealment; a steady pattern with clinical support would read as compulsion; either way the wipes are weak evidence on who placed the devices.

- id: PIPE-R008
  title: "The wrist in the January 5 footage"
  summary: >-
    Identify the frames in which the bomber's wrist is visible, publish them with their source, and compare them with Cole's purchase records for watches or wearables.
  claimIds: [PIPE-C017, PIPE-C018]
  track: either
  effortTier: desk
  informationGain: >-
    A clearly visible smartwatch on the bomber, set against no record of Cole ever owning one, would be a real discrepancy; an ambiguous glint would be nothing.

- id: PIPE-R009
  title: Who is the man at Peace Circle?
  summary: Compare the clearest frames of the man on cameras 3187, 600 and 602, and any other camera that filmed him, with known images of Cole, by an examiner who is not told which is which, and publish the method and its error rate. Set what he wears on screen — a violet-blue hooded jacket, light shoes that flash under the lights — against the items seized in December 2025 and the family's photographs, published with their provenance. And follow him on the cameras around him, before 7:57 and after 8:06 p.m., to where he came from and where he went.
  claimIds:
    - PIPE-C031
    - PIPE-C033
    - PIPE-C034
    - PIPE-C059
  track: either
  effortTier: desk
  informationGain: Decisive either way. He is not the bomber, so if he is Cole the charged account fails; if he is someone else, the footage drops out of the case. His track may also show whether he came by car, and when he arrived and left.

- id: PIPE-R010
  title: Trace the sedan clips
  summary: "Find the source of the clips in Baker's breakdown captioned 3rd street SW (8:03:35 to 8:03:49 p.m.) and C street (8:04:19 p.m.): which cameras, whose clocks, and what the plate reads. Set them against the plate reader's 7:10 p.m. record of Cole's car and against Sector C, which covers 3rd and C Streets SW."
  claimIds:
    - PIPE-C077
    - PIPE-C026
    - PIPE-C075
  track: either
  effortTier: desk
  informationGain: If the sedan is Cole's and the clock is right, his car was being driven in Southwest at 8:03, which bears on where his phone was at 7:59:36 and on both accounts; if it is not, the clips drop out.

- id: PIPE-R011
  title: The phone's raw records, and the corrupted data
  summary: Obtain the provider's raw records for the phone attributed to Cole on January 5, 2021 — every session, with timing-advance or distance data where kept — and the FBI's drive-test maps for Sectors A to E; and the congressional transcript in which a former senior FBI official described corrupted cell data, to establish which carrier's data, for which hours, how it was recovered, and whether the records in the affidavit are the ones recovered.
  claimIds:
    - PIPE-C027
    - PIPE-C028
    - PIPE-C029
    - PIPE-C075
  track: either
  effortTier: desk
  informationGain: Distance data would place the phone within a few hundred metres at each session — on the bomber's route, by the sedan in Southwest, or by the man on the north side. The transcript would show whether the data used against Cole has a gap in its custody.

- id: PIPE-R012
  title: The January 5 phone media the defense has subpoenaed
  summary: "Follow the court's ruling on Cole's renewed motion for early return of pretrial subpoenas (ECF 88, 91, 96 and 100): whether the native video file and other media from January 5, 2021, and the communications that day, are produced, and what either side says they show."
  claimIds:
    - PIPE-C076
    - PIPE-C052
  track: either
  effortTier: desk
  informationGain: The government calls the material irrelevant and not exculpatory; the defense says it can be had nowhere else. Production would test both positions; it bears on the insider account only if what it shows does.
