  synthesis: "Provisionally supported: the lines against Cole converge, but each, the interview's transcript aside, is the prosecution's description of records not yet public or tested, and the one public challenge turns on a question no one has settled — who the man at Peace Circle is. Purchases including an uncommon battery connector, though not the alligator clips; a plate reader at 7:10 p.m., which both sides now state; phone sessions on five sectors that fit the bomber's route; parts and receipts at his home; and a confession the defense calls coerced. Under this site's rules none of it rises above provisional while the records stay unexamined. What is new is the footage. Checked against the files the House subcommittee posted, every clip in Baker's video matches a posted file, and its added times are the files' own, but for camera 602's, about 30 seconds early. On those clocks the man who crosses at Peace Circle at 8:01:18 could have been where the affidavit puts the bomber 100 seconds earlier, at least 960 metres away, only by moving faster than any runner has over a kilometre; at a walk, the clocks would have to be about nine minutes apart. Only camera 794's clock has been checked, at one moment: it films a figure the breakdown labels the bomber 212 metres up New Jersey Avenue at 7:57:10, an ordinary walk from the sworn position at 7:59:38. If he is Cole, the charged account needs the clocks to be minutes apart. Two things weigh against that. His identification rests on his family's recognition, relayed by Baker, of clothes the frames cannot resolve, and on his face judged by eye. And at 7:59:36 the phone the affidavit attributes to Cole used a sector facing away from every place he is filmed: either the man is not Cole, or Cole's phone was not with him, or the sector served it from behind, or the sworn records are wrong. Cole's own first account, now public in transcript, does not settle it either: it fits the man no better than the bomber's sworn walk, and the details that would tell them apart came from the agents. A blind identification and the phone's raw distance data would settle it."
  steelman: "Every line against Cole but the confession is the prosecution's description of records no outsider has examined, and the public footage cuts the other way. The subcommittee's posted files show a man crossing at Peace Circle at 8:01:18, at least 960 metres from where the affidavit puts the bomber 100 seconds earlier, in a release whose camera 794 matches the FBI's timeline; his family recognises his mask, jacket and shoes, and Cole's first account, before any pressure, was that he came to a protest. The phone does not rescue the charge: a sector is a wedge, not a pin; at 7:59:36 the bomber's corner sits at the very edge of its sector and beyond the next site, and if the breakdown's captions are right a dark sedan was in Southwest, inside that sector, four minutes later — the phone may have been in a car. Purchases over two years can be a hobby, and the alligator clips came after. A former senior FBI official told Congress the cell data was corrupted. The confession followed two hours of denial and talk of his family, from a man later diagnosed with autism, and before he said yes the agents had named the RNC and DNC, the hours and the shoes; and the devices never went off."
