  synthesis: "On the public record as it stands, the charged account is well supported: several independent lines described under oath converge on Cole, though none has yet been tested at trial. The purchase records match six of the devices' kinds of part, including a battery connector fewer than 8,000 people could have bought, though not the alligator clips, which appear only after the placements; a plate reader puts his car at the South Capitol Street exit at 7:10 p.m.; and the phone attributed to him used the cell sectors covering the bomber's route at the minutes the cameras show the bomber there, five times over. The confession adds detail but is the weakest line until the recording is examined: it came after two hours of denial, under techniques the defense's expert calls coercive, from a man diagnosed afterwards with autism, and the record does not yet show which details came first from Cole and proved true. Against all this stands one specific, checkable challenge: Capitol CCTV, said to come from the House's public release, of a man Baker identifies as Cole on Constitution Avenue at 20:03:32, four minutes after the affidavit has the bomber at New Jersey Avenue and E Street SE, about a kilometre away. If both systems' clocks agree and the man is Cole, the charged account fails at that point; if the clocks differ by several minutes, the conflict dissolves. The identification rests on family recognition of clothing and on gait judged by eye, the method that earlier named a different person in a report later retracted; and the phone would still need explaining, since at 7:59:36 it used a sector facing south from Independence Avenue. Baker's other points — shoe size, a smartwatch, a timer found at twenty minutes, a missing end cap — are unpublished or secondhand; only the negative flame test finds support in the record. The insider account has no public evidence left. The clock comparison and the confession's audit would move this judgment, and the court will see both before trial."
  steelman: "Every line against Cole is the prosecution's description of records no outsider has examined, and each is weaker than it sounds. A cell sector covers a wedge kilometres long, not a corner; in 2021 five other people's phone data also may have matched the bomber's movements. Hardware bought over two years can be a hobby as easily as a plan; the uncommon connector narrows the field without closing it, and the alligator clips appear in his records only weeks after the placements. The plate reader shows his car arriving, which his first account explains: he came to a protest. That account came before any pressure, and now a Capitol camera shows a man in a homemade mask, a tagged new jacket and heel-crushed shoes, which his family recognised, walking on the north side four minutes after the bomber was filmed by the DNC. The confession followed two hours of denial, a still image, a reminder that lying is a crime and talk of sparing his family, from a man whose autism makes him likelier to say what pressure demands; and devices whose powder failed a flame test never went off. If the October clocks hold, the case rests on a confession of the kind that has convicted innocent people before."
