caseAssessment:
  verdict: well_supported
  whatIsClaimed: Prosecutors say Brian Cole Jr. built two pipe bombs and placed them by the party headquarters on January 5, 2021, and confessed when arrested in 2025; he denies it and is presumed innocent. His lawyers call the confession coerced. The reporter Steve Baker says Capitol CCTV shows Cole on the north side of the Capitol at 8:03 p.m., and that the bomber was an insider.
  whereDisagreementLives: "Not over what Cole bought, where his car was or what he first told agents, but over whether he was the man on the bomber's route. The affidavit puts his phone on that route minute by minute; Baker's footage puts a man he identifies as Cole a kilometre north at 8:03 p.m., four minutes after the bomber is filmed by the DNC. Both cannot be true if the clocks agree. The second dispute is the confession: detailed, but given under pressure by a man later diagnosed with autism."
  whatWouldSettleIt: Three records that exist would settle it. First, the October footage's native files and the Capitol Police cameras' clock offsets, set against the cameras that filmed the bomber. Second, a map of the five phone sectors against the places in that footage. Third, the recorded interview, played in court, each detail traced to who said it first.
  bestConventionalExplanation: "The charged account: Cole bought the components over 2019 and 2020, built the devices at home, drove into the city on the evening of January 5, 2021, and placed one by the DNC and one behind the RNC, carrying his phone; the cameras, the plate reader and the phone record the same evening from three sides. He kept buying components afterwards, wiped his phone often from 2022, and when arrested first gave the account that he had gone to a protest, then admitted the placements. On this account the October footage shows someone else, or shows Cole at another time than its clock says."
  components:
    - label: "The charged account: Cole placed both devices"
      state: well_supported
      note: On the record as sworn and proffered, purchases, a plate reader and phone data converge on him; none of it has been tested at trial.
    - label: The October 2026 footage clears Cole
      state: unresolved
      note: Specific and checkable (cameras 602 and 940, 20:03:32); the footage's source, its clocks and the man's identity are unverified.
    - label: The confession is reliable evidence
      state: mixed
      note: Detailed and partly matched by records, but obtained under techniques an expert calls coercive; the recording is not public.
    - label: A law-enforcement insider placed the devices
      state: contradicted
      note: No public evidence; its one identification was retracted, and the evidence that exists points elsewhere.
    - label: The devices could have exploded
      state: mixed
      note: The FBI's examiner says viable; one powder sample was not explosive, and neither device went off.
    - label: The security response and the investigation failed
      state: well_supported
      note: A missed sweep, broken perimeters and four years without a suspect are documented by Congress and the FBI's own account.
