  synthesis: "The record splits into three layers. The first is settled: the
    devices and their evening timeline (sworn and uncontradicted), the component
    purchases, the plate-reader record — which the challenging side's own
    researcher now concedes — the phone sessions, whose existence the
    challenging side also concedes, the interrogation techniques, which the
    government's own brief admits using, the authentication of the October 2026
    footage against the congressional originals, and the retraction of the
    November 2025 identification. The second layer is the charged account's
    convergence: a car recorded entering the city 24 minutes before the bomber
    appears on camera, a phone whose sessions track the bomber's route across
    five sectors, purchases matching every device component including a
    connector of which fewer than 8,000 were distributed nationwide, matching
    components found at the home and car, a detailed confession cited to the
    public transcript, one confession detail (the sulfur brand) matched to an
    independent 2018 card purchase, and a jail call repeating the admission. The
    third layer is the challenge, and it is real but unestablished at its
    center: the footage is authentic and its on-screen times are the files' own,
    and on those clocks the man at Peace Circle at 8:01:18 cannot be the person
    the affidavit places about a kilometre away 100 seconds earlier — but
    whether that man is Cole rests on interested-family recognition of a mask,
    jacket and shoes that the frames, at 704x528 and a roughly 10-by-13-pixel
    head, cannot confirm; and if he is Cole, the sector the phone used at
    7:59:36 faces away from every place he is filmed, a conflict the alibi's
    proponents leave to the prosecution. Steelman for the challenge: the
    impossibility finding and the sector geometry are exactly the kind of
    checkable, dispositive anomaly that, if the man were ever identified as Cole
    by a blind examiner or by the seized clothing, would force the government to
    choose between its phone evidence and its charge — and no public record
    currently reconciles them. Steelman for the charge: the convergence was
    built from records assembled before Cole was a suspect (the 2021 height
    analysis, the provider's April 2021 sector correction, the drive tests),
    which is hard to square with framing an innocent man five years later. The
    verdict is well_supported rather than established because the two most
    decisive bodies of evidence — the phone's raw records with drive-test maps,
    and the confession's decisive pages — have not yet been independently read,
    and the man's identity is the open question PIPE-R009 would settle.
    Sensitivity: the single record whose removal would most change this verdict
    is PIPE-E051, the affidavit's pairing of the phone's 7:59:36 session with
    the bomber's position on video two seconds later; it is also the pivot of
    the sector-geometry finding (PIPE-C075). Without it the minute-by-minute
    convergence — the strongest single line — goes, and the verdict downgrades
    to provisionally_supported; it survives, because the purchases, the conceded
    plate-reader record, the search finds, the confession and the jail call
    remain, and the sessions' bare existence also survives through the
    challenging side's own concession."
  steelman: The Lilly Miller sulfur dust. Cole named a brand of sulfur as an
    ingredient in his confession; his card records show a purchase of that exact
    brand on January 14, 2018 — three years before the placements and years
    before any investigation of him. The government's own account of the
    transcript lists the components the agents named before his admission —
    timers, connectors, pipe, end caps, alligator clips, wire — and sulfur is
    not among them. If the brand came first from Cole, it is a confession detail
    that predates the investigation, was not supplied by the agents, and is
    independently checkable in records the defense can subpoena — precisely the
    kind of detail a contamination-based false-confession account cannot
    explain, and the public record does not yet say who spoke the brand first
    (Tr. 104-105, unread).
