      which is faster than the world record for a kilometer. At a standard
      walking pace of roughly 5 km/h, the journey requires roughly 11 minutes,
      meaning the two recorded events can describe the same individual only if
      the camera clocks diverge by nine minutes or more. The strongest opposing
      consideration is that the Capitol CCTV system clock and the FBI's timeline
      clocks may have experienced uncalibrated drift, but the kinematic
      impossibility on the recorded clocks is mathematically established.
