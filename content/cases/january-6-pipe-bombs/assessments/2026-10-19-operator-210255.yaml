caseAssessment:
  verdict: provisionally_supported
  whatIsClaimed: Prosecutors say Brian Cole Jr. built two pipe bombs and placed them by the party headquarters on January 5, 2021, and confessed in 2025; he denies it and is presumed innocent. Steve Baker says congressional CCTV shows Cole on the north side of the Capitol while the bomber was on the southeast side, and that the bomber was an insider.
  whereDisagreementLives: "Over who the man on the north side of the Capitol is. The congressional originals show he is not the bomber: he crosses at Peace Circle at 8:01:18, about a kilometre and 100 seconds from where the affidavit puts the bomber. If he is Cole, the charged account fails. But the phone attributed to Cole used, at 7:59:36, a sector facing away from every place he is filmed. The second dispute is the confession."
  whatWouldSettleIt: Three records would. A comparison of the man's clearest frames with known images of Cole by an examiner not told which is which, with his track on the cameras around him. The phone's raw records with distance data, and the FBI's drive tests. And the recorded interview, each detail traced to whoever said it first.
  bestConventionalExplanation: "The charged account: Cole bought the components over 2019 and 2020, built the devices at home, drove into the city on the evening of January 5, 2021, and placed one by the DNC and one behind the RNC, carrying his phone, which kept pace with him on the sectors along his route. When arrested he first said he had gone to a protest, then admitted the placements. On this account the man in the October footage is someone else: he is not the bomber, and at 7:59:36 the phone was on a sector that reaches the bomber's route, at its edge, and faces away from every place the man is filmed."
