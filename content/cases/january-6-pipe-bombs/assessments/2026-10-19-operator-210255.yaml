  synthesis: "Provisionally supported: the lines against Cole converge, but each is the prosecution's description of records not yet public or tested, and the one public challenge turns on a question no one has settled — who the man at Peace Circle is. Purchases including an uncommon battery connector, though not the alligator clips; a plate reader at 7:10 p.m., which both sides now state; phone sessions on five sectors that fit the bomber's route; parts and receipts at his home; and a confession the defense calls coerced. Under this site's rules none of it rises above provisional while the records stay unexamined. What is new is the footage. Checked against the House subcommittee's originals, Baker's video is authentic: every clip is a congressional file, and its added times are the files' own. The same release films the bomber on the sworn route at 7:57, so its clock agrees with the FBI's, and the man who crosses at Peace Circle at 8:01:18 cannot be the person the affidavit puts at New Jersey Avenue and E Street SE 100 seconds earlier. If he is Cole, the charged account fails. Two things weigh against that. His identification rests on his family's recognition, relayed by Baker, of clothes the frames cannot resolve, and on his face judged by eye. And at 7:59:36 the phone the affidavit attributes to Cole used a sector facing away from every place he is filmed: either the man is not Cole, or Cole's phone was not with him, or the sworn records are wrong. A blind identification and the phone's raw distance data would settle it."
  steelman: "Every line against Cole is the prosecution's description of records no outsider has examined, and the one record the public can check cuts the other way. The congressional originals show a man crossing at Peace Circle at 8:01:18, a kilometre from where the affidavit puts the bomber 100 seconds earlier, on a clock that agrees with the FBI's; his family recognises his mask, jacket and shoes, and Cole's first account, before any pressure, was that he came to a protest. The phone does not rescue the charge: a sector is a wedge, not a pin; at 7:59:36 the bomber's corner sits at the very edge of its sector and beyond the next site, and if the breakdown's captions are right a dark sedan was in Southwest, inside that sector, four minutes later — the phone may have been in a car. Purchases over two years can be a hobby, and the alligator clips came after. A former senior FBI official told Congress the cell data was corrupted. The confession followed two hours of denial and talk of his family, from a man later diagnosed with autism; and the devices never went off."
