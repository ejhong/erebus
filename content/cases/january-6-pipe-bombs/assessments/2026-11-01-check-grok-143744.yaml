  synthesis: >-
    The public record supplies several independent, mutually reinforcing lines
    that provisionally support the charged account (PIPE-C059) that Brian Cole
    Jr. is the person surveillance shows placing the devices on the evening of
    January 5, 2021. Bank and card records described in the sworn affidavit show
    purchases, before that night, of the component types used in the devices,
    including an uncommon nine-volt battery connector of which fewer than 8,000
    were distributed nationally in the relevant window (PIPE-C020). A
    license-plate reader recorded Cole's Nissan taking the South Capitol Street
    exit at about 7:10 p.m., which the challenging side now also states
    (PIPE-C026). Between 7:39 and 8:24 p.m. the phone attributed to Cole
    exchanged data with successive cell sectors that the affidavit pairs, minute
    by minute, with the bomber's path on video; a geometry study finds the
    bomber's sworn positions fit those sectors, while every place the October
    2026 north-side footage puts its man lies behind the sector used at 7:59:36
    (PIPE-C027, PIPE-C075). Those three lines do not depend on the confession.

    The October 2026 Capitol CCTV is real subcommittee-released product: all
    eight named cameras match posted files, and on-screen times were taken from
    file start times plus elapsed time, with one caption about thirty seconds
    early (PIPE-C073, PIPE-C074). On those clocks, a man at Peace Circle at
    about 8:01:18 cannot also be the person the affidavit places at New Jersey
    Avenue and E Street SE at 7:59:38 without covering roughly a kilometre in
    about 100 seconds (PIPE-C063). That geometric conflict is real. It becomes
    an alibi for Cole only if the man is Cole. The identification (PIPE-C031)
    rests on family recognition of a maroon-and-gold mask and a jacket, and on
    eye comparison of night frames in which a head is about 10 by 13 pixels;
    resolution studies cannot make out mask colour, shoe brand, or tag, and the
    method is not the quantified gait match used in the retracted November 2025
    report (PIPE-C085 is contradicted). Cole's pre-admission account fits the
    footage man no better than the bomber's sworn route (PIPE-C079). Without a
    reliable identification, the footage does not displace the phone-route
    match.

    The confession is a weaker pillar. After roughly two hours of denials, Cole
    said yes and then described building and placing the devices (PIPE-C039).
    The transcript shows agents had already named the RNC and DNC, Folger Park,
    the 7:34–8:18 window, and the shoes before that yes (PIPE-C080).
    Minimization, implied leniency, and remarks about family appear in the
    quoted record (PIPE-C041). Whether remaining details are uncontaminated and
    true is still an open desk test. The insider alternative (PIPE-C052) has no
    affirmative public proof; a prior named identification was retracted; the
    defense is pursuing it in court (PIPE-C086), which is procedural fact, not
    evidence of placement.

    Steelmanning the charge: multi-sector CSLI ordered with the bomber's path,
    plus the uncommon connector and full component set, plus the plate reader,
    is the kind of convergent circumstantial case that can stand without a
    confession. Steelmanning the challenge: if the man at Peace Circle is later
    shown to be Cole by a blind, error-rated comparison, then either the phone
    was not with him at 7:59:36 or the sworn sector directions or times are
    wrong—and the charged route collapses. On the evidence in hand, that
    identification is not made. The charged account is therefore provisionally
    supported by the purchase, plate-reader, and cell-sector lines, with the
    confession contested and the October alibi not secured. Guilt remains for a
    court; this grades the public record only.
  steelman: Post-waiver confession details the public transcript study has not yet
    itemized—brand-named powder ingredients Cole said he bought at Lowes,
    advance Google Maps scouting of the two headquarters, disinfectant wiping of
    the devices, and sixty-minute timer settings—remain unchecked against bank
    records, browser or maps data, and the laboratory examination of the timers
    and powder; if those details prove both unprompted and accurate, they would
    be knowledge hard to attribute to agent contamination or to a frame.
