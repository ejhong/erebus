  prompt: "Editorial cover artwork, unmistakably a gouache painting — visible
    brushstrokes, matte pigment, soft paper-textured edges, nothing
    photographic. Upper two-thirds: a quiet residential street on Capitol
    Hill in Washington, D.C., at dusk on a still winter evening — a row of
    brick rowhouses with iron railings and bare street trees, streetlamps
    pooling amber light on the empty sidewalk, the Capitol dome small and
    pale in the far distance above the rooftops, no people, no vehicles and
    no legible signage, rendered in loose confident brushwork with buildings
    and land as simplified planes of pigment. Lower third: the painting
    dissolves downward into a ghosted hand-drawn surveyor's plat of the city
    blocks south-east of the Capitol grounds, with numbered squares and lot
    lines. — thin ink linework, faint as a watermark, as if the painted
    scene rests on an archival record of itself. The transition is gradual
    and atmospheric, paint strokes breaking apart into ink lines. Palette:
    deep indigo winter dusk, sodium-amber streetlamp glow pooling on brick
    sidewalks, cold slate-grey rowhouse brick, the dome a pale ivory in the
    distance; the ghosted plat in faded indigo ink on cool grey paper.
    Quiet, elegiac, dignified; completely empty of people; no violence, no
    memorials, no flags. Absolutely no text, no numbers, no labels, no
    logos, no border frame lines. Painterly throughout — obviously a
    painting, never photorealistic, never mistakable for a photograph."

