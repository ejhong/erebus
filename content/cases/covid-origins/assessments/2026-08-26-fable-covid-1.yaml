  synthesis: >-
    The case resolves into an asymmetry that neither camp describes
    accurately. Zoonotic spillover at or near the Huanan market is the only
    hypothesis with multiple affirmative lines of public evidence, and they
    converge on the same few hundred square metres: early-case geography
    including the unlinked-cases-closer result, environmental positivity
    concentrated where live mammals were sold, susceptible-wildlife DNA
    co-occurring with viral RNA at a wildlife stall, and an early-diversity
    pattern better explained by more than one introduction. That is a real
    affirmative case and it is not matched on the other side.

    But every one of those pillars carries a qualification that public
    argument strips off. The geography rests on unaudited case
    ascertainment and a single unreproduced spatial result at a modest
    margin. The co-location evidence establishes co-presence, not
    infection, by its own authors' explicit statement. The
    multiple-introductions inference had its support cut roughly
    fourteenfold by a code correction, from strong to substantial. And the
    market, environmental, and lineage analyses are one Chinese CDC dataset
    in three analytic layers with overlapping authors — not three
    independent confirmations.

    Against that, the research-related family has capability, opportunity,
    documented intent-on-paper — a 2018 proposal, with a Wuhan partner, to
    insert human-specific cleavage sites into SARS-related spikes — and
    opacity, and no disclosed progenitor, no documented incident, and no
    infected worker. The proposal was rejected and no public record shows
    the work was done, which is exactly the gap between document and deed
    that its advocates elide and its critics treat as closing the question. It is sustained by the
    inadequacy of what has been produced rather than by anything
    affirmative. Its strongest structural point is not evidential but
    epistemic: the body best placed to evaluate it says it could not,
    because the records were not provided.

    Hence the verdict. Not "mixed," which would imply the two families are
    comparably supported — they are not, on public evidence. Unresolved,
    because the question the case asks has an answer that the available
    record cannot determine, and because the two symmetrical absences at
    its center — no infected animal, no known laboratory holding — are both
    hostage to material that has never been produced. Six years of argument
    has not closed either gap, and two of the tests that could move the
    question need nobody's permission and remain undone.

    Kept deliberately off this verdict: the institutional-integrity record.
    Grant-oversight failures and records-handling misconduct are real and
    primary-sourced, and they carry no diagnosticity for what infected the
    first humans. They sit on their own layer, and this assessment does not
    let them touch the origin judgment in either direction.
