      credible genomic observation. The strongest opposing consideration is that
      natural sarbecovirus diversity is heavily undersampled, and furin motifs
      are routinely found in other natural coronavirus lineages, providing no
      direct proof of artificial insertion.
  - claimId: COV-C012
    verdict: well_supported
    confidence: high
    reasoning: The US intelligence community and WHO genomic analyses concur that
      the virus carries no feature currently accepted as a diagnostic
