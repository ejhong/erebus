  synthesis: >-
    Three seats (Grok, Kimi, Opus) argue that the house verdict is internally
    inconsistent, and they are right. The draft concedes that market-associated
    zoonosis is the only hypothesis family with affirmative public evidence and
    that this is "not matched on the other side," then labels the case
    unresolved — a word that in this vocabulary means the record cannot order
    the alternatives at all. It can order them, weakly. COV-C001, COV-C005 and
    COV-C006 place the earliest recognised cluster, 87.5% of interior
    environmental positives, and mitochondrial DNA of susceptible mammals in the
    same few hundred square metres; COV-C002 supplies the one observation
    ascertainment bias does not naturally generate; COV-C010, even after its
    fourteenfold demotion, still leans toward more than one introduction. That
    is limited, largely unreplicated, single-custodian-dataset support for one
    explanation and nothing affirmative for the other — the textbook shape of
    provisionally_supported. I therefore move.


    Gemini holds with the house at unresolved on the ground of two symmetrical
    absences hostage to non-disclosure. That is correct about the keystone
    claims and I preserve it there: COV-C008 (an infected supply-chain animal)
    and COV-C017 (DEFUSE-like work actually performed) both stay unresolved, and
    COV-C015 records that SAGO could not assess the laboratory route at all. But
    unresolved-at-the-keystone does not force unresolved-at-the-family. The
    absence of an infected animal is substantially manufactured by not sampling
    the candidate species before clearance and disinfection (COV-E006, COV-E007,
    COV-C004); the absence of a laboratory holding sits beside no progenitor, no
    incident, no seroconversion (COV-E019). Both are non-diagnostic; only one
    sits inside a convergent affirmative pattern.


    GPT-5.1's well_supported does not compel. Well_supported implies replication
    and independent lines. Here the geography, environmental, metagenomic and
    lineage analyses run on one Chinese CDC dataset through overlapping author
    teams (COV-E004, COV-E005, COV-E010) — three analytic layers, not three
    confirmations. COV-C002 is a single p = 0.029 result on an unaudited line
    list with an unresolved published exchange; COV-C010 lost most of its
    support to a code error (COV-E011). Two of the three genuinely
    discriminating items are the two least load-tested. Strip them and the
    record supports only "the market amplified an outbreak," which both families
    accommodate. Institutional-integrity findings (COV-E026) remain off the
    origin verdict entirely.
