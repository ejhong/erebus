      themselves: co-presence is not infection, and an early unreported human
      case shedding in the same stall would produce the identical pattern. Their
      further admission that correlational analysis cannot establish infection
      caps what this can carry. Assessed as an observation about co-occurrence,
      it is well supported; it must not be read as transmission."
  - claimId: COV-C007
    verdict: well_supported
