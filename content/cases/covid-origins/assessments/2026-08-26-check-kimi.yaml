      scope problem the record itself documents — the sampled animals were
      unsold stock, strays, and freezer contents; the candidate host species
      were never sampled; and WHO states the limited species range precludes
      definitive conclusions while expressing scepticism that China has seen
      zero reverse zoonoses. So the claim is true and simultaneously much weaker
      evidence than it appears: an absence produced by not testing the relevant
      animals. Well supported as stated, near-uninformative as discrimination."
  - claimId: COV-C008
