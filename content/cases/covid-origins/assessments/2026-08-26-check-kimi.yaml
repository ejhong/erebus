  synthesis: 'The featured hypothesis — zoonotic spillover at or immediately
    upstream of the Huanan market — is the only account with multiple
    affirmative lines of public evidence, and those lines do converge on one
    location. The case file itself grades the market-spillover component
    "provisionally_supported," and my independent read of the evidence records
    lands in the same place, for the same structural reasons and with the same
    debts. The affirmative case rests on four pillars. First, the geographic
    concentration of the earliest documented cases around the market (COV-C001),
    multiply corroborated in data but hostage to unaudited Chinese case
    ascertainment. Second, the observation carrying the real statistical weight:
    unlinked early cases living closer to the market than market workers
    (COV-C002) — genuinely hard for ascertainment bias to explain, but a single
    p = 0.029 result, never independently reproduced, on an unreleased case set,
    with a published methodological dispute unresolved. Third,
    susceptible-wildlife DNA co-occurring with viral RNA at a wildlife stall
    (COV-C006), which the authors themselves state is specifically predicted by
    zoonosis yet cannot establish infection — co-presence, not transmission.
    Fourth, the two-introductions inference (COV-C010), the sharpest
    discriminator, whose quantitative support was cut roughly fourteenfold by an
    erratum and now sits in the lower positive band (BF ≈ 4.2–4.3). Notably,
    pillars two through four are one evidence stream: overlapping authors
    reanalyzing one Chinese CDC dataset. That is the deepest structural weakness
    — convergence of analytic layers, not of independent measurements.
    Steelmanning the zoonotic side: no alternative hypothesis has any
    affirmative public evidence of comparable specificity; the two-introductions
    pattern is awkward for any single-index account; the species detected are
    documented SARS amplifiers in the same trade; and the missing animal is
    demonstrably a product of not sampling the candidate species, as the WHO
    group itself states. Steelmanning the research-related side: the two
    absences are symmetric and both hostage to one custodian; the DEFUSE passage
    documents intent to insert exactly the relevant feature class with a Wuhan
    partner; BSL-2 practice establishes opportunity; and WHO states it could not
    assess the laboratory route at all because information was withheld — so "no
    evidence of a lab origin" is substantially "no access." The
    engineered-construct variant is affirmatively weak; the bioweapon variant is
    contradicted. Overall: provisionally supported, with the transmission chain
    unclosed and the decisive records unproduced. This is a finding about the
    accessible evidence, and the record itself warns that accessibility is the
    contested variable.'
