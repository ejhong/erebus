caseAssessment:
  verdict: provisionally_supported
  whatIsClaimed: "The zoonotic account claims spillover from the live-wildlife trade in roughly November–December 2019, possibly more than once. The research-related account claims a field, laboratory, or engineered-construct exposure, in ascending order of specificity and descending order of support. Two further claims sit underneath and are contested on their own terms: whether the early scientific consensus for zoonosis was reached by ordinary data-driven deliberation, and whether officials and funded scientists steered the early narrative. This case grades the evidence disputes. It does not grade anyone's culpability, honesty, or intent."
  whereDisagreementLives: "Not over the market as the early epicenter of the recognised outbreak; the live disputes sit a rung up, and all three now have published arguments on both sides. Whether the statistics identify the market rather than any nearby landmark as the center. Whether wildlife DNA beside viral RNA indicates infected animals, when the viral reads do not track the susceptible-species reads across the full dataset and the original authors answer that decay would erase such a signal. And whether the earliest diversity means one introduction or two. Underneath all three sits custodianship: the early sequences, the supply-chain records, the laboratory inventories and the worker health files are held in one country and have not been produced."
  whatWouldSettleIt: "Documents and datasets, not argument. On the zoonotic side: trader and farm records, archived 2019 animal tissues and sera, and the raw market reads with stall-level sampling dates and metadata, which would let the decay explanation be tested rather than asserted. On the research-related side: the institute's pre-pandemic inventory with raw sequence files and freezer records, examined by people who work neither for the custodian nor for its critics, and de-identified 2019 occupational-health records with stored sera. Common to both: the several hundred early-patient sequences WHO says remain unavailable. Two exceptions need nobody's permission — a preregistered adversarial reanalysis of the lineage question, and an independent reproduction of the geographic signal, which the published critique makes overdue."
  bestConventionalExplanation: "A sarbecovirus circulating in bats, plausibly via an intermediate mammal host, entered the live-wildlife supply chain and reached Wuhan, where it crossed into humans at or immediately upstream of the Huanan market in roughly November–December 2019 — most likely more than once. It is the only hypothesis with multiple affirmative lines of public evidence, and they converge on the same few hundred square metres. The earliest known cases cluster around the market, and cases with no reported market link lived closer to it than cases who worked there. Positive environmental samples concentrate where live-mammal vendors operated; genetic material from susceptible species co-occurs with viral RNA at a wildlife stall; those species amplified the earlier SARS outbreak through the same trade. The earliest viral diversity is more easily explained by repeated introduction than by one seeding event, and the genome carries no accepted signature of engineering. Its unpaid debts are real: no infected source animal has ever been found, the upstream traceback was never completed, the animals were gone before anyone sampled them, and two of its three analytic pillars are now contested in peer-reviewed print by specialists re-analysing the same data."
  components:
    - label: Huanan market as early epicenter of the recognized outbreak
      state: well_supported
      note: "Multiple channels: early-case geography, environmental positivity, district-level excess pneumonia and later seroprevalence. Rests on case ascertainment that has never been independently audited, and the claim that statistics identify the market specifically as the center is disputed in a statistics journal (COV-C020)."
    - label: Market as the site of the initial animal-to-human spillover
      state: mixed
      note: "Moved from provisionally supported this pass: both affirmative pillars now have published counter-analyses — the viral reads do not track susceptible-species reads (COV-C023), and the centrality test is challenged on method (COV-C020). Both have stated answers from the original authors, and neither supplies an alternative origin."
    - label: Research-related incident (any variant)
      state: unresolved
      note: A real conjunction of capability, opportunity, documented intent-on-paper, and opacity — with no publicly disclosed progenitor, incident, or infected worker, and an inventory no independent party has examined.
    - label: Engineered-construct origin specifically
      state: weakly_supported
      note: Almost all US intelligence elements assessed the virus was not genetically engineered, and the notable genomic features have published natural explanations. Not excluded — seamless methods leave no required scar — but affirmatively unsupported.
    - label: Deliberate engineering and release as a weapon
      state: contradicted
      note: All US intelligence elements assessed the virus was not developed as a biological weapon; no affirmative public evidence exists.
    - label: Early public scientific certainty exceeded contemporaneous private belief
      state: provisionally_supported
      note: Documentary, and orthogonal to the biological question. Rests on released communications whose completeness is contested. It does not cross into the origin layer.
  researchPriority:
    level: high
    reason: Two of the highest-yield tests — an adversarial preregistered reanalysis of the lineage question and an independent reproduction of the geographic signal — need no one's permission and run on already-public data, and a peer-reviewed critique of the geographic analysis now makes the second overdue. The rest are disclosure requests whose cost is diplomatic rather than scientific.
  loadBearing:
    - COV-C001
    - COV-C002
    - COV-C005
    - COV-C006
