  synthesis: "The ladder runs as it did, but two rungs now creak audibly. At the observation rung the record is strong: the earliest cluster centred on the market (COV-C001), 87.5 percent of interior environmental positives in the western section (COV-C004, COV-C005), mammalian DNA in positive swabs at a wildlife stall (COV-C006). What this pass adds is that both inferences drawn from those observations are contested in peer-reviewed print by people re-analysing the same data. The spatial argument that the market specifically is the center is challenged on method (COV-C020, COV-E033) by authors explicit that their paper decides nothing about zoonosis. The co-detection argument is met by a correlation analysis across the full dataset (COV-C023, COV-E036), answered by the original authors with a sampling-and-decay account (COV-E037) that predicts exactly the absence found — leaving the dataset unable to discriminate either way. At the mechanism rung COV-C010 survives its correction only near Bayes factor 4, and recovered partial sequences are argued to make the market viruses a derived subset (COV-C022). At the attribution rung both families are empty (COV-C008, COV-C017). What keeps the case at provisionally_supported is the asymmetry, and it is now the whole load: one family has a convergent affirmative pattern whose strength is disputed, the other nothing affirmative at all. Sensitivity: the previous assessment hung the verdict on COV-E005, the co-detection. That thread is contested in print rather than cut — hence the market-spillover component moves to mixed while the case verdict holds at the lower edge of provisionally supported. Two custodianship records enter and are graded for what they are: an archive deletion whose stated reasons conflict (COV-C021), and one group's reconstruction of a database leaving public access (COV-C024). Neither is origin evidence; both describe records no independent party has examined — the same standard that makes the intelligence community's no-progenitor statement (COV-C019) a statement about its own reporting rather than an audit. Integrity findings (COV-E026) stay walled off; opportunity (COV-C018) is not occurrence."
  steelman: The strongest case against this assessment is that it grades a record its subject controls, and treats the resulting symmetry as neutrality. On that account, the custodian cleared the market, ended the traceback, withheld the early sequences and let the institute's inventory leave public view, while a deletion from a foreign archive shows records being withdrawn when they became interesting. Each absence this page scores as uninformative was produced by decisions of the parties the case is about, and a page that keeps answering 'not inspectable' on both sides has let the party with the records set the ceiling on what can ever be concluded. This assessment cannot answer that. It can only record that nothing affirmative has been produced for the research-related family either, and that the critiques now in the ledger attack the strength of the zoonotic evidence without supplying an alternative event.
claimAssessments:
  - claimId: COV-C001
    verdict: well_supported
    reasoning: "Multiple channels converge: the spatial analysis of December 2019 cases, the concentration of positive environmental samples inside the market, and the Chinese CDC's own surveillance data placing 87.5 percent of interior positives in the market's west zone. The WHO scientific advisory group calls a zoonotic origin the best supported hypothesis on accessible evidence while declining to conclude the market was the first spillover site rather than a site of amplification. A published statistical critique disputes the narrower proposition that the statistics identify the market as the center of the case locations, not the clustering itself."
    confidence: high
    treatment:
      plainLanguage: The earliest known cases cluster tightly around one market. This is the sturdiest finding in the case, and both sides now largely accept it — what they dispute is what it means.
      importance: headline
      diagnosticity: moderate
      diagnosticitySummary: An epicenter is predicted by market spillover, by upstream spillover with subsequent market arrival, and by amplification of a virus already circulating in humans. It discriminates against non-market origins collectively, not among the hypotheses that matter most here.
      strongestObjection: The finding rests entirely on Chinese case ascertainment that has never been independently audited, and the complete December 2019 line list has never been released. Cases were identified by clinical review, but the review itself is not inspectable.
      whatWouldChangeOurMind:
        - Release of the complete December 2019 case line list showing a materially different geographic distribution.
        - Evidence that early case-finding was concentrated around the market for administrative reasons.
  - claimId: COV-C002
    verdict: provisionally_supported
    reasoning: Stated directly in the published paper, which reports the unlinked cases resided significantly closer to the market than those with a direct link and infers exposure at or near the market. The comparison is a spatial-statistical result on a case set of disputed completeness, at p = 0.029 — a margin one published critic characterizes as borderline. It has not been independently reproduced, and a peer-reviewed critique in a statistics journal now argues the wider centrality analysis does not establish what it is read as establishing.
    confidence: moderate
    treatment:
      plainLanguage: The single most load-bearing observation in the zoonotic case. People with no known market connection lived nearer the market than market workers did — which is what exposure at the market predicts and what a contact-tracing artifact does not.
      importance: headline
      diagnosticity: high
      diagnosticitySummary: The observation hardest for ascertainment-bias explanations to absorb, and therefore the load-bearing item distinguishing spillover at the market from amplification of a virus that arrived from elsewhere.
      strongestObjection: "Two published criticisms now stand against it and neither has been resolved: an eLetter arguing the early lineage cases were not closer to the market than statistically expected, and a peer-reviewed paper in a statistics journal arguing that the centroid-based reasoning and the Monte Carlo test used to exclude rival locations are both invalid. The authors replied to the first; the underlying case data remains unreleased, so no third party has reproduced either side."
      whatWouldChangeOurMind:
        - Independent reproduction from released code, raw geospatial data, and case-definition history.
        - A preregistered alternative spatial model that dissolves the relationship under reasonable ascertainment corrections.
  - claimId: COV-C003
    verdict: well_supported
    reasoning: "Verified verbatim in the clinical study of the first 41 confirmed patients, which states the onset date and, in the next sentence, that no epidemiological link was found between the first patient and later cases. The claim is framed as what the publication states, which is the honest form: the identification of this patient as the earliest case has been contested in later reporting that this case has not adjudicated."
    confidence: high
    treatment:
      plainLanguage: The first known patient had no market connection. This claim records what the published clinical study states — not a settled fact about the outbreak, because the case's date and status have been disputed elsewhere.
      importance: major
      diagnosticity: moderate
      diagnosticitySummary: Compatible with upstream spillover, with a research-related index infection, and with an unascertained earlier market chain. It weighs against the strictest version of market-only spillover without favoring any specific alternative.
      strongestObjection: A single case's reported exposure history in an early clinical series is weak evidence about the outbreak's origin, and the same paper reports that two-thirds of the series had direct market exposure.
      whatWouldChangeOurMind:
        - Release of the underlying case investigation records establishing this patient's actual exposures and onset date.
  - claimId: COV-C004
    verdict: well_supported
    reasoning: "Reported in the Chinese CDC's own peer-reviewed surveillance paper, with the sampling chronology stated explicitly: the market closed in the early morning of January 1, 2020, and sampling began the same day. Cite the 2024 version of record — the positive count was 73 in the 2023 accelerated preview and 74 after a note added in proof."
    confidence: high
    treatment:
      plainLanguage: The virus was found on surfaces throughout the market — but only after the market had been emptied and was being disinfected, which is the whole problem with interpreting it.
      importance: major
      diagnosticity: low
      diagnosticitySummary: Environmental RNA cannot identify who deposited it. An infected vendor, a customer, or an animal all produce the same swab result, so this observation is compatible with every hypothesis in the case.
      strongestObjection: Sampling began only after the market was cleared, and the paper records that stall surfaces and goods were disinfected through January and February 2020 — so what the sampling could still detect was bounded before it started.
      whatWouldChangeOurMind:
        - Nothing material on the observation; it is the interpretation that is contested.
  - claimId: COV-C005
    verdict: well_supported
    reasoning: "Two independent analytic layers agree, including the Chinese CDC's own data: of 64 positive samples collected inside the market, 87.5 percent came from the west zone. The spatial analysis separately found distance to the nearest live-mammal vendor predictive of sample positivity."
    confidence: high
    treatment:
      plainLanguage: The virus was not spread evenly across the market. It clustered where live wild mammals were sold.
      importance: major
      diagnosticity: moderate
      diagnosticitySummary: Consistent with animals as the source, and also with a poorly ventilated enclosed section concentrating human contamination. It narrows where to look without establishing what was there.
      strongestObjection: Advocacy analysis asserts the same section was the market's least ventilated area with no outside connection, which would concentrate positivity from human shedding alone. This case has not verified that characterization, and records it as an unverified stated objection.
      whatWouldChangeOurMind:
        - Ventilation and layout documentation showing the section's physical characteristics explain the clustering independently of what was sold there.
  - claimId: COV-C006
    verdict: well_supported
    reasoning: "The metagenomic reanalysis found wildlife DNA in all five SARS-CoV-2-positive samples from the wildlife stall, with raccoon dog the most abundantly detected species. Detection is uneven rather than uniform: raccoon dog and hoary bamboo rat in all five samples, Malayan porcupine in four, masked palm civet in one. The WHO group calls this the most compelling evidence of a possible spillover. The observation stands; what a later analysis of the full dataset disputes is the inference drawn from it, graded separately at COV-C023."
    confidence: high
    treatment:
      plainLanguage: Genetic traces of exactly the animals that could have carried the virus were found in the same positive samples. Critically, this shows the animals and the virus were in the same place — not that any animal was infected. The authors say so themselves.
      importance: headline
      diagnosticity: moderate
      diagnosticitySummary: Only a zoonotic origin directly predicts co-detection of the virus and wildlife genetic material, which is the authors' own point and gives this real weight. But co-presence is not infection, human shedding after a zoonotic event would produce the same pattern, and across the full sample set the viral reads do not track the susceptible-species reads.
      strongestObjection: The authors state that their data cannot establish which species shed the virus, that early unreported human cases shedding in the same location would explain the observation equally, and that a correlational analysis of this data cannot reliably show whether any species was infected. A later peer-reviewed analysis finds the samples richest in raccoon-dog material are largely the ones without detectable virus.
      whatWouldChangeOurMind:
        - Archived tissue or serum from these animals testing positive, or a documented negative result on the actual stock.
        - Evidence that the co-detection pattern arises routinely where infected humans and animal products share a space.
  - claimId: COV-C007
    verdict: well_supported
    reasoning: "All 457 animal samples in the Chinese CDC survey tested negative, and the joint WHO study records China's account of tens of thousands of animals tested with no positives. Two qualifications matter enormously and are recorded rather than buried: the sampled animals were largely unsold stock, strays, and freezer contents rather than the candidate intermediate hosts — which the later reanalysis states were never sampled or tested — and the aggregate testing figure is the custodian's own unaudited account."
    confidence: moderate
    treatment:
      plainLanguage: The zoonotic case's missing keystone. After the largest search of its kind ever conducted, no infected animal has ever been found.
      importance: headline
      diagnosticity: moderate
      diagnosticitySummary: "The zoonotic case's principal empirical deficit, and weaker than it looks: an absence produced by not sampling the relevant species is largely uninformative. Its mirror image is the absence of any known laboratory holding of the virus, and this case treats the two alike."
      strongestObjection: The market was cleared and disinfected before sampling began, the upstream farm traceback was never completed, and the candidate host species were never tested — so this is substantially a fact about what investigators were permitted and able to look for.
      whatWouldChangeOurMind:
        - A pre-outbreak animal or archived sample carrying the virus or a basal near-progenitor.
        - A complete, independently audited account of what species were actually tested and when.
  - claimId: COV-C008
    verdict: unresolved
    reasoning: The zoonotic family's missing keystone. The co-location evidence is consistent with it and, by the analysing authors' own statement, cannot establish it; a later analysis of the full dataset finds no consistent correlation between viral and susceptible-species reads, and the original authors answer that sampling timing and RNA decay would erase such a correlation in a true zoonotic scenario. No infected animal has ever been identified, and the animals that would have been tested were gone before sampling began. Unresolved here means genuinely open, not disfavored.
    confidence: moderate
    treatment:
      plainLanguage: Stated explicitly because it is what the co-location evidence is constantly read as having established, and has not. Naming it as unresolved is the point.
      importance: headline
      diagnosticity: high
      diagnosticitySummary: Resolving it either way would largely settle the case. Confirmation would establish the transmission chain; a thorough negative on the actual stock would remove the market-spillover hypothesis's foundation.
      strongestObjection: Nothing affirmative has ever been produced, the physical opportunity to produce it has largely expired with the 2019 stock, and the one statistical test run across the whole released dataset came back null.
      whatWouldChangeOurMind:
        - Archived 2019 animal tissues or sera from the market's wildlife vendors testing positive.
        - Farm and trader records enabling a completed supply-chain traceback.
  - claimId: COV-C009
    verdict: well_supported
    reasoning: "Stated in the published analysis and unchanged by the paper's later erratum: the two lineages differ at two nucleotide sites, both of which are also found in related bat coronaviruses."
    confidence: high
    treatment:
      plainLanguage: The earliest genomes come in two slightly different versions. Nobody disputes this. What it implies is disputed, and that is a separate claim.
      importance: major
      diagnosticity: low
      diagnosticitySummary: The observation alone is compatible with every hypothesis; the inference from it carries all the weight and is graded separately.
      strongestObjection: Several hundred early Chinese sequences remain unpublished, so the early-diversity picture is incomplete by construction.
      whatWouldChangeOurMind:
        - Release of the withheld early sequences revealing intermediate genomes that change the lineage structure.
  - claimId: COV-C010
    verdict: mixed
    reasoning: "A model-based inference whose published support was materially corrected. A code error had overestimated the Bayes factors: they fell from 61.6 and 60.0 to 4.3 and 4.2, and the authors' own wording moved from strong to substantial support. The corrected analysis still favors multiple introductions, so characterizations that the correction reduced the finding to negligible are not supported by the erratum. The inference remains sensitive to rooting choices, clock assumptions, unsampled intermediates, and which early sequences are trusted — the last of which is the point of the recovered-sequence argument at COV-C022."
    confidence: moderate
    treatment:
      plainLanguage: If the virus jumped to humans more than once, that is easy under wildlife-trade spillover and awkward under a single infected worker. The published support for it was reduced fourteenfold by a correction — but not eliminated.
      importance: headline
      diagnosticity: high
      diagnosticitySummary: One of only two or three genuine discriminators in the whole case. Two independent introductions are readily produced by wildlife-trade spillover and awkward for any single-index-infection account. If it fails, the zoonotic case retreats to market amplification plus an unknown upstream event.
      strongestObjection: A fourteenfold reduction in the support statistic on correction is a substantial demotion, and the remaining value sits in the lower band of positive evidence. The WHO group reports the finding and attributes the judgment to the original authors rather than adopting it as its own; a congressional majority report asserts a single introduction instead; and the sequence set the inference runs on is argued to be unrepresentative.
      whatWouldChangeOurMind:
        - A preregistered adversarial reanalysis with methods and sequence-inclusion criteria fixed before unblinding.
        - Release of the unpublished early sequences, which could add intermediate genomes.
  - claimId: COV-C011
    verdict: well_supported
    reasoning: "The feature's presence and its absence from close relatives are not in dispute; the field-virology paper describing the closest Laotian relatives states directly that none of those bat viruses contains a furin cleavage site. Note that the widely circulated stronger formulation — that such a site is \"not found in nature\" — is contradicted: furin motifs occur across other coronavirus lineages, and the WHO group states the feature had been previously identified in nature, for example in animal-associated merbecoviruses."
    confidence: high
    treatment:
      plainLanguage: The genome feature that launched a thousand arguments. It is real, and it is read as suspicious by one side and as ordinary natural variation by the other — which is why it is the best calibration point in the case.
      importance: headline
      diagnosticity: low
      diagnosticitySummary: "The clearest illustration in the case of why credibility and diagnosticity are separate axes: a highly credible observation with near-zero discriminating power, because both hypothesis families accommodate it comfortably."
      strongestObjection: Natural sarbecovirus diversity is badly undersampled, so absence from known relatives is weak evidence about what exists in nature; and the site is suboptimal, which is not what deliberate design from known motifs would predict.
      whatWouldChangeOurMind:
        - Discovery of a natural sarbecovirus carrying a furin cleavage site, which would end the uniqueness argument outright.
  - claimId: COV-C012
    verdict: well_supported
    reasoning: Almost all US intelligence elements assessed the virus was not genetically engineered, and all assessed it was not developed as a biological weapon. The WHO group concluded the notable genomic features are readily explained by natural evolution and provide no support for a man-made origin — and in the very next sentence, that a man-made origin "is also not refuted by biological data." Both halves belong together.
    confidence: high
    treatment:
      plainLanguage: No engineering fingerprint has been found. This weighs against the deliberate-construct hypothesis specifically — and barely at all against a natural virus escaping a lab, which needs no fingerprint.
      importance: headline
      diagnosticity: moderate
      diagnosticitySummary: Weighs specifically against an engineered-construct origin. It has almost no force against a field-collection or laboratory incident involving an unmodified natural virus, and the intelligence reporting itself notes the institute possessed methods that leave no trace of modification.
      strongestObjection: '"No diagnostic signature" and "no research accident" are different statements. Seamless reverse genetics leaves no required scar, so the absence of a signature cannot exclude a laboratory origin — only a detectably engineered one.'
      whatWouldChangeOurMind:
        - Identification of a construct map, plasmid or synthesis order, or passage record connecting a precursor to the virus.
        - Development of a forensic method able to distinguish seamless engineering from natural recombination.
  - claimId: COV-C013
    verdict: well_supported
    reasoning: "The identity figures are published and consistent: roughly 96 percent whole-genome identity for the closest bat relatives, which the intelligence assessment states are not close enough to be direct progenitors. Note that the sources differ slightly on the figure — 96.2 percent in the original description, 96.1 percent in two later papers — so this case attributes a number to the source stating it rather than asserting one canonical value."
    confidence: high
    treatment:
      plainLanguage: The nearest known relatives are decades of evolution away. This single fact defeats popular arguments on both sides at once.
      importance: major
      diagnosticity: low
      diagnosticitySummary: "Earns its place by defeating two popular arguments simultaneously: that a specific NIH-funded virus was the precursor, and that a named archived sequence was the leaked virus. Neither is possible at this genetic distance."
      strongestObjection: "It is a statement about sampled diversity, not about existing diversity: an unsampled closer relative is entirely plausible, which is exactly what both hypothesis families require."
      whatWouldChangeOurMind:
        - Discovery or disclosure of a substantially closer relative, whether from field sampling or from a laboratory inventory.
  - claimId: COV-C016
    verdict: well_supported
    reasoning: "The passage is verbatim in the proposal at a confirmed locator, read by two independent optical-character passes that agree on every substantive word. The non-award is confirmed three ways: the congressional record, contemporaneous reporting, and a negative check of federal award data showing no defense award to the applicant in the relevant years. Graded well supported rather than established only because the copy available is a third-party archive upload rather than an official release, and because the text is OCR-derived."
    confidence: high
    treatment:
      plainLanguage: The strongest documentary point on the research-related side. A funding application twenty months before the outbreak proposed inserting exactly the kind of feature the pandemic virus turned out to have, with a Wuhan partner — and it was rejected. This claim is about what a document says, and it claims nothing more.
      importance: headline
      diagnosticity: moderate
      diagnosticitySummary: Circumstantial evidence of research intent and capability, and weak direct evidence about this virus's ancestry. It establishes that inserting such a site was a contemplated technique in a program with a Wuhan partner — which is genuinely more than the zoonotic account predicts, and considerably less than execution.
      strongestObjection: The proposal was rejected and never funded; the specific viral backbones it contemplated are argued to be too distant from SARS-CoV-2 to be a plausible precursor; and a document describing intended work is not evidence that the work occurred.
      whatWouldChangeOurMind:
        - An authenticated official copy of the proposal, which would raise this to established.
        - Evidence that the cleavage-site passage was removed before submission or never part of the submitted version.
  - claimId: COV-C017
    verdict: unresolved
    reasoning: "The proposal was not funded, no public record shows the experiment was carried out, and no published precursor sequence connects the contemplated constructs to SARS-CoV-2. Against that: the intelligence reporting records that the institute possessed reverse-genetic methods leaving no trace of modification, and the records that would settle the question — institutional biosafety approvals, internal project records, construct maps, synthesis orders, raw reads — have never been produced. Unresolved here means genuinely open in both directions."
    confidence: moderate
    treatment:
      plainLanguage: The step from document to deed, stated explicitly because this is where the argument is usually smuggled across. There is no public record that the work was done.
      importance: headline
      diagnosticity: high
      diagnosticitySummary: Resolving it either way would move the case substantially. Documented performance of such work would convert a documentary coincidence into a mechanism; documented absence would reduce the proposal to what it appears to be on its face.
      strongestObjection: An unfunded proposal is weak grounds for inferring the work happened anyway, and six years of investigation — including congressional subpoenas and a declassification review — has produced no document showing it did.
      whatWouldChangeOurMind:
        - Institutional biosafety approvals, internal project records, plasmid or synthesis orders, or raw sequencing reads bearing on whether the work was performed.
  - claimId: COV-C018
    verdict: well_supported
    reasoning: Stated in the 2023 declassified report at a confirmed locator, together with its own caveats. The same document records that the community knows of no specific biosafety incident that caused the pandemic, and characterizes a November 2019 biosafety training course at the institute as appearing routine rather than an emergency response.
    confidence: high
    treatment:
      plainLanguage: Work with viruses capable of infecting humans was being done at a containment level below what many Western labs would use. This establishes opportunity — which every research-related scenario shares, and which is also compatible with no incident at all.
      importance: major
      diagnosticity: low
      diagnosticitySummary: Establishes opportunity and degraded practice, which the field, laboratory, and engineered scenarios all share equally, and which is also consistent with nothing having happened. Opportunity is not evidence of occurrence.
      strongestObjection: Inadequate biosafety practice was common in coronavirus research globally in that period; the same report finding the practice inadequate also reports no indication that the institute held this virus or a close progenitor, and no evidence of a specific incident.
      whatWouldChangeOurMind:
        - An independent audit of the institute's experiment logs, containment records, and 2019 occupational-health files.
  - claimId: COV-C014
    verdict: well_supported
    reasoning: "The agency split and its confidence levels are stated in both declassified assessments. The confidence language is the part that matters and the part routinely dropped: every position is low confidence except one at moderate, and a later agency change of position was reported as resting on a review of existing information rather than new intelligence."
    confidence: high
    treatment:
      plainLanguage: "Analysts with access to classified reporting split, and stayed split. The correct reading is neither camp's: it means nobody held decisive evidence."
      importance: headline
      diagnosticity: low
      diagnosticitySummary: "Nearly uninformative about the origin and highly informative about the evidence: sustained disagreement among analysts with privileged access indicates that no side held diagnostic material."
      strongestObjection: These are declassified summaries whose underlying reporting cannot be audited by any reader, and the successive assessments are products of the same community rather than independent checks on each other.
      whatWouldChangeOurMind:
        - Declassification of the analytic record — source summaries, dissents, and confidence rationales — behind the divergent conclusions.
  - claimId: COV-C015
    verdict: well_supported
    reasoning: Both halves are verbatim in the report's conclusion, including the qualification "reviewed by SAGO" that ellipsis often removes. The group states it had no access to original raw data from any source, and that requested information was not provided by three governments — China, Germany, and the United States — not by China alone.
    confidence: high
    treatment:
      plainLanguage: "The most authoritative current scientific synthesis says two things at once, and they must be read together: zoonosis is best supported by what could be seen, and a key alternative could not be examined at all."
      importance: headline
      diagnosticity: moderate
      diagnosticitySummary: Carries real weight as an expert synthesis and inherits its dependence on a partly withheld evidence base. A page treating it as settling the question would silently inherit that dependence.
      strongestObjection: A synthesis of accessible evidence is only as good as the access, and this one says plainly that it had none to raw data. Its 2021 predecessor's rating of a laboratory incident as extremely unlikely has been superseded, which shows how much these judgments can move.
      whatWouldChangeOurMind:
        - Provision of the requested information, allowing the laboratory hypothesis to be assessed rather than set aside.
  - claimId: COV-C019
    verdict: well_supported
    reasoning: "Quoted verbatim from the declassified report at a confirmed page locator. The claim is written as what the report states, which is all a reader can check: the intelligence community's description of its own reporting is not an inspection of the institute's holdings, and the report says so in its own scope caveats. Enters this pass because the article's sentence about no laboratory being known to hold the virus had been linked to the claim about genetic distance, which states something else entirely."
    confidence: high
    treatment:
      plainLanguage: The mirror image of the missing animal. The United States intelligence community says it has no indication the Wuhan institute held this virus or anything close to it before the pandemic — a statement about what its own reporting shows, not about what the institute's freezers contained.
      importance: headline
      diagnosticity: moderate
      diagnosticitySummary: "Weighs against the research-related family to exactly the extent that the community's collection was capable of detecting such a holding, which no reader can assess. Treated here as the symmetric counterpart of the never-found animal: an absence of indication, not an audited absence."
      strongestObjection: An interested government's summary of its own classified reporting is the claim of an interested party, and the institution that would hold the dispositive records is not the one making the statement. The same report elsewhere records that the institute possessed methods leaving no trace of modification.
      whatWouldChangeOurMind:
        - An independently examined inventory of the institute's pre-pandemic sarbecovirus holdings, with raw sequence files and freezer records.
        - Declassification of the collection basis for the no-indication statement.
  - claimId: COV-C020
    verdict: well_supported
    reasoning: "The claim states what a peer-reviewed critique concludes, and the conclusion is quoted verbatim from the authors' accepted manuscript. Graded on the fidelity of the report, not on whether the critique is right: it is a published, independent, methodological argument by two spatial-statistics specialists re-analysing the same case coordinates, and it has not been answered in print as far as this case has found."
    confidence: high
    treatment:
      plainLanguage: Two statisticians, in a statistics journal, say the famous spatial analysis does not prove what it is cited for — that the market, rather than some other nearby landmark, is the center of the earliest cases. They are explicit that this decides nothing about where the virus came from.
      importance: headline
      diagnosticity: moderate
      diagnosticitySummary: "Diagnostic about the strength of an argument rather than about the origin, which is precisely its value: it bears on how much weight the geographic pillar can carry, and the authors disclaim any origin implication in their own words."
      strongestObjection: A methodological critique that offers no alternative analysis leaves the underlying clustering untouched, and the separate comparison that carries most of the weight here — unlinked cases living nearer the market than market workers — is not what the critique addresses.
      whatWouldChangeOurMind:
        - A published reply from the original authors answering the centroid and Monte Carlo objections.
        - An independent reanalysis under alternative spatial models, which would make this dispute decidable rather than argued.
  - claimId: COV-C021
    verdict: well_supported
    reasoning: The deletion, the author's recovery of the files, and the conflicting explanations are stated in a peer-reviewed paper, and the archive's own correspondence requesting deletion is reproduced in it. What the record establishes is the deletion and the conflict about why — not a motive, which the author expressly declines to infer.
    confidence: high
    treatment:
      plainLanguage: Sequencing data from Wuhan patient samples was taken out of the United States' public archive at the submitters' request, and was recovered from cloud storage afterwards. The reasons later given for the removal do not match the reason given to the archive at the time.
      importance: major
      diagnosticity: low
      diagnosticitySummary: "Almost no discriminating power on the origin question and real weight on the custodianship question: it is a documented instance of early-outbreak records leaving public view, which is the condition this whole case operates under."
      strongestObjection: The data were later posted to a Chinese database, the submitting side gave an account of the deletion as an administrative error, and the paper's author himself writes that archive deletions do not imply malfeasance.
      whatWouldChangeOurMind:
        - The archive's own review of other deletions of early-outbreak data, which the paper recommends and which nobody has published.
        - Collection records establishing when the samples were actually taken.
  - claimId: COV-C022
    verdict: mixed
    reasoning: "A peer-reviewed inference, and the author states its limits himself: the recovered sequences are partial, lack metadata, cannot be placed unambiguously on a tree, and the analysis is qualitative without formal statistical testing. The argument's earlier premise — that lineage A was absent from the market — has since been met by the report of lineage A in a market environmental sample. It remains the sharpest published case for the market as amplifier rather than origin, and it has not been resolved either way."
    confidence: moderate
    treatment:
      plainLanguage: "The strongest technical argument that the market was where the virus spread, not where it started: the viruses found at the market already look like a derived branch, with the likely ancestor sitting closer to the bat relatives."
      importance: headline
      diagnosticity: high
      diagnosticitySummary: One of the few propositions in the case that would genuinely discriminate. If the market viruses are a derived subset, the market cannot be the site of the first human infection, and the zoonotic account retreats to an unlocated upstream event.
      strongestObjection: It rests on partial sequences of disputed provenance and dating, uses qualitative phylogenetics by the author's own description, and the market analyses report lineage A within the market environment, which was the argument's original missing piece.
      whatWouldChangeOurMind:
        - Release of the several hundred withheld early-patient sequences, which would settle the rooting question.
        - A formal statistical treatment of the recovered sequences, with their collection dates established.
  - claimId: COV-C023
    verdict: well_supported
    reasoning: The correlation result is stated in a peer-reviewed paper with a fully reproducible pipeline run across the custodian's complete released dataset, and the striking particular — fourteen samples with more than twenty percent raccoon-dog chordate mitochondrial material, only one of which contains any viral read at all — is quoted verbatim. The observation itself is not disputed by the authors of the paper it criticizes; what they dispute is what follows from it.
    confidence: high
    treatment:
      plainLanguage: Across all the market samples, the ones richest in raccoon-dog genetic material are not the ones with the virus in them. The strongest statistical association runs instead to fish.
      importance: headline
      diagnosticity: moderate
      diagnosticitySummary: "Would be highly diagnostic against the infected-animal inference if co-detection were expected to track infection, and the original authors' answer is exactly that it would not: animal shedding would precede human shedding and decay before most wildlife stalls were sampled. The honest reading is that this dataset cannot discriminate in either direction."
      strongestObjection: Sampling began only after the market was cleared and ran eleven days later for most wildlife stalls, so a true animal signal would be expected to have decayed; and non-wildlife-stall positives were very likely human in origin, which distorts any univariate correlation.
      whatWouldChangeOurMind:
        - Stall-level sampling dates and complete metadata released with the raw reads, which would let the decay explanation be tested rather than asserted.
        - A pre-registered analysis agreed between the two sets of authors on what correlation a zoonotic origin should produce.
  - claimId: COV-C024
    verdict: provisionally_supported
    reasoning: "Graded as what the document asserts, and no further. The assertion is specific, dated, and anchored in archive snapshots and access logs its authors reproduce — but those artifacts have not been examined by any independent party, the group is an interested one, and the account stops in February 2021. The institution's own stated reason, a cyber-attack, is recorded beside it and is not implausible. This case holds the doubters to the standard it holds governments to: a description of records nobody independent has examined carries the weight of one source."
    confidence: low
    treatment:
      plainLanguage: The institute's main database of virus samples and sequences went off public access in September 2019 and, on this account, never came back. What it held is therefore known only from the institution's own description and from outsiders' reconstructions.
      importance: major
      diagnosticity: low
      diagnosticitySummary: "Not origin evidence in either direction: a withdrawn database is consistent with a security incident, with routine administration, and with concealment. Its weight is structural — it is why the mirror-image assurance that no laboratory held a progenitor cannot be checked."
      strongestObjection: The institution gave a stated reason — attacks on its systems — and a database being offline shows nothing about its contents. The document asserting the chronology is self-published by a group that is a party to the dispute, and this case has not verified its artifacts.
      whatWouldChangeOurMind:
        - An independently examined inventory of the holdings, which would make the database's contents a matter of record rather than of inference.
        - Archive evidence that the database was restored to public access, which would retire the claim.
