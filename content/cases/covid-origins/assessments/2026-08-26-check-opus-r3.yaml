      inferring execution from an unfunded application is a substantial
      unsupported step."
  - claimId: COV-C018
    verdict: well_supported
    confidence: high
    reasoning: Both halves are stated at a confirmed locator in the 2023
      declassified report, including the intelligence community's own assessment
      that some researchers probably did not use adequate precautions at least
      some of the time. The strongest opposing consideration is that this is a
      declassified summary no reader can audit, and the same document
      simultaneously reports no known biosafety incident capable of causing the
      pandemic and characterises the November 2019 training course as routine.
      Substantively, BSL-2 handling of SARS-like coronaviruses was not unusual
      in the field internationally in that period. The claim establishes
      opportunity and degraded practice — shared equally by the field,
      laboratory and engineered scenarios, and fully consistent with nothing
      having happened.
  - claimId: COV-C014
    verdict: established
    confidence: high
    reasoning: "The split and its confidence language are stated in both
      declassified assessments: several elements favouring natural exposure, two
      favouring a research-related incident, others undecided, every position at
      low confidence except one at moderate. As a documentary claim about what
      the assessments say, this is not seriously contestable. The strongest
      opposing consideration is that these are summaries of unauditable
      classified reporting produced serially by one community, so they are not
      independent checks on each other, and the 2025 low-confidence CIA shift —
      reported as resting on review of existing information — shows how mobile
      these positions are. The correct reading favours neither camp: sustained
      disagreement among analysts with privileged access indicates nobody held
      decisive material."
  - claimId: COV-C015
    verdict: established
    confidence: high
    reasoning: "Both halves are verbatim in the report's conclusion, including the
      qualifier \"reviewed by SAGO\" that ellipsis routinely removes, and the
      report separately states it had no access to original raw data from any
      source and that three governments — China, Germany and the United States —
      did not fully provide requested information. As a claim about what the
      report concluded, it is established. The strongest opposing consideration
      concerns use rather than truth: the zoonosis half is frequently cited as
      an independent scientific verdict when it is a synthesis of a partly
      withheld evidence base by a body that could not examine the alternative at
      all, and whose 2021 predecessor's \"extremely unlikely\" rating of a
      laboratory incident has already been superseded. Both halves must travel
      together or the citation misrepresents the source."
