      strongest opposing consideration is that an unfunded proposal is weak
      grounds for inferring the work happened anyway, which is why the step from
      document to deed must remain a separate unresolved claim rather than being
      smuggled across."
  - claimId: COV-C018
    verdict: well_supported
    confidence: high
    reasoning: The June 2023 declassified report states that as of January 2019
      institute researchers performed experiments with SARS-like coronaviruses
      in BSL-2 laboratories and that some researchers probably did not use
      adequate biosafety precautions at least some of the time. The same
      document records that the community knows of no specific biosafety
      incident that caused the pandemic and characterizes a November 2019
      training course as appearing routine rather than an emergency response.
      The strongest opposing consideration is that opportunity and degraded
      practice are shared by every research-related scenario and are also
      consistent with nothing having happened, and inadequate coronavirus
      biosafety was not unique to this institute in that period.
  - claimId: COV-C014
    verdict: well_supported
    confidence: high
    reasoning: "The 2021 and 2023 declassified assessments state the split directly:
      several elements favored natural exposure, two a laboratory- associated
      incident, others could not decide, all at low confidence except one at
      moderate, and the 2023 report adds no indication that the institute's
      pre-pandemic research involved this virus or a close progenitor. A later
      agency shift toward a research-related origin was reported as a
      low-confidence review of existing information, not new intelligence, and
      its own statement adds that both scenarios remain plausible. The strongest
      opposing consideration is that these are unauditable declassified
      summaries from a single community, so sustained disagreement indicates
      that nobody held decisive material rather than that both origins are
      equally evidenced."
  - claimId: COV-C015
    verdict: well_supported
    confidence: high
    reasoning: Both halves of the claim are verbatim in the June 2025 SAGO
      conclusion, including the qualifier that the weight of evidence reviewed
      by SAGO suggests zoonotic spillover and the statement that the group could
      not adequately assess a laboratory origin because information was not
      available or not provided. The report states it had no access to original
      raw data from any source, and requested information was withheld by China,
      Germany, and the United States, not by China alone. The strongest opposing
      consideration is that a synthesis of accessible evidence inherits that
      partly withheld base, and the 2021 joint study's "extremely unlikely"
      laboratory rating — now superseded — shows how far these expert judgments
      can move when access and membership change.
