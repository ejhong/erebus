  synthesis: The accessible public record provisionally supports a wildlife-trade
    spillover at or immediately upstream of the Huanan market as the event that
    initiated sustained human transmission in Wuhan in late 2019, while leaving
    a research-related origin neither demonstrated nor excludable. That is not a
    hedged default and does not rest on paper counts or institutional prestige.
    It follows from an asymmetry in affirmative public evidence, together with
    two holes the same record cannot close. Steelman the zoonotic family. The
    earliest documented cases concentrate on the market, and the comparison
    ascertainment bias has the most trouble absorbing is that people with no
    reported market link lived closer to it than the people who worked there.
    Interior environmental positives concentrate in the western section where
    live-mammal vendors operated, a pattern the Chinese CDC's own figures
    independently show. Mitochondrial DNA from raccoon dog, hoary bamboo rat,
    Malayan porcupine, and masked palm civet occurs in the virus-positive swabs
    from a wildlife stall. Only a zoonotic pathway directly predicts that
    co-detection, as the analysing authors themselves state, even though they
    also state that the data cannot identify which species, if any, was
    infected. Early genomes form two lineages separated by two nucleotides; the
    model-based inference that this pattern favors at least two introductions
    survives a fourteenfold correction of the Bayes factors, albeit demoted from
    strong to substantial support. Two jumps are easy under wildlife-trade
    spillover and awkward under a single infected worker. The genome carries no
    feature presently accepted as diagnostic of engineering. These lines point
    at the same few hundred square metres. Steelman the research-related family.
    A Wuhan laboratory was performing experiments with SARS-like coronaviruses
    at biosafety level 2, and the intelligence community assessed that some
    researchers probably did not use adequate precautions. Twenty months before
    the outbreak, a proposal led by EcoHealth Alliance with that institute among
    its partners offered to introduce human-specific furin cleavage sites into
    SARS-related spikes where mismatches occurred. The virus that emerged
    carries exactly that class of motif, and the motif is absent from its
    closest sampled sarbecovirus relatives. No animal sampled at the market, in
    its supply chain, or in China's subsequent testing has been shown to carry
    the virus or a close progenitor. The market was emptied and disinfected
    before systematic sampling, so environmental RNA cannot name its depositor.
    The first published case had no market link. Intelligence elements with
    classified access never converged. WHO's 2025 advisory group said the weight
    of evidence it reviewed suggests zoonosis and, in the same breath, that it
    could not assess a laboratory origin because the necessary information had
    not been provided. Seamless reverse genetics leaves no required scar.
    Opportunity, documented intent-on-paper, location, and opacity form a
    genuine conjunction. The conjunction is not a mechanism. No public record
    shows the contemplated cleavage-site work was performed; the intelligence
    reporting records no indication that the institute held this virus or a
    close progenitor; there is no documented incident. Symmetrically, the
    zoonotic keystone — at least one infected supply-chain animal before
    sustained human transmission — has never been shown, and the candidate stock
    was gone before anyone sampled it. Those two absences are both hostage to
    records that have not been produced, which is why support for
    market-associated spillover remains provisional rather than well supported.
    Layer-three opacity licenses caution about unproduced files; it is not
    itself evidence of what infected the first humans. Anyone claiming the
    initiating event is settled is describing a record that does not exist.
claimAssessments:
  - claimId: COV-C001
    verdict: well_supported
    confidence: high
    reasoning: "Worobey et al. report that all three early-case categories,
      including cases with no market link, resided significantly closer to the
      Huanan market than expected, and Huang et al. report that 27 of 41 of the
      first confirmed patients had been exposed there. Liu et al. separately
      place 87.5 percent of interior environmental positives in the west zone,
      so geography, clinical exposure fractions, and environmental RNA all point
      at the same site. The claim as stated is about the center of the earliest
      documented cluster, not about the first spillover, and on that narrower
      wording the record is consistent. Strongest opposing consideration: the
      finding rests entirely on Chinese case ascertainment that has never been
      independently audited, and the complete December 2019 line list has never
      been released."
  - claimId: COV-C002
    verdict: provisionally_supported
    confidence: moderate
    reasoning: "Worobey et al. state directly that unlinked early cases resided
      significantly closer to the market than cases who worked there and infer
      exposure at or near the market; the 2024 erratum regenerated files and
      reports that all results remained the same. The comparison is a single
      spatial-statistical result at p = 0.029 on a case set of disputed
      completeness, and it has not been independently reproduced from released
      code and raw geospatial inputs. Strongest opposing consideration: a
      published eLetter challenges the distributional assumptions and argues the
      early-lineage cases were not closer than statistically expected; the
      authors replied, but the exchange is unresolved and the underlying case
