    reasoning: "Huang et al. state verbatim that the symptom onset date of the first
      identified patient was 1 December 2019, that none of his family developed
      symptoms, and that no epidemiological link was found between that patient
      and later cases. The claim is graded as a report of that published series,
      including the paper's own onset date, not as a settled reconstruction of
      the index infection. The same paper reports that two-thirds of the 41
      patients had direct market exposure, so the unlinked earliest case sits
      inside a market-centered cluster rather than replacing it. Strongest
      opposing consideration: later reporting not adjudicated in this file
      disputes whether this patient was in fact the earliest case and whether
      the December 1 onset date is correct, and a single early clinical history
