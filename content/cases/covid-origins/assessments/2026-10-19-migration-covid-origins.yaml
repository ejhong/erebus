  synthesis: "The ladder still runs the same way. At the observation rung the record is strong and largely uncontested: the earliest recognised cluster centred on the market (COV-C001), the custodian's own surveillance putting 87.5 percent of interior environmental positives in the western section (COV-C004, COV-C005), and mitochondrial DNA of susceptible mammals in SARS-CoV-2-positive swabs from a wildlife stall (COV-C006). At the mechanism rung the picture thins: COV-C010 survives its code correction but only at Bayes factors near 4, model-dependent and never independently reanalysed (COV-E010, COV-E011). At the attribution rung both families are empty — no infected supply-chain animal (COV-C008), no demonstrated performance of DEFUSE-style cleavage-site work (COV-C017). That asymmetry — one family with a convergent affirmative pattern at the lower rungs and nothing affirmative on the other side — is what keeps the case at provisionally_supported rather than unresolved, and what keeps it short of well_supported: the geography, environmental, metagenomic and lineage analyses are analytic layers over one Chinese CDC dataset through overlapping author teams, not independent confirmations (COV-E004, COV-E005, COV-E010). The load-bearing items are also the least load-tested: COV-C002 is a single p = 0.029 spatial result on an unaudited line list with an unresolved published exchange (COV-E001). Sensitivity: the record whose removal would most change the verdict is COV-E005, the wildlife-DNA co-detection. Without it, what remains — market centrality, western-zone concentration, an unreproduced spatial statistic — is accommodated equally by \"the market amplified an already-circulating outbreak,\" and the case verdict would not survive intact; it would fall back to the edge of unresolved. That is a verdict hanging on close to one thread, and it should be read that way. Institutional-integrity findings (COV-E026) remain walled off from the origin verdict; opportunity findings (COV-C018) establish feasibility, not occurrence."
