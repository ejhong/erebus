    verdict: well_supported
    reasoning: "Multiple channels converge: the spatial analysis of December 2019 cases, the concentration of positive environmental samples inside the market, and the Chinese CDC's own surveillance data placing 87.5 percent of interior positives in the market's west zone. The WHO scientific advisory group calls a zoonotic origin the best supported hypothesis on accessible evidence while declining to conclude the market was the first spillover site rather than a site of amplification."
    confidence: high
    treatment:
      plainLanguage: The earliest known cases cluster tightly around one market. This is the sturdiest finding in the case, and both sides now largely accept it — what they dispute is what it means.
      importance: headline
      diagnosticity: moderate
      diagnosticitySummary: An epicenter is predicted by market spillover, by upstream spillover with subsequent market arrival, and by amplification of a virus already circulating in humans. It discriminates against non-market origins collectively, not among the hypotheses that matter most here.
      strongestObjection: The finding rests entirely on Chinese case ascertainment that has never been independently audited, and the complete December 2019 line list has never been released. Cases were identified by clinical review, but the review itself is not inspectable.
      whatWouldChangeOurMind:
