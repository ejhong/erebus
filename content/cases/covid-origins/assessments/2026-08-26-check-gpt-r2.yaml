      readily explained by natural evolution and give no support to a man-made
      origin (COV-E014). The primary objection is conceptual: seamless
      reverse-genetics leaves no required “fingerprint,” so the absence of
      recognized diagnostic features cannot definitively exclude a carefully
      engineered virus, only one that would leave current forensic signatures."
  - claimId: COV-C013
    verdict: well_supported
