  synthesis: "The featured question — what initiated sustained human transmission
    in Wuhan in late 2019 — has exactly one hypothesis family with affirmative
    public evidence, and that evidence converges tightly but shallowly. Zoonotic
    spillover at or immediately upstream of the Huanan market rests on three
    pillars: the early-case geography, the environmental co-location of viral
    RNA with susceptible-wildlife DNA, and the two-lineage pattern. Each pillar
    is real and each is weaker than its popular citation. The geography includes
    the case's best single observation — unlinked cases living closer to the
    market than market workers — but that is one spatial statistic at p = 0.029,
    never independently reproduced, on an unaudited line list, with an
    unresolved published exchange against it. The co-location finding is genuine
    and is the only observation that a zoonotic origin specifically predicts,
    yet its own authors state it cannot establish infection, and an early human
    shedder produces the identical pattern. The two-introduction inference is
    the sharpest discriminator in the case, and its headline statistic was cut
    roughly fourteenfold by a code correction; the corrected Bayes factors still
    favor two introductions, but they sit in the low-positive band and the
    inference is hostage to several hundred withheld early sequences.
    Steelmanning the research-related family: the epicenter is fully consistent
    with amplification of a virus that arrived with an infected person; the
    DEFUSE passage documents contemplated insertion of exactly the feature class
    the virus carries, with a Wuhan partner, twenty months before the outbreak;
    BSL-2 practice establishes opportunity; and the custodian has never produced
    the inventories, health records, or raw data that could exculpate.
    Steelmanning the zoonotic family: no laboratory anywhere is known to have
    held a progenitor closer than decades of evolution away; no incident,
    seroconversion, or construct has surfaced through six years of subpoenas and
    declassification; the genome carries no accepted engineering signature; and
    the market pattern replicates the SARS-1 trade route in the same country.
    The two central absences — no infected animal, no laboratory holding — are
    symmetrical in form and both hostage to records one custodian declines to
    produce; the asymmetry is that only the zoonotic side has affirmative public
    evidence at all. That makes market zoonosis provisionally supported as the
    best current answer, not established: its transmission chain is unclosed,
    its load-bearing statistics are load-untested, and the research-related
    alternative is unresolved rather than excluded. Confidence in this ordering
    is moderate, and it would move materially on either the adversarial lineage
    reanalysis or the geographic reproduction, both of which require no one's
    permission."
