      multiply supported. The strongest opposing consideration is that every
      channel rests on Chinese case ascertainment that has never been
      independently audited, and the complete December 2019 line list has never
      been released, so the observation is one custodial act away from revision.
      That qualifies confidence in permanence, not the current verdict."
