      require one. Its value is negative and symmetric: it defeats both the
      "NIH-funded virus was the precursor" and the "named archived sequence was
      the leaked virus" arguments.'
  - claimId: COV-C016
    verdict: well_supported
    confidence: high
    reasoning: The cleavage-site passage is verbatim at a confirmed locator, read by
