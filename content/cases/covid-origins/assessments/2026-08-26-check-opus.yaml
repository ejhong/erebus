      be direct progenitors. The inference from ~4 percent divergence to decades
      of independent evolution leans on standard coronavirus molecular-clock
      background rather than on any evidence record here, which I flag
      explicitly. The strongest opposing consideration is that this is a
      statement about sampled, not existing, diversity — an unsampled closer
