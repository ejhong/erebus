      correctly the datum belongs to neither camp: persistent low-confidence
      disagreement among people with privileged access is strong evidence that
      no side held diagnostic material, and weak evidence about the origin
      itself."
  - claimId: COV-C015
    verdict: established
    confidence: high
    reasoning: "Both halves are verbatim in the report's conclusion, including the
