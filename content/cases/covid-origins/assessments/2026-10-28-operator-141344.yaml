  synthesis: "The ladder runs the same way, with one thread now thinner and the weight shifted off it. At the observation rung the record is strong: the earliest cluster centred on the market (COV-C001), 87.5 percent of interior environmental positives in the western section (COV-C004, COV-C005), wildlife mtDNA in positive swabs from a wildlife stall (COV-C006). At the mechanism rung it thins: COV-C010 survives its code correction at Bayes factors near 4, model-dependent and never independently reanalysed. At the attribution rung both families are empty — no infected supply-chain animal (COV-C008), no demonstrated performance of cleavage-site work (COV-C017), and no title in the June 2026 declassification's index names a progenitor, an incident or an infected worker (COV-E036). That asymmetry — one family with a convergent affirmative pattern at the lower rungs, nothing affirmative on the other side — keeps the case at provisionally_supported rather than unresolved, and short of well_supported: these are analytic layers over one Chinese CDC dataset through overlapping author teams, not independent confirmations. Sensitivity, re-graded this pass: the co-detection (COV-C006, COV-E005) is no longer the single record whose removal would most change the verdict, because its diagnosticity is downgraded here to low — the published reanalysis shows viral abundance does not track the susceptible species (COV-C020, COV-E033), and its author's conclusion is that co-mingling is unlikely to indicate infection either way (COV-E037). What the verdict now hangs on most is the epidemiological geography, COV-C002 — a single unreplicated spatial result at p = 0.029, which the assessment already grades provisionally supported and names its own weakest link. That is a thinner footing than the previous pass described, and it is stated plainly rather than absorbed."
  steelman: "The strongest argument for the zoonotic account that this assessment does not answer is the base rate. The closest precedent runs the zoonotic way: SARS-CoV-1 emerged through the wildlife trade in southern China, in related species, and close relatives were found in masked palm civets and raccoon dogs at wet markets and in farmed civets in Hubei — the province where SARS-CoV-2 later appeared, in a city with a large live-wildlife market. Against that prior, the research-related account proposes a mechanism never yet shown to have started a pandemic, while the market's evidential deficits are fully explained by a custodian who cleared the stalls, never sampled the live stock, and closed its investigation. This assessment treats the two absences as symmetrical; a reader weighing that prior heavily would say they are not. The previous pass stated this too strongly, and the correction matters in both directions. The reference class is not uniform: WHO's MERS fact sheet records dromedary camels as that coronavirus's primary reservoir and the route to humans, not a wildlife market. And laboratory escape of a coronavirus is not hypothetical: WHO's Disease Outbreak News of 22 April 2004 records that of the five SARS cases confirmed after the outbreak was declared over, two occurred in laboratory workers, in Singapore and in Taiwan, China — adding that none of the five led to further transmission. So the defensible version of the base-rate argument is narrower than the one usually made: no pandemic is known to have begun from research activity, not that no coronavirus has ever escaped a laboratory. This page cannot currently price that difference, and it remains the most likely reason a future panel would grade the case higher than provisionally_supported."
claimAssessments:
  - claimId: COV-C001
    verdict: well_supported
    reasoning: "Multiple channels converge: the spatial analysis of December 2019 cases, the concentration of positive environmental samples inside the market, and the Chinese CDC's own data placing 87.5 percent of interior positives in the west zone. The WHO group calls zoonotic origin the best supported hypothesis on accessible evidence while declining to conclude the market was the first spillover site rather than a site of amplification."
    confidence: high
    treatment:
      plainLanguage: The earliest known cases cluster tightly around one market. This is the sturdiest finding in the case, and both sides now largely accept it — what they dispute is what it means.
      importance: headline
      diagnosticity: moderate
      diagnosticitySummary: An epicenter is predicted by market spillover, by upstream spillover with subsequent market arrival, and by amplification of a virus already circulating. It discriminates against non-market origins collectively, not among the hypotheses that matter most here.
      strongestObjection: The finding rests entirely on Chinese case ascertainment that has never been independently audited, and the complete December 2019 line list has never been released.
      whatWouldChangeOurMind:
        - Release of the complete December 2019 case line list showing a materially different geographic distribution.
        - Evidence that early case-finding was concentrated around the market for administrative reasons.
  - claimId: COV-C002
    verdict: provisionally_supported
    reasoning: Stated directly in the published paper, which reports the unlinked cases resided significantly closer to the market than those with a direct link. The comparison is a spatial-statistical result on a case set of disputed completeness, at p = 0.029 — a margin one published critic characterizes as borderline. It has not been independently reproduced. With the co-detection's diagnosticity downgraded this pass, this is now the observation the case verdict most depends on, and it is also one of its weakest links.
    confidence: moderate
    treatment:
      plainLanguage: The single most load-bearing observation in the zoonotic case. People with no known market connection lived nearer the market than market workers did — which is what exposure at the market predicts and what a contact-tracing artifact does not.
      importance: headline
      diagnosticity: high
      diagnosticitySummary: The observation hardest for ascertainment-bias explanations to absorb, and therefore the load-bearing item distinguishing spillover at the market from amplification of a virus that arrived from elsewhere.
      strongestObjection: A published eLetter argues the early lineage cases were not closer to the market than statistically expected and challenges the distributional assumptions; the authors replied identifying flaws in that critique. The exchange is unresolved, and the underlying case data remains unreleased.
      whatWouldChangeOurMind:
        - Independent reproduction from released code, raw geospatial data, and case-definition history.
        - A preregistered alternative spatial model that dissolves the relationship under reasonable ascertainment corrections.
  - claimId: COV-C003
    verdict: well_supported
    reasoning: "Verified verbatim in the clinical study of the first 41 confirmed patients, which states the onset date and, in the next sentence, that no epidemiological link was found between the first patient and later cases. The claim is framed as what the publication states: the identification of this patient as the earliest case has been contested in later reporting that this case has not adjudicated."
    confidence: high
    treatment:
      plainLanguage: The first known patient had no market connection. This claim records what the published clinical study states — not a settled fact about the outbreak, because the case's date and status have been disputed elsewhere.
      importance: major
      diagnosticity: moderate
      diagnosticitySummary: Compatible with upstream spillover, with a research-related index infection, and with an unascertained earlier market chain. It weighs against the strictest version of market-only spillover without favoring any specific alternative.
      strongestObjection: A single case's reported exposure history in an early clinical series is weak evidence about the outbreak's origin, and the same paper reports that two-thirds of the series had direct market exposure.
      whatWouldChangeOurMind:
        - Release of the underlying case investigation records establishing this patient's actual exposures and onset date.
  - claimId: COV-C004
    verdict: well_supported
    reasoning: "Reported in the Chinese CDC's own peer-reviewed surveillance paper, with the sampling chronology stated explicitly: the market closed in the early morning of January 1, 2020, and sampling began the same day. Cite the 2024 version of record — the positive count was 73 in the 2023 accelerated preview and 74 after a note added in proof."
    confidence: high
    treatment:
      plainLanguage: The virus was found on surfaces throughout the market — but only after the market had been emptied and was being disinfected, which is the whole problem with interpreting it.
      importance: major
      diagnosticity: low
      diagnosticitySummary: Environmental RNA cannot identify who deposited it. An infected vendor, a customer, or an animal all produce the same swab result, so this observation is compatible with every hypothesis in the case.
      strongestObjection: Sampling began only after the market was cleared, and the paper records that stall surfaces and goods were disinfected through January and February 2020 — so what the sampling could still detect was bounded before it started.
      whatWouldChangeOurMind:
        - Nothing material on the observation; it is the interpretation that is contested.
  - claimId: COV-C005
    verdict: well_supported
    reasoning: "Two analytic layers agree, including the Chinese CDC's own data: of 64 positive samples collected inside the market, 87.5 percent came from the west zone. The spatial analysis separately found distance to the nearest live-mammal vendor predictive of sample positivity."
    confidence: high
    treatment:
      plainLanguage: The virus was not spread evenly across the market. It clustered where live wild mammals were sold.
      importance: major
      diagnosticity: moderate
      diagnosticitySummary: Consistent with animals as the source, and also with a poorly ventilated enclosed section concentrating human contamination. It narrows where to look without establishing what was there.
      strongestObjection: Advocacy analysis asserts the same section was the market's least ventilated area with no outside connection, which would concentrate positivity from human shedding alone. This case has not verified that characterization, and records it as an unverified stated objection.
      whatWouldChangeOurMind:
        - Ventilation and layout documentation showing the section's physical characteristics explain the clustering independently of what was sold there.
  - claimId: COV-C006
    verdict: well_supported
    reasoning: "The metagenomic reanalysis found wildlife DNA in all five SARS-CoV-2-positive samples from the wildlife stall, with raccoon dog the most abundantly detected species. Detection is uneven rather than uniform: raccoon dog and hoary bamboo rat in all five samples, Malayan porcupine in four, masked palm civet in one. The observation itself is not disputed by the reanalysis that challenges what it implies (COV-C020), whose author states that co-mingling of animal and viral material is unlikely to reliably indicate whether any animals were infected (COV-E037). The verdict on the observation is unchanged; its diagnosticity is downgraded this pass from moderate to low, which is the real effect of that exchange."
    confidence: high
    treatment:
      plainLanguage: Genetic traces of exactly the animals that could have carried the virus were found in the same positive samples. Critically, this shows the animals and the virus were in the same place — not that any animal was infected. The authors say so themselves.
      importance: headline
      diagnosticity: low
      diagnosticitySummary: "Downgraded from moderate on a cold re-grade. The case for weight was the original authors' point that only a zoonotic origin directly predicts co-detection of virus and wildlife material. Against it: co-presence is not infection, human shedding after a zoonotic event produces the same pattern, and a published reanalysis of the same data finds viral abundance does not track the susceptible species at all — so co-detection at a stall that sold wildlife, in a market where the virus was by then widespread, discriminates little between the hypotheses."
      strongestObjection: A published reanalysis counting viral reads against animal reads finds the correlation negative for raccoon dogs and hoary bamboo rats and at most weakly positive for the other susceptible species, with viral abundance highest alongside fish. A co-author of the original replies that the swabs came too late to identify any animal host either way — a concession that cuts the same direction.
      whatWouldChangeOurMind:
        - Archived tissue or serum from these animals testing positive, or a documented negative result on the actual stock.
        - Evidence that the co-detection pattern arises routinely where infected humans and animal products share a space.
  - claimId: COV-C020
    verdict: well_supported
    reasoning: "Measured in a published, fully reproducible pipeline over the same Chinese CDC sequencing data: of fourteen samples with at least a fifth of chordate mitochondrial material from raccoon dogs, only one contained any viral reads, at one read in roughly two hundred million. The paper states a negative correlation between viral abundance and mitochondrial material from raccoon dogs and hoary bamboo rats, and at most a weak positive correlation for other susceptible species thought to have been sold live, with the strongest correlations for fish such as catfish and largemouth bass. The measurement is not disputed by the published reply, which contests what it licenses rather than what it found."
    confidence: high
    treatment:
      plainLanguage: Where the market swabs are richest in the DNA of the animals that could have carried the virus, the virus itself is almost absent — and it is most abundant alongside fish that nobody thinks were infected.
      importance: major
      diagnosticity: moderate
      diagnosticitySummary: It bears on the inference from co-detection to infection, not on the market's role. A null or negative association weighs against reading co-detection as a sign of an infected animal; it cannot weigh against infection at an earlier date, before the stalls were cleared.
      strongestObjection: "The reply in the same journal argues a correlation analysis could never have answered the question: sampling followed weeks of human-to-human transmission, so neither a positive nor a null association would identify a host. On that reading the result restates a known limitation rather than adding evidence."
      whatWouldChangeOurMind:
        - Raw reads with complete stall and date metadata, allowing the association to be tested within sampling windows rather than across them.
        - A demonstration that comparable null associations do or do not arise in datasets from animal outbreaks with a known infected host.
  - claimId: COV-C007
    verdict: well_supported
    reasoning: "All 457 animal samples in the Chinese CDC survey tested negative, and the joint WHO study records China's account of tens of thousands of animals tested with no positives. Two qualifications matter enormously: the sampled animals were largely unsold stock, strays, and freezer contents rather than the candidate intermediate hosts — which the later reanalysis states were never sampled or tested — and the aggregate figure is the custodian's own unaudited account."
    confidence: moderate
    treatment:
      plainLanguage: The zoonotic case's missing keystone. After the largest search of its kind ever conducted, no infected animal has ever been found.
      importance: headline
      diagnosticity: moderate
      diagnosticitySummary: "The zoonotic case's principal empirical deficit, and weaker than it looks: an absence produced by not sampling the relevant species is largely uninformative. Its mirror image is the absence of any known laboratory holding, and this case treats the two alike."
      strongestObjection: The market was cleared and disinfected before sampling began, the upstream farm traceback was never completed, and the candidate host species were never tested — so this is substantially a fact about what investigators were permitted and able to look for.
      whatWouldChangeOurMind:
        - A pre-outbreak animal or archived sample carrying the virus or a basal near-progenitor.
        - A complete, independently audited account of what species were actually tested and when.
  - claimId: COV-C008
    verdict: unresolved
    reasoning: The zoonotic family's missing keystone. The co-location evidence is consistent with it and, by the analysing authors' own statement, cannot establish it; the published exchange over the metagenomic data ends with both parties agreeing the swabs cannot identify an animal host; no infected animal has ever been identified; and the animals that would have been tested were gone before sampling began. Unresolved here means genuinely open, not disfavored.
    confidence: moderate
    treatment:
      plainLanguage: Stated explicitly because it is what the co-location evidence is constantly read as having established, and has not. Naming it as unresolved is the point.
      importance: headline
      diagnosticity: high
      diagnosticitySummary: Resolving it either way would largely settle the case. Confirmation would establish the transmission chain; a thorough negative on the actual stock would remove the market-spillover hypothesis's foundation.
      strongestObjection: Nothing affirmative has ever been produced, and the physical opportunity to produce it has largely expired with the 2019 stock.
      whatWouldChangeOurMind:
        - Archived 2019 animal tissues or sera from the market's wildlife vendors testing positive.
        - Farm and trader records enabling a completed supply-chain traceback.
  - claimId: COV-C009
    verdict: well_supported
    reasoning: "Stated in the published analysis and unchanged by the paper's later erratum: the two lineages differ at two nucleotide sites, both of which are also found in related bat coronaviruses."
    confidence: high
    treatment:
      plainLanguage: The earliest genomes come in two slightly different versions. Nobody disputes this. What it implies is disputed, and that is a separate claim.
      importance: major
      diagnosticity: low
      diagnosticitySummary: The observation alone is compatible with every hypothesis; the inference from it carries all the weight and is graded separately.
      strongestObjection: Several hundred early Chinese sequences remain unpublished, so the early-diversity picture is incomplete by construction.
      whatWouldChangeOurMind:
        - Release of the withheld early sequences revealing intermediate genomes that change the lineage structure.
  - claimId: COV-C010
    verdict: mixed
    reasoning: "A model-based inference whose published support was materially corrected. A code error had overestimated the Bayes factors: they fell from 61.6 and 60.0 to 4.3 and 4.2, and the authors' wording moved from strong to substantial support. The corrected analysis still favors multiple introductions, so characterizations that the correction reduced the finding to negligible are not supported by the erratum. The inference remains sensitive to rooting choices, clock assumptions, unsampled intermediates, and which early sequences are trusted."
    confidence: moderate
    treatment:
      plainLanguage: If the virus jumped to humans more than once, that is easy under wildlife-trade spillover and awkward under a single infected worker. The published support for it was reduced fourteenfold by a correction — but not eliminated.
      importance: headline
      diagnosticity: high
      diagnosticitySummary: One of only two or three genuine discriminators in the whole case. Two independent introductions are readily produced by wildlife-trade spillover and awkward for any single-index-infection account. If it fails, the zoonotic case retreats to market amplification plus an unknown upstream event.
      strongestObjection: A fourteenfold reduction in the support statistic on correction is a substantial demotion, and the remaining value sits in the lower band of positive evidence. The WHO group reports the finding and attributes the judgment to the original authors rather than adopting it; a congressional majority report asserts a single introduction instead.
      whatWouldChangeOurMind:
        - A preregistered adversarial reanalysis with methods and sequence-inclusion criteria fixed before unblinding.
        - Release of the unpublished early sequences, which could add intermediate genomes.
  - claimId: COV-C011
    verdict: well_supported
    reasoning: "The feature's presence and its absence from close relatives are not in dispute; the field-virology paper describing the closest Laotian relatives states that none of those bat viruses contains a furin cleavage site. The widely circulated stronger formulation — that such a site is \"not found in nature\" — is contradicted: furin motifs occur across other coronavirus lineages, and the WHO group states the feature had been previously identified in nature."
    confidence: high
    treatment:
      plainLanguage: The genome feature that launched a thousand arguments. It is real, and it is read as suspicious by one side and as ordinary natural variation by the other — which is why it is the best calibration point in the case.
      importance: headline
      diagnosticity: low
      diagnosticitySummary: "The clearest illustration in the case of why credibility and diagnosticity are separate axes: a highly credible observation with near-zero discriminating power, because both hypothesis families accommodate it comfortably."
      strongestObjection: Natural sarbecovirus diversity is badly undersampled, so absence from known relatives is weak evidence about what exists in nature; and the site is suboptimal, which is not what deliberate design from known motifs would predict.
      whatWouldChangeOurMind:
        - Discovery of a natural sarbecovirus carrying a furin cleavage site, which would end the uniqueness argument outright.
  - claimId: COV-C012
    verdict: well_supported
    reasoning: Almost all US intelligence elements assessed the virus was not genetically engineered, and all assessed it was not developed as a biological weapon. The WHO group concluded the notable genomic features are readily explained by natural evolution and provide no support for a man-made origin — and in the very next sentence, that a man-made origin "is also not refuted by biological data." Both halves belong together.
    confidence: high
    treatment:
      plainLanguage: No engineering fingerprint has been found. This weighs against the deliberate-construct hypothesis specifically — and barely at all against a natural virus escaping a lab, which needs no fingerprint.
      importance: headline
      diagnosticity: moderate
      diagnosticitySummary: Weighs specifically against an engineered-construct origin. It has almost no force against a field-collection or laboratory incident involving an unmodified natural virus, and the intelligence reporting itself notes the institute possessed methods that leave no trace of modification.
      strongestObjection: '"No diagnostic signature" and "no research accident" are different statements. Seamless reverse genetics leaves no required scar, so the absence of a signature cannot exclude a laboratory origin — only a detectably engineered one.'
      whatWouldChangeOurMind:
        - Identification of a construct map, plasmid or synthesis order, or passage record connecting a precursor to the virus.
        - Development of a forensic method able to distinguish seamless engineering from natural recombination.
  - claimId: COV-C013
    verdict: well_supported
    reasoning: "The identity figures are published and consistent: roughly 96 percent whole-genome identity for the closest bat relatives, which the intelligence assessment states are not close enough to be direct progenitors. The sources differ slightly on the figure — 96.2 percent in the original description, 96.1 percent in two later papers — so this case attributes a number to the source stating it rather than asserting one canonical value."
    confidence: high
    treatment:
      plainLanguage: The nearest known relatives are decades of evolution away. This single fact defeats popular arguments on both sides at once.
      importance: major
      diagnosticity: low
      diagnosticitySummary: "Earns its place by defeating two popular arguments simultaneously: that a specific NIH-funded virus was the precursor, and that a named archived sequence was the leaked virus. Neither is possible at this genetic distance."
      strongestObjection: "It is a statement about sampled diversity, not about existing diversity: an unsampled closer relative is entirely plausible, which is exactly what both hypothesis families require."
      whatWouldChangeOurMind:
        - Discovery or disclosure of a substantially closer relative, whether from field sampling or from a laboratory inventory.
  - claimId: COV-C016
    verdict: well_supported
    reasoning: "The passage is verbatim in the proposal at a confirmed locator, read by two independent optical-character passes that agree on every substantive word. The non-award is confirmed three ways: the congressional record, contemporaneous reporting, and a negative check of federal award data. Graded well supported rather than established only because the copy available is a third-party archive upload rather than an official release, and because the text is OCR-derived."
    confidence: high
    treatment:
      plainLanguage: The strongest documentary point on the research-related side. A funding application twenty months before the outbreak proposed inserting exactly the kind of feature the pandemic virus turned out to have, with a Wuhan partner — and it was rejected. This claim is about what a document says, and it claims nothing more.
      importance: headline
      diagnosticity: moderate
      diagnosticitySummary: Circumstantial evidence of research intent and capability, and weak direct evidence about this virus's ancestry. It establishes that inserting such a site was a contemplated technique in a program with a Wuhan partner — genuinely more than the zoonotic account predicts, and considerably less than execution.
      strongestObjection: The proposal was rejected and never funded; the specific viral backbones it contemplated are argued to be too distant from SARS-CoV-2 to be a plausible precursor; and a document describing intended work is not evidence that the work occurred.
      whatWouldChangeOurMind:
        - An authenticated official copy of the proposal, which would raise this to established.
        - Evidence that the cleavage-site passage was removed before submission or never part of the submitted version.
  - claimId: COV-C017
    verdict: unresolved
    reasoning: "The proposal was not funded, no public record shows the experiment was carried out, and no published precursor sequence connects the contemplated constructs to SARS-CoV-2 — including in the June 2026 declassification, whose index names no such document. Against that: the intelligence reporting records that the institute possessed reverse-genetic methods leaving no trace, and the records that would settle the question have never been produced. Unresolved here means genuinely open in both directions."
    confidence: moderate
    treatment:
      plainLanguage: The step from document to deed, stated explicitly because this is where the argument is usually smuggled across. There is no public record that the work was done.
      importance: headline
      diagnosticity: high
      diagnosticitySummary: Resolving it either way would move the case substantially. Documented performance of such work would convert a documentary coincidence into a mechanism; documented absence would reduce the proposal to what it appears to be on its face.
      strongestObjection: An unfunded proposal is weak grounds for inferring the work happened anyway, and six years of investigation — including congressional subpoenas and two declassification reviews — has produced no document showing it did.
      whatWouldChangeOurMind:
        - Institutional biosafety approvals, internal project records, plasmid or synthesis orders, or raw sequencing reads bearing on whether the work was performed.
  - claimId: COV-C018
    verdict: well_supported
    reasoning: Stated in the 2023 declassified report at a confirmed locator, together with its own caveats. The same document records that the community knows of no specific biosafety incident that caused the pandemic, and characterizes a November 2019 biosafety training course at the institute as appearing routine rather than an emergency response.
    confidence: high
    treatment:
      plainLanguage: Work with viruses capable of infecting humans was being done at a containment level below what many Western labs would use. This establishes opportunity — which every research-related scenario shares, and which is also compatible with no incident at all.
      importance: major
      diagnosticity: low
      diagnosticitySummary: Establishes opportunity and degraded practice, which the field, laboratory, and engineered scenarios all share equally, and which is also consistent with nothing having happened. Opportunity is not evidence of occurrence.
      strongestObjection: Inadequate biosafety practice was common in coronavirus research globally in that period; the same report finding the practice inadequate also reports no indication that the institute held this virus or a close progenitor, and no evidence of a specific incident.
      whatWouldChangeOurMind:
        - An independent audit of the institute's experiment logs, containment records, and 2019 occupational-health files.
  - claimId: COV-C022
    verdict: provisionally_supported
    reasoning: "The release index lists the report first, with its date and title. The document itself is scanned imagery with no text layer in the released PDF, so nothing beyond the title has been read here: not what it assessed, on what information, at what confidence, or how much is redacted. Press accounts quote an assessment that the conditions for an accidental release were present, but this case does not take a quotation from a document it has not read."
    confidence: moderate
    treatment:
      plainLanguage: The one origin document named in the June 2026 release's index is a weapons-laboratory report from May 2020. Its title says the conditions for laboratory modification were present — which is not the same as saying one happened, and the pages that would tell us which it meant cannot yet be read.
      importance: supporting
      diagnosticity: indeterminate
      diagnosticitySummary: A title cannot be graded. If the report assessed that conditions existed, it duplicates what COV-C018 already records; if it assessed that a modification occurred, and on what basis, it would be the most consequential document on the research-related side. Those are different propositions and the record does not yet distinguish them.
      strongestObjection: Nothing of the document's reasoning, sourcing, or confidence language has been read, and an index entry is the releasing office's own description. The same office's announcement states conclusions its own community's assessments do not.
      whatWouldChangeOurMind:
        - A text-bearing copy of the report (COV-R009), which would either promote this to a graded finding or reduce it to a restatement of known opportunity.
  - claimId: COV-C014
    verdict: well_supported
    reasoning: "The agency split and its confidence levels are stated in both declassified assessments. The confidence language is the part that matters and the part routinely dropped: every position is low confidence except one at moderate, and a later agency change of position was reported as resting on a review of existing information rather than new intelligence. The June 2026 release's index names no assessment of the origin written after 2023."
    confidence: high
    treatment:
      plainLanguage: "Analysts with access to classified reporting split, and stayed split. The correct reading is neither camp's: it means nobody held decisive evidence."
      importance: headline
      diagnosticity: low
      diagnosticitySummary: "Nearly uninformative about the origin and highly informative about the evidence: sustained disagreement among analysts with privileged access indicates that no side held diagnostic material."
      strongestObjection: These are declassified summaries whose underlying reporting cannot be audited by any reader, and the successive assessments are products of the same community rather than independent checks on each other.
      whatWouldChangeOurMind:
