      diagnosticitySummary: Evidence about an institution's stated position, not about the origin. It is recorded on the same footing as China's white paper and the 2025 agency statement, and for the same reason.
      strongestObjection: An announcement is political communication and a poor guide to what the releasing institution's analysts believe; reading it as an intelligence position would be the error this page warns against in the other direction.
