caseAssessment:
  verdict: provisionally_supported
  whatIsClaimed: The zoonotic account claims spillover from the live-wildlife trade in roughly November–December 2019, possibly more than once. The research-related account claims a field, laboratory, or engineered-construct exposure, in descending order of support. This case grades the evidence disputes. It does not grade anyone's culpability, honesty, or intent.
  whereDisagreementLives: "Not over whether the market was the early epicenter; both sides largely accept it. The live disputes sit one rung up. Epicenter versus origin: the market was cleared and disinfected before sampling, so environmental RNA cannot say who deposited it. One introduction or two: the inference is model-dependent and rests partly on unpublished sequence data. And the two absences — no infected animal after the largest such search on record, no laboratory known to have held a progenitor — each side reading the other's as telling and its own as merely hard."
  whatWouldSettleIt: "Documents and datasets, not argument. On the zoonotic side: trader and farm records, archived 2019 animal tissues and sera, raw market reads with stall metadata. On the research-related side: the laboratory sample database that went offline, freezer inventories, de-identified 2019 occupational-health records with stored sera. Common to both: the several hundred early-patient sequences WHO says remain unavailable. Most of that is political will, not research. The exception is a preregistered adversarial reanalysis of the lineage question, on public data."
  bestConventionalExplanation: "A sarbecovirus, plausibly via an intermediate mammal, entered the live-wildlife supply chain and reached Wuhan, crossing into humans at or immediately upstream of the Huanan market in roughly November–December 2019 — most likely more than once. This is not an argument from the absence of a laboratory smoking gun; it is the only hypothesis with multiple affirmative lines of public evidence converging on the same few hundred square metres. The earliest cases cluster around the market, and cases with no reported market link lived closer to it than cases who worked there. Positive samples concentrate where live-mammal vendors operated; wildlife DNA co-occurs with viral RNA at a wildlife stall; those species amplified the earlier SARS outbreak through the same trade. The genome carries no accepted forensic signature of engineering. Its unpaid debts are real: no infected animal was ever found, the farm traceback was never completed, and the market's animals were gone before anyone sampled them."
  components:
    - label: Huanan market as early epicenter of the recognized outbreak
      state: well_supported
      note: "Multiple channels: early-case geography, environmental positivity, district-level excess pneumonia and later seroprevalence. Rests on case ascertainment never independently audited."
    - label: Market as the site of the initial animal-to-human spillover
      state: provisionally_supported
      note: "The best-developed affirmative case, and its transmission link is unclosed: no infected animal, and post-clearance swabs cannot say who deposited the RNA."
    - label: Research-related incident (any variant)
      state: unresolved
      note: A real conjunction of capability, opportunity, documented intent-on-paper, and opacity — with no publicly disclosed progenitor, incident, or infected worker, and none named in the titles indexed in the June 2026 release.
    - label: Engineered-construct origin specifically
      state: weakly_supported
      note: Almost all US intelligence elements assessed the virus was not genetically engineered, and the notable genomic features have published natural explanations. Not excluded — seamless methods leave no required scar — but affirmatively unsupported.
    - label: Deliberate engineering and release as a weapon
      state: contradicted
      note: All US intelligence elements assessed the virus was not developed as a biological weapon; no affirmative public evidence exists.
    - label: Early public scientific certainty exceeded contemporaneous private belief
      state: provisionally_supported
      note: Documentary, and orthogonal to the biological question. Rests on released communications whose completeness is contested. It does not cross into the origin layer.
  researchPriority:
    level: high
    reason: "Two of the highest-yield tests need no one's permission and run on already-public data: an adversarial preregistered reanalysis of the lineage question, and an independent reproduction of the geographic signal. The rest are disclosure requests whose cost is diplomatic rather than scientific."
