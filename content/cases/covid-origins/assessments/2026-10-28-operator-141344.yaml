  - claimId: COV-C015
    verdict: well_supported
    reasoning: Both halves are verbatim in the report's conclusion, including the qualification "reviewed by SAGO" that ellipsis often removes. The group states it had no access to original raw data from any source, and that requested information was not provided by three governments — China, Germany, and the United States — not by China alone.
    confidence: high
    treatment:
      plainLanguage: "The most authoritative current scientific synthesis says two things at once, and they must be read together: zoonosis is best supported by what could be seen, and a key alternative could not be examined at all."
      importance: headline
      diagnosticity: moderate
      diagnosticitySummary: Carries real weight as an expert synthesis and inherits its dependence on a partly withheld evidence base. A page treating it as settling the question would silently inherit that dependence.
