  synthesis: "The case reduces to one asymmetric convergence and two symmetric
    absences. The asymmetry: every affirmative line of public evidence about
    where sustained transmission began — early-case geography (C001, C002),
    environmental positivity concentrated where live mammals were sold (C005),
    and co-detection of susceptible-wildlife DNA with viral RNA at a wildlife
    stall (C006) — converges on a few hundred square metres of Wuhan, and the
    custodian's own surveillance data corroborate the spatial pattern. That is
    why the zoonotic-family answer earns provisionally_supported rather than
    unresolved: it is the only hypothesis with multiple affirmative, mutually
    reinforcing lines. The symmetry: neither family has produced its keystone.
    No infected animal or near-progenitor has been found in the trade (C007,
    C008), and no laboratory is known to have held one (C013, with the 2023
    intelligence report recording no indication either way); each absence is
    hostage to records a single custodian has not produced, and each camp's
    habit of reading the other's absence as damning and its own as merely hard
    is a prior commitment, not a measurement. The steelman for the
    research-related family is genuinely documentary, not vaporous: a 2018
    proposal contemplating insertion of exactly the feature class that later
    emerged, with a Wuhan partner (C016); SARS-like coronavirus work at BSL-2
    with assessed precaution lapses (C018); and an unbridged document-to-deed
    gap (C017) that six years of subpoenas and declassification have not closed.
    But the same record contains no execution evidence, no precursor sequence,
    no incident, and no infected worker, and the genomic findings (C011, C012)
    plus the too-distant-relatives result (C013) defeat the popular strong
    variants outright — what remains live is a natural-virus research incident,
    which needs no engineering scar. The zoonotic case's weaknesses are equally
    concrete: it is one evidence stream (a single Chinese CDC dataset under
    three analytic layers with overlapping authors) resting on unaudited case
    ascertainment; its keystone C008 is absent and its testing window has
    largely closed; its load-bearing spatial statistic (C002) sits at p = 0.029,
    unreproduced, in an unresolved published exchange; and its most diagnostic
    inference (C010) was demoted roughly fourteenfold by its own authors' code
    correction to modest positive support that a withheld sequence set could
    still overturn. The persistent low-confidence split among analysts with
    privileged access (C014) is itself evidence that no side holds decisive
    material, and WHO's two-part conclusion (C015) — zoonosis best supported on
    reviewed evidence, the laboratory route unassessable — is the correct shape
    of the answer and inherits the withheld-evidence problem it names. Where
    this verdict leans on priors rather than evidence records, I flag it: the
    SARS-1 trade precedent and the base-rate intuition that unfunded proposals
    stay unexecuted are background calibration, not ledger items. Verdict:
    provisionally_supported for zoonotic spillover at or immediately upstream of
    the market, with the transmission chain unclosed and the research-related
    family unresolved; the two desk tests in the research agenda (adversarial
    reanalysis of C010, independent reproduction of C002) are the cheapest
    places this verdict could move."
