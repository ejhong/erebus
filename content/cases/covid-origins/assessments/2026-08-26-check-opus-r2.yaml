      that these are summaries of unauditable classified reporting produced
      successively by the same community, so they are not independent checks on
      each other; that limits what the split can tell us, but it does not
      undermine the claim, which is about the split itself.
  - claimId: COV-C015
    verdict: established
    confidence: high
    reasoning: "Both halves are verbatim in the SAGO conclusion, including the
      qualifier \"reviewed by SAGO\" that ellipsis usually removes, and the
      report states plainly it had no access to original raw data from any
      source. The Director-General's remarks on release said the same. The
      strongest opposing consideration is about what the claim licenses rather
      than its truth: a synthesis is only as good as its access, requested
      information was withheld by three governments rather than one, and the
      2021 predecessor's \"extremely unlikely\" rating for a laboratory incident
      has already been superseded — demonstrating how far such judgments can
      move on a substantially unchanged data base."
