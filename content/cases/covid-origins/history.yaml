- date: "2026-08-26"
  change: >-
    Confirmation pass on the metagenomics evidence record (COV-E005),
    closing the weakest provenance link in this case. The version of record
    was reached from two Internet Archive captures of the publisher's own
    full-text page after sixteen other routes failed, and the three body-text
    quotations were checked against it. Two are verbatim. The third carried
    one pre-copyedit word — the record quoted "While either animal or human
    viral shedding is consistent with these data", where the published text
    reads "Although" — and has been corrected. The locator now names the
    published sections rather than the manuscript, and the
    author-manuscript caveat is removed because the pass it asked for has
    been done.

    The caveat was deliberately not lifted on its own: removing it while
    leaving the pre-copyedit wording in place would have converted an
    honestly flagged manuscript quotation into an unflagged misquotation of
    the version of record, which is worse than the state it replaced.

    Also established and recorded: the public repository deposit for this
    paper is the accepted author manuscript, not the version of record, and
    the paper is not open-access under a reuse licence. Verification stays
    ai_verified — AI-performed citation checking is never promoted, and no
    copy is held in a project library.
  reason: >-
    Founder direction to complete the open items from the case launch. The
    remaining limitations on the record — shared data and authorship with
    the companion papers, and the authors' own statement that their data
    cannot identify the infected species — are untouched by this pass; the
    second is strengthened, since it is now confirmed verbatim in the
    published text.
  actor: "Erebus editorial AI (Claude Fable 5, Cursor cloud agent)"
  aiAssisted: true
  kind: content

- date: "2026-08-26"
  change: >-
    Added three plates to the overview article: three photographs — live susceptible mammals documented on sale at the market before the pandemic, the market sealed and being disinfected after closure, and the entrance of the research institute. All are real imagery
    under reusable licences with photographer, date, source, and original
    title recorded; captions state what each image shows and, where it
    matters more, what it does not establish.

    Generated artwork remains barred from the plate role by the schema, so
    every plate here is a document or a photograph rather than an
    illustration. The selection is deliberately evidential rather than
    atmospheric — the imagery that bears on this case is the record itself,
    and photographs chosen for impact would sit badly with a page arguing
    that impact is not evidence.
  reason: >-
    Founder direction to make the articles more readable. Classified as
    content, not housekeeping, on an arbiter seat's objection. The engine's
    own display heuristic would treat an images.yaml change as housekeeping,
    and the covers were logged that way — but this change also edits article
    text to place the plates, and the plate captions make evidential
    statements linked to specific claims. Where the classification is
    genuinely arguable, AGENTS.md §3.15's bar on reclassifying a change to
    dodge a check means taking the conservative side: content, so the panel
    re-judges the case file as a reader now sees it.
  actor: "Erebus editorial AI (Claude Fable 5, Cursor cloud agent)"
  aiAssisted: true
  kind: content

