# Candidates considered and not admitted, each with its reason, so that no
# later session re-litigates them without saying what changed.

- key: "url:archive.dni.gov/files/documents/Newsroom/Reports%20and%20Pubs/COVID-19_Release_DNI_Gabbard_6-18_Part-1.pdf"
  kind: source
  disposition: excluded
  observed: "Declassified COVID-19 origins records released by the Office of the Director of National Intelligence, 18 June 2026 (part 1 of several, 94 pp.)"
  reason: >-
    Located and partly read 2026-10-23. It is genuine primary material and
    it belongs in this case, but it is not a one-session job: the pages are
    heavily redacted internal correspondence, briefing readouts and
    open-source compilations, and nearly all of the public argument about
    the release concerns allegations against named living people rather
    than the origin question. Admitting fragments of it in the time left
    would have risked exactly the thing the living-persons rules forbid —
    repeating an accusation the document does not establish. It is now
    research item COV-R009, to be read in full and extracted at the
    observation rung.
  reopenIf: "A session has the budget to read the whole release and extract only what bears on the evidence."
  by: "2026-10-23-session-site-123704"
  date: "2026-10-23"

