findings:
  - statement: >-
      The precise table refutes both popular compressions. "The agencies
      concluded lab leak" and "the agencies concluded natural origin"
      are each false as stated: at every documented date the positions
      span a low-confidence natural-origin group (NIC plus four
      elements), one moderate-confidence and later one low-confidence
      laboratory-lean (FBI; DOE), and explicit abstentions (three
      elements in 2021; CIA and one other in 2023) — with all agencies
      agreeing throughout that both hypotheses are plausible, that the
      virus was not developed as a bioweapon, and (most agencies, low
      confidence) that it probably was not genetically engineered.
    evidenceId: COV-E032
  - statement: >-
      Confidence language is the load-bearing data the public debate
      drops: no United States agency has ever held a high-confidence
      position on origin in the released record. The strongest stated
      confidence anywhere in the table is the FBI's moderate; every
      other position — natural-origin, laboratory-lean, and the CIA's
      2025 shift — is low confidence or explicit abstention, and the
      CIA statement itself pairs its lean with a same-sentence
      reaffirmation that both scenarios remain plausible.
    evidenceId: COV-E032
  - statement: >-
      The changes over time are few, dated, and documented: DOE's
      laboratory-lean enters the official record in the June 2023
      statutorily compelled report; the CIA moves from abstention to a
      low-confidence research-related lean in January 2025, with
      officials stating the review used no new intelligence. ODNI's own
      stated cause of the divergence — 'differences in how agencies
      weigh intelligence reporting and scientific publications' rather
      than different evidence pools — is exactly the proposition the
      declassification request this study feeds (COV-R007) would let
      the public test.
    evidenceId: COV-E032
  - statement: >-
      Reported ungraded, per the freeze: the February 2023 press
      descriptions of DOE's position (anonymous-sourced until the June
      2023 official carrier); a searcher-proposed July 2023
      congressional-testimony quotation of the FBI director that could
      not be natively verified and was excluded rather than trusted;
      and the April 2025 White House origins webpage — an official
      executive-communication document, but not an agency assessment,
      and therefore outside the frozen population (noted here so its
      absence is a decision on the record, not an oversight).
limitations:
  - >-
    The table records stated positions, not their merits: it cannot say
    which agency weighed the evidence correctly, and it inherits the
    releases' own limits — the classified annexes and the analytic
    record behind each confidence label remain unreleased, which is
    COV-R007's point.
  - >-
    Agency attribution in the 2021 assessment is by grouped description
    ('one IC element,' 'four elements'), not by name; the FBI row's
    identification rests on the bureau's own later on-record statements
    and the 2023 report's named positions, and the 'one other agency'
    abstaining alongside the CIA in 2023 remains unnamed in the public
    record.
  - >-
    Searcher coverage: GEMINI_COVERAGE. The OpenAI substitute run
    proposed one additional position-instance (a July 2023 testimony
    quotation) whose wording could not be natively verified and which
    was excluded per the never-cite-briefs rule.
