id: COV-001
slug: covid-origins
title: "The Origins of SARS-CoV-2"
subtitle: "What event initiated sustained human transmission of SARS-CoV-2 in Wuhan in late 2019 — and why does the evidence that would settle it sit with a single custodian?"
domain: "Contested public events · Scientific and intelligence dispute"
status: active
summary: >-
  Two families of explanation compete for the origin of SARS-CoV-2. The zoonotic family holds that the virus reached humans from wildlife at or immediately upstream of the Huanan Seafood Wholesale Market. The research-related family holds that it, or a close progenitor, was present in a Wuhan research program and reached the city through an infected person. Under both, the market matters; they disagree about whether it is where the virus entered humans or where an already-human virus amplified. This case separates three layers that public argument constantly merges: what infected the first humans, what laboratories could do or planned to do, and how institutions handled records and candor. Misconduct in the third licenses re-weighting testimony; it is not origin evidence. The case turns on two symmetrical absences — no infected animal has ever been found, and no laboratory is known to have held the virus or a close progenitor — each of which is hostage to records that have never been produced.
