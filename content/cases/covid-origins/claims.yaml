# COV-001 featured claims. Wording was frozen against the verified primary
# text before the evidence pass (AGENTS.md §3.12). Several claims read more
# narrowly than their popular versions because verification found the
# popular version misquoted: the WHO report contains no statement calling
# the missing intermediate host "surprising," and it draws no contrast
# between the two-lineage pattern and a laboratory introduction. Claims
# grade evidence disputes only — never any person's conduct, honesty, or
# intent.

