# COV-001 featured claims. Wording was frozen against the verified primary
# text before the evidence pass (AGENTS.md §3.12). Several claims read more
# narrowly than their popular versions because verification found the
# popular version misquoted: the WHO report contains no statement calling
# the missing intermediate host "surprising," and it draws no contrast
# between the two-lineage pattern and a laboratory introduction. Claims
# grade evidence disputes only — never any person's conduct, honesty, or
# intent.

# ── early cases and geography ───────────────────────────────────────────

- id: COV-C001
  tier: featured
  statement: >-
    The Huanan Seafood Wholesale Market was the geographic center of the
    earliest documented cluster of SARS-CoV-2 infections in Wuhan in
    December 2019.
  plainLanguage: >-
    The earliest known cases cluster tightly around one market. This is the
    sturdiest finding in the case, and both sides now largely accept it —
    what they dispute is what it means.
  theme: early-geography
  rung: observation
  claimType: statistical
  importance: headline
  reviewState: ai_extracted
  origin:
    ref: "casework/covid-origins digest — C001"
    extractedBy: "Claude Fable 5 (Cursor cloud agent)"
    runId: "case-covid-launch-2026-08-26"
    date: "2026-08-26"
  credibility: well_supported
  credibilitySummary: >-
    Multiple channels converge: the spatial analysis of December 2019 cases,
    the concentration of positive environmental samples inside the market,
    and the Chinese CDC's own surveillance data placing 87.5 percent of
    interior positives in the market's west zone. The WHO scientific
    advisory group calls a zoonotic origin the best supported hypothesis on
    accessible evidence while declining to conclude the market was the first
    spillover site rather than a site of amplification.
  diagnosticity: moderate
  diagnosticitySummary: >-
    An epicenter is predicted by market spillover, by upstream spillover
    with subsequent market arrival, and by amplification of a virus already
    circulating in humans. It discriminates against non-market origins
    collectively, not among the hypotheses that matter most here.
  strongestObjection: >-
    The finding rests entirely on Chinese case ascertainment that has never
    been independently audited, and the complete December 2019 line list has
    never been released. Cases were identified by clinical review, but the
    review itself is not inspectable.
  whatWouldChangeOurMind:
    - "Release of the complete December 2019 case line list showing a materially different geographic distribution."
    - "Evidence that early case-finding was concentrated around the market for administrative reasons."

- id: COV-C002
  tier: featured
  statement: >-
    Among the earliest documented cases, those with no reported Huanan
    market exposure resided significantly closer to the market than cases
    who worked there.
  plainLanguage: >-
    The single most load-bearing observation in the zoonotic case. People
    with no known market connection lived nearer the market than market
    workers did — which is what exposure at the market predicts and what a
    contact-tracing artifact does not.
  theme: early-geography
  rung: observation
  claimType: statistical
  importance: headline
  reviewState: ai_extracted
  origin:
    ref: "casework/covid-origins digest — C002"
    extractedBy: "Claude Fable 5 (Cursor cloud agent)"
    runId: "case-covid-launch-2026-08-26"
    date: "2026-08-26"
  credibility: provisionally_supported
  credibilitySummary: >-
    Stated directly in the published paper, which reports the unlinked cases
    resided significantly closer to the market than those with a direct link
    and infers exposure at or near the market. The comparison is a
    spatial-statistical result on a case set of disputed completeness, at
    p = 0.029 — a margin one published critic characterizes as borderline.
    It has not been independently reproduced.
  diagnosticity: high
  diagnosticitySummary: >-
    The observation hardest for ascertainment-bias explanations to absorb,
    and therefore the load-bearing item distinguishing spillover at the
    market from amplification of a virus that arrived from elsewhere.
  dependsOnClaimIds: [COV-C001]
  strongestObjection: >-
    A published eLetter argues the early lineage cases were not closer to
    the market than statistically expected and challenges the analysis's
    distributional assumptions; the authors replied identifying flaws in
    that critique. The exchange is unresolved, and the underlying case data
    remains unreleased, so no third party has reproduced either side.
  whatWouldChangeOurMind:
    - "Independent reproduction from released code, raw geospatial data, and case-definition history."
    - "A preregistered alternative spatial model that dissolves the relationship under reasonable ascertainment corrections."

