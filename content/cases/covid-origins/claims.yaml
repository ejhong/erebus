- id: COV-C015
  tier: featured
  statement: >-
    The WHO Scientific Advisory Group concluded in June 2025 that the weight
    of the evidence it reviewed suggests zoonotic spillover, while stating
    that it could not assess a laboratory origin because the necessary
    information had not been provided.
  plainLanguage: >-
    The most authoritative current scientific synthesis says two things at
    once, and they must be read together: zoonosis is best supported by what
    could be seen, and a key alternative could not be examined at all.
  theme: assessments
  rung: observation
  claimType: observation
  importance: headline
  reviewState: ai_extracted
  origin:
    ref: "casework/covid-origins digest — C025, corrected at verification"
    extractedBy: "Claude Fable 5 (Cursor cloud agent)"
    runId: "case-covid-launch-2026-08-26"
    date: "2026-08-26"
  credibility: well_supported
  credibilitySummary: >-
    Both halves are verbatim in the report's conclusion, including the
    qualification "reviewed by SAGO" that ellipsis often removes. The group
    states it had no access to original raw data from any source, and that
    requested information was not provided by three governments — China,
    Germany, and the United States — not by China alone.
  diagnosticity: moderate
  diagnosticitySummary: >-
    Carries real weight as an expert synthesis and inherits its dependence
