# ── early cases and geography ───────────────────────────────────────────

- id: COV-E001
  title: "Early cases clustered around the market, including cases with no market link"
  claimIds: [COV-C001, COV-C002]
  sourceId: SRC-WOROBEY-2022
  direction: supports
  strength: strong
  sourceStatement: >-
    "We considered three categories of cases, which were all significantly
    closer to the Huanan market than expected: (i) all cases (median
    distance 4.28 km; P < 0.001), (ii) cases linked directly to the Huanan
    market (median distance 5.74 km; P < 0.001), and (iii) cases with no
    evidence of a direct link to the Huanan market (median distance 4.00
    km; P < 0.001)." And, from the Discussion: "this group of cases resided
    significantly closer to the market than those who worked there,
    indicating that they had been exposed to the virus at or near the
    Huanan market. For market workers, the exposure risk was their place of
    work, not their residential locations, which were significantly farther
    afield than those cases not formally linked to the market."
  editorInference: >-
    This is the observation that ascertainment bias has the hardest time
    explaining. If early cases were found because investigators looked
    around the market, the unlinked cases should not be the ones living
    nearest it. The comparison is significant at p = 0.029, which is a
    modest margin for a load-bearing result.
  exactLocator: "Science 377(6609):951–959, Results ('Early cases lived near to and centered on the Huanan market') and Discussion, opening paragraph"
  limitations:
    - "Rests on Chinese case ascertainment that has never been independently audited; the complete December 2019 line list has not been released."
