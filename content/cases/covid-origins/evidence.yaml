  editorInference: >-
    The strongest affirmative market evidence, and its limits are stated by
    the people who produced it rather than by critics. The asymmetry the
    authors identify is genuine and easy to miss: co-detection is what
    zoonosis specifically predicts, even though human shedding after a
    zoonotic event would produce the same pattern. Detection is uneven
