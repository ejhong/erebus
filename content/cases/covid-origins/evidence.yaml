- id: COV-E006
  title: "All 457 animal samples negative — and the species that were never sampled"
  claimIds: [COV-C007, COV-C008]
  sourceId: SRC-LIU-2024
  direction: undermines
  strength: moderate
  sourceStatement: >-
    "The 457 animal samples included 188 individuals belonging to 18
    species … The sources of the samples included unsold goods kept in
    refrigerators and freezers in the stalls … Samples from stray animals in
    the market were also collected, comprising swab samples from 10 cats, 27
    samples of cat faeces, 1 dog, 1 weasel and 10 rats. All of the 457
    animal samples tested negative for SARS-CoV-2 nucleic acid."
  editorInference: >-
    Read carefully, this is much weaker negative evidence than it appears.
    The sampled animals were unsold stock, freezer contents, and strays —
    not the live wild mammals the zoonotic hypothesis implicates. The
    reanalysis of this very dataset states that no raccoon dogs or civets on
    sale at the market were ever sampled or tested, and no serology was
    taken from animals or handlers. An absence produced by not testing the
    relevant species carries little weight either way.
  exactLocator: "Nature 631(8020):402–408, Results"
  limitations:
    - "Sampling began only after the market was cleared, so the animals of interest had largely been removed."
    - "The candidate intermediate-host species were not among those tested."
