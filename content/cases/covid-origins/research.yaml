# COV-001 decisive tests. Ordered by information gain per unit of
# feasibility. Note the uncomfortable pattern this ordering exposes: the
# highest-yield items are acts of political will rather than research
# programs, and the two that are genuinely fundable are both reanalyses of
# data that is already public.

- id: COV-R001
  title: "Preregistered adversarial reanalysis of the one-versus-two-introductions question"
  summary: >-
    Convene proponents and critics of the multiple-introduction inference to
    fix methods, rooting choices, molecular-clock assumptions, and
    sequence-inclusion criteria in a public protocol BEFORE unblinding, then
    run the analysis once and publish whatever it returns. The dispute is
    currently conducted by each side selecting defensible analytic choices
    that favor its conclusion; a preregistered protocol removes that degree
    of freedom.
  claimIds: [COV-C010, COV-C009]
  track: either
  effortTier: desk
  informationGain: >-
    The best value for money in the case, and it needs nobody's permission:
    the data is already public. It would remove method-shopping suspicion
    from the zoonotic case's strongest quantitative pillar — a pillar whose
    published support was already cut roughly fourteenfold by one code
    correction, which is precisely why an adversarial protocol is warranted.

- id: COV-R002
  title: "Independent reproduction of the early-case geographic signal"
  summary: >-
    Obtain release of the analysis code, raw geospatial inputs,
    case-definition history, ascertainment methodology, and negative
    sampling locations behind the early-case spatial result, and reproduce it
    under preregistered alternative spatial models and ascertainment
    corrections — including the specific critique published as an eLetter and
    the authors' reply.
  claimIds: [COV-C002, COV-C001]
  track: either
  effortTier: desk
  informationGain: >-
    High in both directions and the case's load-bearing observation. A
    signal robust to alternative models materially strengthens market
    spillover; collapse under reasonable corrections would remove the
    strongest thing the zoonotic case has. The margin on the key comparison
    is modest enough that this is a live question rather than a formality.

- id: COV-R003
  title: "Release of the unpublished early-patient sequences and the December 2019 line list"
  summary: >-
    Publication of the more than 500 early sequences WHO has formally
    requested, with verified collection dates and metadata, together with the
    complete December 2019 Wuhan case line list and its case-definition
    history.
  claimIds: [COV-C009, COV-C010, COV-C001, COV-C003]
  track: either
  effortTier: desk
  informationGain: >-
    Directly tests one-versus-two introductions and pre-December
    circulation, and supplies the input the adversarial reanalysis most
    needs. WHO has requested it publicly and not received it, which makes
    this a question of political will rather than research capacity.

- id: COV-R004
  title: "Release of the Wuhan Institute of Virology sample database and inventories"
  summary: >-
    Disclosure of the offline sample database with raw sequence files,
    freezer inventories, sample barcodes, and server logs, subject to
    independent audit rather than summary description.
  claimIds: [COV-C013, COV-C012]
  track: either
  effortTier: desk
  informationGain: >-
    High and genuinely bidirectional — the rare test that could substantially
    settle the question either way. A timestamped pre-pandemic virus above
    roughly 99 percent identity would transform the research-related
    hypothesis; a complete, independently audited inventory containing no
    such virus would substantially weaken it. At present the intelligence
    community reports no indication either way, which is not the same as an
    audit.

- id: COV-R005
  title: "Wildlife supply-chain traceback with serology on 2019 stock"
  summary: >-
    Obtain farm and trader records for the market's wildlife vendors, test
    archived animal tissues and sera from 2019 where any survive, and take
    serology from supply-chain workers — the traceback WHO's advisory group
    has repeatedly named as a priority and which was never completed.
  claimIds: [COV-C008, COV-C007]
  track: either
  effortTier: field
  informationGain: >-
    Decisive if an infected animal is found and largely inconclusive
    otherwise, since the relevant stock is mostly gone. Time has degraded
    this test badly, which is itself part of the record: the window was open
    in 2020 and the sampling that occurred did not cover the candidate
    species.

- id: COV-R006
  title: "Independent audit of laboratory records and 2019 occupational-health files"
  summary: >-
    Independent examination of experiment logs, sample inventories,
    biosafety and biosecurity protocols, and de-identified 2019 staff health
    records with any stored sera — the three categories WHO requested and
    did not receive.
  claimIds: [COV-C012, COV-C015]
  track: either
  effortTier: desk
  informationGain: >-
    The only route to confirming or excluding a laboratory-acquired
    infection. A verified 2019 seroconversion would be among the strongest
    possible research-origin evidence; a clean audited record would be the
    strongest exculpatory evidence available, and the institute has an
    interest in producing it that this case notes rather than assumes.

- id: COV-R007
  title: "Declassification of the analytic record behind the divergent agency conclusions"
  summary: >-
    Release of source summaries, analyst drafts, dissent memoranda,
    source-reliability ratings, confidence rationales, and draft-to-final
    change histories behind the intelligence assessments — enough to
    determine whether the divergence reflects different evidence, different
    weighting, or process problems.
  claimIds: [COV-C014]
  track: either
  effortTier: desk
  informationGain: >-
    Moderate on the origin and high on the meta-question of why analysts
    with privileged access split. It is also the only way to evaluate
    allegations that analytic judgments were altered, which currently rest
    on characterizations rather than on documents any reader can inspect.

- id: COV-R008
  title: "Broadened sarbecovirus sampling targeting furin-cleavage-site-bearing relatives"
  summary: >-
    Sustained field sampling in bats and candidate intermediate hosts across
    Southeast Asia and southern China, with sequencing aimed specifically at
    relatives carrying a polybasic furin cleavage site.
  claimIds: [COV-C011, COV-C013]
  track: either
  effortTier: field
  informationGain: >-
    A natural sarbecovirus carrying a furin cleavage site would neutralize
    the feature's uniqueness argument outright — the single cleanest
    resolution available to that dispute. Continued absence slowly
    strengthens it. Genuinely fundable, and it accrues value regardless of
    the origin question.

- id: COV-R009
  title: "Read the June 2026 declassified United States intelligence release in full"
  summary: >-
    On 18 June 2026 the Office of the Director of National Intelligence
    published several hundred pages of declassified COVID-origins records
    under the declassification provision of the fiscal 2026 defense
    authorization act. The documents are heavily redacted and consist
    largely of internal correspondence, briefing readouts and open-source
    compilations. Read every part of the release through the reading tool,
    extract what bears on the origin question at the observation rung, and
    grade each extraction against the primary records it describes — not
    against anyone's characterization of the release.
  claimIds: [COV-C014, COV-C018, COV-C012]
  track: either
  effortTier: desk
  informationGain: >-
    The first substantial new official material in this case since 2023,
    and the first released under a statutory declassification mandate rather
    than at an agency's discretion. It is also the single most dangerous
    body of material in the case for this site's rules: it is being read
    publicly through allegations about named living people, and much of what
    it contains is correspondence about what officials said to each other
    rather than evidence about the virus. The yield is in the parts that
    bear on the evidence — what the agencies held, when, and what they could
    not resolve — and the discipline required is to leave the rest alone.
  origin:
    ref: "operator session 2026-10-23: release located and its first part read; not extracted"
    extractedBy: "Claude Opus 5 (Claude Code, operator session)"
    runId: "2026-10-23-session-site-123704"
    date: "2026-10-23"

- id: COV-R010
  title: "An independent audit of the Wuhan institute's sample-and-sequence inventory"
  summary: >-
    The institute's main viral-sample database has been off public access
    since September 2019 (COV-C024), and the only public accounts of what it
    held are the institution's own and its critics' reconstructions from
    archived snapshots. Obtain, through an inspection regime any party would
    accept, a complete and dated inventory of the pre-pandemic sarbecovirus
    holdings, with raw sequence files and freezer records, examined by
    people who do not work for the custodian or for its critics.
  claimIds: [COV-C024, COV-C019, COV-C013]
  track: either
  effortTier: field
  informationGain: >-
    This is the laboratory side's exact counterpart to the animal-sampling
    question, and it is held to the same standard here: a closed inventory
    can neither confirm nor exclude anything, and both the institution's
    assurance that it held no progenitor and the doubters' suspicion that it
    did rest on records no independent party has examined. A verified
    inventory containing a near-progenitor would transform the case; a
    verified inventory lacking one would substantially weaken the
    research-related family for the first time on evidence rather than on
    assurance.
  origin:
    ref: "operator session 2026-10-23: the missing-records pass (config/site-rules.md)"
    extractedBy: "Claude Opus 5 (Claude Code, operator session)"
    runId: "2026-10-23-session-site-123704"
    date: "2026-10-23"
