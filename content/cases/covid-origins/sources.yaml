  verification: ai_verified
  verificationNote: >-
    Scanned proposal downloaded from the Internet Archive 2026-08-26 and read;
    the requested amount, partner list, and the S2 proteolytic-cleavage
    passage confirmed at PDF p. 13 (printed p. 11) by two independent OCR
