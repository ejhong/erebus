    footnote superscripts were dropped rather than guessed.
  reliabilityNotes:
    - "Chain of custody is weak: this is a third-party user upload to a public archive in December 2023, not an official government release or an authenticated FOIA production. Its authenticity is corroborated independently — draft versions appear in a federal FOIA release and a congressional committee treats it as genuine — but this specific file has no official provenance."
