- id: SRC-HUANG-2020
  title: "Clinical features of patients infected with 2019 novel coronavirus in Wuhan, China"
  authors: ["Chaolin Huang", "Yeming Wang", "Xingwang Li", "and 26 others", "Bin Cao"]
  organization: "The Lancet"
  year: "2020"
  sourceType: paper
  identifier: "The Lancet 395(10223):497–506; PMID 31986264; PMC7159299; online 24 January 2020"
  url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC7159299/"
  verification: ai_verified
  verificationNote: >-
    Open-access full text fetched 2026-08-26 from the repository deposit; the
