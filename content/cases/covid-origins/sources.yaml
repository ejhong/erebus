- id: SRC-ZHOU-2020
  title: "A pneumonia outbreak associated with a new coronavirus of probable bat origin"
  authors: ["Peng Zhou", "Xing-Lou Yang", "Xian-Guang Wang", "and 26 others", "Zheng-Li Shi"]
  organization: "Nature"
  year: "2020"
  sourceType: paper
  identifier: "Nature 579(7798):270–273; DOI 10.1038/s41586-020-2012-7"
  url: "https://doi.org/10.1038/s41586-020-2012-7"
  verification: ai_verified
  verificationNote: >-
    Open-access full text fetched 2026-08-26; the whole-genome identity
    figure quoted verbatim from the Results.
  reliabilityNotes:
    - "The paper that established the closest known bat relative; authored by the institute whose research is itself under scrutiny, which is a conflict to note rather than a reason to discount the sequencing."
    - "Reports identity figures and concludes probable bat origin; it does not itself argue that the relative is too distant to be a progenitor, and that inference is not attributed to it here."
    - "Later peer-reviewed papers give the same relative's identity as 96.1 percent rather than 96.2, so this case attributes any figure to the source stating it rather than asserting one canonical value."

- id: SRC-TEMMAM-2022
  title: "Bat coronaviruses related to SARS-CoV-2 and infectious for human cells"
  authors: ["Sarah Temmam", "Khamsing Vongphayloth", "Eduard Baquero", "and others"]
  organization: "Nature"
  year: "2022"
  sourceType: paper
  identifier: "Nature 604(7905):330–336; DOI 10.1038/s41586-022-04532-4; online 16 February 2022"
  url: "https://doi.org/10.1038/s41586-022-04532-4"
  verification: ai_verified
  verificationNote: >-
    Full text fetched directly from the publisher 2026-08-26; the identity
    figures and the furin-cleavage-site finding quoted verbatim. The
    publication year is 2022, resolving an uncertainty carried in the
    casework digest.
  reliabilityNotes:
    - "Peer-reviewed field virology; establishes that bat sarbecoviruses with efficient human receptor binding circulate outside China, which bears on how undersampled natural diversity is."
    - "Carries negative evidence for the natural-cleavage-site argument as well: none of the viruses it describes contains a furin cleavage site in the spike protein."

- id: SRC-ANDERSEN-2020
  title: "The proximal origin of SARS-CoV-2"
  authors: ["Kristian G. Andersen", "Andrew Rambaut", "W. Ian Lipkin", "Edward C. Holmes", "Robert F. Garry"]
  organization: "Nature Medicine"
  year: "2020"
  sourceType: paper
  identifier: "Nature Medicine 26(4):450–452; DOI 10.1038/s41591-020-0820-9; published as a Letter"
  url: "https://doi.org/10.1038/s41591-020-0820-9"
  verification: ai_verified
  verificationNote: >-
    Open-access full text fetched 2026-08-26; both of its most-quoted
    sentences verified verbatim with section locators (the unheaded
    introduction, and the Conclusions).
  reliabilityNotes:
    - "A three-page commentary-style Letter, not a research article — a distinction that matters given how heavily both camps invoke it as though it were a study."
    - "Its central sentence is 'Our analyses clearly show that SARS-CoV-2 is not a laboratory construct or a purposefully manipulated virus'; the subject clause is exactly what was later contested and is retained wherever this case quotes it."
    - "The authors' contemporaneous private deliberations were later released by congressional committees; this case treats the paper's status as a consensus marker as a separate question from its scientific content."

