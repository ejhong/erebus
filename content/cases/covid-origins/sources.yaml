- id: SRC-HOUSE-MAJORITY-2024
  title: "After Action Review of the COVID-19 Pandemic: The Lessons Learned and a Path Forward (majority final report)"
  organization: "U.S. House Select Subcommittee on the Coronavirus Pandemic"
  year: "2024"
  sourceType: report
  identifier: "520 pages; submitted to the congressional record December 4, 2024"
  url: "https://oversight.house.gov/wp-content/uploads/2024/12/2024.12.04-SSCP-FINAL-REPORT-ANS.pdf"
  verification: ai_verified
  verificationNote: >-
    Report PDF downloaded and searched in full 2026-08-26 (558 PDF pages).
    A critical finding: the phrase "not found in nature" appears NOWHERE in
    the report. It occurs only in the accompanying press release, where it
    describes "a biological characteristic" and does not name the furin
    cleavage site. The report's parallel five points are expressly attributed
    to an outside newspaper opinion piece, and its furin-cleavage argument is
    a quotation of a journalist's claim.
  reliabilityNotes:
    - "A majority-party congressional report. Its conclusions are assertions by their authors, recorded as such, and its companion minority report reaches opposite conclusions on the same record."
    - "The report and its press release must not be conflated: the press release's stronger formulations do not appear in the report, and this case treats them as two distinct sources with distinct locators."
    - "Several of its origin arguments are attributed in the report itself to third-party op-eds rather than developed from the committee's own record."

