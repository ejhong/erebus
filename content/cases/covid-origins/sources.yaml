# COV-001 source registry. Every entry was independently verified by the
# editorial AI against the primary document on 2026-08-26 (or a dated
# archive snapshot where a publisher bot-walls automated clients);
# verificationNote records how. Casework briefs are cited nowhere, and no
# citation was inherited from them unchecked — the pass found a wrong
# publication year on a load-bearing paper, an erratum attributed to the
# wrong article, and two quotations attributed to a WHO report that do not
# appear in it.
#
# Independence is the hard problem in this case: the market evidence is one
# Chinese CDC dataset in three analytic layers with overlapping authors, and
# the whole record depends on a single custodian. Reliability notes say so.

# ── the market and early cases ──────────────────────────────────────────

- id: SRC-WOROBEY-2022
  title: "The Huanan Seafood Wholesale Market in Wuhan was the early epicenter of the COVID-19 pandemic"
  authors: ["Michael Worobey", "Joshua I. Levy", "Lorena Malpica Serrano", "Alexander Crits-Christoph", "Jonathan E. Pekar", "and 13 others"]
  organization: "Science"
  year: "2022"
  sourceType: paper
  identifier: "Science 377(6609):951–959; DOI 10.1126/science.abp8715; corrected by DOI 10.1126/science.adp1133"
  url: "https://doi.org/10.1126/science.abp8715"
  verification: ai_verified
  verificationNote: >-
    Version of record read via a Wayback snapshot dated 2025-07-07 (the
    publisher bot-walls automated clients), cross-checked against the
    open-access First Release deposit; quotations taken from the version of
    record with section locators.
  reliabilityNotes:
    - "Peer-reviewed, and not independent of the other market analyses: it shares authors and underlying Chinese CDC case and environmental data with the companion lineage paper and the 2024 metagenomic reanalysis. Treat all three as one evidence stream with three analytic layers."
    - "Rests entirely on Chinese case ascertainment that has never been independently audited; the complete December 2019 line list has never been released."
    - "Its excess-pneumonia and seroprevalence points are citations to other work, not findings of this paper, and are not attributed to it here."
    - "Corrected in March 2024 by an erratum that fixed duplicated data files and a pseudoreplicate count and states all results remained the same."
    - "A published eLetter disputes the spatial result and the authors replied identifying flaws in the critique; the exchange is recorded as the symmetric undermining material rather than suppressed."

- id: SRC-WOROBEY-ERRATUM-2024
  title: "Erratum for the Research Article 'The Huanan Seafood Wholesale Market in Wuhan was the early epicenter of the COVID-19 pandemic'"
  organization: "Science"
  year: "2024"
  sourceType: paper
  identifier: "Science 383(6688):eadp1133; DOI 10.1126/science.adp1133; indexed 15 March 2024"
  url: "https://doi.org/10.1126/science.adp1133"
  verification: ai_verified
  verificationNote: >-
    Full erratum text read via a Wayback snapshot dated 2025-04-27; the
    Crossref update-to record independently confirms it corrects the market
    epicenter paper and not the lineage paper.
  reliabilityNotes:
    - "A null correction: it fixes duplicated data files and a pseudoreplicate count and states the results were unchanged. Linking it must not imply it weakened the paper's findings."
    - "Records a real process-integrity detail: an informal supplementary correction of May 2023 that the journal concedes should have been indexed as a formal erratum, and was not indexed until March 2024."

- id: SRC-LIU-2024
  title: "Surveillance of SARS-CoV-2 at the Huanan Seafood Market"
  authors: ["William J. Liu", "Ping Liu", "Wenwen Lei", "and 33 others", "George F. Gao"]
  organization: "Nature"
  year: "2024"
  sourceType: paper
  identifier: "Nature 631(8020):402–408; DOI 10.1038/s41586-023-06043-2; print issue 11 July 2024"
  url: "https://doi.org/10.1038/s41586-023-06043-2"
  verification: ai_verified
  verificationNote: >-
    Full text fetched directly from the publisher 2026-08-26 (openly
    available); the sample counts, sampling chronology, and negative animal
    results quoted verbatim from the abstract, Results, and Methods.
  reliabilityNotes:
    - "The Chinese CDC reporting on its own investigation — the primary market dataset, and produced by the custodian whose data-sharing is itself disputed."
    - "Cite the 2024 version of record, not the April 2023 accelerated preview: the positive-sample count changed from 73 to 74 between them, and a note added in proof explains why."
    - "The 457 animal samples that tested negative were largely unsold stock, stray animals, and freezer contents — not the candidate intermediate-host species, which the later reanalysis states were never sampled or tested. The negative result is therefore narrow in scope."
    - "The paper records that stall surfaces and goods were disinfected through January and February 2020, which bounds what environmental sampling could still detect."

