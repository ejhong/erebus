- id: SRC-PEKAR-2022
  title: "The molecular epidemiology of multiple zoonotic origins of SARS-CoV-2"
  authors: ["Jonathan E. Pekar", "Andrew Magee", "Edyth Parker", "and 26 others", "Joel O. Wertheim"]
  organization: "Science"
  year: "2022"
  sourceType: paper
  identifier: "Science 377(6609):960–966; DOI 10.1126/science.abp8337; corrected by DOI 10.1126/science.adl0585"
  url: "https://doi.org/10.1126/science.abp8337"
  verification: ai_verified
  verificationNote: >-
    Both the pre-correction open-access deposit and the corrected version of
    record (Wayback snapshot dated 2025-07-04) were read, so that corrected
    and superseded values could be distinguished; only corrected values are
    cited in this case.
  reliabilityNotes:
    - "Peer-reviewed, and model-based: its conclusion depends on rooting choices, molecular-clock assumptions, epidemic simulation parameters, and which early sequences are trusted."
    - "Companion paper to the market epicenter study with overlapping authors and inputs; their agreement is not independent corroboration."
    - "Materially corrected in October 2023 — the Bayes factors favoring two introductions fell roughly fourteenfold and the authors' own wording moved from strong to substantial support. Only the corrected figures are usable."
    - "Several hundred early Chinese sequences remain unpublished, so the analysis rests on an incomplete early-sequence set by construction."

- id: SRC-PEKAR-ERRATUM-2023
  title: "Erratum for the Research Article 'The molecular epidemiology of multiple zoonotic origins of SARS-CoV-2'"
  organization: "Science"
  year: "2023"
  sourceType: paper
  identifier: "Science 382(6667):eadl0585; DOI 10.1126/science.adl0585; 13 October 2023"
  url: "https://doi.org/10.1126/science.adl0585"
  verification: ai_verified
  verificationNote: >-
    Full erratum text read via a Wayback snapshot dated 2025-05-12; the
    Crossref update-to record confirms it corrects the lineage paper. The
    magnitude of the change was established by comparing the pre-correction
    deposit against the corrected version of record, since the erratum text
    itself gives no numbers.
  reliabilityNotes:
    - "A substantive correction, not a formatting one: a code error had overestimated the Bayes factors favoring multiple introductions."
    - "It states the corrected analysis still favors multiple introductions, so characterizations that it reduced the finding to negligible are not supported by the document. Both the original and corrected values are recorded in this case so readers can judge the size of the change."

