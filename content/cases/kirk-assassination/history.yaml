- date: 2026-08-26
  change: >-
    Study KRK-S004 pre-registered (freeze only, zero rows): inconclusive
    outcomes in firearm-toolmark black-box studies, criteria hash
    3fa1c832219a. New research item KRK-R014 added. The study reads the
    ATF examiner's inconclusive comparison (KRK-C004) against the
