  synthesis: "The public record of the 10 September 2025 killing splits into three
    layers that must be kept apart. Collapsing them is how both the official
    narrative and its loudest critics overclaim. At the observational layer the
    state's skeleton is well supported. Independently geolocated social-media
    video, FBI-released rooftop footage, and sworn scene testimony converge on a
    person present on the Losee Center roof who fled within seconds of the shot.
    A towel-wrapped .30-06 was recovered along the apparent escape route. The
    medical examiner's report, as admitted, classifies a homicidal gunshot wound
    of the neck with projectile fragments recovered at autopsy. DNA testimony
    associates Robinson with the rifle and related items at high reported
    statistical strength, and the prosecution presented a cluster of attributed
    statements. None of that grades guilt — Robinson is presumed innocent — but
    anyone characterizing the public file as a house of cards is not describing
    this evidence set. Steelman for the official account: every enumerated gap
    has a mundane pre-trial explanation. Inconclusive toolmark comparison is the
    modal outcome on damaged projectile metal, not a hidden exclusion. Fragment
    splits across the medical examiner and the lab are ordinary multi-custodian
    paperwork. A contractor grabbing his own cards in a massacre is what a
    working videographer does. A university paving a courtyard to reopen campus
    is facilities work after scene release, and the lead investigator need not
    sign the work order. A 30-day auto-purge is how sheriff's offices actually
    retain video. A prosecutor's contempt finding is about talking to a tabloid,
    not fabricating a rifle. Donor anger is not a hit team. A Navy purchase
    order and a later industrial disaster with a record safety penalty are not a
    device at a microphone. No authenticated residue, device fragment, or
    excluded bullet has been published that the rifle mechanism cannot absorb.
    Steelman for the critics: the strongest ballistic proposition the public
    should be able to audit — this fatal projectile came from this rifle — is
    exactly the proposition the ATF examiner could not make. Seven photographed
    fragments versus four examined remain unreconciled in any public matrix.
    Independent pathologists cannot test competing mechanisms against scaled
    wound photographs, a fragment map, or radiology, because that package is not
    out. The event's most sensitive camera angle was in private hands within
    minutes, and the sworn chain documents copies rather than original cards
    with hashes. The courtyard was altered within days under a partial
    authorization vacuum. Surrender-area footage was allowed to expire. Those
    are not internet inventions; they are hearing testimony, open-records
    reporting, and the sheriff's own letters. Until they are closed by
    disclosure, \"trust the process\" is a request, not an audit. The roll-up is
    therefore mixed, not as a hedge but as a structure. The observational
    single-shooter account is substantially supported and is not refuted by any
    public forensic artifact. The public record is not complete enough for
    independent end-to-end verification, which is a finding about auditability
    rather than about falsity. The strong alternative claims —
    device-at-the-microphone as the fatal mechanism, established donor or state
    operational involvement, established concealment, an established AES-cluster
    bridge, abandoned screwdriver DNA, timeline impossibility — do not survive
    contact with the primary record. They fail as established while remaining,
    in a few cases, testable. The honest next step is the cheap one already
    specified: fragment reconciliation, autopsy-package review, native-media
    synchronization, and a media ledger with hashes."
