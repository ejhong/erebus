  - claimId: KRK-C015
    verdict: contradicted
    reasoning: Every reviewed affirmative account stops at motive and pressure; the operational elements (contact with the attack, funding of it, foreknowledge of it) are absent from the public record. "Contradicted" grades the claim that involvement is ESTABLISHED — not the different claim that it has been ruled out, which the record also cannot support.
    confidence: high
    treatment:
      plainLanguage: No. Motive, conflict, and fast political framing are not communications, payments, logistics, or forensic links. As of the last review date no public bridge evidence connects this cluster to the attack — and the absence of a bridge is itself a finding this site displays.
      importance: headline
      diagnosticity: indeterminate
      diagnosticitySummary: The claim is itself an attribution overreach; its proper diagnostic use is negative — marking where the evidence stops.
