caseAssessment:
  verdict: mixed
  whatIsClaimed: The State of Utah charges that Tyler Robinson shot Charlie Kirk from the Losee Center roof; a judge has sent the case to trial, Robinson has pleaded not guilty, and he is presumed innocent. Critics claim, in rising order of strength, that the public record cannot be audited, that evidence chains were compromised, that he had help, and that the fatal wound came from a device at the microphone. The question here is which of those challenges survive the primary record — not who did it.
  whereDisagreementLives: "Not over whether Kirk died of neck trauma at the event, nor over whether a figure fled the Losee Center roof — both are strongly documented. The live disputes sit one rung up, in provenance and completeness: the ATF examiner could neither match nor exclude the recovered rifle against the autopsy fragments; seven photographed fragments against four examined remain unreconciled publicly; the complete autopsy package has not been released in auditable form; the event contractor's original camera media chain is not publicly established; and the site was altered within days. Whether those gaps are ordinary process or something worse is exactly what the record does not yet say."
  whatWouldSettleIt: "Disclosure and independent testing would settle it, not commentary. The tests: a fragment-by-fragment reconciliation of all seven documented fragments; the complete autopsy and radiology package reviewed by independent forensic pathologists; a blind, native-file synchronization study of every camera and audio source ordering shot, wound, and clothing motion frame-accurately; a blind independent re-examination of the ballistics with 3-D surface metrology; and an activity-level DNA review. Each is specified in the research agenda; most are desk- or lab-scale."
  bestConventionalExplanation: "The state's single-shooter model: Robinson planned the attack, fired the fatal round from the Losee Center roof, and fled alone; the rifle, DNA, digital messages, and alleged admissions cohere with that account, and its unresolved edges are the ordinary noise of a live prosecution — fragments retained at different custodians, an inconclusive comparison on damaged projectile metal (the modal outcome for such evidence), a contractor grabbing his own cards in a panic, a university paving a courtyard to reopen a campus, and a prosecutor who talked too much. On this account every \"gap\" has a mundane explanation, and none of the alternative hypotheses has produced a single authenticated forensic artifact — no residue, no device fragment, no excluded bullet — that the official mechanism cannot absorb. Its main unpaid debt is auditability: it asks the public to wait for trial rather than showing the complete chains now, and \"trust the process\" is precisely the posture this case exists to replace with records."
  components:
    - label: Fatal mechanism (distant rifle shot)
      state: well_supported
      note: Medical examiner's report (gunshot wound of the neck, homicide), recovered projectile fragments, and the bindover order's front-to-back, downward track from an elevated shot; not independently auditable yet.
    - label: Public bullet-to-rifle identification
      state: unresolved
      note: The public ATF comparison was inconclusive — neither identification nor exclusion.
    - label: Public chain-of-custody completeness
      state: mixed
      note: Same-day delivery of video copies and sealed lab transfers are documented; fragment accounting and original-card inventory are not.
    - label: Device-at-the-microphone alternative
      state: weakly_supported
      note: Rests on contested video interpretation; no residue, device fragment, or pathology support has been published, and the court's reading of the wound track fits a shot from above.
  researchPriority:
    level: high
    reason: The decisive disclosures — fragment reconciliation, the autopsy package, native-media synchronization — are cheap beside the dispute they would settle. The case is now bound over for trial with no trial date set, so nothing on the court's calendar will release them soon.
