  - claimId: KRK-C008
    verdict: well_supported
    reasoning: Multiple contemporaneous courtroom reports describe the testimony consistently, and the court bound the case over on it at the probable-cause standard (KRK-E069), with the evidence read in the state's favour and the defense's experts contesting the subjectivity of DNA interpretation (KRK-E070). The underlying electropherograms, mixture statistics, and laboratory controls have not been independently reviewed.
    confidence: moderate
    treatment:
      plainLanguage: Prosecution testimony reported strong DNA associations. DNA of this kind answers "whose biological material" — it does not by itself answer when, why, or during what activity it was deposited, and the defense explored transfer scenarios at the hearing. Robinson is presumed innocent; this claim grades what was presented, not guilt.
      importance: major
      diagnosticity: moderate
