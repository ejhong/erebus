    confidence: moderate
    treatment:
      plainLanguage: They are not — yet. A person can be off campus at 8:07 and arrive at 8:29; and no reviewed official source actually asserts the shooter disassembled the rifle on the roof after the shot, so the "no time to disassemble" contradiction targets a claim the government has not been shown to make.
      importance: supporting
