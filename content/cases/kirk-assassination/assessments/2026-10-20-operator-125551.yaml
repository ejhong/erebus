  synthesis: "The ladder still splits by rung. At the observation level the core scene account is strong: a rooftop figure fleeing seconds after the shot is triangulated by independent visual forensics (KRK-E001), FBI footage and trace evidence (KRK-E002), and sworn testimony (KRK-E003); the rifle recovery is undisputed. At the mechanism level, credibility and diagnosticity diverge: the sworn ballistics result neither identifies nor excludes the rifle (KRK-E007, KRK-E008), the only true identification is casing-to-rifle (KRK-E067), and the wound-ballistics base rate (KRK-E065) shows a retained, fragmented lead-core .30-06 striking the spine (KRK-E066) is the expected outcome. The bindover order, as quoted, adds a front-to-back, downward track from a position 68 feet above the canopy (KRK-E068) — what a rooftop shot predicts — though it is a judge's summary, read in the state's favour, of a report still unreleased. At the attribution rung, the grand claims (KRK-C015, KRK-C017, KRK-C025, KRK-C028) verify their premise documents but fail on connective tissue: timing collapses (KRK-E042), base rates deflate the speed intuition (KRK-E057, KRK-E058), and the statement ledger shows announcements outrunning paperwork, not coordinated falsehood (KRK-E064). The case's real finding remains auditability: KRK-C019 is defeated by the seven-versus-four fragment gap, the unreleased autopsy package (KRK-E006), the unresolved original-media chain (KRK-E018, KRK-E063), destroyed surrender footage (KRK-E045), and a digital record the defense itself had not finished processing by the bindover (KRK-E071). The bindover (KRK-E069, KRK-E070) changes the posture, not the grades. Sensitivity: the record whose removal would most change the verdict is KRK-E009, the sworn fragment-count discrepancy; the mixed verdict survives without it, but the sharpest custody defect hangs on that one exchange. No court has decided the charges; nothing here grades guilt."
  steelman: "The strongest case against this assessment's comfort with the state's mechanism is that every record that would test it is held by the institutions whose account is in question, and the public now knows it mainly through their descriptions. The medical examiner did not testify; the report entered through an investigator; the wound track is known through a judge's summary written, by rule, in the state's favour; the ATF result is known through filings and reporting; the original media and the fragment inventory are in custody unseen. Officials in this case have announced evidence before the paper existed, a prosecutor was held in contempt over publicity, surrender footage was allowed to delete, and the scene was paved within days. On that record, grading the rifle mechanism well supported credits descriptions no independent party has checked, and the site's own rule caps a judgment resting on one party's unexamined description at provisionally supported. This assessment answers it only in part: the rooftop figure rests on independent video, the scene, rifle and DNA evidence was cross-examined at a public hearing, and the defense, which holds the report, is not reported in this file contesting the gunshot classification — only its admission without its author. But cross-examination is not release, and until the autopsy package and fragment inventory are public the objection stands."
claimAssessments:
  - claimId: KRK-C001
    verdict: well_supported
    reasoning: Supported by independently geolocated social-media video (Washington Post analysis), FBI-released escape footage, and officer testimony about rooftop impressions and a displaced-gravel "sniper pad" — three channels with different failure modes.
    confidence: high
    treatment:
      plainLanguage: Multiple independent recordings and law-enforcement scene evidence show someone on the roof overlooking the event who ran immediately after the shot. This claim says nothing about who that person was.
      importance: headline
      diagnosticity: moderate
      diagnosticitySummary: A rooftop actor is expected under the single-shooter account and under most assisted or staged variants alike; it weighs against only the strictest "microphone device, no rooftop event" formulation. It does not identify the person or establish that they fired a live round.
      strongestObjection: The public has seen excerpts, not every native file; identity and the person's exact actions in the seconds before the shot remain outside the published record.
      whatWouldChangeOurMind:
        - Native rooftop surveillance showing the timing or the figure to be inconsistent with the published excerpts.
        - A demonstration that the geolocated video's timestamp or location was misattributed.
  - claimId: KRK-C002
    verdict: well_supported
    reasoning: Stated in FBI public updates and sworn preliminary-hearing testimony; no party in the litigation disputes the recovery itself.
    confidence: high
    treatment:
      plainLanguage: Investigators say they found the rifle, wrapped in a towel, where the fleeing figure went. Recovery is well documented; what the rifle did is a separate question graded elsewhere.
      importance: major
      diagnosticity: moderate
      diagnosticitySummary: Recovery along the escape route fits the single-shooter account, but a planted or decoy weapon is exactly what several alternative hypotheses predict, so recovery alone discriminates weakly among them; the discriminating evidence is what the rifle can be forensically tied to.
      strongestObjection: The recovery narrative rests on the investigation's own scene records; the public record does not include the full recovery-to-lab custody documentation.
      whatWouldChangeOurMind:
        - Custody records showing the rifle's recovery context was misdescribed.
  - claimId: KRK-C003
    verdict: contradicted
    reasoning: "The ATF examiner testified she could not conclusively identify the autopsy fragments to the rifle. The claim as stated — a public, conclusive identification — is therefore contradicted by the public record. Note carefully what this does not say: the rifle was not excluded either (KRK-C004)."
    confidence: high
    treatment:
      plainLanguage: 'This is the strongest possible ballistic link — "this bullet came from this gun." As of the last review date, the public record does not contain it: the ATF comparison was inconclusive.'
      importance: headline
      diagnosticity: high
      diagnosticitySummary: If this identification existed it would nearly close the mechanism question in favor of the recovered-rifle account; its absence keeps the mechanism rung genuinely open to audit, which is why both sides misstate the inconclusive result in opposite directions.
      strongestObjection: Damaged projectile fragments frequently yield inconclusive comparisons even when fired from the suspect weapon; the absence of a public match is weak evidence against the rifle mechanism.
      whatWouldChangeOurMind:
        - Release of an ATF or independent examination reporting an identification (or an exclusion) on any fragment.
        - Independent blind re-examination with 3-D surface metrology reaching a non-inconclusive result.
  - claimId: KRK-C004
    verdict: established
    reasoning: Sworn preliminary-hearing testimony, contemporaneously reported by multiple outlets; consistent with NIST's account of firearm comparison outcomes, in which inconclusive is a recognized result category.
    confidence: high
    treatment:
      plainLanguage: '"Inconclusive" is its own outcome, distinct from both "match" and "ruled out." Statements that the bullet "matched" the rifle and statements that the rifle was "cleared" are both misreadings of the same testimony.'
      importance: major
      diagnosticity: low
      diagnosticitySummary: An inconclusive result on damaged fragments is expected under the single-shooter account and under most alternatives; it discriminates almost nothing by itself. Its importance is procedural — it defines what the public record does and does not contain.
      strongestObjection: The examiner's full report has not been released; the public knows the result through courtroom reporting rather than the laboratory document.
      whatWouldChangeOurMind:
        - Release of the complete ATF laboratory report showing a different characterization.
  - claimId: KRK-C005
    verdict: well_supported
    reasoning: The seven-versus-four discrepancy comes from the examiner's own sworn testimony; the absence of a public reconciliation is verifiable by inspection of the released record.
    confidence: high
    treatment:
      plainLanguage: Three fragments are unaccounted for in the public record. Routine explanations exist (retained by the medical examiner, consumed in testing, separately packaged) — but none has been published, so this is a genuine open chain-of-custody question, not evidence of tampering.
      importance: headline
      diagnosticity: moderate
      diagnosticitySummary: Under ordinary process the gap is paperwork; under evidence-manipulation hypotheses it is exactly where manipulation would live. Because both accounts absorb it, the gap itself discriminates only weakly — but its RESOLUTION is highly diagnostic, which is why the reconciliation is the case's top-priority disclosure (KRK-R001).
      strongestObjection: Multi-custodian fragment handling with partial laboratory submission is common in homicide cases; silence in a pre-trial public record is not evidence that records do not exist.
