  synthesis: "The case is built as a two-storey structure and both storeys hold,
    though not equally. The ground floor is the physical account: a person on
    the Losee Center roof fleeing within seconds (three channels with different
    failure modes — independent visual forensics, agency-released video, sworn
    officer testimony about prone-position gravel disturbance and a
    screwdriver), a rifle recovered along that route, an autopsy classification
    of gunshot wound to the neck with projectile fragments recovered, and
    caliber consistency between fragments and a casing in the recovered rifle.
    Nothing in the evidence ledger opposes any of that. The upper floor is
    auditability, and here the case's central finding (KRK-C019) is not merely
    defensible but demonstrable by inspection: seven photographed fragments
    against four examined with no published reconciliation (from the examiner's
    own sworn mouth), an autopsy admitted through an investigator rather than
    its author, an event-media chain documented only for copies, a scene paved
    four days in, and unpreserved surrender-area footage. Each is individually
    mundane; collectively they mean no outside party can currently reproduce the
    state's chain end to end. Two disciplines deserve credit and one caution.
    Credit first: the file consistently grades \"X is established\" claims
    separately from \"X has been ruled out,\" which is why KRK-C003 and KRK-C004
    do not collapse into the two rival misreadings that drove the March 2026
    media wave; and it applies the same knife to friendly and hostile
    compilations alike, killing the timeline anomalies (KRK-C010), the
    screwdriver \"abandonment\" (KRK-C032), and the procurement/explosion arc
    (KRK-C025) on their own evidence. The caution: the file's own independence
    note is the most important line in it. AP, KSL, KUTV, East Idaho News and
    Fox all transcribe the same proceeding; they corroborate each other's
    stenography, not the underlying forensics. So the medical, DNA, ballistic
    and admissions findings all trace to a single evidentiary channel —
    prosecution presentation at one hearing — and their apparent multiplicity is
    illusory. Steelmanning the challengers: the strongest version of their case
    is not any device theory but the narrow procedural point that a capital
    prosecution has been publicly argued through summaries while the primary
    records (fragment ledger, autopsy package, media hashes) stay closed, with a
    prosecutor formally held in contempt for talking about them. That point
    survives intact. Steelmanning the state: every enumerated gap has a
    modal-outcome explanation, no alternative has produced one authenticated
    artifact, and pre-trial incompleteness is the norm rather than a defect.
    Both survive; only disclosure separates them."
