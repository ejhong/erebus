  synthesis: "The public record of the 10 September 2025 killing does not yield
    one tidy verdict on the official single-shooter account, and the split is
    structural rather than a failure of nerve. Steelman the state's model first.
    Three channels with different failure modes — independently geolocated
    social-media video analyzed by the Washington Post, FBI-released footage of
    a figure jumping from the roof, and Officer Bagley's sworn findings of a
    screwdriver and a prone-position gravel disturbance — establish that a
    person was on the Losee Center roof and fled within seconds of the shot. A
    towel-wrapped .30-06 bolt-action rifle was recovered along the apparent
    escape route. The medical examiner's report, as admitted at the preliminary
    hearing, classifies the death as a homicide caused by a gunshot wound of the
    neck with projectile fragments recovered at autopsy. Hearing testimony
    reported DNA associations described as extremely or highly likely between
    Robinson and the rifle and related items, and a cluster of attributed
    statements was presented in court. Class-level caliber consistency and a
    cartridge-case identification to the recovered rifle further bind the
    physical evidence without individualizing the fatal projectile. On the
    method's own published performance, an inconclusive toolmark comparison on
    damaged fragments is a standard non-error output and carries little
    diagnostic weight either way; analog wound-profile data indicate that an
    expanding lead-core .30-06 that strikes cervical bone is ordinarily retained
    and fragmented, so the absent exit wound is the expected pattern rather than
    a clue to a device. No alternative has produced an authenticated residue,
    device fragment, operational communication, payment, or excluded bullet.
    Steelman the other direction with equal care. The strongest ballistic
    sentence available — this fatal projectile was fired from this rifle — is
    precisely the sentence the public record does not contain: the ATF examiner
    could neither identify nor exclude the rifle, and photographs of seven
    fragments against four received (or a jacket plus four lead, itself
    unreconciled with the testified four) remain without a public accounting.
    The complete autopsy package is not public, so competing mechanism claims
    cannot be tested against primary pathology. Same-day delivery of video
    copies is sworn; whether every original storage card reached law-enforcement
    custody is not established, and published footage appears to show the event
    contractor pocketing the rear-camera card within about four minutes of the
    shot. The courtyard was excavated and paved within days, and the lead
    investigator testified he did not personally authorize that alteration.
    Surrender-related surveillance was allowed to auto-delete after thirty days.
    A deputy prosecutor was held in civil contempt for a public guilt statement.
    Authenticated messages show acute donor pressure in Kirk's final weeks. Each
    of those facts is real. None of them, on the present record, licenses the
    further inferences that critics most want: a microphone device as the fatal
    mechanism, operational involvement by any donor or state, an established
    AES-cluster bridge, pre-arranged diversion by George Zinn, abandonment of
    the screwdriver DNA, or documented deliberate concealment. Those attribution
    claims are contradicted as established or remain unresolved and thinly
    evidenced. The case-level verdict is therefore mixed in a specific,
    non-hedging sense. The observational and association core of the official
    account is well supported and has not been publicly refuted. The public
    record is simultaneously not complete enough to audit that account
    independently, which is itself a finding: the completeness claim is
    contradicted. The ambitious replacement hypotheses have not paid their
    explanatory debts. Until fragment reconciliation, the autopsy package, a
    native-media ledger, and a blind ballistics re-examination exist, the honest
    posture is neither trust the process nor the official story has collapsed.
    It is: here is what the record contains, here is exactly where it stops, and
    here are the tests that would move each dispute."
