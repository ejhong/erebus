  synthesis: >-
    The public evidence supports the official rooftop-rifle account as the
    best-supported explanation of the killing, although it does not make that
    account fully auditable and does not adjudicate Tyler Robinson's guilt.
    Multiple channels converge on a person occupying and rapidly leaving the
    Losee Center roof: an independent visual-forensics summary, FBI-released
    footage, and sworn scene testimony describing video, a prone-position
    disturbance, prints, and an escape path. A rifle and ammunition were
    recovered along that apparent route. The admitted medical finding classifies
    the death as a homicide caused by a gunshot wound to the neck, and the
    reported wound direction—front to back and downward—is what an elevated
    source approximately 415 feet away would predict. Reported DNA results
    associate Robinson with several parts of the rifle and related objects,
    while testimony and exhibits attribute a note, text messages, Discord
    communication, and acknowledgments to him. These are distinct evidentiary
    channels even though much of their public presentation comes from the same
    preliminary proceeding.

    The strongest case against treating the official account as established is
    also substantial. The fatal fragments were not conclusively identified to
    the recovered rifle: the ATF result was explicitly inconclusive, neither
    identifying nor excluding it. Public accounts conflict over whether the
    examiner received four fragments or four lead fragments plus a jacket
    fragment, against seven photographed fragments, and no public
    fragment-by-fragment reconciliation closes that gap. The complete autopsy
    package, native event recordings, original-card acquisition inventory, raw
    DNA data, and native digital-message extractions are unavailable for
    independent review. The event contractor removed a rear-camera card within
    minutes, investigators publicly documented receiving copies rather than
    every original card, and surrender-area surveillance was not preserved
    beyond ordinary retention. Rapid paving and an unresolved authorization
    chain add a legitimate process question, although neither establishes
    concealment.

    The alternative device hypothesis does not presently overcome the medical
    and spatial evidence. Its affirmative case rests on unreplicated analyses of
    compressed consumer video, an anonymous analyst's energy and timing
    calculations, and subjective observations of clothing, necklace, gas, and
    sound. Conversely, the gunshot classification, retained fragmented-bullet
    pattern, and reported downward wound track all weigh against a
    microphone-associated device. The missing primary autopsy and native-media
    packages prevent the strongest possible independent rebuttal, so
    “well_supported” is warranted rather than “established.”

    The donor-pressure messages, unusual institutional conduct, and halted
    foreign-nexus inquiry justify continued scrutiny but provide no operational
    bridge to a donor, organization, foreign state, explosives contractor, or
    second shooter. The single record whose removal would most change this
    verdict is KRK-E013, because it supplies the strongest physical association
    between Robinson and the recovered rifle. The case verdict survives its
    removal: the rooftop chronology, gunshot evidence, rifle recovery, reported
    trajectory, and attributed admissions would still support the official
    mechanism, though the identity component would become materially less
    secure.
  steelman: The official account predicts that the complete autopsy package will
    show a measured front-to-back, downward rifle wound aligned with the Losee
    Center roof and that native multichannel audio will independently localize
    the projectile and muzzle signatures there. Neither primary package is
    public, so that decisive joint prediction has not been independently tested.
