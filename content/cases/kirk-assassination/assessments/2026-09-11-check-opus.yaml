  synthesis: "The case file poses two questions that have different answers, and
    the honest roll-up is therefore genuinely mixed rather than evasive. On
    mechanism and attribution, the evidence records weigh heavily toward the
    conventional account and against every affirmative challenge to it. A
    rooftop actor is documented through three channels with different failure
    modes (independent visual forensics, agency release, sworn officer testimony
    about a prone impression and screwdriver); a rifle and towel were recovered
    along the flight path; DNA on rifle, trigger, casing, towel and screwdriver
    was presented with strong source-level statistics; and — a detail most
    summaries drop — the ATF identified the recovered .30-06 cartridge case as
    fired from that rifle (KRK-E067). That is an individualizing ballistic link,
    just not the bullet-to-rifle link the public argument fights over. Against
    that, the device-at-the-microphone hypothesis rests on compressed consumer
    video analyzed by anonymous parties, carries an unanswered physics objection
    about a 32-gram clipped transmitter, and must additionally explain away a
    recovered deformed bullet jacket plus lead fragments and a gunshot
    classification. Two pre-registered base-rate studies remove its best
    negative arguments: inconclusive is the method's ordinary output on damaged
    specimens (KRK-E061, KRK-E062), and bullet retention without exit is the
    expected outcome for an expanding rifle bullet that strikes cervical bone
    (KRK-E065). Similarly, operational involvement by donors or states,
    deliberate concealment, the \"abandoned screwdriver,\" and the publicized
    timeline contradictions all fail on contact with the record. The skeptical
    claims that survive are the negative, procedural ones. Seven photographed
    fragments versus four (or a jacket plus four lead fragments) examined is an
    unreconciled, sworn custody gap. The autopsy entered through an
    investigator, not its author, and the package remains unreleased, so the
    single strongest evidence against the alternative mechanism is also the
    least auditable item in the file. The event media chain documents copies,
    not originals, after the most sensitive camera's card passed through private
    hands. The courtyard was paved within four days with a disputed
    authorization — unmatched on sequence, though not on speed, in an
    eighteen-venue table. Surrender footage auto-deleted. A prosecutor was held
    in contempt. Read structurally: the state's account is substantially
    supported and nothing in the public record refutes it; the record is
    simultaneously not complete enough for an independent auditor to close it.
    Both halves are findings, and neither licenses the other's inflation. Note
    where priors do work here: judgments that multi-custodian fragment handling,
    inconclusive comparisons, and a videographer securing his own cards are
    unremarkable rest on general forensic background, not on records in this
    file — which is exactly why KRK-R001, KRK-R002 and KRK-R008 are the decisive
    outstanding tests."
