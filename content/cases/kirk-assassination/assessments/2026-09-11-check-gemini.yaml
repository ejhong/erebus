      rather than an orchestrated concealment.
  - claimId: KRK-C017
    verdict: contradicted
    confidence: high
    reasoning: The leap from documented institutional transparency failures to
      deliberate evidence concealment is completely unsupported by the current
      record. While institutions do sometimes conceal negligence without
