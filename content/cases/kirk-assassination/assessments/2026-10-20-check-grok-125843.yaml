  synthesis: >-
    The public evidentiary record provisionally supports the core physical spine
    of the official single-shooter account while remaining clearly incomplete
    for independent audit. Multiple independent channels converge on a rooftop
    actor who fled the Losee Center roof within seconds of the shot: Washington
    Post visual forensics, FBI-released escape video and trace-evidence
    description, and Officer Bagley's sworn line-of-sight, prone-position
    gravel, and footage testimony. A .30-06 bolt-action rifle recovered
    towel-wrapped along the apparent escape route is repeatedly placed in the
    official and hearing record, with class-level caliber consistency to the
    fatal projectile family and a cartridge case identified to that rifle. The
    medical examiner's classification, as admitted at the preliminary hearing,
    is homicide by gunshot wound to the neck with recovered projectile
    fragments; nothing in the hearing medical record is inconsistent with that
    classification. DNA associations presented at the hearing link Robinson at
    high reported statistical strength to the rifle and related items, and a
    substantial attributed- statements cluster (roommate account, texts,
    Discord, engraved ammunition) was shown in court. A judge bound the case
    over on all counts at the probable-cause standard, expressly noting
    substantial identity evidence while viewing the record in the state's favor.

    Equally clear are the points at which the public record stops being
    auditable. The ATF firearm/toolmark examination of the fragments was
    publicly and conclusively inconclusive: the examiner could neither identify
    nor exclude the recovered rifle as the source of the fragments examined.
    That result is the method's ordinary outcome on damaged specimens and
    licenses neither the popular "bullet matched" gloss nor the "rifle was
    cleared" gloss. Photographs documented seven recovered fragments while the
    examiner received four (or a jacket fragment plus four lead fragments in the
    filed-report itemization); as of the ledger freeze no public matrix
    reconciles recovery location, custodian, testing, and disposition. Complete
    autopsy documentation required for independent reconstruction—scaled wound
    photographs, wound track, fragment map, radiology—is not public; the report
    entered through an investigator over a standing expert-without-expert
    objection. The event-media chain establishes same-day receipt of copies
    (flash drive and downloadable files) but does not establish that
    investigators received every original storage card; the contractor's removal
    of the rear camera card within minutes is documented on video, and the
    formal contractor statement was not collected until months later. The
    courtyard was cleaned and paved within days, and the lead agent testified he
    did not personally authorize the alteration; base-rate comparison shows
    speed alone is unremarkable among released public venues, but this case is
    unmatched in the surveyed table on disputed authorization and missing formal
    release date. Surrender-area surveillance was allowed to age past a 30-day
    retention period unpreserved and unshared. Large volumes of digital forensic
    discovery remain non-public even to completed defense review.

    Alternative mechanism and attribution claims do not presently displace the
    rooftop-rifle spine. The microphone-device hypothesis rests on
    cellphone-video optical-flow claims by unnamed or advocacy analysts, is
    unpaid on shaped-charge physics against a fabric-clipped transmitter, drifts
    into bullet-into-microphone variants, and faces a hearing medical
    classification of gunshot wound plus a bindover-order trajectory description
    (elevated position, front-to-back and downward) that a device at the
    microphone does not predict without further steps. Base- rate wound
    mechanics for an expanding .30-06 that strikes cervical bone make retention
    and fragmentation the ordinary pattern, so absent exit wound is not evidence
    against a rifle mechanism. Donor-pressure messages are authenticated and
    real as motive environment; they establish no operational involvement by any
    donor, organization, or foreign state in the killing. The AES
    procurement/explosion cluster documents a real purchase order and a real
    industrial disaster with documented safety failures; it supplies no
    delivery, no end use, and no link to any person or place in this case, and
    the device theory was public weeks before the factory explosion. Zinn's
    false confession yields no public evidence of pre-arrangement with attack
    parties. Screwdriver DNA was not abandoned; it was presented under oath at
    the preliminary hearing. Institutional frictions—contempt for a prosecutor's
    guilt opinion, early statement drift, scene alteration under thin public
    authorization—are real and degrade transparency, but the graded statement
    ledger and scene base rate do not establish deliberate concealment or
    destruction of evidence.

    Steelmanning the official account: rooftop presence, rifle recovery along
    the escape path, cartridge-case identification to that rifle, DNA
    association, attributed admissions, and medical gunshot classification form
    a mutually reinforcing package that survived cross-examination sufficiently
    for bindover. Steelmanning the skeptical auditability critique: an
    inconclusive fragment comparison, an unreconciled fragment count, a
    non-public autopsy package, original media whose card-level custody is
    unproven, a paved scene, and deleted surrender video mean a serious
    independent auditor cannot yet re-run the official reconstruction from
    primary materials. Those gaps are custody and disclosure defects, not
    affirmative proof of a different mechanism. On the evidence records alone,
    the official single-shooter physical account is provisionally supported; the
    public record is not complete enough to call it established or fully
    auditable. Confidence is moderate because several load-bearing medical and
    ballistics packages remain secondary (investigator relay, press renderings
    of reports) and because activity-level DNA and native digital authentication
    have not been publicly tested. No claim in this run adjudicates any person's
    guilt; Robinson is presumed innocent and charging and hearing assertions are
    graded as assertions and hearing presentations.
  steelman: The court's written bindover order, as quoted, states that physical
    evidence establishes a shot from an elevated position about 415 feet away
    and 68 feet up with the bullet travelling anatomically front to back and
    downward and not exiting—precisely the track a Losee Center roof rifle shot
    predicts—and the filed ATF report identified the spent .30-06 cartridge case
    to the recovered rifle even while fragment toolmarks stayed inconclusive; a
    proponent would rightly treat that trajectory-plus-casing package, not yet
    read in the order's own full text or tied to released wound-track
    measurements, as independent corroboration of the rooftop-rifle mechanism
    that cellphone mic-theory analyses have not answered.
