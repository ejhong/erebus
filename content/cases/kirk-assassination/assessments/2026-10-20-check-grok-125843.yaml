      converge on a person present on the Losee Center roof who fled within
      seconds of the shot. The strongest opposing consideration is that Bagley
      could not identify the person or what he was holding from the footage and
      that his body camera died on the roof, but non-identification does not
      erase the multi-channel observation of a rooftop actor.
