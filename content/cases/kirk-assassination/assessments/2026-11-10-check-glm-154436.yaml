  synthesis: "The featured hypothesis — that the public record supports an
    official single-shooter account — divides into three layers that grade very
    differently. The observational spine is strong: a rooftop actor is
    documented by independent visual forensics (KRK-E001), the FBI's own record,
    and sworn officer testimony describing the prone position, the line of
    sight, and escape footage (KRK-E002, KRK-E003); a rifle was recovered along
    the escape route (KRK-E002); and the DNA and attributed-statement clusters
    were presented in court in substantial form (KRK-E013, KRK-E015). The
    mechanism layer is honestly incomplete: the ATF comparison was inconclusive
    — the fragments can neither be identified to nor excluded from the recovered
    rifle (KRK-E007, KRK-E008, KRK-E067) — and the method's own base rates show
    an inconclusive on damaged fragments carries little diagnostic weight in
    either direction (KRK-E061, KRK-E062). The alternative-mechanism layer fails
    on this record: the microphone-device hypothesis contradicts the only
    medical finding and the trajectory as summarized in the bindover order
    (KRK-E030, KRK-E065, KRK-E068), with unpaid physics debts its own advocates
    record; the AES procurement/explosion cluster consists of real documents
    with no connective tissue to the case and a deflated timing narrative
    (KRK-E038–E042, E055); the Zinn pre-arrangement claim rests on nothing in
    the reviewed record (KRK-E044); and the donor-pressure environment, though
    authenticated, has no documented operational bridge (KRK-E023, KRK-E024).
    The genuinely live findings are auditability defects, not alternative
    culprits: a sworn, unreconciled seven-vs-four fragment count (KRK-E009), an
    original-media chain documented only as far as copies (KRK-E018), a
    non-public autopsy package (KRK-E006, KRK-E071), unpreserved surrender
    footage (KRK-E045), and a scene paved over a disputed authorization
    (KRK-E033, KRK-E058) — real anomalies that the base-rate studies deflate on
    speed and routine conduct but do not close on sequence and authority. The
    honest verdict: the single-shooter account is well supported but not yet
    fully auditable, and the missing records, not any competing mechanism, are
    where legitimate contest currently lives."
  steelman: "The strongest unanswered argument: the seven-vs-four fragment
    discrepancy is sworn, specific, and unexplained anywhere in this ledger —
    the ATF examiner herself testified she received four fragments while
    photographs documented seven, and no record offers the routine explanations
