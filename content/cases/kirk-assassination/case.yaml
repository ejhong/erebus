id: KRK-001
slug: kirk-assassination
title: "The Killing of Charlie Kirk"
subtitle: "Does the public evidentiary record of the September 10, 2025 killing of Charlie Kirk support the official single-shooter account — and where exactly does it stop being auditable?"
domain: "Contested public events · Active criminal proceeding"
status: active
summary: >-
  Charlie Kirk was killed by a single shot during a public event at Utah Valley University on September 10, 2025. The State of Utah has charged Tyler Robinson — who is presumed innocent — and presented a multi-channel case: surveillance chronology, a rooftop figure, a recovered rifle, DNA association, and alleged admissions. Around that case has grown a contested penumbra: an ATF bullet comparison that was publicly inconclusive, a fragment count that does not yet reconcile, event video handled by private personnel before documented law-enforcement custody, a site paved over within days, a prosecutor held in contempt for publicity violations, authenticated messages showing acute donor pressure on Kirk in his final weeks, and an alternative "device" hypothesis promoted by independent analysts. This case maps which of those disputes are real, which are manufactured, and what record or test would move each one. It grades evidence disputes — never anyone's guilt, which only a court can adjudicate.
