# Images for KRK-001 — cover artwork (AI-generated, abstract only) and
# numbered plates (real imagery with verified licenses). Living-persons
# discipline applies throughout: no injury imagery, no imagery of the
# accused, FBI identification language attributed rather than adopted.

- id: IMG-KRK-COVER
  role: cover
  file: /images/cases/kirk-assassination/cover.jpg
  alt: >-
    Abstract technical diagram on a deep blue-black field: a single sharp
    vertical impulse resolving into one unbroken pale trace, surrounded by
    many fainter parallel traces that step, break, and fade into dotted
    gaps marked with small crosses.
  source: generated
  license: "Project artwork (AI-generated)"
  credit: "AI-generated editorial artwork, Erebus house style"
  styleVersion: style-e1
  model: "gpt-image-1"
  runId: "cover-style-e1-2026-08-26"
  prompt: >-
    Minimal modern technical editorial illustration, in the visual language
    of a precise instrument chart or forensic diagram. An abstract diagram
    of a single sharp impulse recorded by many instruments: one clean
    vertical pulse at the left edge fanning out rightward into many
    parallel horizontal traces, some continuing unbroken, others fading
    into dotted gaps or stopping mid-line, with small registration marks
    where the traces disagree — the idea of one event producing many
    incomplete, imperfectly reconciled records. Thin, exact vector-like
    linework: fine isolines, section lines, waveform traces, small
    registration marks, restrained geometric abstraction. Cold palette only
    — deep blue-black field, graphite and slate linework, one thin
    pale-steel accent tracing the single unbroken line — on a near-white
    cool porcelain field (#eef1f4) or a deep blue-black field (#10151b);
    Prussian blue, slate, steel grey, indigo, graphite throughout; no warm
    cream, sepia, ochre, or terracotta tones anywhere. Flat, matte,
    documentary and quiet: no glow, no lens flare, no 3D render look, no
    gradients beyond subtle atmospheric shading. Generous negative space,
    austere composition. Absolutely no text, no numbers, no labels, no
    captions, no border frame lines. Stylized editorial artwork, obviously
    an illustration — not photorealistic, no photograph.

