    date: "2026-08-25"
  credibility: unresolved
  credibilitySummary: >-
    The affirmative evidence (testimony) covers copies; the assertion
    covering originals is uncorroborated publicly; nothing in the record
    shows originals were NOT transferred later. Genuinely open pending an
