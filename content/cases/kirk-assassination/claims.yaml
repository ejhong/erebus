# ── custody, scene alteration, and the A/V chain ────────────────────────

- id: KRK-C011
  tier: featured
  statement: >-
    The event A/V contractor removed the rear camera's storage card within
    minutes of the shot, before law-enforcement custody of the event media
    was documented.
  plainLanguage: >-
    Footage published by Candace Owens appears to show the contractor
    taking down the camera behind Kirk and pocketing its card about four
    minutes after the shooting. The act appears documented; its purpose is
    not — preservation, panic, and worse are all consistent with what the
    footage shows.
  theme: custody
  rung: observation
  claimType: observation
  importance: major
  reviewState: ai_extracted
  origin:
    ref: "casework/kirk brief — TPUSA/event A/V chain"
    extractedBy: "Claude Fable 5 (Cursor cloud agent)"
    runId: "case-kirk-launch-2026-08-25"
    date: "2026-08-25"
  credibility: provisionally_supported
  credibilitySummary: >-
    The removal is visible in Owens-published footage and coheres with
    sworn testimony that the contractor supplied copies the same day; but
    the public artifact is a mediated copy — native file, camera clock, and
    full surrounding sequence have not been independently examined.
  diagnosticity: moderate
  diagnosticitySummary: >-
    Early private custody of the most sensitive camera angle is a real
    provenance defect that every hypothesis must route through: it weakens
    the state's ability to prove footage integrity AND is a necessary (not
    sufficient) ingredient of any footage-manipulation variant. It does not
    by itself indicate intent.
  parentClaimIds: [KRK-C012]
  strongestObjection: >-
    Securing one's own equipment and media in an emergency is ordinary
    behavior for a working videographer; the same act would look identical
    under entirely innocent intent.
  whatWouldChangeOurMind:
    - "The native video with verified clock, showing context that changes the sequence."
    - "The contractor's sworn account of the removal and each card's disposition."

- id: KRK-C012
  tier: featured
  statement: >-
