  plainLanguage: >-
    "Inconclusive" is its own outcome, distinct from both "match" and
    "ruled out." Statements that the bullet "matched" the rifle and
    statements that the rifle was "cleared" are both misreadings of the
    same testimony.
  theme: forensics
  rung: observation
  claimType: observation
  importance: major
  reviewState: ai_extracted
  origin:
    ref: "casework/kirk brief — ballistics"
    extractedBy: "Claude Fable 5 (Cursor cloud agent)"
    runId: "case-kirk-launch-2026-08-25"
    date: "2026-08-25"
  credibility: established
  credibilitySummary: >-
    Sworn preliminary-hearing testimony, contemporaneously reported by
    multiple outlets; consistent with NIST's account of firearm comparison
    outcomes, in which inconclusive is a recognized result category.
  diagnosticity: low
  diagnosticitySummary: >-
    An inconclusive result on damaged fragments is expected under the
    single-shooter account and under most alternatives; it discriminates
    almost nothing by itself. Its importance is procedural — it defines
