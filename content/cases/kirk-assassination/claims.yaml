# ── ballistics, medical, and DNA ────────────────────────────────────────

- id: KRK-C003
  tier: featured
  statement: >-
    The bullet fragments recovered at autopsy have been publicly and
    conclusively identified as having been fired from the recovered rifle.
  plainLanguage: >-
    This is the strongest possible ballistic link — "this bullet came from
    this gun." As of the last review date, the public record does not
    contain it: the ATF comparison was inconclusive.
  theme: forensics
  rung: mechanism
  claimType: measurement
  importance: headline
  reviewState: ai_extracted
  origin:
    ref: "casework/kirk brief — ballistics"
    extractedBy: "Claude Fable 5 (Cursor cloud agent)"
    runId: "case-kirk-launch-2026-08-25"
    date: "2026-08-25"
  credibility: contradicted
  credibilitySummary: >-
    The ATF examiner testified she could not conclusively identify the
    autopsy fragments to the rifle. The claim as stated — a public,
    conclusive identification — is therefore contradicted by the public
    record. Note carefully what this does not say: the rifle was not
    excluded either (KRK-C004).
  diagnosticity: high
  diagnosticitySummary: >-
    If this identification existed it would nearly close the mechanism
    question in favor of the recovered-rifle account; its absence keeps the
    mechanism rung genuinely open to audit, which is why both sides
    misstate the inconclusive result in opposite directions.
  dependsOnClaimIds: [KRK-C004]
  strongestObjection: >-
    Damaged projectile fragments frequently yield inconclusive comparisons
    even when fired from the suspect weapon; the absence of a public match
    is weak evidence against the rifle mechanism.
  whatWouldChangeOurMind:
    - "Release of an ATF or independent examination reporting an identification (or an exclusion) on any fragment."
    - "Independent blind re-examination with 3-D surface metrology reaching a non-inconclusive result."

- id: KRK-C004
  tier: featured
  statement: >-
    The public ATF firearm/toolmark examination was inconclusive: the
    examiner could neither identify nor exclude the recovered rifle as the
