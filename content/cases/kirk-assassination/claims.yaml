# KRK-001 featured claims. Living-persons rule (AGENTS.md): every claim
# grades an evidence dispute — what records state, what forensics
# established, whether a chain is complete — never any person's criminal
# culpability. Tyler Robinson is presumed innocent; prosecution assertions
# are recorded as assertions. Claim wording was frozen from the research
# brief before the evidence pass (AGENTS.md §3.12).

# ── the roof, the rifle, and the scene ──────────────────────────────────

- id: KRK-C001
  tier: featured
  statement: >-
    A person was present on the Losee Center roof and fled across it within
    seconds of the fatal shot on September 10, 2025.
  plainLanguage: >-
    Multiple independent recordings and law-enforcement scene evidence show
    someone on the roof overlooking the event who ran immediately after the
    shot. This claim says nothing about who that person was.
  theme: scene
  rung: observation
  claimType: observation
  importance: headline
  reviewState: ai_extracted
  origin:
    ref: "casework/kirk brief — claim matrix, rooftop actor"
    extractedBy: "Claude Fable 5 (Cursor cloud agent)"
    runId: "case-kirk-launch-2026-08-25"
    date: "2026-08-25"
  credibility: well_supported
  credibilitySummary: >-
    Supported by independently geolocated social-media video (Washington
    Post analysis), FBI-released escape footage, and officer testimony
    about rooftop impressions and a displaced-gravel "sniper pad" — three
    channels with different failure modes.
  diagnosticity: moderate
  diagnosticitySummary: >-
    A rooftop actor is expected under the single-shooter account and under
    most assisted or staged variants alike; it weighs against only the
    strictest "microphone device, no rooftop event" formulation. It does
    not identify the person or establish that they fired a live round.
  strongestObjection: >-
