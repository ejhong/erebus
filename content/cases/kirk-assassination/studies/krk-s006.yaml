# Study KRK-S006 — collected 2026-09-10 under the criteria frozen the same
# day in PR #101 (hash ab8dc1418a35; the loader re-verifies it on every
# build). Rows are the collected data, one per source, each cell quoting
# its source with a locator and verification label; findings are the only
# ledger-bearing grain, entering through KRK-E065 (workpaper SRC-KRK-S006).
#
# Disclosure carried over from the freeze: the criteria were frozen in the
# operator's working session (plain-text file, SHA-256 4ca8a9aeace8766d…,
# reproduced in the freeze PR body) BEFORE any search was run, but the
# collection was carried out in that same session before the freeze PR was
