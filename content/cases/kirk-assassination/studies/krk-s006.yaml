# in-session freeze, not that the author was blind to the results.
id: KRK-S006
title: Bullet retention in a rifle-shot neck — scenario-conditional base rates for a .30-06 at 130-200 m
question: Given a .30-06 Springfield rifle bullet fired from roughly 130-200 m into an adult man's neck, how unusual is it for the bullet NOT to exit (to be retained and recovered as fragments) — answered conditionally on bullet construction, whether bone was struck, path length, and impact velocity, rather than as one number?
researchIds:
  - KRK-R002
  - KRK-R004
claimIds:
  - KRK-C006
  - KRK-C007
  - KRK-C018
criteria:
  frozenOn: 2026-09-10
  inclusion:
    - "Primary or peer-reviewed sources: ordnance-gelatin/wound-profile studies, forensic autopsy series reporting perforating vs penetrating outcomes for rifle wounds, wound-ballistics textbooks, hunting-bullet fragmentation studies in real tissue, anthropometric neck measurements, manufacturer external-ballistics tables."
    - Case-specific facts only from court-reported testimony, official statements, or the case's own verified evidence records (KRK-E009, KRK-E010, KRK-E032, KRK-C006).
    - Every row carries a verbatim quotation and a locator; a source read only in abstract is labeled so.
  exclusion:
    - Social-media assertions, commentary videos, and back-yard 'tests' are recorded (if at all) as the claims under examination, never as evidence rows.
    - No medical fact about the decedent beyond what the public court record and on-record statements contain (living-persons rules; the autopsy package is not public).
    - No number is stated without a cited source; where the literature gives no rate, the study says 'no rate found'.
  searchProtocol: "PubMed/PMC, DTIC, Springer/Elsevier abstracts, manufacturer ballistics tables, textbook excerpts reachable by web fetch; searches logged in the study; stop when each scenario cell has at least one primary row or a recorded 'no rate found'. Conditioning variables fixed at freeze (the scenarios): S1 bullet construction — (a) full-metal-jacket military-type ball; (b) expanding lead-core soft-point/hunting bullet; (c) lightweight varmint/rapid-fragmenting bullet; (d) monolithic copper expanding. S2 what the bullet struck — (i) soft tissue only (no bone); (ii) cervical spine / vertebra or mandible (dense bone) struck. S3 path length through the neck — short (transverse, ~10-14 cm) vs long (oblique, downward from an elevated firing position, up to ~20 cm+ into the chest/shoulder region). S4 impact velocity — from published external-ballistics tables for common loads at 130-200 m; treated as a range, not a point. Output: a scenario table with, per cell, the expected outcome, the sourced basis, and a plain-language rarity statement with explicit uncertainty; no single truth score."
  knownCandidates:
    - name: Fackler wound profiles (J Trauma 1988; International Defense Review 1989; DTIC ADA233190)
      disposition: include
      reason: the standard gelatin wound-profile data for FMJ and soft-point rifle bullets
    - name: Kneubuehl et al., Wound Ballistics — Basics and Applications
      disposition: include
      reason: standard text; used only if a reachable, verifiable excerpt exists
    - name: Terminal ballistics of 7.62 mm NATO bullets in ordnance gelatin (Int J Legal Med)
      disposition: include
      reason: FMJ fragmentation thresholds by impact velocity
    - name: Hunt et al. 2006 / Grund et al. 2010 / Trinogga et al. 2013 on hunting-bullet fragmentation in deer
      disposition: include
      reason: real-tissue fragmentation and exit data for lead-core hunting bullets
    - name: Spinal gunshot-wound reviews
      disposition: include
      reason: what bone strikes do to bullets; retention in spinal wounds
    - name: ANSUR / CT-based neck anthropometry
      disposition: include
      reason: the path-length denominator
    - name: ATF firearms report as filed by the defense (reported by ABC4, 2026)
      disposition: include
      reason: the case's fragment inventory, as reported
    - name: NBC News 2025 reporting on the rifle
      disposition: include
      reason: rifle and distance as reported
    - name: New York Post 2025 relay of the surgeon (KRK-E032)
      disposition: include
      reason: the 'no exit wound' relay, already in the ledger as a second-hand statement
    - name: Peak Prosperity 'experimental proof' page (Martenson, Nov 2025)
      disposition: exclude
      reason: the claim under examination; a back-yard test, recorded as a claim, never a row
    - name: Fox / East Idaho News / KUTV hearing live blogs already in the case file
      disposition: include
      reason: court-reported facts (wound classification, fragments)
  criteriaHash: ab8dc1418a35
method: For each scenario cell (S1 x S2, with S3 and S4 as stated ranges), state the expected outcome, the sourced basis, and a plain-language statement of how unusual a retained bullet would be, with explicit uncertainty and no single truth score. Rows are the collected data — one row per source, each cell quoting the source verbatim with its locator and verification label; numbers derived by this study (velocity interpolation, equivalent neck diameter, scale-bar readings from reproduced figures) are marked as derived. Animal hunting series are used as analog base rates only where no human series exists, and are labeled as analogs. The public record of the case is then placed in the table by scenario, with every case fact attributed to its source and prosecution statements labeled as assertions (living-persons rules). The study never grades a claim; its findings enter the ledger only through ordinary evidence records citing the workpaper. Either outcome publishes, including "no rate found".
columns:
  - source
  - material and conditions
  - bullet
  - impact velocity
  - what was measured
  - result
  - bears on
rows:
  - cells:
      source: "Fackler, Bellamy & Malinowski, 'The wound profile: illustration of the missile-tissue interaction', J Trauma 1988;28(1 Suppl):S21-9"
      material and conditions: 10% ordnance gelatin at 4 °C in 25 × 25 × 50 cm blocks; the method behind rows 2-4
      bullet: method row (all calibers)
      impact velocity: as fired; recorded per profile
      what was measured: penetration depth, deformation and fragmentation pattern, yaw, temporary cavity
      result: '"The penetration depth, projectile deformation and fragmentation pattern, yaw, and temporary cavity of the missile in living anesthetized swine muscle are reproduced by this gelatin."'
      bears on: validity of the gelatin rows for tissue
    citation:
      text: J Trauma 1988;28(1 Suppl):S21-9 (abstract read via the Europe PMC record MED:3339689)
      url: https://europepmc.org/article/MED/3339689
      locator: abstract
      verification: ai_verified
  - cells:
      source: Fackler, 'Wounding patterns of military rifle bullets', International Defense Review 1989;(1):59-64
      material and conditions: gelatin wound profiles; uncomplicated thigh and abdominal wounds discussed
      bullet: 7.62 × 51 mm NATO full-metal-jacket, US version (9.7 g)
      impact velocity: 862 m/s as printed on the Fig. 9 profile
      what was measured: point-forward distance before yaw; deformation; total penetration
      result: "The bullet \"tends to travel point-forward during the first 16cm of the tissue path\"; Fig. 9 caption: \"This bullet does not ordinarily deform on striking soft tissue at any range.\"; on variation: \"Seven out of ten shots can be expected to begin yaw within 25 per cent of this distance\"; \"Bullet mass and bullet striking velocity establish a bullet's potential; they set the limit on the tissue disruption it can produce.\""
      bears on: "(a)(i): an FMJ over a 10-14 cm path has not yet begun to yaw"
    citation:
      text: International Defense Review 1989, no. 1, pp. 59-64; read from the archive.org scan 'wounding_patterns_military_rifles' (pp. 62-63)
      url: https://ia903201.us.archive.org/7/items/wounding_patterns_military_rifles/wounding_patterns_military_rifles_text.pdf
      locator: pp. 62-63 and Fig. 9
      verification: ai_verified
  - cells:
      source: Fackler 1989 (as row 2)
      material and conditions: gelatin wound profiles
      bullet: 7.62 × 51 mm NATO, West German version (thinner jacket); US M193 5.56 mm
      impact velocity: as printed on the profiles; M193 fragmentation shown falling off with range
      what was measured: jacket failure, fragmentation and mass retention of nominally non-expanding bullets
      result: "The German bullet, \"after travelling point-forward for only about 8cm, yaws and breaks at the cannelure. The flattened point section retains about 55 per cent of the bullet's weight; the remaining 45 per cent becomes fragments\"; M193 profile label \"36% fragmentation\"; caption: \"The M193 is unlikely to break up on striking soft tissue at ranges over 200m.\""
      bears on: "(a)(ii) and (c): a jacket that fails turns a ball round into a fragmenting one; fragmentation falls with impact velocity"
    citation:
      text: International Defense Review 1989, no. 1, p. 62 and Figs. 6-7, 11 (archive.org scan)
      url: https://ia903201.us.archive.org/7/items/wounding_patterns_military_rifles/wounding_patterns_military_rifles_text.pdf
      locator: p. 62; Fig. 6, Fig. 7, Fig. 11
      verification: ai_verified
  - cells:
      source: Fackler wound profiles as reproduced on Fr. Frog's 'Terminal Ballistics' page (credited 'courtesy Dr. Martin Fackler and IWBA files')
      material and conditions: 10% ordnance gelatin per row 1; profiles at muzzle velocity
      bullet: .30-06 Winchester 150 gr soft point; M80 7.62 NATO 149 gr FMJ; .30-30 Winchester 170 gr Silvertip
      impact velocity: 2923 ft/s (.30-06 SP); 2730 ft/s (M80); 2020 ft/s (.30-30)
      what was measured: penetration depth and where fragmentation or yaw begins (this study's reading of the scale bars, ± about 1 cm)
      result: 'Caption: "Winchester .30-06 150gr Softpoint at 2923 f/s. Note the larger permanent cavity than the .30-30 but almost identical penetration." Read from the image: fragments shed from within the first ~5 cm; the residual expanded bullet (labelled 1.15 cm) stops at the end of a 42 cm scale. M80 caption: "a 149gr FMJ boat tailed bullet at 2730 f/s"; image: point-forward to ~15 cm, bullet at the end of a 65 cm scale. .30-30 image: expanded bullet at ~45 cm.'
      bears on: "(b)(i): a soft-point's ~40 cm of gelatin penetration is three times a neck's width; (a)(i): FMJ ~65 cm"
    citation:
      text: frfrogspad.com/terminal2.htm, images 308sp.jpg, m80.jpg, 3030.jpg — a secondary reproduction of Letterman Army Institute of Research profiles; numbers are scale-bar readings by this study
      url: https://www.frfrogspad.com/terminal2.htm
      locator: captions and the three profile images
      verification: ai_verified
  - cells:
      source: Gremse et al., 'Performance of lead-free versus lead-based hunting ammunition in ballistic soap', PLoS ONE 2014;9(7):e102015
      material and conditions: glycerin ballistic soap blocks 25 × 25 × 40 cm (soap is stiffer than gelatin and under-states tissue penetration); four impact speeds per bullet
      bullet: Norma Vulkan (NVU) semi-jacketed lead-core deforming, 11.68 g / 180.25 gr; compared with brass, copper-fragmenting and copper-deforming bullets
      impact velocity: NVU at 500, 600, 700 and 800 m/s
      what was measured: energy deposited in the block; mass of fragments exiting the block; fragment count; depth of maximum damage
      result: "\"In our experiments, the bullets released most of their energy in the block (97.5% ± 2.6%).\" \"The relative weight of the exiting fragments at the highest speeds was 99.4% for ILS, 64.9% for TAG, 73.6% for TSX, and 54.7% for NVU\" — at 800 m/s more than half the lead bullet's mass still left a 40 cm soap block. \"The lead-containing bullet creates hundreds of small lead fragments\"; NVU averaged 562.03 ± 456.06 fragments; depth of maximum damage 8.91 ± 1.14 cm for NVU versus 20.31 ± 2.27 cm for the non-deforming brass bullet."
      bears on: "(b)(i): exit through 40 cm of soap at hunting velocity; (b)(ii): energy release concentrated in the first ~9 cm; (d): copper bullets retain 65-74% of mass and leave few fragments"
    citation:
      text: "PLoS ONE 2014;9(7):e102015, doi 10.1371/journal.pone.0102015 (open-access PDF read, pp. 2-6: Methods 'Ballistic Soap Experiments', Table 1, Results 'Energy to Volume Conversion', 'Metal Fragments', 'Cavity Shape')"
      url: https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0102015
      doi: 10.1371/journal.pone.0102015
      locator: pp. 2-6
      verification: ai_verified
  - cells:
      source: Trinogga, Courtiol & Krone, 'Fragmentation of lead-free and lead-based hunting rifle bullets under real life hunting conditions in Germany', Ambio 2019;48(9):1056-1064
      material and conditions: 297 wild ungulates (chamois, fallow deer, red deer, roe deer, wild boar) shot in ordinary hunting; carcasses imaged for fragments
      bullet: lead-core and lead-free hunting bullets in '.30-06 Springfield, 9.3 × 62, 8 × 57 IS and .308 Winchester'
      impact velocity: "hunting ranges: '102 out of 297 shots were done at a distance of up to 50 m, further 161 shots were done at a distance ranging between 51 and 100 m. In the remaining 34 cases, shooting distances were longer than 100 m'"
      what was measured: number of metal fragments per carcass and their distance from the wound channel; role of bone hits
      result: Lead-based bullets left "an average of 153 ± 107 (mean ± SD)" fragments per carcass; lead-free deforming bullets left no fragments in "106 out of 126 cases"; "Bone hits were not required for the production of a large number of fragments."
      bears on: "(b): a lead-core hunting bullet sheds ~150 fragments even without bone — fragments in the body are the norm, not a sign of an unusual event; (d): copper bullets do not"
    citation:
      text: Ambio 2019;48(9):1056-1064, doi 10.1007/s13280-019-01168-z (open access at PMC6675795; Results read)
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC6675795/
      doi: 10.1007/s13280-019-01168-z
      locator: Results
      verification: ai_verified
  - cells:
      source: "Hunt et al., 'Lead bullet fragments in venison from rifle-killed deer: potential for human dietary exposure', PLoS ONE 2009;4(4):e5330"
      material and conditions: 30 white-tailed deer shot by hunters under normal conditions; 26 of 30 shot in the thorax; radiographed
      bullet: 7 mm Remington Magnum, 150 gr (9,720 mg), lead core (68% of mass) with copper jacket
      impact velocity: "'Reported shot distances averaged 116 m (range = 25-172 m)'"
      what was measured: whether any part of the projectile exited; fragment counts and spread
      result: '"some portion of the projectile exited the animal in 92% of shots"; carcasses held "metal fragments (geometric mean = 136 fragments, range = 15-409)"; "maximum single fragment separation was 45 cm".'
      bears on: "(b)(i) analog base rate: in a deer chest — a far longer path than a neck — the bullet failed to exit in about 1 shot in 12"
    citation:
      text: PLoS ONE 2009;4(4):e5330, doi 10.1371/journal.pone.0005330 (open access at PMC2669501; Results read)
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC2669501/
      doi: 10.1371/journal.pone.0005330
      locator: Results
      verification: ai_verified
  - cells:
      source: Hampton et al., 'A comparison of lead-based and lead-free bullets for shooting sambar deer (Cervus unicolor) in Australia', Wildlife Research 2023;50:632-641
      material and conditions: sambar deer, 'Australia's largest deer species (140 kg for females, 220 kg for males)'; thoracic shots; 'Most deer (98%) were shot at a range of <300 m'
      bullet: 124 lead-based and 152 lead-free bullets across 13 cartridge types, calibers .270-.450
      impact velocity: hunting ranges under 300 m
      what was measured: proportion of bullet tracts with an exit wound, by bullet type
      result: "\"the proportion of bullet tracts producing exit wounds was 0.96 for lead-free and 0.58 for lead-based bullets\"; authors' explanation: \"Bullets that deform and/or fragment to a lesser degree or more slowly tend to achieve deeper penetration of animal tissues.\""
      bears on: "(b)(ii) analog: 42% of lead-core hunting bullets did not exit very large animals even on chest shots; (d): copper bullets exited 96%"
    citation:
      text: Wildlife Research 2023;50:632-641, doi 10.1071/WR22099 (Results and Discussion read at connectsci.au)
      url: https://doi.org/10.1071/WR22099
      doi: 10.1071/WR22099
      locator: Results (exit wounds); Discussion
      verification: ai_verified
  - cells:
      source: Hampton et al., 'A comparison of fragmenting lead-based and lead-free bullets for aerial shooting of wild pigs', PLoS ONE 2021;16(3):e0247785
      material and conditions: wild pigs of mean body mass ~70 kg shot from helicopters; ballistic testing at 50 m
      bullet: .308 Winchester Speer 130 gr non-bonded hollow-point (lead) versus 115 gr copper Controlled Chaos
      impact velocity: short aerial ranges (rifles zeroed at 30 m)
      what was measured: fragment number and size; exit wounds
      result: 'Lead-based: "median number of fragments = >300", all fragments "small (< 1 mm)"; lead-free: median 54.6, "large (>5 mm)"; "Determining the presence or absence of exit wounds was found to be infeasible for animals that were shot multiple times".'
      bears on: "(c): a light non-bonded hollow-point disintegrates; no exit rate available"
    citation:
      text: PLoS ONE 2021;16(3):e0247785, doi 10.1371/journal.pone.0247785 (Results read)
      url: https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0247785
      doi: 10.1371/journal.pone.0247785
      locator: Results
