  - cells:
      source: "Di Maio, Gunshot Wounds: Practical Aspects of Firearms, Ballistics, and Forensic Techniques, 2nd ed., CRC Press 1999 (ISBN 0849381630)"
      material and conditions: forensic-pathology textbook, chapter on centerfire rifle wounds
      bullet: hunting (soft-point / hollow-point) centerfire rifle bullets
      impact velocity: rifle velocities generally; 'dependent on the velocity of the bullet'
      what was measured: "described behaviour: expansion, lead shedding ('lead snowstorm'), effect of bone, exit wounds, jacket retention"
      result: 'p. 77: "Soft-point and hollow-point centerfire rifle bullets not only tend to expand as they go through the body, but also shed lead fragments from the core"; p. 186: "A hunting bullet is designed to deform in its passage through the body, producing an increase in its presenting area"; p. 204: "As the expanding hunting bullet moves through the body, fragments of lead break off the lead core and are hurled out into the surrounding tissues."; p. 205: "The lead snowstorm from hunting ammunition is dependent on the velocity of the bullet."; p. 196: "Anything that tends to produce instability, deformation or breakup of the bullet as it enters the head results in more extensive injuries. Thus, bullets entering through the thick occipital bone cause greater injuries than those entering the temporal area."; p. 212: "Exit wounds are variable in size, sometimes indistinguishable from those from handgun bullets, though at other times too large."; p. 397: "The jacket may be retained beneath the skin adjacent to the exit site."'
      bears on: "(b)(i)-(ii): expansion and lead shedding are the design behaviour; dense bone increases breakup; jackets lodge under the skin"
    citation:
      text: Di Maio VJM, Gunshot Wounds, 2nd ed. (CRC Press, 1999); sentences located through the archive.org full-text index of a scanned copy (item Gunshot_Wounds_Practical_Aspects_Of_Firearms_Ballistics_Forensic_Techniques); page numbers are the index's, not checked against a physical copy
      url: https://archive.org/details/Gunshot_Wounds_Practical_Aspects_Of_Firearms_Ballistics_Forensic_Techniques
      locator: pp. 77, 186, 196, 204, 205, 212, 397 (as indexed)
      verification: ai_verified
  - cells:
      source: Bono & Heary, 'Gunshot wounds to the spine', The Spine Journal 2004;4(2):230-240
      material and conditions: clinical review of spinal gunshot wounds
      bullet: fully jacketed versus partially/non-jacketed and hollow-point bullets
      impact velocity: low- and high-velocity weapons discussed
      what was measured: "described behaviour: deformation, fragmentation, retained bullets, cervical outcomes"
      result: 'p. 231: "Fully jacketed bullets exhibit little deformation with firing and are designed for accuracy to hit long-range targets. They are highly precise and incur clean exit and entrance wounds. Partially or nonjacketed missiles expand on tissue impact and, like hollow-point bullets, exponentially extend the circumference of tissue damage."; "Fragmentation of the missile can increase the zone of tissue destruction."; p. 232: "Often, only an entrance hole can be found if the bullet is lodged in tissue."; p. 235: "Approximately 59% of penetrating cervical spine injuries result in complete spinal cord injury, compared with 49% for blunt trauma".'
      bears on: "(a) versus (b): construction decides deformation; (b)(ii): a lodged bullet leaves only an entrance wound"
    citation:
      text: The Spine Journal 2004;4(2):230-240, doi 10.1016/S1529-9430(03)00178-5 (full PDF read, pp. 231-235)
