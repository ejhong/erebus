findings:
  - statement: 'Scenario (a)(i), a full-metal-jacket bullet through soft tissue only: exit is all but certain. A 10-14 cm side-to-side neck path (rows 16-17) is shorter than the ~15-16 cm an intact-jacket 7.62 mm bullet travels before it even begins to yaw, and a fraction of its ~65 cm of gelatin penetration (rows 2, 4); sound jackets stay intact at 810 m/s (row 13). No human series gives a rate, and none is needed: there is no mechanism in the sources for stopping such a bullet within 14 cm of soft tissue. This is the one scenario in which "it should have gone through" is well founded — and a retained, shattered bullet would be genuinely anomalous.'
  - statement: "Scenario (a)(ii), full-metal-jacket against a cervical vertebra: usually still exits, but not always. A thin bone layer delayed yaw and did not stop a 7.62 × 39 mm bullet in 50 cm of gelatine (row 14); yet jacket failure on high-velocity impact is documented — all but one bullet in a national autopsy series of one 7.62 NATO make had fragmented, with both retained and exited outcomes (rows 3, 12, 13). Retention after a vertebral-body strike is uncommon but documented; no rate was found."
  - statement: "Scenario (b)(i), an expanding lead-core soft-point through soft tissue only: the main mass exits and a shower of small lead fragments stays behind. The .30-06 150 gr soft point penetrates ~42 cm of gelatin at muzzle velocity (row 4); a 180 gr lead-core deforming bullet passed through 40 cm of ballistic soap at 800 m/s with 55% of its mass still exiting (row 5); in deer chests — a far longer path than a neck — some part of the bullet exited in 92% of shots at an average of 116 m (row 7), and even in 140-220 kg sambar deer lead-core bullets exited 58% of the time (row 8). Retention of the main mass over a neck path would be unusual, plausibly rarer than 1 in 10 given the analogs' thicker targets; ~150 fragments left in the body is the norm (row 6)."
  - statement: 'Scenario (b)(ii), an expanding lead-core soft-point that strikes the cervical spine: retention with fragmentation and jacket-core separation is the ordinary, textbook outcome, not an anomaly. The bullet is designed to deform and shed lead (row 10), releases most of its energy early (depth of maximum damage ~9 cm in soap, row 5), breaks up more on dense bone (row 10, p. 196), and when it stops "often, only an entrance hole can be found" (row 11), the jacket lodging under the skin (row 10, p. 397). The best available rate is an animal analog: 42% of lead-core hunting bullets did not exit very large deer even on chest shots (row 8); no human series of expanding rifle bullets in the neck with a vertebral strike was found, so no tighter number is claimed. A clinical review describes high-velocity deforming ammunition as one that "often result[s] in retained bullets" (row 15).'
    evidenceId: KRK-E065
  - statement: 'Scenarios (c) and (d): a light, non-bonded hollow-point disintegrates (>300 fragments in a 70 kg pig, row 9; 36% fragmentation for M193 at close range, row 3), so retention is expected, with no rate found. A monolithic copper bullet expands without shedding lead and exits even very large deer 96% of the time (row 8) while leaving no fragments in 106 of 126 cases (row 6); retention would be unusual, and the "four lead fragments" the ATF describes (row 22) are not what a copper bullet leaves.'
  - statement: "Path length and velocity (S3, S4): a lateral neck diameter of about 12 cm at the larynx (row 16; 11.8-12.6 cm from circumference cut-offs, row 17) makes a side-to-side path 10-14 cm. At 142-200 yards a 150 gr load arrives at roughly 2,340-2,500 fps (713-762 m/s) with 1,830-2,100 ft·lb (rows 18-19) — far above the velocities at which soft-point bullets expand and shed lead, and inside the band where FMJ jackets are tested. Heavier loads arrive 100-250 fps slower without changing any cell. A long oblique path (downward into the chest) would move every \"exits\" cell toward \"retained\"; the building's height was not found (row 27), so the angle is not computed, and over 130-183 m a roof a few stories high gives a shallow angle in any case."
  - statement: "Placing the record: as it stands, the public record describes a .30-06 rifle (row 25 and KRK-C002), a neck gunshot wound with fragments recovered at autopsy (KRK-C006, KRK-E005), a bullet that in the prosecution's words relaying the ME report \"struck Kirk's spine and shattered\" (row 21 — an assertion, the report itself being confidential), one deformed jacket fragment plus four lead fragments examined and seven photographed (row 22, KRK-E009), a bullet relayed second-hand as found \"just beneath the skin\" (row 23, KRK-E032), and — in unverified secondary accounts of an exhibit — a Remington Core-Lokt soft point (row 26). That is cell (b)(ii), where the sources make retention the expected outcome. The intuition that \"a .30-06 always goes through\" is correct for cells (a)(i) and (b)(i) and wrong for the cell the record describes. What would move the case out of (b)(ii): evidence that the bullet was full-metal-jacket; evidence that no bone was struck; or a fragment inventory whose recovered mass is inconsistent with a 150 gr bullet. Nothing here bears on who fired the shot."
    evidenceId: KRK-E065
  - statement: The claim under examination (Peak Prosperity, Chris Martenson, "Experimental proof…", Nov. 7, 2025 — excluded from the rows by the frozen criteria as a back-yard test) describes shooting pork "picnic" roasts, some "bone-in", with 150 gr FMJ, 180 gr ballistic-tip and 220 gr soft-point loads from a Remington 700 at about 100 yards, 38 shots, and reports that "no bullets were stopped or even meaningfully deflected", concluding "a human neck could not have stopped a .30-06 round". Read against the table, the test reproduces cells (a)(i) and (b)(i) and a limb-bone strike inside a roast; it does not reproduce a cervical vertebral body in situ, does not report the roasts' thickness or the impact velocities, and its 100-yard range gives roughly 100 fps more velocity than 175 yards. Its result agrees with the sources for the cells it tested and says nothing about cell (b)(ii). The surgeon's relayed statement that this caliber "always just go[es] through everything" (row 23) is contradicted by rows 7, 8 and 10 for expanding bullets; both circulating claims fail for the same reason — neither conditions on bullet construction and bone.
  - statement: "Failed searches (§3.11 at study grain): no human forensic or trauma series was found reporting retention versus exit for expanding rifle bullets in the neck; neck-wound series are handgun-dominated, military series are FMJ (rows 12, 13, 20), and a Europe PMC query for hunting rifle or hunting ammunition with exit wound or perforating and autopsy returned nothing relevant. The following were blocked or unreadable to this operator and are therefore absent or abstract-only: abc4.com (403), nypost.com, cnn.com (451), washingtonpost.com (403), sciencedirect.com (403), link.springer.com (login redirect), apps.dtic.mil (403), pubmed.ncbi.nlm.nih.gov (cookie wall; Europe PMC used instead). Kneubuehl's Wound Ballistics, named at freeze, was not reachable and is not used."
limitations:
  - Every base rate in the table is an animal analog (deer, pigs, wild ungulates) or a simulant (gelatin, soap); no human series gives a retention rate for expanding rifle bullets in the neck. Analogs are labeled and their target sizes stated; the neck is thinner than every analog target, which pushes exit rates up, while a vertebral strike pushes them down.
  - The Fackler wound profiles are read from a secondary reproduction (row 4) and at muzzle velocity; at 713-762 m/s a soft point fragments somewhat less and penetrates somewhat more, which strengthens the exit expectation in cell (b)(i) and does not change cell (b)(ii).
  - Di Maio's page numbers come from the archive.org full-text index of a scanned copy of the 1999 edition and were not checked against a physical copy; the sentences themselves are quoted as indexed.
  - Rows 1, 12, 13, 15, 17 and 20 were read in abstract only; their labels say so.
  - "Every case fact is second-hand to the primary medical and forensic records: the autopsy report is confidential (KRK-C007), the spine strike is the prosecution's characterization of it (row 21), the ATF report was read through a press account (row 22), the ammunition type rests on secondary accounts of an exhibit photograph and is carried as unverified (row 26), the distance is a 142-200 yard range from official statements on different days (rows 24-25), the building's height was not found, and the left-side entry widely reported from video was not verified against a primary record."
  - Derived numbers — velocity interpolation, equivalent neck diameter, scale-bar readings — carry ± several percent and are marked as derived in the cells.
  - "The literal search queries were not pre-registered; the frozen protocol named the sources and the stopping rule. The queries run are listed here verbatim: 'Charlie Kirk shooting distance yards Losee Center roof rifle .30-06 charging document Robinson'; 'Tyler Robinson rifle cartridges ammunition type .30-06 soft point hunting rounds engraved FBI Mauser'; 'forensic study rifle gunshot wounds perforating versus penetrating retained bullet percentage hunting rifle autopsy series'; 'Fackler wound profile .30-06 soft point ballistic gelatin penetration depth fragmentation 7.62 NATO FMJ 20 cm yaw'; 'gunshot wounds cervical spine bullet retained versus exit high velocity rifle series percentage'; 'adult male neck anteroposterior diameter cm measurement study sagittal neck depth'; 'Robinson defense filing ATF firearms report inconclusive fragments described jacket lead grain core'; 'Kolvet surgeon Charlie Kirk bullet man of steel bone should have gone through'; 'Robinson preliminary hearing autopsy testimony bullet entered left side of neck trajectory spine fragments'; 'Fackler wound profile .30-06 soft point 150 gr penetration cm fragmentation gelatin'; 'Hunt 2006 bullet fragments deer carcasses lead fragmentation Grund 2010 Trinogga 2013 retained mass'; 'Federal Power-Shok 30-06 150 grain soft point ballistics table'; 'WDMET Vietnam rifle bullet wounds perforating penetrating percentage'; 'penetrating neck injury gunshot series exit wound through-and-through transcervical percentage rifle'; 'civilian high-velocity rifle gunshot wounds series retained bullet perforating exit trauma center'; 'neck circumference adult men mean cm Ben-Noun 2001'; 'Kirk bullet struck spine shattered hearing testimony'; 'Fackler Wounding patterns of military rifle bullets'; 'Terminal ballistics of 7.62 mm NATO bullets ordnance gelatin'; 'neck separation lateral diameter radiotherapy larynx'; 'Utah DPS Mason FBI yards roof Losee Center shot distance official statement'; 'forensic autopsy se