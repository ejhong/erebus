id: KRK-S006
title: Bullet retention in a rifle-shot neck — scenario-conditional base rates
  for a .30-06 at 130-200 m
question: Given a .30-06 Springfield rifle bullet fired from roughly 130-200 m
  into an adult man's neck, how unusual is it for the bullet NOT to exit (to be
  retained and recovered as fragments) — answered conditionally on bullet
  construction, whether bone was struck, path length, and impact velocity,
  rather than as one number?
researchIds:
  - KRK-R002
  - KRK-R004
claimIds:
  - KRK-C006
  - KRK-C007
  - KRK-C018
criteria:
  frozenOn: 2026-09-10
  inclusion:
    - "Primary or peer-reviewed sources: ordnance-gelatin/wound-profile studies,
      forensic autopsy series reporting perforating vs penetrating outcomes for
      rifle wounds, wound-ballistics textbooks, hunting-bullet fragmentation
      studies in real tissue, anthropometric neck measurements, manufacturer
      external-ballistics tables."
    - Case-specific facts only from court-reported testimony, official
      statements, or the case's own verified evidence records (KRK-E009,
      KRK-E010, KRK-E032, KRK-C006).
    - Every row carries a verbatim quotation and a locator; a source read only
      in abstract is labeled so.
  exclusion:
    - Social-media assertions, commentary videos, and back-yard 'tests' are
      recorded (if at all) as the claims under examination, never as evidence
      rows.
    - No medical fact about the decedent beyond what the public court record and
      on-record statements contain (living-persons rules; the autopsy package is
      not public).
    - No number is stated without a cited source; where the literature gives no
      rate, the study says 'no rate found'.
  searchProtocol: "PubMed/PMC, DTIC, Springer/Elsevier abstracts, manufacturer
    ballistics tables, textbook excerpts reachable by web fetch; searches logged
    in the study; stop when each scenario cell has at least one primary row or a
    recorded 'no rate found'. Conditioning variables fixed at freeze (the
    scenarios): S1 bullet construction — (a) full-metal-jacket military-type
    ball; (b) expanding lead-core soft-point/hunting bullet; (c) lightweight
    varmint/rapid-fragmenting bullet; (d) monolithic copper expanding. S2 what
    the bullet struck — (i) soft tissue only (no bone); (ii) cervical spine /
    vertebra or mandible (dense bone) struck. S3 path length through the neck —
    short (transverse, ~10-14 cm) vs long (oblique, downward from an elevated
    firing position, up to ~20 cm+ into the chest/shoulder region). S4 impact
    velocity — from published external-ballistics tables for common loads at
    130-200 m; treated as a range, not a point. Output: a scenario table with,
    per cell, the expected outcome, the sourced basis, and a plain-language
    rarity statement with explicit uncertainty; no single truth score."
  knownCandidates:
    - name: Fackler wound profiles (J Trauma 1988; International Defense Review 1989;
        DTIC ADA233190)
      disposition: include
      reason: the standard gelatin wound-profile data for FMJ and soft-point rifle
        bullets
    - name: Kneubuehl et al., Wound Ballistics — Basics and Applications
      disposition: include
      reason: standard text; used only if a reachable, verifiable excerpt exists
    - name: Terminal ballistics of 7.62 mm NATO bullets in ordnance gelatin (Int J
        Legal Med)
      disposition: include
      reason: FMJ fragmentation thresholds by impact velocity
    - name: Hunt et al. 2006 / Grund et al. 2010 / Trinogga et al. 2013 on
        hunting-bullet fragmentation in deer
      disposition: include
      reason: real-tissue fragmentation and exit data for lead-core hunting bullets
    - name: Spinal gunshot-wound reviews
      disposition: include
      reason: what bone strikes do to bullets; retention in spinal wounds
    - name: ANSUR / CT-based neck anthropometry
      disposition: include
      reason: the path-length denominator
    - name: ATF firearms report as filed by the defense (reported by ABC4, 2026)
