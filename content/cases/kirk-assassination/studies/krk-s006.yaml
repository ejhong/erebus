method: For each scenario cell (S1 x S2, with S3 and S4 as stated ranges), state
  the expected outcome, the sourced basis, and a plain-language statement of how
  unusual a retained bullet would be, with explicit uncertainty and no single
  truth score. Rows are the collected data — one row per source, each cell
  quoting the source verbatim with its locator and verification label; numbers
  derived by this study (velocity interpolation, equivalent neck diameter,
  scale-bar readings from reproduced figures) are marked as derived. Animal
  hunting series are used as analog base rates only where no human series
  exists, and are labeled as analogs. The public record of the case is then
  placed in the table by scenario, with every case fact attributed to its source
  and prosecution statements labeled as assertions (living-persons rules). The
  study never grades a claim; its findings enter the ledger only through
  ordinary evidence records citing the workpaper. Either outcome publishes,
  including "no rate found".
