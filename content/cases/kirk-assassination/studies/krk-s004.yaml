method: Discovery per the frozen protocol; extraction per study of the row
  variables, each cell citing the primary document with the standard
  verification label; cells that cannot be sourced are marked, not estimated.
  Same-source and different-source inconclusive shares are recorded separately,
  as is each study's convention for scoring inconclusives in its error rates —
  that convention, not the raw rate, is where most public misreadings start.
  Findings state in plain language what an inconclusive outcome does and does
  not shift between the identification and exclusion readings of KRK-C004, state
  explicitly that black-box materials are intact test-fired bullets or cartridge
  cases while this case's questioned items are fragments (an applicability
  limit, stated, not smoothed over), report failed searches, and give the
  searcher-overlap coverage indicator. Either outcome publishes.
