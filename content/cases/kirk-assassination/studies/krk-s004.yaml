findings:
  - statement: >-
      An inconclusive is a standard, high-frequency outcome of
      firearm-toolmark examination, not an anomaly: every ground-truth
      study in the table offers it as a response category, scores it as
      a non-error, and observes it at rates from a few percent to the
      modal response (65.4% of true different-source bullet comparisons
      in Ames II). The ATF result in this case (KRK-C004) is exactly
      what the method's own literature says it frequently produces.
      Neither public misreading survives the table: an inconclusive is
      not an identification, and it is not an elimination — the studies
      reserve those words for definitive calls the examiner declined to
      make.
    evidenceId: KRK-E061
  - statement: >-
      Measured against ground truth, inconclusives are asymmetric: every
      study reporting both shares finds them far more common on true
      different-source pairs (Ames I 33.7% versus 1.0%; Ames II bullets
      65.4% versus 20.5%; Mattijssen 48.1% versus 16.6%; Guyll 35.9%
      versus 6.5%, with an explicit likelihood ratio giving an
      inconclusive probative value toward different-source). Read
      naively, that asymmetry would make the ATF result weak evidence
      against the rifle being the source. The naive reading does not
      transfer to this case: the asymmetry is measured on intact
      test-fires, and the one study that includes damaged bullets
      (Hicklin 2024) shows specimen quality drives inconclusive rates by
      itself, in whichever direction — a fragment-based inconclusive is
      dominated by the quality mechanism, not the source mechanism. The
      honest bound: on published performance data, the inconclusive in
      this case carries little diagnostic weight in either direction,
      and the fragments' condition, not examiner effort, is the binding
      constraint.
    evidenceId: KRK-E062
  - statement: >-
      Scoring conventions are where public error-rate claims go wrong:
      all six rows decline to count inconclusives as errors, so widely
      quoted sub-1% error rates are conclusives-only figures. Guyll 2023
      makes the sensitivity of this choice explicit — true-negative
      performance drops from over 99% to 63.5% when inconclusives are
      incorporated — and Hicklin 2024 formalizes three rate bases and
      requires the choice to be stated. Any courtroom or public claim
      citing a firearms-identification error rate without stating its
      inconclusive convention is under-specified.
    evidenceId: KRK-E061
  - statement: >-
      The pre-committed candidates survived: Ames I, both published Ames
      II parts, and Mattijssen 2020 met the frozen criteria on native
      verification (Mattijssen's inconclusive measure is a
      would-you-report flag rather than an AFTE category, recorded on
      the row). Three studies the author's union missed were surfaced by
      searchers and included after verification: Guyll 2023 (PNAS) and
      Hicklin 2024 (the only damaged-bullet study) by the OpenAI run,
      and Fadul 2011 (the closed-set exemplar courts historically cited)
      by the Gemini run. Two lead errors were
      caught at native verification: the freeze named Bajic on the Ames
      II papers (the accuracy and repeatability parts are Monson, Smith
      & Peters), and the FBI Laboratory's statement page mis-cites the
      repeatability paper's page numbers.
limitations:
  - >-
    The table measures the method's behavior on materials mostly unlike
    this case's questioned items: five of six rows use intact
    test-fires, and the one damaged-bullet study declined to publish
    overall rates and warns it lacked enough very poor-quality bullets
    for precision. Every transfer from this table to the ATF result
    inherits that gap, which is why finding 2 bounds rather than
    estimates.
  - >-
    Study difficulty is a design choice that moves inconclusive rates
    by tens of percentage points (Ames II chose challenging specimens
    deliberately; Mattijssen selected hard comparisons from 79,800;
    Guyll manipulated difficulty across firearm models). The frozen
    never-pool rule is why no summary rate is offered across rows.
  - >-
    Response scales differ across rows (AFTE three-level inconclusive;
    OSAC lean categories; a would-report flag). Shares are comparable
    in direction but not in exact magnitude across scales.
  - >-
    Searcher coverage: three searchers ran the frozen protocol. The
    OpenAI substitute run (deep-research models remain unavailable to
    the project key) surfaced both post-freeze candidates (Guyll 2023,
    Hicklin 2024) though with partly garbled author lists and counts,
    used as leads only; the Gemini deep-research run corroborated every
    natively verified rate in the table (including the Ames II 65.4%/20.5%
    split and Guyll's 63.5% incorporated true-negative rate) and surfaced
    one further candidate beyond the union (Fadul 2011, included after
    native verification as the closed-set design exemplar). Commentary
    literature on inconclusive scoring (surfaced repeatedly) is
    excluded from rows per the frozen criteria and enters only as the
    debate finding 3 describes.
  - >-
    Stage provenance: the freeze stamp (runId
