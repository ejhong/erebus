    Per-candidate queries pairing the case name with: \"FBI\", \"press
    conference\", \"special agent in charge\", \"FBI assisted\", \"FBI evidence
    response\", \"federal charges\". Generic queries: [FBI role state murder
    investigation assistance]; [FBI director press conference shooting];
    [special agent in charge briefing shooting]. Sources searched: FBI and DOJ
    press-release archives, contemporaneous AP/Reuters and papers of record,
    official after-action reports. Union of searcher candidate lists; overlap
    reported in limitations. Deep-research output is a brief under casework
    convention — never cited; every cell verified natively before entering the
    table."
