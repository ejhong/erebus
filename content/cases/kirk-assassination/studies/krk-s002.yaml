findings:
  - statement: "FBI participation is universal in the table: thirteen of thirteen
      comparable state-jurisdiction cases had documented FBI investigative
      involvement — typically evidence response, laboratory work, interviews,
      and victim services — always framed as assistance to a state or local
      lead. Participation alone carries no information; the on-record expert
      baseline (assistance is routine) is confirmed."
    evidenceId: KRK-E060
  - statement: "Public fronting stayed local in every case: day-one investigative
      briefings were led by a police chief, sheriff, state police, or campus
      police in thirteen of thirteen. Federal officials appeared at the podium
      at special-agent-in-charge rank in four cases (Las Vegas, Aurora, MSU,
      Sutherland Springs), speaking to technical lanes beside the local
      commander; in four cases no federal public statement was found at all; the
      rest were field-office or written statements. The three headquarters-level
      items are different in kind: a written attorney-general pledge of support
      that explicitly named the state as leading (Virginia Tech, day one), a
      written headquarters statement about the FBI's own mishandled tip
      (Parkland, day two), and an attorney general announcing a non-criminal
      review of the police response two weeks later at the mayor's request
      (Uvalde)."
    evidenceId: KRK-E059
  - statement: "Placed against this table, the target case is unmatched: no
      comparable case shows any federal official above special-agent-in-charge
      rank personally fronting investigative evidence announcements — and none
      at any rank walking the scene and framing the bureau as leading. The FBI
      director's in-person, on-scene role within 48 hours, announcing forensic
      results in a case with no federal charge identified, has no precedent in
      thirteen comparables. On the frozen discriminating variable — who fronted
      the case publicly, at what rank, how fast — the comparative claim in
      KRK-C037 is supported."
    evidenceId: KRK-E059
  - statement: "Interpretive decisions and failed searches, reported: presidential
      remarks (made after several of these events) were recorded but excluded
      from the rank variable as non-investigative statements — a taxonomy
      decision made at collection, not frozen, and flagged as such. Searches for
      any comparable case with director-level in-person evidence fronting found
      none; the first-federal-statement searches for the none-found cases are
      reported per row."
limitations:
  - Thirteen comparable cases; the population is venue-based (inherited from the
    KRK-S001 criteria) and does not control for victim prominence, political
    salience, or media pressure — the deflationary hypothesis that
    director-level attention tracks case profile rather than institutional
    irregularity survives this study and is stated in KRK-R013.
  - "The rank taxonomy required two interpretive calls made at collection
    (flagged, not frozen): presidential remarks excluded as non-investigative;
    written statements distinguished from in-person fronting. Under any
    reasonable variant, the target case's director-in-person-on-scene profile
    remains unmatched in the table."
  - First-statement dates for several SAC appearances rest on day-2/3
    contemporaneous reporting rather than agency transcripts; the cells say
    which.
  - "Searcher coverage: three searchers ran the frozen protocol. The OpenAI
    substitute run (deep-research models remain unavailable to the project key)
    matched the native union with zero new candidates but produced partially
    generic citations, used as leads only; the Gemini deep-research run
    corroborated the rank pattern and surfaced one candidate beyond the native
    union (Highland Park), included after native verification. Coverage is good
    and demonstrably not complete."
  - The author knew the target case's profile before the freeze;
    pre-registration cannot prevent pre-hoc criteria tuning (see the freeze PR's
    panel question). The population inheritance from KRK-S001 and the
    pre-committed federal-prosecution exclusions bound but do not eliminate this
    risk.
