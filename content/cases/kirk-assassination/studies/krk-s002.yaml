method: Discovery per the frozen protocol; extraction per case of the four
  variables, each cell citing its own source with the standard verification
  label; cells that cannot be sourced are marked, not estimated. Cases where the
  FBI made no public statement are rows, not gaps — absence of federal fronting
  is the base-rate signal. Findings state the distribution in plain language,
  place this case's profile against it on rank-of-first-statement and stated
  nexus ahead of participation itself, report the direction of failed searches,
  and give the searcher-overlap coverage indicator. The deflationary and
  inflationary hypotheses are stated in KRK-R013; either outcome publishes.
