id: KRK-S002
title: Federal public-facing role in state-jurisdiction public-venue homicides
question: Was the FBI's first-week public role in this case — director-level
  scene walkthrough and evidence announcements, with no federal charge
  identified — typical or atypical of comparable state-jurisdiction cases?
researchIds:
  - KRK-R013
claimIds:
  - KRK-C037
criteria:
  frozenOn: 2026-08-26
  inclusion:
    - United States events, 2000–2026, in which one or more people were killed
      at a public or semi-public venue and law enforcement processed the
      location as a crime or mass-casualty scene (the KRK-S001 population).
    - The criminal matter, if prosecuted, proceeded under state law with no
      federal charges filed within the first year — or no prosecution occurred
      (perpetrator dead). The question is federal conduct where federal
      jurisdiction was NOT asserted.
    - "The federal role is documentable from the public record on at least two
      of four variables: (a) whether the FBI participated in the investigation;
      (b) the depth of that role (laboratory or evidence-response assistance,
      joint task force, investigative lead); (c) the date and RANK of the first
      federal public statement on the case (none / special agent in charge /
      headquarters official / director personally); (d) the stated legal basis
      or nexus for involvement."
  exclusion:
    - Cases where federal charges were filed within the first year or a federal
      nexus (terrorism, federal hate crime) was asserted by federal authorities
      in the first week — federal fronting of a federal case is not the
      comparandum.
    - Events before 2000.
    - Non-US events.
  searchProtocol: "Multi-searcher discovery per the ratified practice, run only
