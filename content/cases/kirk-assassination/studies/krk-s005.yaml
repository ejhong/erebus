findings:
  - statement: >-
      Of eleven graded statements, the record corroborates four and
      partially corroborates three; a court adjudicated one (carrying the court's
      finding, not this site's), one was self-corrected on the record
      within moments, and one is unresolved pending the records request
      that would decide it. The single outright contradiction is the FBI
      director's day-one custody post, walked back the same afternoon at
      the podium by the governor's careful 'person of interest' framing.
      Officials' first-day factual accounts — transport, single victim,
      rooftop origin, security posture — have held up against records
      that entered the ledger independently.
    evidenceId: KRK-E064
  - statement: >-
      The media-custody cluster grades exactly where the case has always
      placed it: the protective-removal account's core is corroborated
      (removal documented, footage supplied same day) while its
      'turned over to the FBI' half stays partially corroborated,
      because the sworn record establishes copies — a flash drive and
      downloadable files — and leaves the fate of every original card
      open. The statement ledger and KRK-C012 point at the same gap,
      and the media ledger (KRK-R008) remains the instrument that would
      close it.
    evidenceId: KRK-E063
  - statement: >-
      The announced-evidence cluster shows one repeating shape:
      announcements that outran their paper. The screwdriver-DNA
      announcement was absent from the next day's charging document and
      then presented under oath ten months later; the Quantico
      processing announcement was true as stated while the comparison
      it implied would resolve came back inconclusive; the 'ample
      evidence' assertion earned a civil-contempt finding even as its
      technical half was ruled legitimate. In each case the eventual
      record partially vindicated the statement while the interval —
      not the content — is where the transparency cost lived.
    evidenceId: KRK-E064
  - statement: >-
      A count of qualified or contradicted statements is not evidence of
      coordination, and this table declines that aggregate move in both
      directions: the distribution here — mostly corroborated, one
      adjudicated violation, one real-time self-correction — supports
      neither a coordinated-lies narrative nor a nothing-to-see-here
      one. Statement by statement is the only grain at which this
      ledger speaks.
  - statement: >-
      Reported ungraded, per the freeze: the hospital-clearing claim
      (no hospital record or administrative statement bearing on it was
      found by any searcher; the claim's only source remains commentary);
      the university's formal GRAMA response letter (reported by a
      searcher, but its primary page would not render for native
      verification, so it is left ungraded rather than cited on a
      searcher's word); and the venue-selection approver (redacted in
      the released records, leaving no attributable statement to grade
      beyond the police chief's, which is row 4).
limitations:
  - >-
    Searcher coverage, reported bluntly: the OpenAI substitute run
    produced a table of fabricated rows — invented speaker names,
    invented exhibits with page-and-line locators, and one row asserting
    a ballistic match where the verified record says inconclusive — and
    was discarded entirely, contributing nothing, not even leads. The
    Gemini deep-research run was directionally accurate and proposed
    most of the clusters collected here, but cited aggregator wikis
    whose claims were re-anchored to primary or previously verified
    ledger sources before any cell entered the table. Native
    verification is the only reason the fabricated table is a
    limitations entry rather than published content.
  - >-
    Ten of eleven rows anchor to sources the ledger had already verified
    for other claims; one new primary (the day-of joint-briefing
    transcript) was fetched in full. Reusing verified sources means row
    quality inherits those sources' stated reliability notes, including
    that the GRAMA corpus is carried through an independent synthesis
    pending direct records (KRK-R007).
  - >-
    The population is bounded by the freeze date; statements after
    2026-08-26 (including anything said at the September 1 hearing) are
    out of scope and would enter through a superseding study.
  - >-
    Sworn-testimony rows summarize live transcripts; exact wording is
    quoted where short, paraphrased with locators where long, and every
    paraphrase can be checked against the cited transcript.
  - >-
    Stage provenance: the freeze stamp (runId
    2026-08-26-study-krk-s005-freeze, promptVersion
    erebus-study-freeze-v1) is preserved in the merged freeze PR and in
    the header comment; criteria hash 85874a57b2bf re-verifies unchanged
    at collection.
