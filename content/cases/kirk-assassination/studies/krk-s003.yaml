findings:
  - statement: "Rapid physical alteration after a scene is released is documented
      and unremarkable in comparable cases when the property owner or a
      municipality orders it: Boston's pre-planned city restoration began one
      minute after the FBI's formal handback; Sutherland Springs' sanctuary was
      patched and repainted by the owner within seven days; the Nickel Mines
      schoolhouse was demolished by its owners on day ten; Emanuel AME's
      bullet-scarred wall panels were cut out by day three and services held on
      day four. Every fast alteration in the table pairs speed with a named,
      undisputed authorizer: where a formal release is documented, alteration
      followed it; where no release record was found, the owner acted openly
      with no investigative objection anywhere on the record — the post-release
      reading there is inference, labeled as such in each row."
    evidenceId: KRK-E057
  - statement: "Where investigators or courts asserted continuing interest,
      alteration waited: weeks under Astroworld's court freeze, years for
      Parkland and Tree of Life under trial preservation, and indefinitely at
      Uvalde, where the district attorney has withheld release for over four
      years despite the owner's 2022 demolition decision. No case in the table
      shows alteration proceeding over a disputed or absent authorization."
    evidenceId: KRK-E058
  - statement: "Placed against this table, the UVU courtyard's four-day
      event-to-pavers interval sits inside the observed fast tail (zero to ten
      days) — on speed alone it is not an outlier. What no comparable case
      shares is its profile on the two frozen discriminating variables: it is
      the only case in the table where the authorization is disputed on the
      record (the lead investigator testifying he did not authorize the work)
      and the only fast alteration with no release evidence of any kind on the
      public record — Emanuel AME lacks a published release date too, but its
      day-three readmission of parishioners documents release in fact."
  - statement: "Direction of failed searches: formal scene-release dates could not
      be found under the protocol for seven of fifteen venues — release dates
      are routinely unrecorded in public reporting, so the absence of a
      published UVU release date is itself common; a disputed authorization is
      not. A specific search for comparable cases where alteration preceded
      formal release found none."
  - statement: "Release latency, where documented, runs from seven days (Boston —
      after the manhunt had concluded; Sandy Hook's seven days of processing had
      the perpetrator dead at the scene) through 33 days (court-frozen
      Astroworld) and 47 days (Route 91, perpetrator dead on the first night),
      to years or never where courts or prosecutors held an interest. This
      places the target case's unknown release date at one of two extremes: if
      the courtyard was formally released before the September 14 paving, that
      release — within four days of the event, during an active prosecution with
      the case's central physical-evidence disputes unresolved — would match the
      fastest evidenced in the table (Emanuel AME, about three days — with the
      perpetrator in custody from day one); every release evidenced inside a
      week followed a closed perpetrator question, and the target case's
      remained open for its first thirty-three hours; if it was not, the
      alteration preceded release, for which the table contains no precedent at
      all. The undocumented release date determines which extreme, and nothing
      in between; the GRAMA record (KRK-R007) decides it."
limitations:
  - "Coverage: two of three searchers completed (the executing agent's own
    search and an OpenAI web-search run; the OpenAI run found no candidates
    beyond the agent's union, the intended overlap signal). The OpenAI
    deep-research models were unavailable to the project's API key, so an
    o4-mini web-search run substituted (a protocol deviation); it failed twice
    on organization rate limits before completing. The Gemini deep-research
    run's outcome is recorded in the collection PR; the union above does not
    depend on it."
  - Seven of fifteen release-date cells could not be filled from public
    reporting; intervals for those rows are measured from the event, not the
    release, and are marked as such.
  - Release-before-alteration is directly documented in six rows (Boston, Sandy
    Hook, Route 91, Astroworld, Parkland, Tree of Life); in the remaining
    fast-alteration rows it is an inference from open owner action and the
    absence of any investigative objection on the record, and each such sequence
    cell says so. Observation and inference are not pooled.
  - Interval figures are day-precision from published dates; "~" marks cells
    where a month but not a day is documented.
  - Comparability is venue-based per the frozen criteria; it does not control
    for victim prominence, political salience, or media pressure, all of which
    plausibly affect alteration timing.
  - The author knew the target case's values before the freeze (pre-registration
    cannot prevent pre-hoc criteria tuning; see the freeze PR's panel question).
    The known-candidates declaration and post-freeze discoveries — seven of
    fifteen rows were discovered after the freeze — bound but do not eliminate
    this risk.
  - "This study supersedes KRK-S001: the protocol's third searcher completed
    after publication and surfaced one candidate the published table had missed
    (Emanuel AME). Per the append-only rule the published rows were never edited
    — this successor carries the full table plus the discovered row, and the
    ledger's evidence records re-point here."
