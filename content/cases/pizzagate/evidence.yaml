  sourceId: SRC-FEC-SCHEDULE-B
  direction: supports
  strength: strong
  sourceStatement: >-
    FEC Schedule B pages (American Bridge 21st Century, Form 3X) list
    "Comet Ping Pong, 5037 Connecticut Avenue, NW" with purpose "Catering
    & Facility Rental": $5,500.00 (2012-01-05, D367394); $4,764.25
    (2013-01-09, D430075); $11,600.00 (2014-03-21, D468951). The official
    FEC API confirms $6,960.00 (2015-01-15) and $6,422.48 (2016-03-22),
    the 2017 $14,129.46 memo item, and Correct the Record's $3,584.64
    (2016-01-06, "CATERING: NON-CONTRIBUTION ACCOUNT").
