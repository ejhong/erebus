# Case imagery. Two kinds, never confused:
#   cover — AI-generated editorial artwork (style-e2: the place, painted,
#           dissolving into its ghosted survey record), honestly credited;
#           may never depict evidence or the event.
#   plate — real imagery with provenance and license, presented as
#           numbered record plates.

- id: IMG-PZG-COVER
  role: cover
  file: /images/cases/pizzagate/cover.jpg
  alt: >-
    Gouache painting of a quiet row of two-story brick storefronts with
    awnings under bare winter trees, empty sidewalk in long morning
    shadow, the scene dissolving downward into a ghosted sepia surveyor's
    plat of numbered storefront footprints.
  source: generated
  license: "Project artwork (AI-generated)"
  credit: "AI-generated editorial artwork, Erebus house style (style-e2)"
  styleVersion: style-e2
  model: "gpt-image-1"
  runId: "cover-style-e2-2026-08-28"
  prompt: >-
    Editorial cover artwork, unmistakably a gouache painting. Upper
    two-thirds: a quiet Washington, D.C. neighborhood commercial block on
    an early winter morning — a row of low brick storefronts with awnings
    under bare street trees, empty sidewalk, long morning shadows, no
    people and no legible signage. Lower third: the painting dissolves
    downward into a ghosted hand-drawn surveyor's plat of the avenue
    block with numbered storefront footprints and lot lines. Palette:
    warm brick red and cream storefronts under a pale grey-gold winter
    morning, long cool blue-grey sidewalk shadows; the ghosted plat in
    warm sepia ink on cool ivory paper. Quiet, elegiac, dignified;
    completely empty of people; no violence, no memorials, no flags.

