lastReviewed: "2026-08-28"
researchPriority:
  level: medium
  reason: >-
    The genealogy and residue items are desk-scale and well-specified,
    and the case is a strong testbed for allegation-anatomy methods; but
    no live proceeding or new primary evidence stream is expected to
    move the central question, which nine years of scrutiny have left
    where it stands.
components:
  - label: "Authenticity of the underlying artifacts (emails, posts, logos, payments, bulletin)"
    state: well_supported
    note: "The raw material was real; this case verified the load-bearing artifacts natively."
  - label: "The food-word codebook as documented law-enforcement code"
    state: contradicted
    note: "The genuine 2007 FBI bulletin contains graphical symbols only — zero food terms; no law-enforcement provenance for the dictionary has ever surfaced."
  - label: "Marquee 'coded email' readings (hotdog stand, tortillas, $65,000, ice cream)"
    state: contradicted
    note: "Primary-source context — including a 2000 profile documenting the hotdog joke 15 years earlier — supplies the mundane referents the readings denied existed."
  - label: "Unexplained residue (handkerchief 'map', 'torture chamber')"
    state: unresolved
    note: "Authentic, terse, and still without recovered referents; preserved as anomalies, not evidence."
  - label: "The central trafficking allegation"
    state: weakly_supported
    note: "No victim, witness, forensic, financial, or law-enforcement record substantiating it has been located; allegations about identifiable people are never graded as verdicts here, and every person named is presumed innocent."
