  symbols: "Symbols and the claimed codebook"
  network: "The social and financial network"
  venue: "The venue, its scene, and its people"
  aftermath: "The Welch attack and the investigative record"
  mechanisms: "How the allegation was assembled"
  residue: "The unresolved residue"
editors:
