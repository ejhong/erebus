id: PZG-001
slug: pizzagate
title: "Pizzagate: Anatomy of an Allegation"
subtitle: "In November 2016 an internet investigation accused a Washington pizzeria's social circle of concealing a child-trafficking network. Much of its raw material was real. What does the primary record actually contain — and what did the interpretation machine do to it?"
domain: "Contested public events · Allegation genealogy · Living persons"
status: active
summary: >-
  Pizzagate is usually told as a parable about fake news, and usually told wrong in both directions. The allegation network that formed in early November 2016 around Comet Ping Pong, its owner, and the Podesta emails was not built from fabricated documents: the emails are authentic, the social ties were real and publicly documented before the controversy, the political-committee payments to the restaurant are in federal filings, and the FBI symbol bulletin its adherents cited is a genuine 2007 document. But when this case fetched the primary record behind the most-circulated claims, a pattern repeated: recovering the source made the artifact more certain and the incriminating interpretation less. The "coded" hotdog joke was documented as a literal family joke fifteen years before the email. The FBI bulletin contains graphical symbols and not one food word. The "$65,000 pizza" was an employee's speculation prefaced by "I think." The basement that "didn't exist" was down the block, holding canned tomatoes, in print in 2013. A masked performer "identified" as the owner was a keyboardist doing a bit documented in 2012. What remains, after the corrections, is a small residue of genuinely unexplained artifacts, a documented negative — no victim, witness, forensic, financial, or law-enforcement record substantiating the trafficking allegation has been located — and a case study in how authentic material becomes a false certainty. Every person named here is presumed innocent; this case grades records, never people.
