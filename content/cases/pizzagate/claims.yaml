- id: PZG-C010
  tier: featured
  statement: >-
    The genuine FBI intelligence bulletin of 2007-01-31 ("Symbols and
    Logos Used by Pedophiles to Identify Sexual Preferences", Cyber
    Division, Innocent Images National Initiative) describes graphical
    symbols — BLogo, LBLogo, GLogo, CLogo, a butterfly — and contains no
    food terminology whatsoever; the claimed pizza/pasta/cheese "code
    dictionary" has no law-enforcement provenance.
  plainLanguage: >-
    The real FBI document Pizzagate cited is about logos — triangles,
    hearts, a butterfly. Not one food word appears in it. The famous food
    dictionary was never in it, and nobody has ever produced an official
    source for it.
  theme: symbols
  rung: observation
  claimType: observation
  importance: headline
  genealogy:
    firstKnown: "2016-11"
    originDescription: >-
      The food-word dictionary's earliest known appearances are anonymous
      forum material from early November 2016; no earlier law-enforcement,
      scholarly, or documentary attestation has been located. (The
      bulletin itself is genuine and predates it by nine years — which is
      exactly the distinction the dictionary's circulation erased.)
  credibility: established
  credibilitySummary: >-
    The bulletin PDF was fetched, checksummed, text-extracted, and
    mechanically searched: zero occurrences of pizza, pasta, hotdog, or
    cheese. Its genuine contents (title, date, issuing unit, symbol
    descriptions) were verified verbatim. The narrow real fact that
    "cheese pizza" appears as CSAM slang in some offender contexts is a
    separate, later-documented proposition that does not source the
    dictionary.
  diagnosticity: high
  diagnosticitySummary: >-
    The dictionary was the allegation's interpretive engine: every email
    reading depended on it. Its provenance failure is therefore
    load-bearing for the whole structure above it.
  sourceAnchor:
    locator: "FBI Intelligence Bulletin, 2007-01-31 (mirror PDF, md5 2e8148e084930b96a459e3aa42a96df5), pp. 1–2"
    sourceId: SRC-FBI-2007-BULLETIN
  parentClaimIds: []
  dependsOnClaimIds: []
  strongestObjection: >-
    Code systems need not appear in official documents to exist; but a
    claimed law-enforcement dictionary that law enforcement never
    documented, first attested in anonymous 2016 forums, carries the
    burden it has never met.
  whatWouldChangeOurMind:
    - "Any pre-2016 official or documentary attestation of the food-word dictionary."
  reviewState: ai_extracted
  origin:
    ref: "verification ledger V05"
    extractedBy: "claude-fable-5 (cursor session)"
