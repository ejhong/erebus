- id: PZG-C001
  tier: featured
  statement: >-
    Across the most-circulated Pizzagate claims, recovering the primary
    source repeatedly made the underlying artifact more certain while
    making the incriminating interpretation less certain.
  plainLanguage: >-
    The raw material was usually real — real emails, real posts, real
    payments. And checking the original, again and again, supplied the
    ordinary context the accusation said didn't exist. Both halves of
    that sentence matter.
  theme: mechanisms
  rung: attribution
  claimType: interpretive
  importance: headline
  credibility: well_supported
  credibilitySummary: >-
    Demonstrated case-by-case in this ledger: the hotdog email and its
    15-years-earlier documented joke (PZG-C002), the "$65,000" hedge
    (PZG-C008), the cookout invitation (PZG-C007), the basement fork
    (PZG-C014), the masked-performer identification (PZG-C016), the
    codebook's missing provenance (PZG-C010), and the "donations" that
    were disclosed vendor payments (PZG-C012).
  diagnosticity: high
  diagnosticitySummary: >-
    This is the case's central analytical finding, and it cuts both ways:
