    story is an "I think" joke in a private analyst's office banter (PZG-C008).
    The "bring all children" line sits in an explicit family cookout invitation
    Podesta declined (PZG-C007). The "basement lie" resolves cleanly once the
    2013 tomato-storage piece is read (PZG-C014). The masked "owner" is a
    documented performer whose act and roast context were in print years before
