  whatIsClaimed: "In ascending order of strength: that the Podesta emails contain coded language for child abuse; that the restaurant's owner, his social circle, and associated political figures signaled that activity in imagery, art, performances, and business symbols; that the venue physically hosted abuse; and that a networked trafficking operation connected these people and was subsequently protected from investigation. The featured question is not anyone's guilt — no court has ever charged any of it, and this site never grades culpability. It is which links in the evidentiary chain survive contact with the primary record, and how the chain was assembled from links that do not."
  whereDisagreementLives: 'Not over the artifacts: the emails are authentic, the Instagram posts were real, the logos existed and were changed, the payments are in FEC filings, the bulletin is genuine. The dispute lives entirely in the interpretive layer — whether ordinary-looking language was code (the claimed dictionary has no law-enforcement provenance; the bulletin contains no food words), whether documented associations imply concealed conduct (the associations were in society-page print before the controversy), and whether the residue that resists mundane explanation — a handkerchief "map," a terse "torture chamber" line — is signal or the ordinary strangeness any large email corpus yields.'
  whatWouldSettleIt: "For the central allegation: any independent evidentiary bridge — an identified victim or firsthand witness, forensic or property evidence, a criminal financial trail, or a law-enforcement record substantiating it. None has been located; its continued absence under targeted search is itself evidence. For the residue: recovery of the actual handkerchief context, Tony Podesta's January 31, 2014 calendar, the original camera-operator records, and the still-unverified 2002/ 2003 press bodies. For the genealogy: a frozen-criteria study tracing each major claim to its earliest appearance and classifying the assembly mechanisms — source fusion, identity conflation, paraphrase inflation — against the recovered record."
  bestConventionalExplanation: "A political document dump landed weeks before an election; thousands of readers searched it for the worst thing they could imagine and found ordinary catering, scheduling, and banter that pattern-matched to it. A restaurant embedded in Democratic social and fundraising circles — documented in society pages years earlier — supplied faces, a venue, and imagery. Interpretations hardened into a dictionary nobody could source; different people with the same name were merged; hedged speculation lost its hedges in retelling. The result needed no fabricated inputs: authentic material, plus motivated inference, plus transmission error, manufactured the appearance of corroboration. On this account the residue is residue — what any deeply searched life would leave unexplained — and the absence of any victim, witness, or forensic record after nine years of scrutiny is the record speaking."
