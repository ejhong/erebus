    rules:
      - §3.15
    reasoning: "The PR body asserts that the new supersede-close loop closes older
      `respond/*` PRs 'except a PR the arbiter has parked, which is a live
      disagreement and stays visible (§3.15)', but the diff contains no such
      exclusion: the `gh pr list --jq` filter selects every open PR whose head
      branch starts with `respond/` other than the current one, and closes it
      with `--delete-branch`. As written, a parked/contested judgment PR — the
      exact artifact §3.15 requires to be displayed as contested rather than
      resolved silently — would be auto-closed and its branch deleted by the
      next hourly run, which both weakens the disagreement check and destroys
      the visible record of it (§3.14/§3.15). The body's own history ('the
      upstream panel parked the first version of this change and was right')
      shows the author knew this exclusion was required, so the mismatch between
      claimed and actual behavior is positive evidence rather than a style
      quibble. The other elements — hourly cron, `cancel-in-progress: false`,
      unchanged risk labeling that still routes non-low-risk output to
      needs-approval — are fine on their own. Secondarily, the new header
      comment cites 'docs/DECISIONS.md' for the 2026-08-26 trigger change while
      no DECISIONS.md entry is added in this single-file diff. Fixing the filter
      to skip parked/contested PRs (and landing the decisions note) would make
      this compliant."
