    reasoning: >-
      Sworn testimony from examiner Karner and the text of the ATF ballistics report confirm that the toolmarks on the damaged bullet fragments were insufficient for either source identification or source exclusion. Ground-truth studies show that such inconclusive outcomes are standard for severely fragmented projectiles. The strongest counter-consideration is that defense filings initially emphasized the lack of identification while omitting that the firearm was not excluded, prompting judicial clarification.
  - claimId: KRK-C005
    verdict: established
    confidence: high
    reasoning: >-
      Examiner Karner testified under oath that while initial photographs documented seven recovered bullet fragments, she received only four to examine, and the filed report itemized five pieces (one jacket fragment and four lead cores). As of August 2026, no public record reconciles the missing fragments. The strongest opposing consideration is that routine administrative practices—such as retention by the medical examiner, separate biological packaging, or destructive testing—could account for the difference without custody failure.
