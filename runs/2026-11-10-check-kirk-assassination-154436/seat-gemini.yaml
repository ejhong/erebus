    reasoning: >-
      Enhanced visual forensics from independent media and dispatch camera footage corroborate Officer Bagley's sworn testimony that an individual was positioned on the Losee Center roof in a prone position and fled within seconds of the gunshot. Shoe impressions, a forearm print, and physical roof disturbances corroborate this observation. The strongest opposing consideration is that Officer Bagley conceded on cross-examination that he could not visually identify the rooftop subject or discern what object was being held.
  - claimId: KRK-C002
