      information of collusion. The strongest opposing consideration to that
      negative assessment is Zinn's unusually specific claimed purpose, but
      his unreliable post-event account cannot distinguish spontaneous
      obstruction from coordination.
  - claimId: KRK-C032
    verdict: contradicted
    confidence: high
    reasoning: >-
      Although the charging Information omitted the screwdriver, later
      preliminary-hearing testimony presented its recovery and DNA results
