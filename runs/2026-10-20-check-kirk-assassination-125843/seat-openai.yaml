  - claimId: KRK-C016
    verdict: established
    confidence: high
    reasoning: >-
      KRK-E034 reports a formal judicial finding of civil contempt against a
      deputy county prosecutor for violating a clear pretrial-publicity
      restriction through a public guilt statement. The ruling also
      distinguished that violation from a permissible correction of
      misleading ballistics coverage. The strongest opposing consideration
      is that the contempt finding addressed publicity conduct, not the
      prosecution's evidence or the merits of the criminal case.
  - claimId: KRK-C017
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      Rapid alteration, inconsistent early statements, and a publicity
      violation establish process and transparency problems, but they do not
      establish deliberate concealment or destruction of evidence.
      Comparative records show that rapid scene alteration can occur for
      ordinary reasons, and the statement ledger found no aggregate pattern
      of coordinated falsehood. The strongest opposing consideration is the
      still-unexplained authorization sequence at UVU, which is a legitimate
      anomaly but not presently evidence of intent.
  - claimId: KRK-C018
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      The only medical conclusion in the record identifies a gunshot wound,
      and the reported wound track runs front to back and downward in the
