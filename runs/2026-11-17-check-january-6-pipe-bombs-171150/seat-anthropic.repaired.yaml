  - claimId: PIPE-C080
    verdict: well_supported
    confidence: high
    reasoning: >-
      The site study cites each point to the public transcript by page and line (PIPE-E184). The government's own brief confirms that before the admission the agents confronted Cole with the evidence, listing the components his purchases matched (PIPE-E232). The prosecution's memorandum likewise has him shown a picture of the shoe while he was still denying (PIPE-E026). The strongest opposing consideration is that the negative — that he named none of these himself — rests on one reader's coding of a transcript read by eye from page images, and a single unreplicated reading can miss an exchange.
  - claimId: PIPE-C082
    verdict: well_supported
    confidence: moderate
    reasoning: >-
      The Census Bureau's roads and the District's own street centerlines both show D Street SE between 2nd and 3rd Streets as two roadways about 88 metres apart, with Folger Park between them (PIPE-E193, PIPE-E194). That fits "a road that splits in the middle" with grassy areas on each side. The claim asserts a fit, not an identification, and the fit holds. The strongest opposing consideration is that the description names no street and could fit other divided roads beside parks. It also describes where he "always" parks, and since the FBI had said in 2021 that the bomber operated around Folger Park (PIPE-E192), it shows familiarity with the place, not knowledge only the bomber had.
  - claimId: PIPE-C039
    verdict: well_supported
    confidence: high
    reasoning: >-
      Both of the prosecution's filings describe the post-admission account (PIPE-E081, PIPE-E230), the second citing it to the transcript at Tr. 103–153. The defense does not deny that the account exists; it says the agents supplied its heart and Cole "confirmed, adopted, or briefly elaborated" (PIPE-E191). The strongest opposing consideration is that "described" may overstate his part if the defense is right about who supplied the narrative, a question for PIPE-C040. The recording is not public, and the filings differ on the account's length, an hour and a half against an hour and a quarter.
  - claimId: PIPE-C041
    verdict: well_supported
    confidence: high
    reasoning: >-
      The defense's expert quotes the agents from the transcript by page (PIPE-E086, PIPE-E087), and the government concedes the substance. It says the agents "downplayed the severity of the crimes" by the Reid approach (PIPE-E248), and that they told Cole that if he told the truth they might not have to bring his family to Washington (PIPE-E240). The parties dispute whether this was lawful or coercive, not whether it happened. The strongest opposing consideration is the label "implied threats". By the government's account the family were already under subpoena (PIPE-E239), so the agents offered to lift an existing legal obligation rather than threatening a new one. That distinction is for the court, and it leaves the minimization and the implied promise undisputed.
  - claimId: PIPE-C095
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The government quotes the call by date in a court filing, together with context that cuts against it: his parents said "you didn't do nothing", and he agreed (PIPE-E236). Including that context makes selective quotation less likely, and no record contradicts the quotation. It is still one party's description of a recording the public has not heard, and the defense had not answered it in any filing read. The strongest opposing consideration is its content. The words name no act, and the government itself says he used the same language as in the disputed interview, so the call may repeat that account rather than confirm it independently; he also assented to his parents' denial.
  - claimId: PIPE-C020
    verdict: well_supported
    confidence: high
    reasoning: >-
      The affidavit itemizes the purchases by date and store (PIPE-E037 to PIPE-E039): pipes in June and November 2020, five connectors from Micro Center in late 2019, timers in June 2020, and steel wool in December 2020. The prosecution says the search found a November 2020 Home Depot receipt for pipe nipples and end caps alongside matching parts (PIPE-E045). The defense, which holds the records, has disputed none of this in any filing read and argues only about what it proves (PIPE-E040). The distinctive item is the connector, of which fewer than 8,000 were distributed nationally (PIPE-E041). The strongest opposing consideration is that the records are not public, and the same affidavit's statement that he bought "each type of component" is not borne out for the alligator clips, whose only itemized purchase came after the placements (PIPE-E145). That is a reason to read the affidavit's summaries, though not its itemized entries, with care.
  - claimId: PIPE-C036
    verdict: established
    confidence: high
    reasoning: >-
      The retraction is stated by a news report (PIPE-E076) and by the government in a court filing that cites a newspaper's report of it (PIPE-E205), and no party disputes it. Blaze Media's intention to defend the defamation claims (PIPE-E199) concerns liability, not whether it retracted. The strongest opposing consideration is that the retraction notice itself is not among the records, so the claim rests on secondary accounts — consistent and uncontested, but secondary. A retraction also does not by itself test whether the identification was right.
  - claimId: PIPE-C085
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      As the government's brief quotes it, the November 2025 article claimed a software gait match of 94 to 98 per cent, by an unnamed algorithm and analyst (PIPE-E203). The October identification offers no gait analysis at all. By Baker's own account it began with the mask (PIPE-E204), and it rests on clothing the family recognised and a likeness judged by eye. Where Baker speaks of gait in October, it is to tell the man's walk from the bomber's, not to match the man to Cole (PIPE-E136). The strongest opposing consideration is that Baker's October account does lean on one walking trait judged by eye, the heel-walking Cole's mother described (PIPE-E071), and that the November method is known only through an adverse party's quotation. What the two identifications do share is that neither method has been published or independently tested.
  - claimId: PIPE-C052
    verdict: contradicted
    confidence: moderate
    reasoning: >-
      No record places any law-enforcement insider at the scene, and unlike the misidentification account, this account has no verified observation of its own. Its support is Baker's unevidenced certainty (PIPE-E108), a retracted report whose gait method was never published, and an FBI examiner's "Deception Indicated" opinion on one former officer's polygraph (PIPE-E221). That opinion reads physiological stress on a day of interview and search, and, on general background as well as by the government's own caution (PIPE-E223), it is not evidence of who placed the devices. Against the account stands the convergent case that Cole bought the components, drove in, and carried a phone that kept pace with the bomber (PIPE-E111), which the account would have to explain as coincidence or fabrication. The government also describes a home video placing the one named person at home minutes after the bomber first appears on camera (PIPE-E226). The strongest opposing consideration is that the government's clearance rests on its own undisclosed records, whose timestamp and completeness the defense disputes (PIPE-E225), and that, by the defense's description, the inquiry gathered none of the cell-site data on which the case against Cole rests (PIPE-E242).
  - claimId: PIPE-C086
    verdict: established
    confidence: high
    reasoning: >-
      The defense names its "alternative-perpetrator defense" in its own filing (PIPE-E206). The government describes it as the claim that a then-serving Capitol Police officer was the real perpetrator (PIPE-E207), and the government's reply records both sides describing the theory alike (PIPE-E218). The court's pretrial order also anticipates a motion to exclude such evidence (PIPE-E220). The strongest opposing consideration is one of scope: that a defense pursues a theory is a fact about the proceedings, not evidence that the theory is true.
  - claimId: PIPE-C098
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      The defense's motion lists each gap and cites the government's own discovery correspondence for it (PIPE-E242), and nothing public contradicts it. The record's other descriptions of the inquiry are consistent with it (PIPE-E226, PIPE-E243): a forensic image of her iPhone that the defense calls the only extraction of her data from those days, and a phone video from inside the home rather than home-camera footage. The strongest opposing consideration is that this is one party's description of the other's records, offered to win a discovery motion, with the exhibit not public and the government's answer not yet filed. Even if accurate, it shows what the inquiry did not collect, not what such records would have shown.
  - claimId: PIPE-C076
    verdict: well_supported
    confidence: high
    reasoning: >-
      The joint status report, filed by both parties, does three things (PIPE-E171). It lists the native video file and same-device media from January 5, 2021 as outstanding with no responsive production. It records the government's production of 223 text messages as a PDF extraction report. And it gives the government's position that the information sought is not discoverable. The strongest opposing consideration is wording. The filing's objection is that the material is "not discoverable under applicable law or rule", not that it is irrelevant; the government's word "irrelevant" appears in its refusal of the separate phone image (PIPE-E243). The communications sought also run from midnight to 4:39 p.m., not the whole day.
  - claimId: PIPE-C077
    verdict: weakly_supported
    confidence: low
    reasoning: >-
      Read as a report of how the clips are captioned, the claim is well supported. The site study confirms that the breakdown contains clips of a dark sedan captioned with these places and times (PIPE-E161). Read for its substance — that the sedan was filmed at those times and places — it rests on captions in a different style from the CCTV clips, with no camera numbers, whose source and clock are not shown. The same team's CCTV captions were read from the files' own clocks, one of them 30 seconds early (PIPE-E166, PIPE-E196), which lends its captioning modest credit, but that check does not reach these clips. The strongest opposing consideration is that until the cameras are identified (PIPE-R010), the times and places rest on an advocate's captions alone, and the claim, rightly, says nothing about whose car it is.