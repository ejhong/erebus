    reasoning: >-
      Four things support it: the affidavit states this under oath (PIPE-E050, PIPE-E051), the detention memorandum restates it (PIPE-E053), the challengers concede the sessions themselves (PIPE-E175), and the site study finds the bomber's sworn positions consistent with the serving sectors (PIPE-E163). Two weaknesses are real. At 7:59:36 the fit is only at the arc's edge. The fits at 7:39 and 7:44 depend on the provider's April 2021 correction of a sector's listed direction (PIPE-E164), though that correction predates any suspicion of Cole and agrees with the FBI's drive tests (PIPE-E054). The strongest opposing consideration is that a sector match places a phone in a wide wedge rather than at a corner (PIPE-E052), and the raw records and drive-test maps are not public. In 2021, five people's data may have matched the route (PIPE-E113), so the sessions put the phone near the route without by themselves singling anyone out.
