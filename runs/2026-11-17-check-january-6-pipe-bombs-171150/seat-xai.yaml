    reasoning: >-
      Family members are reported to have recognized a maroon-and-gold cloth mask and a recently gifted jacket; a side-by-side likeness has been offered from a 10-by-13-pixel head. No blind forensic comparison, quantified gait match, or purchase-record corroboration of the clothing appears. The strongest opposing consideration is the low resolution itself plus the fact that an earlier gait-based identification of a different person by related researchers was retracted by its publisher.
  - claimId: PIPE-C073
