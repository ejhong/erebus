      The government’s suppression opposition states that Cole named Lilly Miller sulfur dust and that his Capital One records show a 14 January 2018 purchase of that brand. The records themselves are not public, and the brief does not establish who first uttered the brand name. The strongest opposing consideration is that sulfur dust is a common garden product purchased three years earlier; the match shows acquisition, not incorporation into the devices.
  - claimId: PIPE-C080
