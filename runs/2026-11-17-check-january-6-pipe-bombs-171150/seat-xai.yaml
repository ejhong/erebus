  synthesis: >-
    The public record, taken solely from the supplied evidence records, supplies multiple converging lines that provisionally support the charged account that Brian Cole Jr. is the person shown placing the devices. Bank and card records described in the sworn affidavit show purchases in 2019–2020 of six component types matching those in the devices, including an uncommon 9-volt connector of which fewer than 8,000 units were distributed nationally; a license-plate reader recorded his Nissan Sentra taking the South Capitol Street exit at about 7:10 p.m.; and the phone attributed to him exchanged data with cell sectors whose coverage the affidavit pairs, minute by minute across five sectors between 7:39 and 8:24 p.m., with the locations of the person on the surveillance video. Physical points (height within the FBI photogrammetry range, corrective eyeglasses, prior ownership of the Nike Air Max Speed Turf shoes) add low-diagnosticity consistency. After roughly two hours of denials, Cole gave a detailed account of construction, transport and placement that the prosecution presents as containing non-public particulars. These strands are independent of one another in origin (retail records, automated plate data, carrier sessions, video timestamps) and together raise the prior probability sharply above chance.

    The principal live challenge is the October 2026 Capitol CCTV package. Independent frame-by-frame matching against the House subcommittee’s Rumble release establishes that the eight named cameras are authentic Capitol Police files, that the on-screen times were added in editing but derive (to within seconds, save one 30-second caption error) from the files’ own start-time filenames plus elapsed time, and that a man in a violet-blue hooded jacket is recorded crossing Peace Circle at approximately 8:01:18 and continuing on cameras 602 and 940 around 8:05. On those clocks the man cannot also be the person the affidavit places at New Jersey Avenue and E Street SE at 7:59:38 (approximately 960 m distant); the required speed exceeds any recorded human kilometre, and a brisk walk would demand a clock offset of roughly nine minutes or more. Moreover, every location the footage assigns the man at 7:59:36 lies well behind the south-facing sector the phone used at that instant. If the man is Cole and the clocks and sector directions hold, the charged account collapses unless the phone was not with him. Identification of the man as Cole, however, rests on family recognition of a maroon-and-gold cloth mask and a tagged jacket plus low-resolution gait and shoe observations; the frames resolve a head at roughly 10-by-13 pixels, precluding reliable facial comparison, and no quantified forensic match has been published. The same method that produced the retracted November 2025 identification of a different person is not employed here. Consequently the footage is a conditional, not yet decisive, counter-example.

    The confession is contested on voluntariness: the transcript and both parties’ experts document minimization, implied leniency, references to sparing family a trip already under subpoena, and acute distress while denials continued. Many route, timing and component details were supplied by agents before the admission. One post-admission detail—the brand of sulfur dust—matches a 2018 card purchase the prosecution now cites; whether Cole volunteered it first remains untested against the later transcript pages. No public fingerprint or DNA links Cole to the devices. The insider alternative (a then-serving officer) is pursued by the defense but currently rests on a retracted media identification, an inconclusive polygraph, and discovery disputes rather than affirmative placement evidence; it must still explain why Cole’s phone tracked the bomber. On the present ledger the charged account therefore stands as provisionally supported: the positive convergent record is substantial, the decisive counter-claims remain either weakly identified or unreconciled, and raw carrier records, native CCTV metadata, full post-waiver transcript coding, and a blind identification of the Peace Circle man would each be capable of moving the verdict in either direction. The assessment is expressly limited to the supplied evidence records; guilt is a question solely for the court.
  steelman: >-
    The multi-sector cell-site sequence pairs Cole’s phone, five times across forty-five minutes, with the bomber’s video positions to within seconds on independent carrier records whose drive-test corrections pre-date any focus on Cole; if the raw timing-advance or distance data confirm the phone was inside the narrow walking corridor rather than merely inside a 120-degree wedge, that single thread is difficult for any non-Cole account to absorb without positing that the phone itself was carried by the bomber.
claimAssessments:
  - claimId: PIPE-C059
    verdict: provisionally_supported
    confidence: moderate
    reasoning: >-
      Purchases of matching components (including the uncommon connector), the 7:10 p.m. plate-reader hit, and the minute-by-minute cell-sector pairings with the bomber’s video path form three independent documentary lines; height, glasses and prior shoe ownership add consistency, and the post-admission narrative supplies further detail. The strongest opposing consideration is the authenticated October footage: if the man on the northwest cameras is Cole and the clocks/sectors hold, the charged identification fails. That identification of the man remains weakly evidenced, so the charged account is provisionally rather than firmly supported.
  - claimId: PIPE-C063
    verdict: well_supported
    confidence: high
    reasoning: >-
      District address-point geometry places Peace Circle approximately 960 m from the affidavit’s 7:59:38 location; the congressional file clocks put the man at the Circle at 8:01:18, an interval of 100 s. No human has covered a kilometre that fast, and a brisk walk requires a clock offset of roughly nine minutes. The strongest opposing consideration would be a demonstrated multi-minute offset between the Capitol Police system and the cameras used for the bomber timeline; none is shown in the record.
  - claimId: PIPE-C075
    verdict: well_supported
    confidence: high
    reasoning: >-
      The study mapping sworn sector azimuths against Master Address Repository points shows every location assigned the man by the October footage lies 147–172 degrees off the south-facing sector used by the phone at 7:59:36, outside both the nominal 120-degree arc and a ±90-degree band. The bomber’s sworn positions fit the same sectors (marginally at that instant). The strongest opposing consideration is that actual coverage can exceed the nominal arc on a given day; the affidavit itself notes this variability, yet the angular separation remains extreme.
  - claimId: PIPE-C031
